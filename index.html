<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NEETrix · Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030712;--panel:#0d1322;--panel2:#131c31;--border:#1e293b;
  --text:#f8fafc;--muted:#94a3b8;--accent:#3b82f6;--accent2:#2563eb;
  --green:#10b981;--danger:#ef4444;--warn:#f59e0b;--shadow:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;letter-spacing:-0.01em}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{min-height:100vh;padding-bottom:60px}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:14px 16px;font-size:14px;margin-bottom:12px;outline:none;font-family:inherit;transition:all .2s cubic-bezier(.4,0,.2,1)}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
textarea{min-height:100px;resize:vertical}
button{cursor:pointer;font-family:inherit;transition:all .2s cubic-bezier(.4,0,.2,1);-webkit-tap-highlight-color:transparent}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 4px 16px rgba(59,130,246,.3)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(59,130,246,.4)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13.5px}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.05)}
.btn-outline:active{transform:scale(.97)}
.btn-danger{background:var(--danger);border:none;color:#fff;padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:600}
.btn-good{background:var(--green);border:none;color:#022c22;padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:600}
.btn-warn{background:var(--warn);border:none;color:#451a03;padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:600}
.btn-small{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:9px;font-size:12.5px}
.btn-small:active{transform:scale(.95)}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 20%,#0f172a 0%,var(--bg) 80%)}
.auth-card{background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:40px 32px;width:100%;max-width:420px;box-shadow:var(--shadow);animation:fadeIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.brand{font-size:28px;font-weight:800;background:linear-gradient(135deg,#60a5fa,#3b82f6,#10b981);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:14px;margin:8px 0 24px}
.msg{font-size:13px;margin:-4px 0 14px;min-height:18px}
.link{color:var(--accent);background:none;border:none;font-size:13.5px;text-align:center;width:100%;margin-top:12px}

.topbar{display:flex;align-items:center;gap:6px;padding:12px 18px;border-bottom:1px solid var(--border);background:rgba(3,7,18,.85);backdrop-filter:blur(16px);overflow-x:auto;position:sticky;top:0;z-index:50}
.topbar .brand{font-size:18px;margin:0;flex-shrink:0;margin-right:8px}
.navbtn{background:none;border:1px solid transparent;color:var(--muted);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:500;white-space:nowrap;flex-shrink:0;transition:all .2s}
.navbtn:hover{color:var(--text);background:var(--panel2)}
.navbtn.active{background:var(--panel2);color:var(--text);border-color:var(--border);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.navbtn:active{transform:scale(.95)}
.spacer{flex:1;min-width:12px}
.profile-wrap{position:relative;flex-shrink:0}
.profile-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--green));border:none;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(59,130,246,.3)}
.profile-btn:active{transform:scale(.9)}

.content{max-width:980px;margin:0 auto;padding:28px 20px 48px;animation:fadeIn .4s cubic-bezier(.16,1,.3,1)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,.2);transition:all .25s cubic-bezier(.4,0,.2,1)}
.card:hover{border-color:rgba(59,130,246,.4);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.subject-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px 20px;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.subject-card::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(59,130,246,.1),transparent);opacity:0;transition:opacity .3s}
.subject-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 12px 32px rgba(59,130,246,.2)}
.subject-card:hover::before{opacity:1}
.subject-card:active{transform:scale(.97)}
.subject-card h3{margin:0;font-size:17px;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row-wrap{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.muted{color:var(--muted);font-size:13px}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);color:var(--muted);font-weight:500}
.badge.admin{color:var(--accent);border-color:var(--accent);background:rgba(59,130,246,.1)}
.badge.active{color:var(--green);border-color:var(--green);background:rgba(16,185,129,.1)}
.back{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:20px;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.back:hover{border-color:var(--accent);background:rgba(59,130,246,.1)}
.tabs2{display:flex;gap:8px;margin:16px 0 20px;flex-wrap:wrap}
.tab2{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:9px 18px;border-radius:11px;font-size:13px;font-weight:600;transition:all .2s}
.tab2.active{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 4px 12px rgba(59,130,246,.3)}
h2{font-size:24px;margin:4px 0 16px;font-weight:800;letter-spacing:-.02em}
h3{font-size:16px;margin:18px 0 12px;font-weight:700}
.empty{color:var(--muted);font-size:14px;padding:48px 0;text-align:center}

.home-hero{
  text-align:center;
  padding:40px 20px 32px;
  background:
    radial-gradient(circle at 30% 30%, rgba(59,130,246,.15) 0%, transparent 60%),
    radial-gradient(circle at 70% 50%, rgba(16,185,129,.1) 0%, transparent 60%),
    var(--panel);
  border:1px solid var(--border);
  border-radius:24px;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.anim-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:64px;
  margin-bottom:24px;
  flex-wrap:wrap;
  min-height:160px;
}
.atom-wrap{width:140px;height:140px;position:relative;flex-shrink:0;filter:drop-shadow(0 0 24px rgba(59,130,246,.4))}
.atom-core{width:24px;height:24px;background:radial-gradient(circle at 35% 30%,#fff,#60a5fa 50%,#2563eb 100%);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 16px #fff,0 0 32px var(--accent),0 0 60px rgba(59,130,246,.6);z-index:5}
.atom-core::after{content:"";position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.4) 0%,transparent 70%);animation:corePulse 2.5s ease-in-out infinite}
@keyframes corePulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.4);opacity:.2}}
.orbit{position:absolute;top:50%;left:50%;border:1.5px solid rgba(147,197,253,.3);border-radius:50%;transform:translate(-50%,-50%);animation:spin linear infinite}
.orbit1{width:70px;height:42px;animation-duration:3.5s}
.orbit2{width:100px;height:60px;animation-duration:5.8s;animation-direction:reverse}
.orbit3{width:130px;height:78px;animation-duration:8s}
.electron{width:8px;height:8px;background:#93c5fd;border-radius:50%;position:absolute;top:-4px;left:50%;margin-left:-4px;box-shadow:0 0 10px #60a5fa}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.nerve-wrap{width:120px;height:160px;position:relative;flex-shrink:0;filter:drop-shadow(0 0 20px rgba(16,185,129,.35))}
.nerve-brain{width:46px;height:34px;background:radial-gradient(ellipse at 40% 35%,#a7f3d0 0%,#34d399 50%,#059669 100%);border-radius:50% 50% 40% 40%;position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:3}
.nerve-spine{width:6px;height:96px;background:linear-gradient(180deg,#34d399 0%,var(--green) 50%,rgba(16,185,129,.2) 100%);position:absolute;top:30px;left:50%;transform:translateX(-50%);border-radius:4px;z-index:2}
.nerve-wave{position:absolute;left:50%;width:8px;height:8px;background:#fff;border-radius:50%;transform:translateX(-50%);animation:nerveDown 2.2s cubic-bezier(.4,0,.6,1) infinite;z-index:4}
.nerve-wave:nth-child(3){animation-delay:.5s}
.nerve-wave:nth-child(4){animation-delay:1s}
.nerve-wave:nth-child(5){animation-delay:1.5s}
@keyframes nerveDown{0%{top:34px;opacity:0;transform:translateX(-50%) scale(.4)}20%{opacity:1}80%{opacity:1}100%{top:122px;opacity:0;transform:translateX(-50%) scale(.3)}}

.welcome{font-size:24px;font-weight:800;margin-bottom:6px}
.progress-box{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:20px;cursor:pointer;box-shadow:var(--shadow);transition:all .25s}
.progress-box:hover{border-color:var(--accent);transform:translateY(-2px)}
.progress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:600}
.progress-bar-bg{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-bottom:12px}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:6px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.progress-stats{display:flex;gap:20px;flex-wrap:wrap;font-size:13px}
.progress-stats span{color:var(--muted)}
.progress-stats b{color:var(--text);font-weight:700}

.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:640px){.home-grid{grid-template-columns:1fr}}
.home-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 20px rgba(0,0,0,.2)}
.home-card:hover{border-color:var(--accent);transform:translateY(-6px);box-shadow:0 12px 36px rgba(59,130,246,.25)}
.home-card .icon{font-size:32px;margin-bottom:12px;display:inline-block;transition:transform .3s}
.home-card:hover .icon{transform:scale(1.15)}
.home-card h3{margin:0 0 6px;font-size:16px;font-weight:700}

.powered{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:11.5px;color:var(--muted);padding:12px 0;background:rgba(3,7,18,.9);backdrop-filter:blur(12px);border-top:1px solid rgba(30,41,59,.8);z-index:40}
.powered span{background:linear-gradient(90deg,var(--muted),var(--accent),var(--muted));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}

.yt-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:14px;overflow:hidden;background:#000;margin-bottom:16px;border:1px solid var(--border);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em}

.modal-bg{position:fixed;inset:0;background:rgba(3,7,18,.85);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px;animation:fadeIn .25s ease}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:24px;max-width:1000px;width:100%;max-height:92vh;overflow:auto;padding:24px;box-shadow:var(--shadow)}
.modal-close{background:var(--panel2);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;float:right;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.modal-close:hover{border-color:var(--danger);color:var(--danger);transform:scale(1.05)}

.timer{font-size:24px;font-weight:800;color:var(--warn);text-align:center;padding:14px;background:var(--panel2);border-radius:14px;margin-bottom:16px;border:1px solid var(--border);box-shadow:inset 0 2px 8px rgba(0,0,0,.3)}

/* PROFESSIONAL PDF VIEWER STYLING */
.pdf-pro-container{display:flex;flex-direction:column;height:82vh;background:#090d16;border-radius:16px;border:1px solid var(--border);overflow:hidden;position:relative}
.pdf-pro-header{display:flex;align-items:center;justify-content:between;gap:12px;padding:12px 18px;background:var(--panel2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.pdf-pro-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pdf-tool-btn{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:8px 12px;border-radius:9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.pdf-tool-btn:hover{border-color:var(--accent);color:var(--text)}
.pdf-tool-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 10px rgba(59,130,246,.3)}
.pdf-content-area{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:24px;position:relative;background:#060912}
.pdf-page-wrapper{position:relative;box-shadow:0 12px 40px rgba(0,0,0,.6);border-radius:10px;overflow:hidden;background:#fff;margin:auto}
.pdf-page-wrapper canvas{display:block}
.pdf-draw-layer{position:absolute;top:0;left:0;width:100%;height:100%;cursor:crosshair;touch-action:none}

.cbt-layout{display:grid;grid-template-columns:1fr 240px;gap:20px}
@media(max-width:768px){.cbt-layout{grid-template-columns:1fr}}
.cbt-qbox{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
.cbt-palette{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:18px;height:fit-content;position:sticky;top:80px;box-shadow:var(--shadow)}
.cbt-palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.cbt-pbtn{width:100%;aspect-ratio:1;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:13px;font-weight:700;transition:all .15s}
.cbt-pbtn:hover{border-color:var(--accent)}
.cbt-pbtn.answered{background:rgba(59,130,246,.25);border-color:var(--accent);color:#93c5fd}
.cbt-pbtn.marked{background:rgba(245,158,11,.25);border-color:var(--warn);color:#fcd34d}
.cbt-pbtn.current{outline:2px solid var(--green);outline-offset:2px}
.cbt-opt{display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:12px;background:var(--panel2);border:1px solid var(--border);border-radius:14px;color:var(--text);font-size:15px;font-weight:500;transition:all .2s}
.cbt-opt:hover{border-color:var(--accent);background:rgba(59,130,246,.08)}
.cbt-opt.selected{border-color:var(--accent);background:rgba(59,130,246,.2);color:#fff;box-shadow:0 4px 16px rgba(59,130,246,.2)}
.score-card{text-align:center;padding:36px 20px}
.score-num{font-size:56px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;margin:8px 0}
.profile-field{margin-bottom:16px}
.profile-field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.q-img{max-width:100%;border-radius:12px;margin:12px 0;border:1px solid var(--border)}
</style>
</head>
<body>
<div id="app"></div>
<div class="powered"><span>Powered by Suraj Kumar</span></div>

<script>
const SUPABASE_URL = "https://qhggamgxfwlwtpmwxfwk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_X9_aDiQcrKhYyPfuQdnKPA_K8F7RPjM";

let db=null,session=null,profile=null,activeTab="home",selSubject=null,selChapter=null,selCategory="general",adminTab="users";
let cbtTest=null,cbtQuestions=[],cbtAnswers={},cbtMarked=new Set(),cbtIndex=0,cbtTimerRef=null,cbtRemaining=0;

const app=document.getElementById("app");
function escapeHtml(v){return(v?^^-1: v??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild}
function getLastScore(){try{return JSON.parse(localStorage.getItem("neetrix_last_score")||"null")}catch(e){return null}}
function saveLastScore(obj){try{localStorage.setItem("neetrix_last_score",JSON.stringify(obj))}catch(e){}}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error("Failed: "+src));document.head.appendChild(s)})}
async function loadSupabase(){if(window.supabase)return true;const srcs=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"];let last=null;for(const s of srcs){try{await loadScript(s);if(window.supabase)return true}catch(e){last=e}}throw last||new Error("Supabase load failed")}
async function loadPdfJs(){if(window.pdfjsLib)return true;const srcs=["https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js","https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"];for(const s of srcs){try{await loadScript(s);if(window.pdfjsLib)return true}catch(e){}}return false}

async function initializeApp(){try{await loadSupabase();if(!SUPABASE_URL||!SUPABASE_ANON_KEY)throw new Error("Supabase not configured");db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);loadPdfJs().catch(()=>{});await boot()}catch(e){console.error(e);showFatalError(e?.message||"Could not start")}}
function renderAuth(mode){mode=mode||"login";app.innerHTML="";app.appendChild(el(`<div class="auth-wrap"><div class="auth-card"><div class="brand">NEETrix Pro</div><div class="sub">The ultimate AI & prep experience.</div><div class="msg" id="msg"></div><div id="fields"></div><button class="btn" style="width:100%" id="mainBtn"></button><button class="link" id="link1"></button><button class="link" id="link2" style="display:none"></button></div></div>`));
const fields=document.getElementById("fields"),mainBtn=document.getElementById("mainBtn"),link1=document.getElementById("link1"),link2=document.getElementById("link2"),msg=document.getElementById("msg");
if(mode==="login"||mode==="signup"){fields.innerHTML=`<input id="email" type="email" placeholder="Email address" autocomplete="email"/><input id="pass" type="password" placeholder="Password (8+ characters)" autocomplete="${mode==="login"?"current-password":"new-password"}"/>`;mainBtn.textContent=mode==="login"?"Log in":"Create account";link1.textContent=mode==="login"?"New here? Create an account":"Already have an account? Log in";link1.onclick=()=>renderAuth(mode==="login"?"signup":"login");link2.style.display=mode==="login"?"block":"none";link2.textContent="Forgot password?";link2.onclick=()=>renderAuth("forgot");
mainBtn.onclick=async()=>{msg.textContent="";mainBtn.disabled=true;const email=document.getElementById("email").value.trim(),pass=document.getElementById("pass").value;if(!email||!pass){msg.style.color="var(--muted)";msg.textContent="Enter both fields.";mainBtn.disabled=false;return}try{if(mode==="signup"){const{error}=await db.auth.signUp({email,password:pass});if(error)throw error;msg.style.color="var(--green)";msg.textContent="Account created! Check email if needed, then log in.";setTimeout(()=>renderAuth("login"),1800)}else{const{data,error}=await db.auth.signInWithPassword({email,password:pass});if(error)throw error;session=data.session;await afterLogin()}}catch(e){msg.style.color="var(--danger)";msg.textContent=e?.message||"Something went wrong"}finally{mainBtn.disabled=false}}}

async function openPdf(pdf){try{const{data,error}=await db.storage.from("content").createSignedUrl(pdf.file_path,3600);if(error)throw error;if(!data?.signedUrl)throw new Error("No link");await showPdfModal(data.signedUrl,pdf.title)}catch(e){alert(e?.message||"Unable to open PDF")}}

async function showPdfModal(url,title){
  if(!window.pdfjsLib)await loadPdfJs();
  if(!window.pdfjsLib){alert("PDF viewer library failed to load");return}

  const modal=el(`<div class="modal-bg" id="pdfModal">
    <div class="modal-box" style="max-width:1100px;padding:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <h3 style="margin:0;font-size:17px">${escapeHtml(title||"Document Viewer")}</h3>
        <button class="modal-close" id="mc" style="float:none">×</button>
      </div>
      <div class="pdf-pro-container">
        <div class="pdf-pro-header">
          <div class="pdf-pro-toolbar">
            <button class="pdf-tool-btn" id="prevPage">◀ Prev</button>
            <span id="pageInfo" style="font-size:13.5px;font-weight:700;padding:0 6px">1 / 1</span>
            <button class="pdf-tool-btn" id="nextPage">Next ▶</button>
          </div>
          <div class="pdf-pro-toolbar">
            <button class="pdf-tool-btn active" data-tool="pen">✏️ Pen</button>
            <button class="pdf-tool-btn" data-tool="highlighter">🖍️ Marker</button>
            <button class="pdf-tool-btn" data-tool="eraser">🧹 Eraser</button>
            <button class="pdf-tool-btn" id="clearDraw" style="color:var(--danger)">Clear Page</button>
          </div>
          <div class="pdf-pro-toolbar">
            <button class="pdf-tool-btn" id="zoomOut">−</button>
            <span id="zoomLbl" style="font-size:13px;font-weight:600">100%</span>
            <button class="pdf-tool-btn" id="zoomIn">+</button>
          </div>
        </div>
        <div class="pdf-content-area" id="viewerContainer">
          <div class="pdf-page-wrapper" id="canvasWrap">
            <canvas id="pdfCanvas"></canvas>
            <canvas class="pdf-draw-layer" id="drawCanvas"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>`);

  document.body.appendChild(modal);
  document.getElementById("mc").onclick=()=>modal.remove();
  modal.onclick=e=>{if(e.target===modal)modal.remove();};

  const pdfjsLib=window.pdfjsLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

  let pdfDoc=null, pageNum=1, numPages=1, scale=1.3;
  let currentTool="pen";
  let drawings={};

  const canvas=document.getElementById("pdfCanvas");
  const drawCanvas=document.getElementById("drawCanvas");
  const ctx=canvas.getContext("2d");
  const dCtx=drawCanvas.getContext("2d");

  try{
    pdfDoc=await pdfjsLib.getDocument({url,withCredentials:false}).promise;
    numPages=pdfDoc.numPages;

    async function renderPage(num){
      const page=await pdfDoc.getPage(num);
      const viewport=page.getViewport({scale});
      canvas.width=viewport.width;
      canvas.height=viewport.height;
      drawCanvas.width=viewport.width;
      drawCanvas.height=viewport.height;

      await page.render({canvasContext:ctx,viewport}).promise;
      document.getElementById("pageInfo").textContent=`${num} / ${numPages}`;
      document.getElementById("zoomLbl").textContent=Math.round(scale/1.3*100)+"%";
      redrawCanvas();
    }

    function redrawCanvas(){
      dCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
      const pageStrokes=drawings[pageNum]||[];
      pageStrokes.forEach(stroke=>{
        dCtx.save();
        dCtx.strokeStyle=stroke.color;
        dCtx.lineWidth=stroke.width;
        dCtx.lineCap="round";
        dCtx.lineJoin="round";
        dCtx.globalAlpha=stroke.alpha;
        dCtx.beginPath();
        if(stroke.pts.length>0){
          dCtx.moveTo(stroke.pts[0].x,stroke.pts[0].y);
          for(let i=1;i<stroke.pts.length;i++){dCtx.lineTo(stroke.pts[i].x,stroke.pts[i].y);}
          dCtx.stroke();
        }
        dCtx.restore();
      });
    }

    await renderPage(pageNum);

    document.getElementById("prevPage").onclick=async()=>{if(pageNum>1){pageNum--;await renderPage(pageNum)}};
    document.getElementById("nextPage").onclick=async()=>{if(pageNum<numPages){pageNum++;await renderPage(pageNum)}};
    document.getElementById("zoomIn").onclick=async()=>{scale+=0.3;await renderPage(pageNum)};
    document.getElementById("zoomOut").onclick=async()=>{scale=Math.max(0.6,scale-0.3);await renderPage(pageNum)};

    modal.querySelectorAll(".pdf-tool-btn[data-tool]").forEach(btn=>{
      btn.onclick=()=>{
        modal.querySelectorAll(".pdf-tool-btn[data-tool]").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        currentTool=btn.dataset.tool;
      };
    });

    document.getElementById("clearDraw").onclick=()=>{if(confirm("Clear annotations on this page?")){drawings[pageNum]=[];redrawCanvas();}};

    let isDrawing=false, currentStroke=null;
    const getPos=(e)=>{
      const rect=drawCanvas.getBoundingClientRect();
      const clientX=e.touches?e.touches[0].clientX:e.clientX;
      const clientY=e.touches?e.touches[0].clientY:e.clientY;
      return{x:(clientX-rect.left)*(drawCanvas.width/rect.width), y:(clientY-rect.top)*(drawCanvas.height/rect.height)};
    };

    const startDraw=(e)=>{
      isDrawing=true; const pos=getPos(e);
      let color="#ef4444", width=3, alpha=1.0;
      if(currentTool==="highlighter"){color="#f59e0b";width=20;alpha=0.35;}
      else if(currentTool==="eraser"){color="#ffffff";width=28;alpha=1.0;}
      currentStroke={color,width,alpha,pts:[pos]};
      if(!drawings[pageNum])drawings[pageNum]=[];
      drawings[pageNum].push(currentStroke);
      e.preventDefault();
    };

    const moveDraw=(e)=>{
      if(!isDrawing||!currentStroke)return;
      currentStroke.pts.push(getPos(e));
      redrawCanvas();
      e.preventDefault();
    };

    const endDraw=()=>{isDrawing=false;currentStroke=null;};

    drawCanvas.addEventListener("mousedown",startDraw);
    drawCanvas.addEventListener("mousemove",moveDraw);
    window.addEventListener("mouseup",endDraw);
    drawCanvas.addEventListener("touchstart",startDraw,{passive:false});
    drawCanvas.addEventListener("touchmove",moveDraw,{passive:false});
    window.addEventListener("touchend",endDraw);

    let touchStartX=0;
    const wrapEl=document.getElementById("canvasWrap");
    wrapEl.addEventListener("touchstart",e=>{touchStartX=e.changedTouches[0].screenX},{passive:true});
    wrapEl.addEventListener("touchend",async e=>{
      const touchEndX=e.changedTouches[0].screenX;
      if(touchEndX<touchStartX-60 && pageNum<numPages){pageNum++;await renderPage(pageNum);}
      else if(touchEndX>touchStartX+60 && pageNum>1){pageNum--;await renderPage(pageNum);}
    },{passive:true});

  }catch(e){modal.querySelector(".modal-box").innerHTML+=`<div class="empty">Unable to render PDF<br>${escapeHtml(e?.message||"")}</div>`}
}

async function startCbtTest(test){
  try{
    const isAdmin = profile?.role === "admin";
    const cols = isAdmin ? "*" : "id, question_text, option_a, option_b, option_c, option_d, sort_order, question_image";
    const{data,error}=await db.from("test_questions").select(cols).eq("test_id",test.id).order("sort_order");
    if(error)throw error;
    if(!data?.length){alert("No questions configured for this test yet.");return}
    cbtTest=test;cbtQuestions=data;cbtAnswers={};cbtMarked=new Set();cbtIndex=0;
    cbtRemaining=(Number(test.duration_minutes)||60)*60;
    if(cbtTimerRef)clearInterval(cbtTimerRef);
    cbtTimerRef=setInterval(()=>{
      cbtRemaining--;
      const tEl=document.getElementById("cbtTimer");
      if(tEl){const m=Math.floor(cbtRemaining/60),s=cbtRemaining%60;tEl.textContent=`${m}:${s<10?"0":""}${s}`}
      if(cbtRemaining<=0){clearInterval(cbtTimerRef);cbtTimerRef=null;finishCbt(true)}
    },1000);
    renderCbtUI();
  }catch(e){alert(e?.message||"Unable to start CBT")}
}

function renderCbtUI(){
  const c=document.getElementById("content");
  if(!c||!cbtQuestions.length)return;
  const q=cbtQuestions[cbtIndex];
  const selected=cbtAnswers[q.id]||null;
  const imgHtml = q.question_image ? `<img class="q-img" src="${escapeHtml(q.question_image)}" alt="Question figure"/>` : "";
  c.innerHTML=`<div class="timer" id="cbtTimer">${Math.floor(cbtRemaining/60)}:${(cbtRemaining%60)<10?"0":""}${cbtRemaining%60}</div>
  <div class="cbt-layout"><div class="cbt-qbox">
    <div class="muted" style="margin-bottom:8px;font-weight:600">Question ${cbtIndex+1} of ${cbtQuestions.length}</div>
    <div style="font-size:16px;line-height:1.6;margin-bottom:14px;font-weight:500">${escapeHtml(q.question_text)}</div>
    ${imgHtml}
    <button class="cbt-opt ${selected==="A"?"selected":""}" data-o="A">A. ${escapeHtml(q.option_a)}</button>
    <button class="cbt-opt ${selected==="B"?"selected":""}" data-o="B">B. ${escapeHtml(q.option_b)}</button>
    <button class="cbt-opt ${selected==="C"?"selected":""}" data-o="C">C. ${escapeHtml(q.option_c)}</button>
    <button class="cbt-opt ${selected==="D"?"selected":""}" data-o="D">D. ${escapeHtml(q.option_d)}</button>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
      <button class="btn-outline" id="cbtPrev" ${cbtIndex===0?"disabled":""}>← Previous</button>
      <button class="btn-outline" id="cbtMark">${cbtMarked.has(q.id)?"Unmark":"Mark for Review"}</button>
      <button class="btn" id="cbtNext" style="flex:1">${cbtIndex===cbtQuestions.length-1?"Review Summary":"Next →"}</button>
    </div>
    <button class="btn-danger" style="width:100%;margin-top:14px" id="cbtSubmit">Submit Final Test</button>
  </div>
  <div class="cbt-palette">
    <div style="font-weight:700;font-size:13.5px">Question Palette</div>
    <div class="cbt-palette-grid" id="palette"></div>
  </div></div>`;
  c.querySelectorAll(".cbt-opt").forEach(btn=>{btn.onclick=()=>{cbtAnswers[q.id]=btn.dataset.o;renderCbtUI()}});
  document.getElementById("cbtPrev").onclick=()=>{if(cbtIndex>0){cbtIndex--;renderCbtUI()}};
  document.getElementById("cbtNext").onclick=()=>{if(cbtIndex<cbtQuestions.length-1){cbtIndex++;renderCbtUI()}};
  document.getElementById("cbtMark").onclick=()=>{if(cbtMarked.has(q.id))cbtMarked.delete(q.id);else cbtMarked.add(q.id);renderCbtUI()};
  document.getElementById("cbtSubmit").onclick=()=>{if(confirm("Are you sure you want to submit the test?"))finishCbt(false)};
  const palette=document.getElementById("palette");
  cbtQuestions.forEach((qq,i)=>{
    const btn=el(`<button class="cbt-pbtn">${i+1}</button>`);
    if(cbtAnswers[qq.id])btn.classList.add("answered");
    if(cbtMarked.has(qq.id))btn.classList.add("marked");
    if(i===cbtIndex)btn.classList.add("current");
    btn.onclick=()=>{cbtIndex=i;renderCbtUI()};
    palette.appendChild(btn);
  });
}

async function finishCbt(auto){
  if(cbtTimerRef){clearInterval(cbtTimerRef);cbtTimerRef=null}
  const c=document.getElementById("content");
  c.innerHTML=`<div class="card score-card"><div class="muted">Calculating results...</div></div>`;

  let score=0, total=cbtQuestions.length*4, correct=0, wrong=0, unattempted=0;
  try{
    const {data: fullQs} = await db.from("test_questions").select("*").eq("test_id", cbtTest.id).order("sort_order");
    if(fullQs?.length) cbtQuestions = fullQs;
  }catch(e){}

  cbtQuestions.forEach(q=>{
    const ans = cbtAnswers[q.id] || null;
    const corr = (q.correct_option || "").toUpperCase();
    if(!ans) unattempted++;
    else if(corr && ans === corr) correct++;
    else wrong++;
  });

  score = (correct * 4) + (wrong * -1);
  total = cbtQuestions.length * 4;

  const lastScoreData = { score, total, correct, wrong, unattempted, title: cbtTest?.title, at: Date.now() };
  saveLastScore(lastScoreData);

  c.innerHTML = `<div class="card score-card">
    <div class="muted" style="margin-bottom:6px">${auto ? "Time's up!" : "Test Successfully Submitted"}</div>
    <h2 style="margin-bottom:4px">${escapeHtml(cbtTest?.title || "Mock Test")}</h2>
    <div class="score-num">${score}</div>
    <div class="muted" style="margin-bottom:20px">Total Score out of ${total}</div>
    <div style="display:flex;gap:14px;justify-content:center;margin-bottom:24px">
      <div><div style="font-weight:700;color:var(--green)">${correct}</div><div class="muted" style="font-size:12px">Correct</div></div>
      <div><div style="font-weight:700;color:var(--danger)">${wrong}</div><div class="muted" style="font-size:12px">Incorrect</div></div>
      <div><div style="font-weight:700;color:var(--muted)">${unattempted}</div><div class="muted" style="font-size:12px">Skipped</div></div>
    </div>
    <button class="btn" style="width:100%" id="backTests">Back to Tests</button>
  </div>`;
  document.getElementById("backTests").onclick = () => { cbtTest=null; renderTests(c); };
}

async function renderAdmin(c){
  c.innerHTML=`<h2>Admin Control Panel</h2><div class="tabs2">
    <button class="tab2 ${adminTab==="users"?"active":""}" data-a="users">User Access</button>
    <button class="tab2 ${adminTab==="content"?"active":""}" data-a="content">Subjects & Content</button>
    <button class="tab2 ${adminTab==="tests"?"active":""}" data-a="tests">Tests & Questions Editor</button>
  </div><div id="adminBody"></div>`;
  c.querySelectorAll(".tab2").forEach(b=>{b.onclick=()=>{adminTab=b.dataset.a;renderAdmin(c)}});
  const body=document.getElementById("adminBody");
  if(adminTab==="users")await renderAdminUsers(body);
  else if(adminTab==="content")await renderAdminContent(body);
  else if(adminTab==="tests")await renderAdminTests(body);
}

async function renderAdminUsers(body){
  try{
    const{data,error}=await db.from("profiles").select("*").order("created_at",{ascending:false});
    if(error)throw error;
    if(!data?.length){body.innerHTML=`<div class="empty">No registered users yet.</div>`;return}
    body.innerHTML=`<table><thead><tr><th>User Email</th><th>Role</th><th>Status</th><th>Control Actions</th></tr></thead><tbody id="uRows"></tbody></table>`;
    const rows=document.getElementById("uRows");
    data.forEach(user=>{
      const tr=el(`<tr><td><b>${escapeHtml(user.email)}</b></td><td><span class="badge ${user.role==="admin"?"admin":""}">${escapeHtml(user.role)}</span></td><td><span class="badge ${escapeHtml(user.status)}">${escapeHtml(user.status)}</span></td><td class="row-wrap" id="act-${escapeHtml(user.id)}"></td></tr>`);
      rows.appendChild(tr);
      const act=tr.querySelector(`#act-${CSS.escape(user.id)}`);
      if(user.role==="admin"){act.innerHTML=`<span class="muted">Master Admin</span>`;return}
      const setStatus=async st=>{try{await db.from("profiles").update({status:st}).eq("id",user.id);renderAdmin(document.getElementById("content"))}catch(e){alert(e?.message||"Error")}};
      if(user.status==="pending"){
        const a=el(`<button class="btn-good">Approve</button>`);a.onclick=()=>setStatus("active");act.appendChild(a);
      }else{
        const p=el(`<button class="btn-warn">${user.status==="paused"?"Resume":"Pause"}</button>`);p.onclick=()=>setStatus(user.status==="paused"?"active":"paused");act.appendChild(p);
      }
      const del=el(`<button class="btn-danger">Delete</button>`);
      del.onclick=async()=>{if(confirm("Permanently delete this user?")){try{await db.from("profiles").delete().eq("id",user.id);renderAdmin(document.getElementById("content"))}catch(e){alert(e?.message)}}};
      act.appendChild(del);
    });
  }catch(e){body.innerHTML=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}
}

async function renderAdminContent(body){
  body.innerHTML=`<h3>Complete Curriculum Management</h3>
  <div class="card">
    <input id="subName" placeholder="New Subject Name (e.g. Biology, Physics)"/>
    <button class="btn" id="addSubj">Add New Subject</button>
  </div>
  <div id="adminSubjList"></div>`;
  
  try{
    document.getElementById("addSubj").onclick=async()=>{
      const name=document.getElementById("subName").value.trim();
      if(!name)return;
      try{await db.from("subjects").insert({name});renderAdminContent(body);}catch(e){alert(e?.message)}
    };

    const{data:subjects}=await db.from("subjects").select("*").order("sort_order");
    const subList=document.getElementById("adminSubjList");
    if(!subjects?.length){subList.innerHTML=`<div class="empty">No subjects found.</div>`;return;}
    
    subList.innerHTML="";
    for(let s of subjects){
      const sCard=el(`<div class="card"><div class="row"><b style="font-size:16px">${escapeHtml(s.name)}</b><button class="btn-danger delSub">Delete Subject</button></div>
      <div style="margin-top:14px;display:flex;gap:10px">
        <input placeholder="Chapter Name for ${escapeHtml(s.name)}" id="chInp-${s.id}" style="margin:0;flex:1"/>
        <button class="btn" id="addCh-${s.id}" style="white-space:nowrap">Add Chapter</button>
      </div>
      <div id="chs-${s.id}" style="margin-top:14px"></div></div>`);
      
      sCard.querySelector(".delSub").onclick=async()=>{if(confirm(`Delete subject ${s.name} and all its chapters?`)){try{await db.from("subjects").delete().eq("id",s.id);renderAdminContent(body);}catch(e){alert(e?.message)}}};
      sCard.querySelector(`#addCh-${s.id}`).onclick=async()=>{
        const name=document.getElementById(`chInp-${s.id}`).value.trim();
        if(!name)return;
        try{await db.from("chapters").insert({subject_id:s.id,name});renderAdminContent(body);}catch(e){alert(e?.message)}
      };
      
      subList.appendChild(sCard);

      const{data:chapters}=await db.from("chapters").select("*").eq("subject_id",s.id).order("sort_order");
      const chContainer=sCard.querySelector(`#chs-${s.id}`);
      if(chapters?.length){
        chapters.forEach(ch=>{
          const chRow=el(`<div class="row" style="background:var(--panel2);padding:10px 14px;border-radius:10px;margin-bottom:8px"><div><span style="font-weight:600">${escapeHtml(ch.name)}</span></div><div class="row-wrap"><button class="btn-small addVid">Add Video</button><button class="btn-small addPdf">Add PDF</button><button class="btn-danger" style="padding:5px 10px;font-size:11.5px">Delete</button></div></div>`);
          
          chRow.querySelector(".addVid").onclick=()=>openAddVideoModal(ch);
          chRow.querySelector(".addPdf").onclick=()=>openAddPdfModal(ch);
          chRow.querySelector(".btn-danger").onclick=async()=>{if(confirm(`Delete chapter ${ch.name}?`)){try{await db.from("chapters").delete().eq("id",ch.id);renderAdminContent(body);}catch(e){alert(e?.message)}}};
          chContainer.appendChild(chRow);
        });
      }else{
        chContainer.innerHTML=`<div class="muted" style="font-size:13px">No chapters added under this subject yet.</div>`;
      }
    }
  }catch(e){body.innerHTML=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}
}

function openAddVideoModal(ch){
  const modal=el(`<div class="modal-bg"><div class="modal-box" style="max-width:465px">
    <button class="modal-close" id="mc">×</button>
    <h3 style="margin-bottom:16px">Add Video Lecture to ${escapeHtml(ch.name)}</h3>
    <input id="vTitle" placeholder="Lecture Title"/>
    <input id="vId" placeholder="YouTube Video ID (e.g. dQw4w9WgXcQ)"/>
    <button class="btn" style="width:100%;margin-top:8px" id="saveVid">Upload Video</button>
  </div></div>`);
  document.body.appendChild(modal);
  modal.querySelector("#mc").onclick=()=>modal.remove();
  modal.querySelector("#saveVid").onclick=async()=>{
    const title=document.getElementById("vTitle").value.trim();
    const youtube_id=document.getElementById("vId").value.trim();
    if(!title||!youtube_id)return alert("Fill all fields");
    try{
      await db.from("videos").insert({chapter_id:ch.id,title,youtube_id});
      alert("Video added successfully");
      modal.remove();
    }catch(e){alert(e?.message)}
  };
}

function openAddPdfModal(ch){
  const modal=el(`<div class="modal-bg"><div class="modal-box" style="max-width:465px">
    <button class="modal-close" id="mc">×</button>
    <h3 style="margin-bottom:16px">Add PDF Document to ${escapeHtml(ch.name)}</h3>
    <input id="pTitle" placeholder="Document Title"/>
    <select id="pCat"><option value="general">Practice Sheet</option><option value="pyq">Past Year Paper</option><option value="ncert">NCERT Notes</option></select>
    <input type="file" id="pFile" accept="application/pdf" style="margin-top:8px"/>
    <button class="btn" style="width:100%;margin-top:10px" id="savePdf">Upload PDF</button>
  </div></div>`);
  document.body.appendChild(modal);
  modal.querySelector("#mc").onclick=()=>modal.remove();
  modal.querySelector("#savePdf").onclick=async()=>{
    const title=document.getElementById("pTitle").value.trim();
    const category=document.getElementById("pCat").value;
    const file=document.getElementById("pFile").files[0];
    if(!title||!file)return alert("Provide title and PDF file");
    try{
      const file_path=`pdfs/${crypto.randomUUID()}_${file.name}`;
      await db.storage.from("content").upload(file_path,file);
      await db.from("pdfs").insert({chapter_id:ch.id,title,category,file_path});
      alert("PDF uploaded successfully");
      modal.remove();
    }catch(e){alert(e?.message)}
  };
}

async function renderAdminTests(body){
  body.innerHTML=`<h3>Create Mock Tests & Add Questions to Any Chapter Name</h3>
  <div class="card">
    <input id="tTitle" placeholder="Test Title (e.g. Full Syllabus Mock 1)"/>
    <input id="tDur" type="number" value="180" placeholder="Duration in Minutes"/>
    <select id="tSubj"><option value="">-- Link to Subject (Optional) --</option></select>
    <select id="tChap"><option value="">-- Link to Chapter Name --</option></select>
    <button class="btn" id="createTestBtn" style="margin-top:8px">Create CBT Test Instance</button>
  </div>
  <h3>Existing Tests & Question Management</h3>
  <div id="existingTests"></div>`;

  try{
    const{data:subjects}=await db.from("subjects").select("*").order("sort_order");
    const subjSel=document.getElementById("tSubj");
    const chapSel=document.getElementById("tChap");

    subjects?.forEach(s=>{
      const opt=document.createElement("option");
      opt.value=s.id;opt.textContent=s.name;
      subjSel.appendChild(opt);
    });

    subjSel.onchange=async()=>{
      chapSel.innerHTML=`<option value="">-- Link to Chapter Name --</option>`;
      if(!subjSel.value)return;
      const{data:chapters}=await db.from("chapters").select("*").eq("subject_id",subjSel.value).order("sort_order");
      chapters?.forEach(ch=>{
        const opt=document.createElement("option");
        opt.value=ch.id;opt.textContent=ch.name;
        chapSel.appendChild(opt);
      });
    };

    document.getElementById("createTestBtn").onclick=async()=>{
      const title=document.getElementById("tTitle").value.trim();
      const duration_minutes=parseInt(document.getElementById("tDur").value)||180;
      const subject_id=subjSel.value||null;
      const chapter_id=chapSel.value||null;
      if(!title){alert("Enter test title");return;}

      try{
        await db.from("tests").insert({title,duration_minutes,subject_id,chapter_id,type:"cbt"});
        alert("Test created successfully!");
        renderAdminTests(body);
      }catch(e){alert(e?.message||"Error creating test")}
    };

    const{data:tests}=await db.from("tests").select("*, subjects(name), chapters(name)").order("created_at",{ascending:false});
    const tContainer=document.getElementById("existingTests");
    if(!tests?.length){tContainer.innerHTML=`<div class="empty">No tests created yet.</div>`;return;}
    
    tContainer.innerHTML="";
    tests.forEach(t=>{
      const meta=[t.subjects?.name, t.chapters?.name].filter(Boolean).join(" › ");
      const row=el(`<div class="card row"><div><b style="font-size:16px">${escapeHtml(t.title)}</b><div class="muted" style="margin-top:3px">${meta?meta+" · ":""}${t.duration_minutes} mins</div></div><div class="row-wrap"><button class="btn-good addQ">Add Question</button><button class="btn-danger">Delete</button></div></div>`);
      
      row.querySelector(".addQ").onclick=()=>openAddQuestionModal(t);
      row.querySelector(".btn-danger").onclick=async()=>{
        if(confirm(`Delete test ${t.title}?`)){
          try{await db.from("tests").delete().eq("id",t.id);renderAdminTests(body);}catch(e){alert(e?.message)}
        }
      };
      tContainer.appendChild(row);
    });

  }catch(e){body.innerHTML=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}
}

function openAddQuestionModal(test){
  const modal=el(`<div class="modal-bg"><div class="modal-box" style="max-width:560px">
    <button class="modal-close" id="mc">×</button>
    <h3 style="margin-bottom:16px">Add Question to: ${escapeHtml(test.title)}</h3>
    <textarea id="qText" placeholder="Question statement..."></textarea>
    <input id="optA" placeholder="Option A"/>
    <input id="optB" placeholder="Option B"/>
    <input id="optC" placeholder="Option C"/>
    <input id="optD" placeholder="Option D"/>
    <select id="corr"><option value="A">Correct Option: A</option><option value="B">Correct Option: B</option><option value="C">Correct Option: C</option><option value="D">Correct Option: D</option></select>
    <input id="qImg" placeholder="Optional Question Image URL (optional)" style="margin-top:6px"/>
    <button class="btn" style="width:100%;margin-top:10px" id="saveQ">Save Question</button>
  </div></div>`);
  document.body.appendChild(modal);
  modal.querySelector("#mc").onclick=()=>modal.remove();
  modal.querySelector("#saveQ").onclick=async()=>{
    const question_text=document.getElementById("qText").value.trim();
    const option_a=document.getElementById("optA").value.trim();
    const option_b=document.getElementById("optB").value.trim();
    const option_c=document.getElementById("optC").value.trim();
    const option_d=document.getElementById("optD").value.trim();
    const correct_option=document.getElementById("corr").value;
    const question_image=document.getElementById("qImg").value.trim()||null;

    if(!question_text||!option_a||!option_b||!option_c||!option_d)return alert("Fill question statement and all 4 options");
    try{
      await db.from("test_questions").insert({test_id:test.id,question_text,option_a,option_b,option_c,option_d,correct_option,question_image});
      alert("Question added successfully!");
      document.getElementById("qText").value="";
      document.getElementById("optA").value="";
      document.getElementById("optB").value="";
      document.getElementById("optC").value="";
      document.getElementById("optD").value="";
      document.getElementById("qImg").value="";
    }catch(e){alert(e?.message)}
  };
}

async function boot(){
  if(!db)throw new Error("Supabase not init");
  try{
    const{data,error}=await db.auth.getSession();
    if(error)throw error;
    session=data?.session||null;
    if(session)await afterLogin();
    else renderAuth();
    db.auth.onAuthStateChange((e,ns)=>{session=ns||null});
  }catch(e){throw e}
}
initializeApp();
</script>
