<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NEETrix</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060912;--panel:#0f1524;--panel2:#151d30;--border:#243049;
  --text:#eef2fb;--muted:#8b97b3;--accent:#5b9dff;--accent2:#6b7cff;
  --green:#3dd68c;--danger:#ef5a5a;--warn:#f0b429;--shadow:0 8px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior:none;letter-spacing:-.01em}
#app{min-height:100vh;padding-bottom:52px}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit;transition:border-color .15s ease,box-shadow .15s ease}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,157,255,.12)}
textarea{min-height:90px;resize:vertical}
button{cursor:pointer;font-family:inherit;transition:all .18s ease;-webkit-tap-highlight-color:transparent}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 4px 14px rgba(91,157,255,.25)}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(91,157,255,.35)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:9px;font-size:13px}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--danger);border:none;color:#fff;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600}
.btn-good{background:var(--green);border:none;color:#06281a;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600}
.btn-warn{background:var(--warn);border:none;color:#3a2a00;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600}
.btn-small{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:7px;font-size:12px}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,#121a2e 0%,var(--bg) 70%)}
.auth-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:36px 32px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.brand{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:13.5px;margin:8px 0 22px}
.msg{font-size:12.5px;margin:-4px 0 12px;min-height:16px}
.link{color:var(--accent);background:none;border:none;font-size:13px;text-align:center;width:100%;margin-top:10px}

.topbar{display:flex;align-items:center;gap:4px;padding:10px 14px;border-bottom:1px solid var(--border);background:rgba(15,21,36,.92);backdrop-filter:blur(12px);overflow-x:auto;position:sticky;top:0;z-index:50}
.topbar .brand{font-size:17px;margin:0;flex-shrink:0;margin-right:6px}
.navbtn{background:none;border:1px solid transparent;color:var(--muted);padding:7px 12px;border-radius:8px;font-size:12.5px;white-space:nowrap;flex-shrink:0}
.navbtn:hover{color:var(--text)}
.navbtn.active{background:var(--panel2);color:var(--text);border-color:var(--border)}
.spacer{flex:1;min-width:8px}
.profile-wrap{position:relative;flex-shrink:0}
.profile-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}

.content{max-width:920px;margin:0 auto;padding:22px 16px 40px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.subject-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 18px;cursor:pointer;transition:.2s}
.subject-card:hover{border-color:var(--accent);transform:translateY(-3px)}
.subject-card h3{margin:0;font-size:15.5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row-wrap{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.muted{color:var(--muted);font-size:12.5px}
.badge{font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--muted)}
.badge.admin{color:var(--accent);border-color:var(--accent)}
.badge.active{color:var(--green);border-color:var(--green)}
.back{background:none;border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;font-size:12.5px;margin-bottom:16px}
.tabs2{display:flex;gap:6px;margin:12px 0 16px;flex-wrap:wrap}
.tab2{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:8px 15px;border-radius:9px;font-size:12.5px;font-weight:500}
.tab2.active{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
h2{font-size:20px;margin:2px 0 10px;font-weight:700}
h3{font-size:15px;margin:16px 0 10px;font-weight:600}
.empty{color:var(--muted);font-size:13.5px;padding:32px 0;text-align:center}

.home-hero{text-align:center;padding:32px 16px 28px;background:radial-gradient(ellipse at 30% 40%, rgba(91,157,255,.12) 0%, transparent 50%),radial-gradient(ellipse at 70% 40%, rgba(61,214,140,.08) 0%, transparent 50%),linear-gradient(180deg,rgba(91,157,255,.06) 0%,transparent 100%);border:1px solid var(--border);border-radius:20px;margin-bottom:18px}
.anim-row{display:flex;justify-content:center;align-items:center;gap:56px;margin-bottom:20px;flex-wrap:wrap;min-height:180px}
.atom-wrap{width:150px;height:150px;position:relative;flex-shrink:0;filter:drop-shadow(0 0 20px rgba(91,157,255,.35))}
.atom-core{width:22px;height:22px;background:radial-gradient(circle at 35% 30%,#e8f4ff 0%,#7eb8ff 40%,#3b82f6 100%);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 12px #fff,0 0 28px var(--accent);z-index:5}
.orbit{position:absolute;top:50%;left:50%;border:1.5px solid rgba(125,211,252,.35);border-radius:50%;transform:translate(-50%,-50%);animation:spin linear infinite}
.orbit1{width:64px;height:40px;animation-duration:3.8s}
.orbit2{width:94px;height:58px;animation-duration:6.2s;animation-direction:reverse}
.orbit3{width:122px;height:76px;animation-duration:8.5s}
.orbit4{width:140px;height:90px;animation-duration:11s;animation-direction:reverse;opacity:.5}
.electron{width:9px;height:9px;background:radial-gradient(circle at 30% 30%,#fff,#7dd3fc 60%,#38bdf8);border-radius:50%;position:absolute;top:-4.5px;left:50%;margin-left:-4.5px;box-shadow:0 0 10px #7dd3fc}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.nerve-wrap{width:130px;height:170px;position:relative;flex-shrink:0}
.nerve-brain{width:48px;height:36px;background:radial-gradient(ellipse at 40% 35%,#c7e0ff 0%,#6ba3f0 45%,#3b6fd4 100%);border-radius:50% 50% 42% 42%;position:absolute;top:0;left:50%;transform:translateX(-50%);box-shadow:0 0 16px rgba(91,157,255,.6);z-index:3}
.nerve-spine{width:6px;height:100px;background:linear-gradient(180deg,#7eb8ff 0%,var(--accent) 40%,rgba(91,157,255,.35) 100%);position:absolute;top:32px;left:50%;transform:translateX(-50%);border-radius:4px;z-index:2}
.nerve-wave{position:absolute;left:50%;width:8px;height:8px;background:radial-gradient(circle,#6ee7b7,var(--green));border-radius:50%;transform:translateX(-50%);animation:nerveDown 2.4s ease-in-out infinite;z-index:4}
.nerve-wave:nth-child(3){animation-delay:.6s}
.nerve-wave:nth-child(4){animation-delay:1.2s}
.nerve-wave:nth-child(5){animation-delay:1.8s}
.nerve-branch{position:absolute;height:2.5px;background:linear-gradient(90deg,rgba(91,157,255,.7),rgba(91,157,255,.15));border-radius:2px}
.nerve-branch.arm-l{width:34px;top:52px;left:calc(50% - 34px);transform:rotate(-28deg)}
.nerve-branch.arm-r{width:34px;top:52px;left:50%;transform:rotate(28deg);background:linear-gradient(90deg,rgba(91,157,255,.15),rgba(91,157,255,.7))}
.nerve-branch.leg-l{width:26px;top:108px;left:calc(50% - 22px);transform:rotate(-38deg)}
.nerve-branch.leg-r{width:26px;top:108px;left:50%;transform:rotate(38deg);background:linear-gradient(90deg,rgba(91,157,255,.15),rgba(91,157,255,.7))}
.nerve-branch.org{width:18px;top:78px;left:calc(50% - 18px);transform:rotate(-14deg);opacity:.75}
.nerve-branch.org2{width:18px;top:78px;left:50%;transform:rotate(14deg);opacity:.75;background:linear-gradient(90deg,rgba(91,157,255,.15),rgba(91,157,255,.55))}
@keyframes nerveDown{0%{top:36px;opacity:0;transform:translateX(-50%) scale(.4)}15%{opacity:1}85%{opacity:1}100%{top:128px;opacity:0;transform:translateX(-50%) scale(.25)}}
.welcome{font-size:22px;font-weight:700;margin-bottom:4px}
.progress-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px;cursor:pointer}
.progress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.progress-bar-bg{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-bottom:10px}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:4px;transition:width .6s ease}
.progress-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px}
.progress-stats span{color:var(--muted)}
.progress-stats b{color:var(--text);font-weight:600}
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:600px){.home-grid{grid-template-columns:1fr}}
.home-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px 14px;text-align:center;cursor:pointer;transition:.22s}
.home-card:hover{border-color:var(--accent);transform:translateY(-4px)}
.home-card .icon{font-size:30px;margin-bottom:10px}
.home-card h3{margin:0 0 4px;font-size:15px}

.powered{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);padding:11px 0;background:rgba(6,9,18,.94);backdrop-filter:blur(10px);border-top:1px solid rgba(36,48,73,.6);z-index:40}
.powered span{background:linear-gradient(90deg,var(--muted),var(--accent),var(--muted));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:500}

.yt-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden;background:#000;margin-bottom:14px;border:1px solid var(--border)}
.yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.modal-close{background:none;border:none;color:var(--muted);float:right;font-size:24px;line-height:1;padding:0 4px}

.timer{font-size:22px;font-weight:800;color:var(--warn);text-align:center;padding:12px;background:var(--panel2);border-radius:10px;margin-bottom:12px}
.zoom-row{display:flex;gap:8px;justify-content:center;margin-top:10px}
.zoom-row button{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px}

.cbt-layout{display:grid;grid-template-columns:1fr 220px;gap:16px}
@media(max-width:720px){.cbt-layout{grid-template-columns:1fr}}
.cbt-qbox{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}
.cbt-palette{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:70px}
.cbt-palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.cbt-pbtn{width:100%;aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:12px;font-weight:600}
.cbt-pbtn.answered{background:rgba(91,157,255,.2);border-color:var(--accent);color:var(--accent)}
.cbt-pbtn.marked{background:rgba(240,180,41,.2);border-color:var(--warn);color:var(--warn)}
.cbt-pbtn.current{outline:2px solid var(--green);outline-offset:1px}
.cbt-opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px}
.cbt-opt.selected{border-color:var(--accent);background:rgba(91,157,255,.12)}
.cbt-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.cbt-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11px;color:var(--muted)}
.cbt-legend span{display:flex;align-items:center;gap:4px}
.cbt-dot{width:10px;height:10px;border-radius:3px}
.score-card{text-align:center;padding:28px 16px}
.score-num{font-size:48px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.profile-field{margin-bottom:14px}
.profile-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.q-img{max-width:100%;border-radius:10px;margin:10px 0;border:1px solid var(--border)}

.skel{background:linear-gradient(90deg,var(--panel2) 25%,rgba(255,255,255,.05) 37%,var(--panel2) 63%);background-size:400% 100%;animation:skelShine 1.4s ease infinite;border-radius:12px}
@keyframes skelShine{0%{background-position:100% 0}100%{background-position:0 0}}
.skel-card{height:64px;margin-bottom:10px}
.skel-subj{height:74px;border-radius:14px}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page-fade{animation:fadeSlideIn .3s cubic-bezier(.2,.8,.2,1) both}

.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(10px);background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:10px;font-size:12.5px;opacity:0;transition:opacity .25s ease,transform .25s ease;z-index:200;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.pdf-modal{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column}
.pdf-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(15,21,36,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);z-index:5}
.pdf-tbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:9px;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pdf-tbtn.active-tool{background:var(--accent);border-color:var(--accent);color:#fff}
.pdf-title{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pdf-tools{display:flex;align-items:center;gap:6px;flex-shrink:0;overflow-x:auto}
.pdf-zoom-label{font-size:11.5px;color:var(--muted);min-width:34px;text-align:center}
.pdf-canvas-wrap{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:16px;position:relative;-webkit-overflow-scrolling:touch}
.pdf-canvas-stack{position:relative;flex-shrink:0}
.pdf-canvas-stack canvas{display:block}
#pdfAnnoCanvas{position:absolute;top:0;left:0;pointer-events:none}
#pdfAnnoCanvas.tool-active{pointer-events:auto;touch-action:none}
#pdfTextLayer{position:absolute;top:0;left:0;overflow:hidden;line-height:1;opacity:.2;pointer-events:auto;user-select:text}
#pdfTextLayer span{position:absolute;white-space:pre;color:transparent;transform-origin:0% 0%}
.pdf-pagebar{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;background:rgba(15,21,36,.96);backdrop-filter:blur(14px);border-top:1px solid var(--border);z-index:5}
.pdf-pagebar input{width:52px;text-align:center;margin:0;padding:6px}
.pdf-annobar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(15,21,36,.96);border-top:1px solid var(--border);overflow-x:auto}
.pdf-color{width:22px;height:22px;border-radius:50%;border:2px solid transparent;flex-shrink:0}
.pdf-color.selected{border-color:#fff;transform:scale(1.1)}
.pdf-panel{position:absolute;right:0;top:0;bottom:0;width:280px;max-width:82vw;background:var(--panel);border-left:1px solid var(--border);z-index:10;transform:translateX(100%);transition:transform .25s ease;overflow:auto}
.pdf-panel.open{transform:translateX(0)}
.pdf-panel-tabs{display:flex;border-bottom:1px solid var(--border)}
.pdf-panel-tab{flex:1;padding:12px;text-align:center;font-size:12px;color:var(--muted);background:none;border:none}
.pdf-panel-tab.active{color:var(--accent);border-bottom:2px solid var(--accent)}
.pdf-panel-body{padding:10px}
.pdf-panel-item{padding:10px;border-radius:9px;background:var(--panel2);margin-bottom:8px;font-size:12.5px;cursor:pointer}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>

<script>

let db=null,session=null,profile=null,activeTab="home",selSubject=null,selChapter=null,selCategory="general",adminTab="dashboard";
let cbtTest=null,cbtQuestions=[],cbtAnswers={},cbtMarked=new Set(),cbtBookmarks=new Set(),cbtIndex=0,cbtTimerRef=null,cbtRemaining=0;

const app=document.getElementById("app");
function escapeHtml(v){return(v??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild}
function fmtDate(iso){if(!iso)return"";const d=new Date(iso);if(Number.isNaN(d.getTime()))return"";return d.toLocaleString(undefined,{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function ytId(url){const m=(url||"").match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null}
function showFatalError(m){document.body.innerHTML=`<div style="min-height:100vh;background:#060912;color:#fff;padding:24px"><div style="max-width:700px;margin:40px auto;background:#0f1524;border:1px solid #243049;border-radius:14px;padding:24px"><h2 style="color:#ef5a5a">NEETrix Error</h2><div style="color:#c5cada;line-height:1.6;white-space:pre-wrap">${escapeHtml(m)}</div></div></div>`}
function getLastScore(){try{return JSON.parse(localStorage.getItem("neetrix_last_score")||"null")}catch(e){return null}}
function saveLastScore(obj){try{localStorage.setItem("neetrix_last_score",JSON.stringify(obj))}catch(e){}}
function lsGet(key,fallback){try{const v=localStorage.getItem(key);return v!=null?JSON.parse(v):fallback}catch(e){return fallback}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function skelList(n,cls){let h="";for(let i=0;i<n;i++)h+=`<div class="skel ${cls||"skel-card"}"></div>`;return h}
function toast(msg,ms=2500){let t=document.getElementById("globalToast");if(!t){t=el(`<div class="toast" id="globalToast"></div>`);document.body.appendChild(t)}t.textContent=msg;t.classList.add("show");clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove("show"),ms)}
function confirmAction(title,message){return new Promise(resolve=>{const modal=el(`<div class="modal-bg"><div class="modal-box" style="max-width:420px"><h3 style="margin-bottom:10px">${escapeHtml(title)}</h3><p class="muted" style="line-height:1.55;margin-bottom:18px;white-space:pre-wrap">${escapeHtml(message)}</p><div style="display:flex;gap:10px"><button class="btn-outline" style="flex:1" id="cNo">Cancel</button><button class="btn-danger" style="flex:1" id="cYes">Confirm</button></div></div></div>`);document.body.appendChild(modal);document.getElementById("cNo").onclick=()=>{modal.remove();resolve(false)};document.getElementById("cYes").onclick=()=>{modal.remove();resolve(true)};modal.onclick=e=>{if(e.target===modal){modal.remove();resolve(false)}}})}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error("Failed: "+src));document.head.appendChild(s)})}
async function loadSupabase(){if(window.supabase)return true;const srcs=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"];let last=null;for(const s of srcs){try{await loadScript(s);if(window.supabase)return true}catch(e){last=e}}throw last||new Error("Supabase load failed")}
async function loadPdfJs(){if(window.pdfjsLib)return true;const srcs=["https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js","https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"];for(const s of srcs){try{await loadScript(s);if(window.pdfjsLib)return true}catch(e){}}return false}

async function initializeApp(){try{await loadSupabase();if(!SUPABASE_URL||!SUPABASE_ANON_KEY)throw new Error("Supabase not configured");db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);loadPdfJs().catch(()=>{});await boot()}catch(e){console.error(e);showFatalError(e?.message||"Could not start")}}

function renderAuth(mode){mode=mode||"login";if(!app)return;app.innerHTML="";app.appendChild(el(`<div class="auth-wrap"><div class="auth-card"><div class="brand">NEETrix</div><div class="sub">The focused way to prepare.</div><div class="msg" id="msg"></div><div id="fields"></div><button class="btn" style="width:100%" id="mainBtn"></button><button class="link" id="link1"></button><button class="link" id="link2" style="display:none"></button></div></div>`));
const fields=document.getElementById("fields"),mainBtn=document.getElementById("mainBtn"),link1=document.getElementById("link1"),link2=document.getElementById("link2"),msg=document.getElementById("msg");
if(mode==="login"||mode==="signup"){fields.innerHTML=`<input id="email" type="email" placeholder="Email address" autocomplete="email"/><input id="pass" type="password" placeholder="Password (8+ characters)" autocomplete="${mode==="login"?"current-password":"new-password"}"/>`;mainBtn.textContent=mode==="login"?"Log in":"Create account";link1.textContent=mode==="login"?"New here? Create an account":"Already have an account? Log in";link1.onclick=()=>renderAuth(mode==="login"?"signup":"login");link2.style.display=mode==="login"?"block":"none";link2.textContent="Forgot password?";link2.onclick=()=>renderAuth("forgot");
mainBtn.onclick=async()=>{msg.textContent="";mainBtn.disabled=true;const email=document.getElementById("email").value.trim(),pass=document.getElementById("pass").value;if(!email||!pass){msg.style.color="var(--muted)";msg.textContent="Enter both fields.";mainBtn.disabled=false;return}try{if(mode==="signup"){const{error}=await db.auth.signUp({email,password:pass});if(error)throw error;msg.style.color="var(--green)";msg.textContent="Account created! Check email if needed, then log in.";setTimeout(()=>renderAuth("login"),1800)}else{const{data,error}=await db.auth.signInWithPassword({email,password:pass});if(error)throw error;session=data.session;await afterLogin()}}catch(e){msg.style.color="var(--danger)";msg.textContent=e?.message||"Something went wrong"}finally{mainBtn.disabled=false}}}
else if(mode==="forgot"){fields.innerHTML=`<input id="email" type="email" placeholder="Email address"/>`;mainBtn.textContent="Send reset link";link1.textContent="Back to log in";link1.onclick=()=>renderAuth("login");mainBtn.onclick=async()=>{msg.textContent="";mainBtn.disabled=true;const email=document.getElementById("email").value.trim();if(!email){msg.style.color="var(--muted)";msg.textContent="Enter email";mainBtn.disabled=false;return}try{const{error}=await db.auth.resetPasswordForEmail(email);if(error)throw error;msg.style.color="var(--green)";msg.textContent="Reset link sent"}catch(e){msg.style.color="var(--danger)";msg.textContent=e?.message||"Error"}finally{mainBtn.disabled=false}}}}

    if(error){list.innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`;return}
    if(!data?.length){list.innerHTML=`<div class="empty">No content in this category yet.</div>`;return}

async function openPdf(pdf){try{const{data,error}=await db.storage.from("content").createSignedUrl(pdf.file_path,3600);if(error)throw error;if(!data?.signedUrl)throw new Error("No link");await openPdfReader(data.signedUrl,pdf.title,"pdf_"+pdf.id)}catch(e){toast(e?.message||"Unable to open PDF")}}

function pr_toast(msg){const t=document.getElementById("pdfToast");if(!t)return;t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function pr_setToolActive(active){const c=document.getElementById("pdfAnnoCanvas");if(c)c.classList.toggle("tool-active",!!active)}
function pr_highlightToolBtn(id){["toolPen","toolHi","toolEraser"].forEach(x=>{const b=document.getElementById(x);if(b)b.classList.toggle("active-tool",x===id)})}
function pr_saveAnno(){lsSet("pdfanno_"+pr.storageKey,pr.annotations)}
function pr_scheduleHide(){clearTimeout(pr.hideTimer);pr.hideTimer=setTimeout(()=>{if(document.fullscreenElement){document.getElementById("pdfToolbar")?.classList.add("hidden");document.getElementById("pdfPagebar")?.classList.add("hidden")}},3000)}

function pr_drawAnnotations(){
  const anno=document.getElementById("pdfAnnoCanvas");if(!anno)return;
  const ctx=anno.getContext("2d");ctx.clearRect(0,0,anno.width,anno.height);
  const strokes=pr.annotations[pr.pageNum]||[];
  strokes.forEach(s=>{ctx.strokeStyle=s.color;ctx.lineWidth=s.width*pr.scale;ctx.lineCap="round";ctx.lineJoin="round";ctx.globalAlpha=s.alpha||1;ctx.beginPath();s.points.forEach((p,i)=>{const x=p[0]*pr.scale,y=p[1]*pr.scale;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()});
  ctx.globalAlpha=1;
}

function pr_eraseAt(pos){const strokes=pr.annotations[pr.pageNum]||[];const idx=strokes.findIndex(s=>s.points.some(p=>Math.hypot(p[0]-pos[0],p[1]-pos[1])<14/pr.scale));if(idx>-1){strokes.splice(idx,1);pr_drawAnnotations();pr_saveAnno()}}
function pr_undo(){const strokes=pr.annotations[pr.pageNum]||[];if(!strokes.length)return;const s=strokes.pop();if(!pr.redoStack[pr.pageNum])pr.redoStack[pr.pageNum]=[];pr.redoStack[pr.pageNum].push(s);pr_drawAnnotations();pr_saveAnno()}
function pr_redo(){const redo=pr.redoStack[pr.pageNum]||[];if(!redo.length)return;const s=redo.pop();if(!pr.annotations[pr.pageNum])pr.annotations[pr.pageNum]=[];pr.annotations[pr.pageNum].push(s);pr_drawAnnotations();pr_saveAnno()}

function pr_bindDrawing(){
  const anno=document.getElementById("pdfAnnoCanvas");let drawing=false,stroke=null;
  const getPos=e=>{const rect=anno.getBoundingClientRect();return[(e.clientX-rect.left)/pr.scale,(e.clientY-rect.top)/pr.scale]};
  anno.addEventListener("pointerdown",e=>{if(!pr.tool)return;e.preventDefault();if(pr.tool==="eraser"){pr_eraseAt(getPos(e));return}drawing=true;stroke={color:pr.color,width:pr.tool==="highlighter"?18:3,alpha:pr.tool==="highlighter"?0.35:1,points:[getPos(e)]};anno.setPointerCapture(e.pointerId)});
  anno.addEventListener("pointermove",e=>{if(!drawing||!stroke)return;stroke.points.push(getPos(e));pr_drawAnnotations();const ctx=anno.getContext("2d");ctx.strokeStyle=stroke.color;ctx.lineWidth=stroke.width*pr.scale;ctx.lineCap="round";ctx.globalAlpha=stroke.alpha;ctx.beginPath();stroke.points.forEach((p,i)=>{const x=p[0]*pr.scale,y=p[1]*pr.scale;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.globalAlpha=1});
  anno.addEventListener("pointerup",e=>{if(!drawing||!stroke)return;drawing=false;if(!pr.annotations[pr.pageNum])pr.annotations[pr.pageNum]=[];pr.annotations[pr.pageNum].push(stroke);stroke=null;pr_drawAnnotations();pr_saveAnno()});
}

async function pr_renderPage(){
  if(!pr)return;
  const page=await pr.pdfDoc.getPage(pr.pageNum);
  const canvas=document.getElementById("pdfCanvas");
  const anno=document.getElementById("pdfAnnoCanvas");
  const wrap=document.getElementById("pdfCanvasWrap");
  if(!canvas||!anno||!wrap)return;

  if(pr.fitMode==="width"){const avail=wrap.clientWidth-32;const vp1=page.getViewport({scale:1});pr.scale=avail/vp1.width}
  else if(pr.fitMode==="page"){const availW=wrap.clientWidth-32;const availH=wrap.clientHeight-32;const vp1=page.getViewport({scale:1});pr.scale=Math.min(availW/vp1.width,availH/vp1.height)}

  const outputScale=window.devicePixelRatio||1;
  const viewport=page.getViewport({scale:pr.scale*outputScale});
  canvas.width=viewport.width;canvas.height=viewport.height;
  canvas.style.width=(viewport.width/outputScale)+"px";canvas.style.height=(viewport.height/outputScale)+"px";
  anno.width=viewport.width;anno.height=viewport.height;
  anno.style.width=canvas.style.width;anno.style.height=canvas.style.height;

  await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise;
  pr_drawAnnotations();

  const zl=document.getElementById("pdfZoomLabel");if(zl)zl.textContent=Math.round(pr.scale*100)+"%";
  const pi=document.getElementById("pdfPageInput");if(pi)pi.value=pr.pageNum;
  const pt=document.getElementById("pdfPageTotal");if(pt)pt.textContent=pr.totalPages;
  const bm=pr.bookmarks[pr.pageNum];const bb=document.getElementById("pdfBookmarkPage");
  if(bb){bb.textContent=bm?"★":"☆";bb.classList.toggle("active-tool",!!bm)}
  lsSet("pdfprog_"+pr.storageKey,{page:pr.pageNum,scale:(pr.fitMode==="width"||pr.fitMode==="page")?null:pr.scale});
}

async function pr_goToPage(n){if(!pr)return;n=Math.max(1,Math.min(pr.totalPages,n));pr.pageNum=n;await pr_renderPage()}

function pr_renderPanel(tab){
  const body=document.getElementById("pdfPanelBody");if(!body)return;
  if(tab==="pages"){let h="";for(let i=1;i<=pr.totalPages;i++)h+=`<div class="pdf-panel-item" data-p="${i}">Page ${i}${pr.bookmarks[i]?" ★":""}</div>`;body.innerHTML=h||`<div class="empty">No pages</div>`}
  else if(tab==="bookmarks"){const keys=Object.keys(pr.bookmarks);if(!keys.length){body.innerHTML=`<div class="empty">No bookmarks yet</div>`;return}body.innerHTML=keys.map(k=>`<div class="pdf-panel-item" data-p="${k}">${escapeHtml(pr.bookmarks[k].label||("Page "+k))}</div>`).join("")}
  else{const keys=Object.keys(pr.annotations).filter(k=>(pr.annotations[k]||[]).length);if(!keys.length){body.innerHTML=`<div class="empty">No notes/drawings yet</div>`;return}body.innerHTML=keys.map(k=>`<div class="pdf-panel-item" data-p="${k}">Page ${k} — ${pr.annotations[k].length} stroke(s)</div>`).join("")}
  body.querySelectorAll(".pdf-panel-item").forEach(it=>{it.onclick=()=>{pr_goToPage(parseInt(it.dataset.p));document.getElementById("pdfPanel")?.classList.remove("open")}});
}

  document.getElementById("pdfAnnoToggle").onclick=()=>{const bar=document.getElementById("pdfAnnoBar");const showing=bar.style.display!=="none";bar.style.display=showing?"none":"flex";document.getElementById("pdfAnnoToggle").classList.toggle("active-tool",!showing);if(showing){pr.tool=null;pr_setToolActive(false);pr_highlightToolBtn(null)}};

  document.getElementById("toolEraser").onclick=()=>{pr.tool="eraser";pr_setToolActive(true);pr_highlightToolBtn("toolEraser")};
  document.getElementById("toolUndo").onclick=pr_undo;
  document.getElementById("toolRedo").onclick=pr_redo;
  document.querySelectorAll(".pdf-color").forEach(sw=>{sw.onclick=()=>{pr.color=sw.dataset.c;document.querySelectorAll(".pdf-color").forEach(x=>x.classList.remove("selected"));sw.classList.add("selected")}});
  document.getElementById("pdfPanelBtn").onclick=()=>{const panel=document.getElementById("pdfPanel");panel.classList.toggle("open");if(panel.classList.contains("open"))pr_renderPanel("pages")};
  document.querySelectorAll(".pdf-panel-tab").forEach(t=>{t.onclick=()=>{document.querySelectorAll(".pdf-panel-tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");pr_renderPanel(t.dataset.pt)}});
  document.getElementById("pdfFullscreenBtn").onclick=async()=>{try{if(!document.fullscreenElement)await modal.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
  document.getElementById("pdfDownload").onclick=()=>{const a=document.createElement("a");a.href=pr.originalUrl;a.download=(title||"document")+".pdf";a.target="_blank";a.click()};
  document.getElementById("pdfSearchBtn").onclick=()=>{const bar=document.getElementById("pdfSearchBar");bar.style.display=bar.style.display==="none"?"flex":"none";if(bar.style.display==="flex")document.getElementById("pdfSearchInput").focus()};
  document.getElementById("pdfSearchClose").onclick=()=>{document.getElementById("pdfSearchBar").style.display="none"};
  let searchTimeout;
  document.getElementById("pdfSearchInput").oninput=e=>{clearTimeout(searchTimeout);searchTimeout=setTimeout(async()=>{const q=e.target.value.trim().toLowerCase();pr.searchMatches=[];pr.searchIndex=-1;if(!q){document.getElementById("pdfSearchCount").textContent="";return}for(let i=1;i<=pr.totalPages;i++){const page=await pr.pdfDoc.getPage(i);const tc=await page.getTextContent();const text=tc.items.map(it=>it.str).join(" ").toLowerCase();if(text.includes(q))pr.searchMatches.push(i)}document.getElementById("pdfSearchCount").textContent=pr.searchMatches.length?`1/${pr.searchMatches.length}`:"0 found";if(pr.searchMatches.length){pr.searchIndex=0;pr_goToPage(pr.searchMatches[0])}},400)};
  document.getElementById("pdfSearchNext").onclick=()=>{if(!pr.searchMatches.length)return;pr.searchIndex=(pr.searchIndex+1)%pr.searchMatches.length;pr_goToPage(pr.searchMatches[pr.searchIndex]);document.getElementById("pdfSearchCount").textContent=`${pr.searchIndex+1}/${pr.searchMatches.length}`};
  document.getElementById("pdfSearchPrev").onclick=()=>{if(!pr.searchMatches.length)return;pr.searchIndex=(pr.searchIndex-1+pr.searchMatches.length)%pr.searchMatches.length;pr_goToPage(pr.searchMatches[pr.searchIndex]);document.getElementById("pdfSearchCount").textContent=`${pr.searchIndex+1}/${pr.searchMatches.length}`};
  document.getElementById("pdfCanvasWrap").addEventListener("pointerdown",()=>{document.getElementById("pdfToolbar")?.classList.remove("hidden");document.getElementById("pdfPagebar")?.classList.remove("hidden");pr_scheduleHide()});
  window.addEventListener("resize",()=>{if(pr&&(pr.fitMode==="width"||pr.fitMode==="page"))pr_renderPage()});
}

async function renderBookmarks(c){c.innerHTML=`<h2>My Bookmarks</h2><div id="bmList">${skelList(3)}</div>`;const list=document.getElementById("bmList");try{const{data,error}=await db.from("bookmarks").select("pdf_id, pdfs(title, id, file_path)").eq("user_id",session.user.id);if(error)throw error;if(!data?.length){list.innerHTML=`<div class="empty">No bookmarks yet.</div>`;return}list.innerHTML="";data.forEach(bm=>{if(!bm.pdfs)return;const row=el(`<div class="card row"><span style="cursor:pointer;flex:1" class="open">${escapeHtml(bm.pdfs.title)}</span><button class="btn-small rm">Remove</button></div>`);row.querySelector(".open").onclick=()=>openPdf(bm.pdfs);row.querySelector(".rm").onclick=async e=>{e.stopPropagation();try{await db.from("bookmarks").delete().eq("user_id",session.user.id).eq("pdf_id",bm.pdfs.id);renderBookmarks(c)}catch(err){toast(err?.message||"Error")}};list.appendChild(row)})}catch(e){list.innerHTML=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}}

async function renderTests(c){c.innerHTML=`<h2>Tests</h2><div id="testList">${skelList(3)}</div>`;const list=document.getElementById("testList");try{const{data,error}=await db.from("tests").select("*").order("created_at",{ascending:false});if(error)throw error;if(!data?.length){list.innerHTML=`<div class="empty">No tests yet.</div>`;return}list.innerHTML="";data.forEach(test=>{const isCbt=test.type==="cbt"||!test.file_path;const row=el(`<div class="card row"><div><div style="font-weight:600">${escapeHtml(test.title)}</div><div class="muted">${test.duration_minutes||60} min · ${isCbt?"CBT Mode":"PDF Paper"}</div></div><button class="btn">Start</button></div>`);row.querySelector("button").onclick=()=>{if(isCbt)startCbtTest(test);else startPdfTest(test)};list.appendChild(row)})}catch(e){list.innerHTML=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}}

async function startPdfTest(test){if(!test.file_path){toast("No paper uploaded");return}try{const{data,error}=await db.storage.from("content").createSignedUrl(test.file_path,7200);if(error)throw error;if(!data?.signedUrl)throw new Error("No link");if(!window.pdfjsLib)await loadPdfJs();if(!window.pdfjsLib){toast("PDF viewer failed");return}const modal=el(`<div class="modal-bg"><div class="modal-box" style="max-width:920px"><div class="timer" id="tmr"></div><h3>${escapeHtml(test.title)}</h3><div style="overflow:auto;text-align:center"><canvas id="pc"></canvas></div><div class="zoom-row"><button id="zo">−</button><span id="zl">100%</span><button id="zi">+</button></div><button class="btn" style="width:100%;margin-top:14px" id="submitTest">Submit Test</button></div></div>`);document.body.appendChild(modal);let remaining=(Number(test.duration_minutes)||60)*60;const timerEl=document.getElementById("tmr");let timerRef=null;const finish=()=>{if(timerRef)clearInterval(timerRef);modal.remove();toast("Test submitted")};const tick=()=>{const m=Math.floor(remaining/60),s=remaining%60;timerEl.textContent=`${m}:${s<10?"0":""}${s} remaining`;if(remaining<=0){finish();return}remaining--};tick();timerRef=setInterval(tick,1000);document.getElementById("submitTest").onclick=()=>{if(confirm("Submit now?"))finish()};pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";let scale=1.2;const pdfDoc=await pdfjsLib.getDocument({url:data.signedUrl,withCredentials:false}).promise;const page=await pdfDoc.getPage(1);const render=async()=>{const vp=page.getViewport({scale});const canvas=document.getElementById("pc");if(!canvas)return;canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;const zl=document.getElementById("zl");if(zl)zl.textContent=Math.round(scale/1.2*100)+"%"};await render();document.getElementById("zi").onclick=()=>{scale+=0.3;render().catch(console.error)};document.getElementById("zo").onclick=()=>{scale=Math.max(0.5,scale-0.3);render().catch(console.error)}}catch(e){toast(e?.message||"Unable to start")}}

async function startCbtTest(test){try{const isAdmin=profile?.role==="admin";const cols=isAdmin?"*":"id, question_text, option_a, option_b, option_c, option_d, sort_order, question_image";const{data,error}=await db.from("test_questions").select(cols).eq("test_id",test.id).order("sort_order");if(error)throw error;if(!data?.length){toast("No questions for this CBT yet.");return}cbtTest=test;cbtQuestions=data;cbtAnswers={};cbtMarked=new Set();cbtBookmarks=new Set();cbtIndex=0;cbtRemaining=(Number(test.duration_minutes)||60)*60;if(cbtTimerRef)clearInterval(cbtTimerRef);cbtTimerRef=setInterval(()=>{cbtRemaining--;const tEl=document.getElementById("cbtTimer");if(tEl){const m=Math.floor(cbtRemaining/60),s=cbtRemaining%60;tEl.textContent=`${m}:${s<10?"0":""}${s}`}if(cbtRemaining<=0){clearInterval(cbtTimerRef);cbtTimerRef=null;finishCbt(true)}},1000);renderCbtUI()}catch(e){toast(e?.message||"Unable to start CBT")}}

function renderCbtUI(){const c=document.getElementById("content");if(!c||!cbtQuestions.length)return;const q=cbtQuestions[cbtIndex];const selected=cbtAnswers[q.id]||null;const imgHtml=q.question_image?`<img class="q-img" src="${escapeHtml(q.question_image)}" alt="Question image"/>`:"";c.innerHTML=`<div class="timer" id="cbtTimer">${Math.floor(cbtRemaining/60)}:${(cbtRemaining%60)<10?"0":""}${cbtRemaining%60}</div><div class="cbt-layout"><div class="cbt-qbox"><div class="muted" style="margin-bottom:8px">Question ${cbtIndex+1} of ${cbtQuestions.length}</div><div style="font-size:15.5px;line-height:1.55;margin-bottom:12px">${escapeHtml(q.question_text)}</div>${imgHtml}<button class="cbt-opt ${selected==="A"?"selected":""}" data-o="A">A. ${escapeHtml(q.option_a)}</button><button class="cbt-opt ${selected==="B"?"selected":""}" data-o="B">B. ${escapeHtml(q.option_b)}</button><button class="cbt-opt ${selected==="C"?"selected":""}" data-o="C">C. ${escapeHtml(q.option_c)}</button><button class="cbt-opt ${selected==="D"?"selected":""}" data-o="D">D. ${escapeHtml(q.option_d)}</button><div class="cbt-nav"><button class="btn-outline" id="cbtPrev" ${cbtIndex===0?"disabled":""}>← Previous</button><button class="btn-outline" id="cbtMark">${cbtMarked.has(q.id)?"Unmark":"Mark for Review"}</button><button class="btn-outline" id="cbtBm">${cbtBookmarks.has(q.id)?"★ Bookmarked":"☆ Bookmark"}</button><button class="btn" id="cbtNext">${cbtIndex===cbtQuestions.length-1?"Review":"Next →"}</button></div><button class="btn-danger" style="width:100%;margin-top:14px" id="cbtSubmit">Submit Test</button></div><div class="cbt-palette"><div style="font-weight:600;font-size:13px">Question Palette</div><div class="cbt-palette-grid" id="palette"></div><div class="cbt-legend"><span><div class="cbt-dot" style="background:rgba(91,157,255,.35);border:1px solid var(--accent)"></div> Answered</span><span><div class="cbt-dot" style="background:rgba(240,180,41,.35);border:1px solid var(--warn)"></div> Marked</span><span><div class="cbt-dot" style="background:var(--panel2);border:1px solid var(--border)"></div> Not visited</span></div></div></div>`;
c.querySelectorAll(".cbt-opt").forEach(btn=>{btn.onclick=()=>{cbtAnswers[q.id]=btn.dataset.o;renderCbtUI()}});
document.getElementById("cbtPrev").onclick=()=>{if(cbtIndex>0){cbtIndex--;renderCbtUI()}};
document.getElementById("cbtNext").onclick=()=>{if(cbtIndex<cbtQuestions.length-1){cbtIndex++;renderCbtUI()}};
document.getElementById("cbtMark").onclick=()=>{if(cbtMarked.has(q.id))cbtMarked.delete(q.id);else cbtMarked.add(q.id);renderCbtUI()};
document.getElementById("cbtBm").onclick=()=>{if(cbtBookmarks.has(q.id))cbtBookmarks.delete(q.id);else cbtBookmarks.add(q.id);renderCbtUI()};
document.getElementById("cbtSubmit").onclick=async()=>{if(await confirmAction("Submit Test","Submit test? Answers cannot be changed."))finishCbt(false)};
const palette=document.getElementById("palette");cbtQuestions.forEach((qq,i)=>{const btn=el(`<button class="cbt-pbtn">${i+1}</button>`);if(cbtAnswers[qq.id])btn.classList.add("answered");if(cbtMarked.has(qq.id))btn.classList.add("marked");if(i===cbtIndex)btn.classList.add("current");btn.onclick=()=>{cbtIndex=i;renderCbtUI()};palette.appendChild(btn)})}

async function finishCbt(auto){if(cbtTimerRef){clearInterval(cbtTimerRef);cbtTimerRef=null}const c=document.getElementById("content");c.innerHTML=`<div class="card score-card"><div class="muted">Calculating score...</div></div>`;
let score=0,total=cbtQuestions.length*4,correct=0,wrong=0,unattempted=0,reviewQs=[];
try{const{data:fullQs}=await db.from("test_questions").select("id, question_text, option_a, option_b, option_c, option_d, correct_option, sort_order").eq("test_id",cbtTest.id).order("sort_order");if(fullQs?.length)cbtQuestions=fullQs}catch(e){}
cbtQuestions.forEach(q=>{const ans=cbtAnswers[q.id]||null;const corr=(q.correct_option||"").toUpperCase();let status="unattempted";if(!ans)unattempted++;else if(corr&&ans===corr){correct++;status="correct"}else{wrong++;status="wrong"}reviewQs.push({id:q.id,question_text:q.question_text,option_a:q.option_a,option_b:q.option_b,option_c:q.option_c,option_d:q.option_d,correct_option:corr||null,user_answer:ans,status})});
score=(correct*4)+(wrong*-1);total=cbtQuestions.length*4;
try{const answersPayload={};Object.keys(cbtAnswers).forEach(id=>{answersPayload[id]=cbtAnswers[id]});const{data,error}=await db.rpc("score_cbt_test",{p_test_id:cbtTest.id,p_answers:answersPayload});if(!error&&data){score=data.score??score;total=data.total??total;correct=data.correct??correct;wrong=data.wrong??wrong;unattempted=data.unattempted??unattempted}}catch(e){}
const lastScoreData={score,total,correct,wrong,unattempted,title:cbtTest?.title,at:Date.now(),review:reviewQs};saveLastScore(lastScoreData);showScoreAndReview(c,lastScoreData,auto)}

function showScoreAndReview(c,data,auto){const den=(data.correct||0)+(data.wrong||0)+(data.unattempted||0);const accuracy=den?Math.round(((data.correct||0)/den)*100):0;c.innerHTML=`<div class="card score-card"><div class="muted" style="margin-bottom:6px">${auto?"Time's up!":"Test Submitted"}</div><h2 style="margin-bottom:4px">${escapeHtml(data.title||"Test")}</h2><div class="score-num">${data.score}</div><div class="muted" style="margin-bottom:18px">out of ${data.total}</div><div class="grid2" style="max-width:360px;margin:0 auto 20px;text-align:left"><div class="card" style="margin:0"><div class="muted">Correct</div><div style="font-weight:700;color:var(--green)">${data.correct||0}</div></div><div class="card" style="margin:0"><div class="muted">Wrong</div><div style="font-weight:700;color:var(--danger)">${data.wrong||0}</div></div><div class="card" style="margin:0"><div class="muted">Unattempted</div><div style="font-weight:700">${data.unattempted||0}</div></div><div class="card" style="margin:0"><div class="muted">Accuracy</div><div style="font-weight:700">${accuracy}%</div></div></div><button class="btn" style="width:100%;margin-bottom:10px" id="viewReview">Question-wise Review</button><button class="btn-outline" style="width:100%" id="backTests">Back to Tests</button></div>`;document.getElementById("backTests").onclick=()=>{cbtTest=null;cbtQuestions=[];cbtAnswers={};renderTests(c)};document.getElementById("viewReview").onclick=()=>renderQuestionReview(c,data)}

function renderQuestionReview(c,data){if(!data.review||!data.review.length){c.innerHTML=`<div class="empty">Review data not available.</div><button class="btn" id="backScore">Back</button>`;document.getElementById("backScore").onclick=()=>showScoreAndReview(c,data,false);return}let html=`<button class="back" id="backScore">Score Summary</button><h2>${escapeHtml(data.title||"Review")}</h2><div class="muted" style="margin-bottom:16px">${data.correct||0} correct · ${data.wrong||0} wrong · ${data.unattempted||0} skipped</div>`;data.review.forEach((q,i)=>{const statusColor=q.status==="correct"?"var(--green)":q.status==="wrong"?"var(--danger)":"var(--muted)";const statusText=q.status==="correct"?"Correct":q.status==="wrong"?"Wrong":"Not Attempted";const optHtml=(letter,text)=>{let extra="";if(q.user_answer===letter)extra+=` <span style="color:var(--accent);font-weight:600">(Your answer)</span>`;if(q.correct_option===letter)extra+=` <span style="color:var(--green);font-weight:600">(Correct)</span>`;let bg="var(--panel2)";if(q.correct_option===letter)bg="rgba(61,214,140,.12)";else if(q.user_answer===letter&&q.status==="wrong")bg="rgba(239,90,90,.12)";return`<div style="padding:10px 12px;margin:6px 0;border-radius:8px;border:1px solid var(--border);background:${bg}"><b>${letter}.</b> ${escapeHtml(text||"")}${extra}</div>`};html+=`<div class="card" style="margin-bottom:14px"><div class="row" style="margin-bottom:8px"><div style="font-weight:600">Q${i+1}</div><div style="color:${statusColor};font-weight:600;font-size:13px">${statusText}</div></div><div style="line-height:1.5;margin-bottom:10px">${escapeHtml(q.question_text)}</div>${optHtml("A",q.option_a)}${optHtml("B",q.option_b)}${optHtml("C",q.option_c)}${optHtml("D",q.option_d)}</div>`});html+=`<button class="btn" style="width:100%;margin-top:10px" id="backTests2">Back to Tests</button>`;c.innerHTML=html;document.getElementById("backScore").onclick=()=>showScoreAndReview(c,data,false);document.getElementById("backTests2").onclick=()=>{cbtTest=null;cbtQuestions=[];cbtAnswers={};renderTests(c)}}

  body.innerHTML=`<h3>1. Select Test</h3><select id="cbtTestSel"><option value="">Select test…</option></select>
  <h3 style="margin-top:20px">2. Bulk Add Questions</h3><div class="muted" style="margin-bottom:8px">Format (blank line se alag):<br>Question text<br>A) option<br>B) option<br>C) option<br>D) option</div>
  <textarea id="bulkText" style="min-height:150px" placeholder="Paste multiple questions here..."></textarea><button class="btn" id="bulkAdd">Add All Questions</button>
  <h3 style="margin-top:22px">3. Set Correct Answers</h3><div class="muted" style="margin-bottom:8px">Example:<br>1. B<br>2. A<br>3. D</div>
  <textarea id="ansText" style="min-height:100px" placeholder="1. A&#10;2. B&#10;3. C..."></textarea><button class="btn" id="setAnswers">Update Answers</button>
  <h3 style="margin-top:22px">4. Existing Questions</h3><div id="cbtQList" class="muted">Select a test first</div>`;
  try{
    const{data:tests}=await db.from("tests").select("id,title,file_path").order("created_at",{ascending:false});
    const sel=document.getElementById("cbtTestSel");
    (tests||[]).forEach(t=>{const o=document.createElement("option");o.value=t.id;o.textContent=t.title+(t.file_path?" (PDF)":" (CBT)");sel.appendChild(o)});
    const loadQs=async()=>{const testId=sel.value;const list=document.getElementById("cbtQList");if(!testId){list.innerHTML=`<div class="muted">Select a test</div>`;return}try{const{data,error}=await db.from("test_questions").select("*").eq("test_id",testId).order("sort_order");if(error)throw error;if(!data?.length){list.innerHTML=`<div class="empty">No questions yet</div>`;return}list.innerHTML="";data.forEach((q,i)=>{const imgPreview=q.question_image?`<img src="${escapeHtml(q.question_image)}" style="max-width:120px;border-radius:8px;margin-top:8px;border:1px solid var(--border)"/>`:"";const row=el(`<div class="card"><div class="row"><div style="flex:1"><div class="muted">Q${i+1} · Correct: <select class="corrSel" data-id="${q.id}" style="width:auto;display:inline;padding:4px 8px;margin:0"><option value="A" ${q.correct_option==="A"?"selected":""}>A</option><option value="B" ${q.correct_option==="B"?"selected":""}>B</option><option value="C" ${q.correct_option==="C"?"selected":""}>C</option><option value="D" ${q.correct_option==="D"?"selected":""}>D</option></select></div><div style="margin-top:6px">${escapeHtml(q.question_text)}</div>${imgPreview}<div style="margin-top:8px"><input type="file" accept="image/*" class="imgInput" data-id="${q.id}" style="font-size:12px"/></div></div><button class="btn-danger delQ">Delete</button></div></div>`);row.querySelector(".delQ").onclick=async()=>{if(!await confirmAction("Delete Question","Delete this question?"))return;try{await db.from("test_questions").delete().eq("id",q.id);loadQs()}catch(e){toast(e?.message||"Error")}};row.querySelector(".corrSel").onchange=async e=>{try{await db.from("test_questions").update({correct_option:e.target.value}).eq("id",q.id)}catch(err){toast(err?.message||"Error")}};row.querySelector(".imgInput").onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const path=`question-images/${crypto.randomUUID()}_${file.name}`;const{error:upErr}=await db.storage.from("content").upload(path,file,{cacheControl:"3600",upsert:false});if(upErr)throw upErr;const{data:urlData}=await db.storage.from("content").getPublicUrl(path);const publicUrl=urlData?.publicUrl;if(!publicUrl)throw new Error("No public URL");await db.from("test_questions").update({question_image:publicUrl}).eq("id",q.id);loadQs()}catch(err){toast(err?.message||"Image upload failed")}};list.appendChild(row)})}catch(e){list.innerHTML=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}};
    sel.onchange=loadQs;
    document.getElementById("bulkAdd").onclick=async()=>{const test_id=sel.value;const raw=document.getElementById("bulkText").value.trim();if(!test_id)return toast("Select test first");if(!raw)return toast("Paste questions");const blocks=raw.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);const rows=[];for(const block of blocks){const lines=block.split("\n").map(l=>l.trim()).filter(Boolean);if(lines.length<5)continue;const question_text=lines[0].replace(/^\d+[\.\)]\s*/,"");const getOpt=l=>{const m=l.match(/^[A-Da-d][\.\)\]]\s*(.+)/);return m?m[1]:l};rows.push({test_id,question_text,option_a:getOpt(lines[1]),option_b:getOpt(lines[2]),option_c:getOpt(lines[3]),option_d:getOpt(lines[4]),correct_option:"A",sort_order:rows.length+1})}if(!rows.length)return toast("No valid questions found.");try{const{error}=await db.from("test_questions").insert(rows);if(error)throw error;document.getElementById("bulkText").value="";toast(`${rows.length} questions added`);loadQs()}catch(e){toast(e?.message||"Bulk add failed")}};
    document.getElementById("setAnswers").onclick=async()=>{const test_id=sel.value;const raw=document.getElementById("ansText").value.trim();if(!test_id)return toast("Select test first");if(!raw)return toast("Paste answers");const{data:qs,error}=await db.from("test_questions").select("id,sort_order").eq("test_id",test_id).order("sort_order");if(error)throw error;if(!qs?.length)return toast("No questions found");const lines=raw.split("\n").map(l=>l.trim()).filter(Boolean);let updated=0;for(const line of lines){const m=line.match(/^(\d+)\s*[\.\)\-\:]?\s*([A-Da-d])/i);if(!m)continue;const num=parseInt(m[1]);const ans=m[2].toUpperCase();if(num<1||num>qs.length)continue;try{await db.from("test_questions").update({correct_option:ans}).eq("id",qs[num-1].id);updated++}catch(e){}}toast(`${updated} answers updated`);document.getElementById("ansText").value="";loadQs()};
  }catch(e){body.innerHTML+=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}
}

async function boot(){if(!db)throw new Error("Supabase not init");try{const{data,error}=await db.auth.getSession();if(error)throw error;session=data?.session||null;if(session)await afterLogin();else renderAuth();db.auth.onAuthStateChange((e,ns)=>{session=ns||null})}catch(e){throw e}}
initializeApp();
</script>
</body>
