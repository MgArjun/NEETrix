<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEETrix</title>

<style>
  :root{
    --bg:#0b0d14;
    --panel:#12151f;
    --panel2:#171b28;
    --border:#232a3a;
    --text:#e7e9ee;
    --muted:#8b93a7;
    --accent:#5b7fff;
    --accent2:#8b6bff;
    --danger:#ef5a5a;
    --good:#3ecf8e;
    --warn:#f4b752;
    --radius:14px;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  #app{min-height:100vh;}

  input,textarea,select{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:11px 13px;
    font-size:14px;
    margin-bottom:10px;
    outline:none;
    font-family:inherit;
  }

  input:focus,textarea:focus,select:focus{
    border-color:var(--accent);
  }

  button{
    cursor:pointer;
    font-family:inherit;
  }

  .btn{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    border:none;
    color:#fff;
    padding:11px 16px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:600;
  }

  .btn:disabled{opacity:.5;}

  .btn-outline{
    background:none;
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 14px;
    border-radius:9px;
    font-size:13px;
  }

  .btn-danger{
    background:var(--danger);
    border:none;
    color:#fff;
    padding:7px 12px;
    border-radius:8px;
    font-size:12px;
  }

  .btn-good{
    background:var(--good);
    border:none;
    color:#06281a;
    padding:7px 12px;
    border-radius:8px;
    font-size:12px;
    font-weight:600;
  }

  .btn-warn{
    background:var(--warn);
    border:none;
    color:#3a2a00;
    padding:7px 12px;
    border-radius:8px;
    font-size:12px;
    font-weight:600;
  }

  .btn-small{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:6px 10px;
    border-radius:7px;
    font-size:12px;
  }

  .auth-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }

  .auth-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:32px;
    width:100%;
    max-width:380px;
  }

  .brand{
    font-size:22px;
    font-weight:800;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:4px;
  }

  .sub{
    color:var(--muted);
    font-size:13px;
    margin-bottom:18px;
  }

  .msg{
    font-size:12.5px;
    margin:-2px 0 10px;
    min-height:14px;
  }

  .link{
    color:var(--accent);
    background:none;
    border:none;
    font-size:12.5px;
    text-align:center;
    width:100%;
    margin-top:6px;
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:6px;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    overflow-x:auto;
  }

  .topbar .brand{
    font-size:17px;
    margin:0;
    flex-shrink:0;
  }

  .navbtn{
    background:none;
    border:1px solid transparent;
    color:var(--muted);
    padding:7px 12px;
    border-radius:8px;
    font-size:12.5px;
    white-space:nowrap;
    flex-shrink:0;
  }

  .navbtn.active{
    background:var(--panel2);
    color:var(--text);
    border-color:var(--border);
  }

  .spacer{
    flex:1;
    min-width:8px;
  }

  .content{
    max-width:920px;
    margin:0 auto;
    padding:20px 16px 60px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    margin-bottom:10px;
  }

  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  @media(max-width:560px){
    .grid2{
      grid-template-columns:1fr;
    }
  }

  .subject-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
    cursor:pointer;
  }

  .subject-card:hover{
    border-color:var(--accent);
  }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }

  .row-wrap{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
  }

  .muted{
    color:var(--muted);
    font-size:12.5px;
  }

  .badge{
    font-size:10.5px;
    padding:2px 8px;
    border-radius:20px;
    border:1px solid var(--border);
    color:var(--muted);
  }

  .badge.admin{
    color:var(--accent);
    border-color:var(--accent);
  }

  .badge.active{
    color:var(--good);
    border-color:var(--good);
  }

  .badge.paused{
    color:var(--warn);
    border-color:var(--warn);
  }

  .badge.blocked{
    color:var(--danger);
    border-color:var(--danger);
  }

  .badge.pending{
    color:var(--muted);
  }

  .back{
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    padding:6px 12px;
    border-radius:8px;
    font-size:12.5px;
    margin-bottom:14px;
  }

  .tabs2{
    display:flex;
    gap:6px;
    margin:12px 0;
    flex-wrap:wrap;
  }

  .tab2{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--muted);
    padding:7px 14px;
    border-radius:8px;
    font-size:12.5px;
  }

  .tab2.active{
    color:#fff;
    background:var(--accent);
    border-color:var(--accent);
  }

  h2{
    font-size:19px;
    margin:4px 0 4px;
  }

  h3{
    font-size:15px;
    margin:14px 0 8px;
    color:var(--text);
  }

  .empty{
    color:var(--muted);
    font-size:13px;
    padding:20px 0;
    text-align:center;
  }

  .yt-wrap{
    position:relative;
    padding-bottom:56.25%;
    height:0;
    border-radius:12px;
    overflow:hidden;
    background:#000;
    margin-bottom:10px;
  }

  .yt-wrap iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:0;
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
  }

  th,td{
    text-align:left;
    padding:8px 6px;
    border-bottom:1px solid var(--border);
  }

  th{
    color:var(--muted);
    font-weight:600;
  }

  .modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:60;
    padding:16px;
  }

  .modal-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    max-width:900px;
    width:100%;
    max-height:88vh;
    overflow:auto;
    padding:16px;
  }

  .modal-close{
    background:none;
    border:none;
    color:var(--muted);
    float:right;
    font-size:20px;
  }

  .timer{
    font-size:22px;
    font-weight:800;
    color:var(--warn);
    text-align:center;
    padding:10px;
    background:var(--panel2);
    border-radius:10px;
    margin-bottom:10px;
  }

  .zoom-row{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-top:8px;
  }

  .zoom-row button{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:6px 12px;
    border-radius:8px;
  }

  .fatal-error{
    min-height:100vh;
    background:var(--bg);
    color:#fff;
    padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  .fatal-box{
    max-width:700px;
    margin:40px auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:24px;
  }

  .fatal-title{
    color:var(--danger);
    margin-top:0;
  }

  .fatal-text{
    color:#c5cada;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
  }
</style>
</head>

<body>

<div id="app"></div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const GEMINI_API_KEY = "";

/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let db = null;
let pdfjsReady = false;

let session = null;
let profile = null;

let activeTab = "content";
let selSubject = null;
let selChapter = null;
let selCategory = "general";

let adminTab = "users";

/* =========================================================
   BASIC HELPERS
   ========================================================= */

const app = document.getElementById("app");

function escapeHtml(value){
  return (value ?? "")
    .toString()
    .replace(/[&<>"']/g, function(m){
      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m];
    });
}

function el(html){
  const d = document.createElement("div");
  d.innerHTML = html.trim();
  return d.firstElementChild;
}

function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleString(undefined,{
    day:"2-digit",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function ytId(url){
  const m = (url || "").match(
    /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/
  );

  return m ? m[1] : null;
}

function showFatalError(message){
  const safeMessage = escapeHtml(message);

  document.body.innerHTML = `
    <div class="fatal-error">
      <div class="fatal-box">
        <h2 class="fatal-title">NEETrix Error</h2>
        <div class="fatal-text">${safeMessage}</div>
      </div>
    </div>
  `;
}

function showTemporaryMessage(message){
  console.log(message);
}

/* =========================================================
   EXTERNAL LIBRARY LOADER
   ========================================================= */

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const script = document.createElement("script");

    script.src = src;
    script.async = true;

    script.onload = () => resolve();
    script.onerror = () => reject(new Error("Failed to load: " + src));

    document.head.appendChild(script);
  });
}

async function loadSupabase(){
  if(window.supabase){
    return true;
  }

  const sources = [
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
    "https://unpkg.com/@supabase/supabase-js@2"
  ];

  let lastError = null;

  for(const src of sources){
    try{
      await loadScript(src);

      if(window.supabase){
        return true;
      }
    }catch(error){
      lastError = error;
      console.warn(error);
    }
  }

  throw lastError || new Error("Supabase library could not be loaded.");
}

async function loadPdfJs(){
  if(window.pdfjsLib){
    pdfjsReady = true;
    return true;
  }

  const sources = [
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",
    "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"
  ];

  let lastError = null;

  for(const src of sources){
    try{
      await loadScript(src);

      if(window.pdfjsLib){
        pdfjsReady = true;
        return true;
      }
    }catch(error){
      lastError = error;
      console.warn(error);
    }
  }

  console.warn(
    "PDF.js could not be loaded. PDF viewing will be unavailable."
  );

  return false;
}

/* =========================================================
   INITIALIZATION
   ========================================================= */

async function initializeApp(){

  try{

    const supabaseLoaded = await loadSupabase();

    if(!supabaseLoaded){
      throw new Error(
        "Supabase library could not be loaded."
      );
    }

    if(
      !SUPABASE_URL ||
      !SUPABASE_ANON_KEY ||
      SUPABASE_URL === "YOUR_SUPABASE_URL" ||
      SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY"
    ){
      throw new Error(
        "Supabase is not configured.\n\n" +
        "Add your existing Supabase Project URL and public/anon key in the CONFIG section."
      );
    }

    db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    /*
      PDF.js is optional for the main application.
      We load it without preventing the login screen.
    */
    loadPdfJs().catch(error=>{
      console.warn("PDF.js loading failed:",error);
    });

    await boot();

  }catch(error){

    console.error("NEETrix initialization error:",error);

    showFatalError(
      error && error.message
        ? error.message
        : "NEETrix could not start."
    );
  }
}

/* =========================================================
   AUTH
   ========================================================= */

function renderAuth(mode){

  mode = mode || "login";

  app.innerHTML = "";

  app.appendChild(el(`
    <div class="auth-wrap">
      <div class="auth-card">

        <div class="brand">NEETrix</div>

        <div class="sub">
          The focused way to prepare.
        </div>

        <div class="msg" id="msg"></div>

        <div id="fields"></div>

        <button
          class="btn"
          style="width:100%"
          id="mainBtn">
        </button>

        <button
          class="link"
          id="link1">
        </button>

        <button
          class="link"
          id="link2"
          style="display:none">
        </button>

      </div>
    </div>
  `));

  const fields = document.getElementById("fields");
  const mainBtn = document.getElementById("mainBtn");
  const link1 = document.getElementById("link1");
  const link2 = document.getElementById("link2");
  const msg = document.getElementById("msg");

  if(mode === "login" || mode === "signup"){

    fields.innerHTML = `
      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
      />

      <input
        id="pass"
        type="password"
        placeholder="Password (8+ characters)"
        autocomplete="${mode === "login" ? "current-password" : "new-password"}"
      />
    `;

    mainBtn.textContent =
      mode === "login"
        ? "Log in"
        : "Create account";

    link1.textContent =
      mode === "login"
        ? "New here? Create an account"
        : "Already have an account? Log in";

    link1.onclick = ()=>{
      renderAuth(
        mode === "login"
          ? "signup"
          : "login"
      );
    };

    link2.style.display =
      mode === "login"
        ? "block"
        : "none";

    link2.textContent = "Forgot password?";

    link2.onclick = ()=>{
      renderAuth("forgot");
    };

    mainBtn.onclick = async ()=>{

      msg.textContent = "";
      mainBtn.disabled = true;

      const email =
        document.getElementById("email")
          .value
          .trim();

      const pass =
        document.getElementById("pass")
          .value;

      if(!email || !pass){

        msg.style.color = "var(--muted)";
        msg.textContent =
          "Enter both fields.";

        mainBtn.disabled = false;
        return;
      }

      try{

        if(mode === "signup"){

          const {error} =
            await db.auth.signUp({
              email,
              password:pass
            });

          if(error) throw error;

          msg.style.color = "var(--good)";

          msg.textContent =
            "Account created! Check your email if confirmation is required, then log in.";

          setTimeout(()=>{
            renderAuth("login");
          },1800);

        }else{

          const {data,error} =
            await db.auth.signInWithPassword({
              email,
              password:pass
            });

          if(error) throw error;

          session = data.session;

          await afterLogin();
        }

      }catch(error){

        console.error("Authentication error:",error);

        msg.style.color = "var(--danger)";

        msg.textContent =
          error?.message ||
          "Something went wrong.";

      }finally{

        mainBtn.disabled = false;
      }
    };

  }else if(mode === "forgot"){

    fields.innerHTML = `
      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
      />
    `;

    mainBtn.textContent =
      "Send reset link";

    link1.textContent =
      "Back to log in";

    link1.onclick = ()=>{
      renderAuth("login");
    };

    mainBtn.onclick = async ()=>{

      msg.textContent = "";
      mainBtn.disabled = true;

      const email =
        document.getElementById("email")
          .value
          .trim();

      if(!email){

        msg.style.color = "var(--muted)";
        msg.textContent =
          "Enter your email address.";

        mainBtn.disabled = false;
        return;
      }

      try{

        const {error} =
          await db.auth.resetPasswordForEmail(
            email
          );

        if(error) throw error;

        msg.style.color = "var(--good)";

        msg.textContent =
          "Reset link sent — check your email.";

      }catch(error){

        console.error(
          "Password reset error:",
          error
        );

        msg.style.color = "var(--danger)";

        msg.textContent =
          error?.message ||
          "Something went wrong.";

      }finally{

        mainBtn.disabled = false;
      }
    };
  }
}

/* =========================================================
   STATUS SCREEN
   ========================================================= */

function renderStatusScreen(status){

  app.innerHTML = "";

  const msgs = {

    pending:[
      "Request sent",
      "Your access request has been sent to the admin. You'll be able to log in once approved."
    ],

    paused:[
      "Account paused",
      "Your account has been paused by the admin. Please check back later."
    ],

    blocked:[
      "Account blocked",
      "Your account access has been blocked by the admin."
    ]
  };

  const [title,body] =
    msgs[status] ||
    [
      "Access unavailable",
      "Please contact the admin."
    ];

  app.appendChild(el(`
    <div class="auth-wrap">

      <div class="auth-card">

        <div class="brand">NEETrix</div>

        <h2 style="margin-top:14px;">
          ${escapeHtml(title)}
        </h2>

        <p
          class="muted"
          style="line-height:1.6;">
          ${escapeHtml(body)}
        </p>

        <button
          class="btn-outline"
          style="width:100%;margin-top:10px;"
          id="out">
          Log out
        </button>

      </div>

    </div>
  `));

  document.getElementById("out").onclick =
    async ()=>{
      try{
        await db.auth.signOut();
      }catch(error){
        console.error(error);
      }

      session = null;
      profile = null;

      renderAuth();
    };
}

/* =========================================================
   AFTER LOGIN
   ========================================================= */

async function afterLogin(){

  if(!session || !session.user){
    renderAuth();
    return;
  }

  try{

    /*
      Login history should not prevent a user
      from entering the app if the insert fails.
    */
    try{

      const {error} =
        await db
          .from("login_events")
          .insert({
            user_id:session.user.id,
            email:session.user.email
          });

      if(error){
        console.warn(
          "Login event insert failed:",
          error
        );
      }

    }catch(error){

      console.warn(
        "Login event error:",
        error
      );
    }

    const {
      data,
      error
    } =
      await db
        .from("profiles")
        .select("*")
        .eq("id",session.user.id)
        .single();

    if(error){

      console.error(
        "Profile loading error:",
        error
      );

      /*
        PGRST116 means no row found.
      */
      if(error.code === "PGRST116"){

        profile = null;

        renderStatusScreen("pending");

        return;
      }

      throw error;
    }

    profile = data;

    if(
      !profile ||
      profile.status !== "active"
    ){

      renderStatusScreen(
        profile
          ? profile.status
          : "pending"
      );

      return;
    }

    activeTab = "content";
    selSubject = null;
    selChapter = null;

    renderShell();

  }catch(error){

    console.error(
      "afterLogin error:",
      error
    );

    showFatalError(
      error?.message ||
      "Unable to load your account."
    );
  }
}

/* =========================================================
   SHELL
   ========================================================= */

function renderShell(){

  app.innerHTML = "";

  const isAdmin =
    profile &&
    profile.role === "admin";

  app.appendChild(el(`
    <div>

      <div class="topbar">

        <div class="brand">
          NEETrix
        </div>

        <button
          class="navbtn"
          data-t="content">
          Content
        </button>

        <button
          class="navbtn"
          data-t="questions">
          Questions
        </button>

        <button
          class="navbtn"
          data-t="tests">
          Test
        </button>

        <button
          class="navbtn"
          data-t="bookmarks">
          Bookmarks
        </button>

        ${
          isAdmin
            ? `
              <button
                class="navbtn"
                data-t="admin">
                Admin
              </button>
            `
            : ""
        }

        <div class="spacer"></div>

        <button
          class="btn-outline"
          id="logout">
          Log out
        </button>

      </div>

      <div
        class="content"
        id="content">
      </div>

    </div>
  `));

  document.getElementById("logout").onclick =
    async ()=>{

      try{
        await db.auth.signOut();
      }catch(error){
        console.error(error);
      }

      session = null;
      profile = null;

      activeTab = "content";
      selSubject = null;
      selChapter = null;

      renderAuth();
    };

  document
    .querySelectorAll(".navbtn")
    .forEach(button=>{

      button.onclick = ()=>{

        activeTab =
          button.dataset.t;

        selSubject = null;
        selChapter = null;

        renderTabsUI();
        renderBody();
      };
    });

  renderTabsUI();
  renderBody();
}

function renderTabsUI(){

  document
    .querySelectorAll(".navbtn")
    .forEach(button=>{

      button.classList.toggle(
        "active",
        button.dataset.t === activeTab
      );
    });
}

function renderBody(){

  const c =
    document.getElementById("content");

  if(!c) return;

  if(activeTab === "content"){

    renderSubjectBrowser(
      c,
      "video"
    );

  }else if(activeTab === "questions"){

    renderSubjectBrowser(
      c,
      "pdf"
    );

  }else if(activeTab === "tests"){

    renderTests(c);

  }else if(activeTab === "bookmarks"){

    renderBookmarks(c);

  }else if(activeTab === "admin"){

    if(profile?.role === "admin"){
      renderAdmin(c);
    }else{
      activeTab = "content";
      renderTabsUI();
      renderSubjectBrowser(c,"video");
    }
  }
}

              class="tab2"

              General Practice
            </button>

            <button
              class="tab2"
              data-c="ncert">
              NCERT Exemplar
            </button>

            <button
              class="tab2"
              data-c="pyq">
              PYQs
            </button>

          </div>

          <div id="pdfList"></div>

        </div>
      `);

    c.appendChild(catBox);

    const draw = async ()=>{

      catBox
        .querySelectorAll(".tab2")
        .forEach(button=>{

          button.classList.toggle(
            "active",
            button.dataset.c === selCategory
          );
        });

      const {
        data,
        error
      } =
        await db
          .from("pdfs")
          .select("*")
          .eq(
            "chapter_id",
            selChapter.id
          )
          .eq(
            "category",
            selCategory
          )
          .order(
            "created_at",
            {ascending:false}
          );

      const list =
        document.getElementById("pdfList");

      if(error){

        console.error(error);

        list.innerHTML =
          `<div class="empty">
            ${escapeHtml(error.message)}
          </div>`;

        return;
      }

      if(!data || !data.length){

        list.innerHTML =
          `<div class="empty">
            No PDFs in this category yet.
          </div>`;

        return;
      }

      let bookmarkData = [];

      try{

        const {
          data:bms,
          error:bmError
        } =
          await db
            .from("bookmarks")
            .select("pdf_id")
            .eq(
              "user_id",
              session.user.id
            );

        if(!bmError){
          bookmarkData = bms || [];
        }

      }catch(error){

        console.warn(
          "Bookmark loading failed:",
          error
        );
      }

      const bmSet =
        new Set(
          bookmarkData.map(
            bookmark=>bookmark.pdf_id
          )
        );

      list.innerHTML = "";

      data.forEach(pdf=>{

        const row =
          el(`
            <div class="card row">

              <span
                style="cursor:pointer;flex:1;"
                class="openPdf">

              </span>

              <button class="btn-small bmBtn">
                ${
                  bmSet.has(pdf.id)
                    ? "★ Saved"
                    : "☆ Save"
                }

            </div>
          `);

        row
          .querySelector(".openPdf")
          .onclick = ()=>{
            openPdf(pdf);
          };

        row
          .querySelector(".bmBtn")
          .onclick = async event=>{

            event.stopPropagation();

            try{

              if(bmSet.has(pdf.id)){

                const {error} =
                  await db
                    .from("bookmarks")
                    .delete()
                    .eq(
                      "user_id",
                      session.user.id
                    )
                    .eq(
                      "pdf_id",
                      pdf.id
                    );

                if(error) throw error;

              }else{

                const {error} =
                  await db
                    .from("bookmarks")
                    .insert({
                      user_id:
                        session.user.id,
                      pdf_id:
                        pdf.id
                    });

                if(error) throw error;
              }

              draw();

            }catch(error){

              console.error(
                "Bookmark error:",
                error
              );

              alert(
                error?.message ||
                "Could not update bookmark."
              );
            }
          };

        list.appendChild(row);
      });
    };

    catBox
      .querySelectorAll(".tab2")
      .forEach(button=>{

        button.onclick = ()=>{

          selCategory =
            button.dataset.c;

          draw();
        };
      });

    draw();
  }
}

async function openPdf(pdf){

  try{

    if(!db){

      alert(
        "Supabase is not initialized."
      );

      return;
    }

    const {
      data,
      error
    } =
      await db.storage
        .from("content")
        .createSignedUrl(
          pdf.file_path,
          3600
        );

    if(error) throw error;

    if(!data?.signedUrl){

      throw new Error(
        "Could not create PDF link."
      );
    }

    await showPdfModal(
      data.signedUrl,
      pdf.title
    );

  }catch(error){

    console.error(
      "PDF opening error:",
      error
    );

    alert(
      error?.message ||
      "Unable to open PDF."
    );
  }
}

async function showPdfModal(url,title){

  if(!window.pdfjsLib){

    await loadPdfJs();
  }

  if(!window.pdfjsLib){

    alert(
      "PDF viewer could not be loaded. Please refresh the page and try again."
    );

    return;
  }

  const modal =
    el(`
      <div class="modal-bg">

        <div class="modal-box">

          <button
            class="modal-close"
            id="mc">
            &times;
          </button>

          <h3>
            ${escapeHtml(title || "")}
          </h3>

          <div
            style="overflow:auto;text-align:center;">
            <canvas id="pc"></canvas>
          </div>

          <div class="zoom-row">

            <button id="zo">-</button>

            <span id="zl">
              100%
            </span>

            <button id="zi">+</button>

          </div>

        </div>

      </div>
    `);

  document.body.appendChild(modal);

  document.getElementById("mc").onclick =
    ()=>{
      modal.remove();
    };

  const pdfjsLib =
    window.pdfjsLib;

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

  let scale = 1.2;

  try{

    const loadingTask =
      pdfjsLib.getDocument({
        url:url,
        withCredentials:false
      });

    const pdf =
      await loadingTask.promise;

    const page =
      await pdf.getPage(1);

    const render = async ()=>{

      const viewport =
        page.getViewport({
          scale
        });

      const canvas =
        document.getElementById("pc");

      if(!canvas) return;

      canvas.width =
        viewport.width;

      canvas.height =
        viewport.height;

      const context =
        canvas.getContext("2d");

      await page.render({
        canvasContext:context,
        viewport
      }).promise;

      document.getElementById("zl")
        .textContent =
        Math.round(
          scale / 1.2 * 100
        ) + "%";
    };

    await render();

    document.getElementById("zi").onclick =
      ()=>{
        scale += 0.3;
        render().catch(console.error);
      };

    document.getElementById("zo").onclick =
      ()=>{
        scale =
          Math.max(
            0.5,
            scale - 0.3
          );

        render().catch(console.error);
      };

  }catch(error){

    console.error(
      "PDF rendering error:",
      error
    );

    const box =
      modal.querySelector(".modal-box");

    box.innerHTML += `
      <div class="empty">
        Unable to render this PDF.
        <br>
        ${escapeHtml(error?.message || "")}
      </div>
    `;
  }
}

async function startTest(test){

  if(!test.file_path){

    alert(
      "No question paper uploaded for this test yet."
    );

    return;
  }

  try{

    const {
      data,
      error
    } =
      await db.storage
        .from("content")
        .createSignedUrl(
          test.file_path,
          7200
        );

    if(error) throw error;

    if(!data?.signedUrl){

      throw new Error(
        "Could not create test PDF link."
      );
    }

    if(!window.pdfjsLib){
      await loadPdfJs();
    }

    if(!window.pdfjsLib){

      alert(
        "PDF viewer could not be loaded."
      );

      return;
    }

    const modal =
      el(`
        <div class="modal-bg">

          <div class="modal-box">

            <div
              class="timer"
              id="tmr">
            </div>

            <h3>
              ${escapeHtml(test.title)}
            </h3>

            <div
              style="overflow:auto;text-align:center;">
              <canvas id="pc"></canvas>
            </div>

            <div class="zoom-row">

              <button id="zo">-</button>

              <span id="zl">
                100%
              </span>

              <button id="zi">+</button>

            </div>

            <button
              class="btn"
              style="width:100%;margin-top:14px;"
              id="submitTest">
              Submit Test
            </button>

          </div>

        </div>
      `);

    document.body.appendChild(modal);

    let remaining =
      (Number(test.duration_minutes) || 60) * 60;

    const timerElement =
      document.getElementById("tmr");

    let timerRef = null;

    const finishTest = ()=>{
      if(timerRef){
        clearInterval(timerRef);
      }

      modal.remove();

      alert(
        "Test submitted."
      );
    };

    const tick = ()=>{

      const minutes =
        Math.floor(
          remaining / 60
        );

      const seconds =
        remaining % 60;

      timerElement.textContent =
        `${minutes}:${seconds < 10 ? "0" : ""}${seconds} remaining`;

      if(remaining <= 0){

        finishTest();

        return;
      }

      remaining--;
    };

    tick();

    timerRef =
      setInterval(
        tick,
        1000
      );

    document
      .getElementById("submitTest")
      .onclick =
      ()=>{
        if(
          confirm(
            "Submit the test now?"
          )
        ){
          finishTest();
        }
      };

    const pdfjsLib =
      window.pdfjsLib;

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

    let scale = 1.2;

    const pdf =
      await pdfjsLib
        .getDocument({
          url:data.signedUrl,
          withCredentials:false
        })
        .promise;

    const page =
      await pdf.getPage(1);

    const render = async ()=>{

      const viewport =
        page.getViewport({
          scale
        });

      const canvas =
        document.getElementById("pc");

      if(!canvas) return;

      canvas.width =
        viewport.width;

      canvas.height =
        viewport.height;

      await page.render({
        canvasContext:
          canvas.getContext("2d"),
        viewport
      }).promise;

      document.getElementById("zl")
        .textContent =
        Math.round(
          scale / 1.2 * 100
        ) + "%";
    };

    await render();

    document.getElementById("zi").onclick =
      ()=>{
        scale += 0.3;
        render().catch(console.error);
      };

    document.getElementById("zo").onclick =
      ()=>{
        scale =
          Math.max(
            0.5,
            scale - 0.3
          );

        render().catch(console.error);
      };

  }catch(error){

    console.error(
      "Test error:",
      error
    );

    alert(
      error?.message ||
      "Unable to start test."
    );
  }
}

async function renderAdminUsers(body){

          </tr>

                  user.role === "admin"

      if(user.role === "admin"){

        actBox.innerHTML =
          `<span class="muted">—</span>`;

        return;
      }

      const setStatus =
        async status=>{

          try{

            const {
              error
            } =
              await db
                .from("profiles")

                  status

            );
          };

        actBox.appendChild(
          blockBtn
        );
      }
    });

  }catch(error){

    console.error(
      "Admin users error:",
      error
    );

    body.innerHTML =
      `<div class="empty">
        ${escapeHtml(error?.message || "Unable to load users.")}
      </div>`;
  }
}

/* =========================================================
   ADMIN LOGIN HISTORY
   ========================================================= */

async function renderAdminLogins(body){

  try{

    const {
      data,
      error
    } =
      await db
        .from("login_events")
        .select("*")
        .order(
          "logged_in_at",
          {ascending:false}
        )
        .limit(200);

    if(error) throw error;

    if(!data || !data.length){

      body.innerHTML =
        `<div class="empty">
          No login activity yet.
        </div>`;

      return;
    }

    body.innerHTML = `
      <table>

        <thead>
          <tr>
            <th>Email</th>
            <th>Logged in at</th>
          </tr>
        </thead>

        <tbody>

          ${
            data.map(login=>`
              <tr>

                <td>
                  ${escapeHtml(login.email)}
                </td>

                <td>
                  ${escapeHtml(
                    fmtDate(
                      login.logged_in_at
                    )
                  )}
                </td>

              </tr>
            `).join("")
          }

        </tbody>

      </table>
    `;

  }catch(error){

    console.error(
      "Admin login history error:",
      error
    );

    body.innerHTML =
      `<div class="empty">
        ${escapeHtml(error?.message || "Unable to load login history.")}
      </div>`;
  }
}

/* =========================================================
   ADMIN SETTINGS
   ========================================================= */

async function renderAdminSettings(body){

  try{

    const {
      data,
      error
    } =
      await db
        .from("app_settings")
        .select("*")
        .eq("id",1)
        .single();

    if(
      error &&
      error.code !== "PGRST116"
    ){
      throw error;
    }

    const open =
      data
        ? Boolean(data.registration_open)
        : true;

    body.innerHTML = `
      <div class="card">

        <div class="row">

          <div>

            <div>
              Accept new users
            </div>

            <div class="muted">
              When off, new signups go into a pending request queue instead of getting instant access.
            </div>

          </div>

          <button
            class="btn"
            id="toggleReg">
            ${
              open
                ? "Turn OFF"
                : "Turn ON"
            }
          </button>

        </div>

      </div>
    `;

    document
      .getElementById("toggleReg")
      .onclick =
      async ()=>{

        try{

          const {
            error
          } =
            await db
              .from("app_settings")
              .update({
                registration_open:!open
              })
              .eq(
                "id",
                1
              );

          if(error) throw error;

          renderAdminSettings(body);

        }catch(error){

          console.error(error);

          alert(
            error?.message ||
            "Could not update settings."
          );
        }
      };

  }catch(error){

    console.error(
      "Admin settings error:",
      error
    );

    body.innerHTML =
      `<div class="empty">
        ${escapeHtml(error?.message || "Unable to load settings.")}
      </div>`;
  }
}

/* =========================================================
   ADMIN CONTENT
   ========================================================= */

async function renderAdminContent(body){

  body.innerHTML = `

    <h3>Add Subject</h3>

    <input
      id="newSubj"
      placeholder="Subject name (e.g. Physics)"
    />

    <button
      class="btn"
      id="addSubj">
      Add Subject
    </button>


    <h3>Add Chapter</h3>

    <select id="chSubj"></select>

    <input
      id="newChap"
      placeholder="Chapter name"
    />

    <button
      class="btn"
      id="addChap">
      Add Chapter
    </button>


    <h3>Add Video (YouTube link)</h3>

    <select id="vidSubj"></select>

    <select id="vidChap"></select>

    <input
      id="vidTitle"
      placeholder="Video title"
    />

    <input
      id="vidUrl"
      placeholder="Paste YouTube link here"
    />

    <button
      class="btn"
      id="addVid">
      Add Video
    </button>


    <h3>Add Question PDF</h3>

    <select id="pdfSubj"></select>

    <select id="pdfChap"></select>

    <select id="pdfCat">

      <option value="general">
        General Practice
      </option>

      <option value="ncert">
        NCERT Exemplar
      </option>

      <option value="pyq">
        PYQs
      </option>

    </select>

    <input
      id="pdfTitle"
      placeholder="PDF title"
    />

    <input
      type="file"
      id="pdfFile"
      accept="application/pdf"
    />

    <button
      class="btn"
      id="addPdf">
      Upload PDF
    </button>


    <h3>Add Test</h3>

    <input
      id="testTitle"
      placeholder="Test title"
    />

    <input
      id="testDur"
      type="number"
      placeholder="Duration (minutes)"
      value="60"
    />

    <input
      type="file"
      id="testFile"
      accept="application/pdf"
    />

    <button
      class="btn"
      id="addTest">
      Create Test
    </button>
  `;

  try{

    const {
      data:subjects,
      error
    } =
      await db
        .from("subjects")
        .select("*")
        .order("sort_order");

    if(error) throw error;

    const subjectOptions =
      (subjects || [])
        .map(subject=>`
          <option value="${escapeHtml(subject.id)}">
            ${escapeHtml(subject.name)}
          </option>
        `)
        .join("");

    ["chSubj","vidSubj","pdfSubj"]
      .forEach(id=>{

        const select =
          document.getElementById(id);

        if(select){

          select.innerHTML =
            subjectOptions ||
            `<option value="">
              No subjects yet
            </option>`;
        }
      });

    const loadChapters =
      async (
        subjectSelectId,
        chapterSelectId
      )=>{

        const subjectSelect =
          document.getElementById(
            subjectSelectId
          );

        const chapterSelect =
          document.getElementById(
            chapterSelectId
          );

        if(!subjectSelect ||
           !chapterSelect){
          return;
        }

        const subjectId =
          subjectSelect.value;

        if(!subjectId){

          chapterSelect.innerHTML =
            `<option value="">
              No chapters yet
            </option>`;

          return;
        }

        const {
          data:chapters,
          error
        } =
          await db
            .from("chapters")
            .select("*")
            .eq(
              "subject_id",
              subjectId
            )
            .order("sort_order");

        if(error){

          console.error(error);

          chapterSelect.innerHTML =
            `<option value="">
              Error loading chapters
            </option>`;

          return;
        }

        chapterSelect.innerHTML =
          (chapters || [])
            .map(chapter=>`
              <option value="${escapeHtml(chapter.id)}">
                ${escapeHtml(chapter.name)}
              </option>
            `)
            .join("") ||
          `<option value="">
            No chapters yet
          </option>`;
      };

    if(
      subjects &&
      subjects.length
    ){

      await loadChapters(
        "vidSubj",
        "vidChap"
      );

      await loadChapters(
        "pdfSubj",
        "pdfChap"
      );
    }

    document
      .getElementById("vidSubj")
      .onchange =
      ()=>{
        loadChapters(
          "vidSubj",
          "vidChap"
        );
      };

    document
      .getElementById("pdfSubj")
      .onchange =
      ()=>{
        loadChapters(
          "pdfSubj",
          "pdfChap"
        );
      };


    /* ADD SUBJECT */

    document
      .getElementById("addSubj")
      .onclick =
      async ()=>{

        const name =
          document
            .getElementById("newSubj")
            .value
            .trim();

        if(!name) return;

        try{

          const {
            error
          } =
            await db
              .from("subjects")
              .insert({
                name
              });

          if(error) throw error;

          renderAdminContent(body);

        }catch(error){

          console.error(error);

          alert(
            error?.message ||
            "Could not add subject."
          );
        }
      };


    /* ADD CHAPTER */

    document
      .getElementById("addChap")
      .onclick =
      async ()=>{

        const subject_id =
          document
            .getElementById("chSubj")
            .value;

        const name =
          document
            .getElementById("newChap")
            .value
            .trim();

        if(!subject_id || !name){
          return;
        }

        try{

          const {
            error
          } =
            await db
              .from("chapters")
              .insert({
                subject_id,
                name
              });

          if(error) throw error;

          renderAdminContent(body);

        }catch(error){

          console.error(error);

          alert(
            error?.message ||
            "Could not add chapter."
          );
        }
      };


    /* ADD VIDEO */

    document
      .getElementById("addVid")
      .onclick =
      async ()=>{

        const chapter_id =
          document
            .getElementById("vidChap")
            .value;

        const title =
          document
            .getElementById("vidTitle")
            .value
            .trim();

        const url =
          document
            .getElementById("vidUrl")
            .value
            .trim();

        const youtubeId =
          ytId(url);

        if(
          !chapter_id ||
          !title ||
          !youtubeId
        ){

          alert(
            "Check chapter, title, and that the YouTube link is valid."
          );

          return;
        }

        try{

          const {
            error
          } =
            await db
              .from("videos")
              .insert({
                chapter_id,
                title,
                youtube_id:youtubeId
              });

          if(error) throw error;

          renderAdminContent(body);

        }catch(error){

          console.error(error);

          alert(
            error?.message ||
            "Could not add video."
          );
        }
      };


    /* ADD PDF */

    document
      .getElementById("addPdf")
      .onclick =
      async ()=>{

        const chapter_id =
          document
            .getElementById("pdfChap")
            .value;

        const category =
          document
            .getElementById("pdfCat")
            .value;

        const title =
          document
            .getElementById("pdfTitle")
            .value
            .trim();

        const file =
          document
            .getElementById("pdfFile")
            .files[0];

        if(
          !chapter_id ||
          !title ||
          !file
        ){

          alert(
            "Select a chapter, enter a title, and choose a PDF."
          );

          return;
        }

        if(
          file.type !==
          "application/pdf"
        ){

          alert(
            "Please select a PDF file."
          );

          return;
        }

        try{

          const path =
            `pdfs/${crypto.randomUUID()}_${file.name}`;

          const {
            error:uploadError
          } =
            await db.storage
              .from("content")
              .upload(
                path,
                file,
                {
                  cacheControl:"3600",
                  upsert:false
                }
              );

          if(uploadError){
            throw uploadError;
          }

          const {
            error:insertError
          } =
            await db
              .from("pdfs")
              .insert({
                chapter_id,
                category,
                title,
                file_path:path
              });

          if(insertError){

            /*
              If database insert fails after upload,
              try removing the uploaded file.
            */
            try{

              await db.storage
                .from("content")
                .remove([path]);

            }catch(cleanupError){

              console.warn(
                "PDF cleanup failed:",
                cleanupError
              );
            }

            throw insertError;
          }

          renderAdminContent(body);

        }catch(error){

          console.error(
            "PDF upload error:",
            error
          );

          alert(
            error?.message ||
            "Could not upload PDF."
          );
        }
      };


    /* ADD TEST */

    document
      .getElementById("addTest")
      .onclick =
      async ()=>{

        const title =
          document
            .getElementById("testTitle")
            .value
            .trim();

        const duration_minutes =
          parseInt(
            document
              .getElementById("testDur")
              .value
          ) || 60;

        const file =
          document
            .getElementById("testFile")
            .files[0];

        if(!title){

          alert(
            "Enter a test title."
          );

          return;
        }

        try{

          let file_path = null;

          if(file){

            if(
              file.type !==
              "application/pdf"
            ){

              alert(
                "Test file must be a PDF."
              );

              return;
            }

            file_path =
              `tests/${crypto.randomUUID()}_${file.name}`;

            const {
              error:uploadError
            } =
              await db.storage
                .from("content")
                .upload(
                  file_path,
                  file,
                  {
                    cacheControl:"3600",
                    upsert:false
                  }
                );

            if(uploadError){
              throw uploadError;
            }
          }

          const {
            error
          } =
            await db
              .from("tests")
              .insert({
                title,
                duration_minutes,
                file_path
              });

          if(error){

            if(file_path){

              try{

                await db.storage
                  .from("content")
                  .remove([
                    file_path
                  ]);

              }catch(cleanupError){

                console.warn(
                  "Test cleanup failed:",
                  cleanupError
                );
              }
            }

            throw error;
          }

          renderAdminContent(body);

        }catch(error){

          console.error(
            "Test creation error:",
            error
          );

          alert(
            error?.message ||
            "Could not create test."
          );
        }
      };

  }catch(error){

    console.error(
      "Admin content error:",
      error
    );

    body.innerHTML += `
      <div class="empty">
        ${escapeHtml(error?.message || "Unable to load admin content.")}
      </div>
    `;
  }
}

/* =========================================================
   BOOT
   ========================================================= */

async function boot(){

  if(!db){

    throw new Error(
      "Supabase is not initialized."
    );
  }

  try{

    const {
      data,
      error
    } =
      await db.auth.getSession();

    if(error){
      throw error;
    }

    session =
      data?.session || null;

    if(session){

      await afterLogin();

    }else{

      renderAuth();
    }

    /*
      Keep session state synchronized.
    */
    db.auth.onAuthStateChange(
      (event,newSession)=>{

        session =
          newSession || null;

        /*
          Don't force-render here.
          Supabase may fire INITIAL_SESSION
          during startup.
        */
      }
    );

  }catch(error){

    console.error(
      "Boot error:",
      error
    );

    throw error;
  }
}

/* =========================================================
   START APP
   ========================================================= */

initializeApp();
