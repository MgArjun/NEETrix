<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NEETrix — Extreme 3D Science Animations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    :root{
      --bg:#050812;
      --panel:#0f1420;
      --panel2:#0a0f1a;
      --border:#1a2235;
      --text:#e8ecf5;
      --muted:#94a3b8;
      --accent:#4f8cff;
      --green:#22d3a3;
      --warn:#f59e0b;
      --danger:#ef4444;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow-x:hidden}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.5;
    }
    #app{min-height:100%}
    .auth-wrap{display:grid;place-items:center;min-height:100vh;padding:24px}
    .auth-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px}
    .brand{font-size:22px;font-weight:800;letter-spacing:.4px}
    .sub{color:var(--muted);font-size:13px;margin-top:4px}
    .msg{margin-top:14px;font-size:13px;min-height:18px}
    input,select{width:100%;padding:10px 12px;margin:8px 0;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--text);outline:none}
    input:focus,select:focus{border-color:var(--accent)}
    .btn,.btn-outline,.btn-danger,.btn-small{width:100%;padding:10px 14px;margin-top:10px;border-radius:10px;border:1px solid var(--border);background:var(--accent);color:#050812;font-weight:700;cursor:pointer}
    .btn-outline{background:transparent;color:var(--text)}
    .btn-danger{background:rgba(239,68,68,.12);color:var(--danger);border-color:var(--danger)}
    .btn-small{width:auto;padding:6px 10px;font-size:12px;margin-top:0}
    .link{background:none;border:none;color:var(--muted);cursor:pointer;margin-top:10px}
    .topbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);background:rgba(5,8,18,.85);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
    .topbar .brand{font-size:18px}
    .navbtn{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px}
    .navbtn.active{color:var(--text);border-color:var(--border);background:var(--panel2)}
    .spacer{flex:1}
    .profile-wrap{display:flex;align-items:center}
    .profile-btn{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#050812;font-weight:800;border:none;cursor:pointer}
    .content{padding:16px;max-width:1400px;margin:0 auto}
    .skel{background:linear-gradient(90deg,var(--panel2),#1a2440,var(--panel2));border-radius:10px}
    .skel-card{height:90px}
    .skel-subj{height:70px}
    .home-hero{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px}
    .anim-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
    @media(max-width:900px){.anim-row{grid-template-columns:1fr}}
    .welcome{font-size:20px;font-weight:700;margin-bottom:4px}
    .muted{color:var(--muted);font-size:13px}
    .anim-3d-wrap{position:relative;width:100%;height:320px;background:radial-gradient(ellipse at center, #0a1020 0%, #050812 70%);border-radius:14px;overflow:hidden;border:1px solid var(--border)}
    .anim-3d-canvas{width:100%;height:100%;display:block}
    .anim-overlay{position:absolute;bottom:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
    .anim-control{pointer-events:auto;background:rgba(15,20,32,.85);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text);backdrop-filter:blur(6px)}
    .anim-control select,.anim-control button{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:6px;font-size:12px;cursor:pointer}
    .anim-info{position:absolute;top:10px;right:10px;max-width:280px;background:rgba(15,20,32,.9);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:13px;backdrop-filter:blur(6px);display:none}
    .anim-info.show{display:block}
    .anim-info h4{margin:0 0 6px;font-size:14px;color:var(--accent)}
    .anim-info p{margin:4px 0;color:var(--muted);line-height:1.4}
    .progress-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:16px;cursor:pointer}
    .progress-head{display:flex;justify-content:space-between;margin-bottom:8px}
    .progress-bar-bg{height:10px;background:var(--panel2);border-radius:999px;overflow:hidden}
    .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#22d3a3);width:0%;transition:width .6s ease}
    .progress-stats{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:13px}
    .progress-stats b{color:var(--text)}
    .home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    @media(max-width:700px){.home-grid{grid-template-columns:1fr}}
    .home-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer}
    .home-card .icon{font-size:22px;margin-bottom:6px}
    .home-card h3{margin:0 0 4px;font-size:15px}
    .home-card .muted{font-size:12px}
    .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    @media(max-width:700px){.grid2{grid-template-columns:1fr}}
    .subject-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer}
    .subject-card h3{margin:0;font-size:15px}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
    .card.row{display:flex;align-items:center;gap:10px}
    .empty{color:var(--muted);padding:18px;text-align:center}
    .tabs2{display:flex;gap:8px;margin:12px 0}
    .tab2{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px}
    .tab2.active{color:var(--text);border-color:var(--accent)}
    .back{background:none;border:none;color:var(--muted);cursor:pointer;margin-bottom:8px}
    .yt-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
    .yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
    .pdf-modal{position:fixed;inset:0;background:rgba(5,8,18,.92);z-index:20;display:grid;grid-template-rows:auto auto 1fr auto}
    .pdf-toolbar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border);background:rgba(15,21,36,.96)}
    .pdf-title{flex:1;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pdf-tools{display:flex;gap:6px;flex-wrap:wrap}
    .pdf-tbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
    .pdf-tbtn.active-tool{border-color:var(--accent);background:rgba(79,140,255,.12)}
    .pdf-zoom-label{font-size:12px;color:var(--muted);min-width:42px;text-align:center}
    .pdf-canvas-wrap{position:relative;overflow:auto;display:grid;place-items:center;background:rgba(5,8,18,.7)}
    .pdf-canvas-stack{position:relative}
    #pdfCanvas,#pdfAnnoCanvas{display:block}
    .textLayer{transform-origin:0 0}
    .pdf-pagebar{display:flex;justify-content:center;gap:8px;padding:8px;border-top:1px solid var(--border);background:rgba(15,21,36,.96)}
    #pdfPageInput{width:60px;margin:0 4px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:4px 6px}
    .pdf-annobar{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--border);background:rgba(15,21,36,.96);flex-wrap:wrap}
    .pdf-color{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);cursor:pointer}
    .pdf-color.selected{border-color:#fff;transform:scale(1.1)}
    .pdf-panel{position:absolute;top:48px;right:0;width:260px;max-height:calc(100% - 120px);background:rgba(15,21,36,.98);border:1px solid var(--border);border-radius:12px;overflow:hidden;transform:translateX(110%);transition:transform .2s ease;z-index:5}
    .pdf-panel.open{transform:translateX(0)}
    .pdf-panel-tabs{display:flex;border-bottom:1px solid var(--border)}
    .pdf-panel-tab{flex:1;background:transparent;border:none;color:var(--muted);padding:8px;font-size:12px;cursor:pointer}
    .pdf-panel-tab.active{color:var(--text);border-bottom:2px solid var(--accent)}
    .pdf-panel-body{padding:8px;overflow:auto;max-height:260px}
    .pdf-panel-item{padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
    .pdf-panel-item:hover{background:var(--panel2);border-color:var(--border)}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
    .modal-bg{position:fixed;inset:0;background:rgba(5,8,18,.85);z-index:30;display:grid;place-items:center;padding:16px}
    .modal-box{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;position:relative}
    .modal-close{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
    .profile-field{margin-top:10px}
    .profile-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
    .timer{position:sticky;top:56px;z-index:4;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px 10px;margin-bottom:12px;font-weight:700;text-align:center}
    .cbt-layout{display:grid;grid-template-columns:1fr 260px;gap:12px}
    @media(max-width:900px){.cbt-layout{grid-template-columns:1fr}}
    .cbt-qbox{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
    .cbt-opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;margin-top:8px;cursor:pointer}
    .cbt-opt.selected{border-color:var(--accent);background:rgba(79,140,255,.12)}
    .cbt-nav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .cbt-palette{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px}
    .cbt-palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
    .cbt-pbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px;border-radius:8px;cursor:pointer}
    .cbt-pbtn.answered{background:rgba(79,140,255,.25);border-color:var(--accent)}
    .cbt-pbtn.marked{background:rgba(245,158,11,.25);border-color:var(--warn)}
    .cbt-pbtn.current{outline:2px solid var(--accent)}
    .cbt-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--muted)}
    .cbt-dot{width:14px;height:14px;border-radius:3px;display:inline-block;margin-right:6px}
    .score-card{text-align:center}
    .score-num{font-size:36px;font-weight:800;color:var(--accent);margin:8px 0}
    .q-img{max-width:100%;border-radius:10px;margin:8px 0}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{border:1px solid var(--border);padding:8px;text-align:left;font-size:13px}
    th{background:var(--panel2)}
    .row-wrap{display:flex;gap:6px;flex-wrap:wrap}
    .page-fade{animation:fade .18s ease}
    @keyframes fade{from{opacity:.85}to{opacity:1}}
    .loading-3d{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,8,18,.7);color:var(--muted);font-size:13px;z-index:3;pointer-events:none}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const SUPABASE_URL = "https://qhggamgxfwlwtpmwxfwk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_X9_aDiQcrKhYyPfuQdnKPA_K8F7RPjM";
    let db = null, session = null, profile = null, activeTab = "home";
    let selSubject = null, selChapter = null, selCategory = "general", adminTab = "dashboard";
    let cbtTest = null, cbtQuestions = [], cbtAnswers = {}, cbtMarked = new Set(), cbtBookmarks = new Set(), cbtIndex = 0, cbtTimerRef = null, cbtRemaining = 0;
    let pr = null;
    let atom3D = null, nerve3D = null;
    const app = document.getElementById("app");

    function escapeHtml(v){return (v??"").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
    function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild}
    function fmtDate(iso){if(!iso)return"";const d=new Date(iso);if(Number.isNaN(d.getTime()))return"";return d.toLocaleString(undefined,{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
    function ytId(url){const m=(url||"").match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null}
    function showFatalError(m){document.body.innerHTML=`<div style="min-height:100vh;background:var(--bg);color:#fff;padding:24px"><div style="max-width:700px;margin:40px auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px"><h2 style="color:var(--danger)">NEETrix Error</h2><div style="color:#c5cada;line-height:1.6;white-space:pre-wrap">${escapeHtml(m)}</div></div></div>`}
    function getLastScore(){try{return JSON.parse(localStorage.getItem("neetrix_last_score")||"null")}catch(e){return null}}
    function saveLastScore(obj){try{localStorage.setItem("neetrix_last_score",JSON.stringify(obj))}catch(e){}}
    function lsGet(key,fallback){try{const v=localStorage.getItem(key);return v!=null?JSON.parse(v):fallback}catch(e){return fallback}}
    function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
    function skelList(n,cls){let h="";for(let i=0;i<n;i++)h+=`<div class="skel ${cls||"skel-card"}"></div>`;return h}
    function toast(msg, ms=2500){let t = document.getElementById("globalToast");if(!t){ t = el(`<div class="toast" id="globalToast"></div>`); document.body.appendChild(t); }t.textContent = msg;t.classList.add("show");clearTimeout(t._tm);t._tm = setTimeout(()=>t.classList.remove("show"), ms);}
    function confirmAction(title, message){return new Promise(resolve=>{const modal = el(`<div class="modal-bg"><div class="modal-box" style="max-width:420px"><h3 style="margin-bottom:10px">${escapeHtml(title)}</h3><p class="muted" style="line-height:1.55;margin-bottom:18px;white-space:pre-wrap">${escapeHtml(message)}</p><div style="display:flex;gap:10px"><button class="btn-outline" style="flex:1" id="cNo">Cancel</button><button class="btn-danger" style="flex:1" id="cYes">Confirm</button></div></div></div>`);document.body.appendChild(modal);document.getElementById("cNo").onclick = ()=>{ modal.remove(); resolve(false); };document.getElementById("cYes").onclick = ()=>{ modal.remove(); resolve(true); };modal.onclick = e => { if(e.target===modal){ modal.remove(); resolve(false); } };});}
    function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error("Failed: "+src));document.head.appendChild(s)})}
    async function loadSupabase(){if(window.supabase)return true;const srcs=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"];let last=null;for(const s of srcs){try{await loadScript(s);if(window.supabase)return true}catch(e){last=e}}throw last||new Error("Supabase load failed")}
    async function loadPdfJs(){if(window.pdfjsLib)return true;const srcs=["https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js","https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"];for(const s of srcs){try{await loadScript(s);if(window.pdfjsLib)return true}catch(e){}}return false}
    async function initializeApp(){try{await loadSupabase();if(!SUPABASE_URL || !SUPABASE_ANON_KEY) throw new Error("Supabase not configured");db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);loadPdfJs().catch(()=>{});await boot();}catch(e){console.error(e);showFatalError(e?.message || "Could not start");}}
    async function boot(){const stored = localStorage.getItem("neetrix_session");if(stored){try{const parsed = JSON.parse(stored);if(parsed?.session?.user){session = parsed.session;await afterLogin();return;}}catch(e){}}renderAuth();}

    /* ===================== AUTH ===================== */
    function renderAuth(mode){mode = mode || "login";app.innerHTML = "";app.appendChild(el(`<div class="auth-wrap"><div class="auth-card"><div class="brand">NEETrix</div><div class="sub">The focused way to prepare.</div><div class="msg" id="msg"></div><div id="fields"></div><button class="btn" style="width:100%" id="mainBtn"></button><button class="link" id="link1"></button><button class="link" id="link2" style="display:none"></button></div></div>`));const fields = document.getElementById("fields");const mainBtn = document.getElementById("mainBtn");const link1 = document.getElementById("link1");const link2 = document.getElementById("link2");const msg = document.getElementById("msg");if(mode === "login" || mode === "signup"){fields.innerHTML = `<input id="email" type="email" placeholder="Email address" autocomplete="email"/><input id="pass" type="password" placeholder="Password (8+ characters)" autocomplete="${mode==="login"?"current-password":"new-password"}"/>`;mainBtn.textContent = mode === "login" ? "Log in" : "Create account";link1.textContent = mode === "login" ? "New here? Create an account" : "Already have an account? Log in";link1.onclick = () => renderAuth(mode === "login" ? "signup" : "login");link2.style.display = mode === "login" ? "block" : "none";link2.textContent = "Forgot password?";link2.onclick = () => renderAuth("forgot");mainBtn.onclick = async () => {msg.textContent = "";mainBtn.disabled = true;const email = document.getElementById("email").value.trim();const pass = document.getElementById("pass").value;if(!email || !pass){ msg.style.color="var(--muted)"; msg.textContent="Enter both fields."; mainBtn.disabled=false; return; }try{if(mode === "signup"){const {error} = await db.auth.signUp({email, password: pass});if(error) throw error;msg.style.color = "var(--green)";msg.textContent = "Account created! Check email if needed, then log in.";setTimeout(() => renderAuth("login"), 1800);} else {const {data, error} = await db.auth.signInWithPassword({email, password: pass});if(error) throw error;session = data.session;localStorage.setItem("neetrix_session", JSON.stringify({session}));await afterLogin();}}catch(e){msg.style.color = "var(--danger)";msg.textContent = e?.message || "Something went wrong";} finally {mainBtn.disabled = false;}};} else if(mode === "forgot"){fields.innerHTML = `<input id="email" type="email" placeholder="Email address"/>`;mainBtn.textContent = "Send reset link";link1.textContent = "Back to log in";link1.onclick = () => renderAuth("login");mainBtn.onclick = async () => {msg.textContent = "";mainBtn.disabled = true;const email = document.getElementById("email").value.trim();if(!email){ msg.style.color="var(--muted)"; msg.textContent="Enter email"; mainBtn.disabled=false; return; }try{const {error} = await db.auth.resetPasswordForEmail(email);if(error) throw error;msg.style.color = "var(--green)";msg.textContent = "Reset link sent";}catch(e){msg.style.color = "var(--danger)";msg.textContent = e?.message || "Error";} finally {mainBtn.disabled = false;}};}}

    function renderStatusScreen(status){app.innerHTML = "";const msgs = {pending: ["Request sent", "Your access request has been sent. Wait for admin approval."],paused: ["Account paused", "Your account is paused by admin."],blocked: ["Account blocked", "Access blocked by admin."]};const [t,b] = msgs[status] || ["Access unavailable", "Contact admin."];app.appendChild(el(`<div class="auth-wrap"><div class="auth-card"><div class="brand">NEETrix</div><h2 style="margin-top:14px">${escapeHtml(t)}</h2><p class="muted" style="line-height:1.6;margin:10px 0 16px">${escapeHtml(b)}</p><button class="btn-outline" style="width:100%" id="out">Log out</button></div></div>`));document.getElementById("out").onclick = async () => {try{ await db.auth.signOut(); }catch(e){}session = null; profile = null;localStorage.removeItem("neetrix_session");renderAuth();};}

    async function afterLogin(){if(!session?.user){ renderAuth(); return; }try{try{ await db.from("login_events").insert({user_id: session.user.id, email: session.user.email}); }catch(e){}const {data, error} = await db.from("profiles").select("*").eq("id", session.user.id).single();if(error){if(error.code === "PGRST116"){ profile = null; renderStatusScreen("pending"); return; }throw error;}profile = data;if(!profile || profile.status !== "active"){renderStatusScreen(profile ? profile.status : "pending");return;}activeTab = "home";selSubject = null;selChapter = null;renderShell();}catch(e){showFatalError(e?.message || "Unable to load account");}}

    /* ===================== SHELL ===================== */
    function renderShell(){app.innerHTML = "";const isAdmin = profile?.role === "admin";const initial = (profile?.name || profile?.email || "U")[0].toUpperCase();app.appendChild(el(`<div><div class="topbar"><div class="brand">NEETrix</div><button class="navbtn" data-t="home">Home</button><button class="navbtn" data-t="content">Content</button><button class="navbtn" data-t="questions">Questions</button><button class="navbtn" data-t="bookmarks">Bookmarks</button><button class="navbtn" data-t="tests">Test</button>${isAdmin ? `<button class="navbtn" data-t="admin">Admin</button>` : ""}<div class="spacer"></div><div class="profile-wrap"><button class="profile-btn" id="profileBtn">${escapeHtml(initial)}</button></div></div><div class="content" id="content"></div></div>`));document.getElementById("profileBtn").onclick = () => openProfileModal();document.querySelectorAll(".navbtn").forEach(btn => {btn.onclick = () => {activeTab = btn.dataset.t;selSubject = null;selChapter = null;if(cbtTimerRef){ clearInterval(cbtTimerRef); cbtTimerRef = null; }renderTabsUI();renderBody();};});renderTabsUI();renderBody();}

    function renderTabsUI(){document.querySelectorAll(".navbtn").forEach(b => b.classList.toggle("active", b.dataset.t === activeTab));}

    function initAtom3D(){const canvas = document.getElementById("atom3dCanvas");const wrap = document.getElementById("atom3dWrap");const info = document.getElementById("atomInfo");if(!canvas || !wrap) return;const loading = wrap.querySelector(".loading-3d");const scene = new THREE.Scene();const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);camera.position.set(0, 0, 8);const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});renderer.setSize(canvas.clientWidth, canvas.clientHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));const controls = new THREE.OrbitControls(camera, canvas);controls.enableDamping = true;controls.dampingFactor = 0.05;controls.minDistance = 4;controls.maxDistance = 15;const ambient = new THREE.AmbientLight(0x404060, 0.6);scene.add(ambient);const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);dirLight.position.set(5, 5, 5);scene.add(dirLight);const atomGroup = new THREE.Group();scene.add(atomGroup);const nucleusGroup = new THREE.Group();const protonMat = new THREE.MeshPhongMaterial({color:0xef4444, shininess:80});const neutronMat = new THREE.MeshPhongMaterial({color:0x4f8cff, shininess:80});const particleGeo = new THREE.SphereGeometry(0.25, 32, 32);const positions = [];for(let i=0; i<12; i++){const theta = Math.random() * Math.PI * 2;const phi = Math.acos(2 * Math.random() - 1);const r = 0.6 * Math.cbrt(Math.random());positions.push({x: r * Math.sin(phi) * Math.cos(theta),y: r * Math.sin(phi) * Math.sin(theta),z: r * Math.cos(phi)});}positions.forEach((pos, i) => {const isProton = i % 2 === 0;const particle = new THREE.Mesh(particleGeo, isProton ? protonMat : neutronMat);particle.position.set(pos.x, pos.y, pos.z);nucleusGroup.add(particle);});atomGroup.add(nucleusGroup);const orbitals = {};const orbitalMat1s = new THREE.MeshPhongMaterial({color:0x22d3a3, transparent:true, opacity:0.15, side:THREE.DoubleSide});const orbitalMat2s = new THREE.MeshPhongMaterial({color:0x22d3a3, transparent:true, opacity:0.12, side:THREE.DoubleSide});const orbitalMat2p = new THREE.MeshPhongMaterial({color:0x4f8cff, transparent:true, opacity:0.12, side:THREE.DoubleSide});const orbitalMat3s = new THREE.MeshPhongMaterial({color:0xf59e0b, transparent:true, opacity:0.1, side:THREE.DoubleSide});const orbitalMat3p = new THREE.MeshPhongMaterial({color:0xf59e0b, transparent:true, opacity:0.1, side:THREE.DoubleSide});const orb1s = new THREE.Mesh(new THREE.SphereGeometry(1.8, 48, 48), orbitalMat1s);orb1s.userData = {type:"1s", name:"1s Orbital", shape:"Spherical", capacity:2};orbitals["1s"] = orb1s;atomGroup.add(orb1s);const orb2s = new THREE.Mesh(new THREE.SphereGeometry(2.8, 48, 48), orbitalMat2s);orb2s.userData = {type:"2s", name:"2s Orbital", shape:"Spherical", capacity:2};orbitals["2s"] = orb2s;atomGroup.add(orb2s);const pGeo = new THREE.CylinderGeometry(0.4, 0.4, 3.5, 32);const pSphereGeo = new THREE.SphereGeometry(0.9, 32, 32);const createPOrbital = (rotX, rotZ, name) => {const group = new THREE.Group();const cyl = new THREE.Mesh(pGeo, orbitalMat2p);cyl.rotation.x = rotX;cyl.rotation.z = rotZ;const sph1 = new THREE.Mesh(pSphereGeo, orbitalMat2p);sph1.position.set(0, 1.7, 0);const sph2 = new THREE.Mesh(pSphereGeo, orbitalMat2p);sph2.position.set(0, -1.7, 0);group.add(cyl, sph1, sph2);group.userData = {type:"2p", name:name, shape:"Dumbbell", capacity:6};return group;};orbitals["2p"] = [createPOrbital(Math.PI/2, 0, "2pₓ"),createPOrbital(0, Math.PI/2, "2pᵧ"),createPOrbital(0, 0, "2p_z")];orbitals["2p"].forEach(p => atomGroup.add(p));const orb3s = new THREE.Mesh(new THREE.SphereGeometry(3.8, 48, 48), orbitalMat3s);orb3s.userData = {type:"3s", name:"3s Orbital", shape:"Spherical", capacity:2};orbitals["3s"] = orb3s;atomGroup.add(orb3s);const pGeo3 = new THREE.CylinderGeometry(0.5, 0.5, 5, 32);const pSphereGeo3 = new THREE.SphereGeometry(1.2, 32, 32);const createP3Orbital = (rotX, rotZ, name) => {const group = new THREE.Group();const cyl = new THR     /* ===================== 3D NERVOUS SYSTEM ===================== */
    function initNerve3D(){const canvas = document.getElementById("nerve3dCanvas");const wrap = document.getElementById("nerve3dWrap");const info = document.getElementById("nerveInfo");if(!canvas || !wrap) return;const loading = wrap.querySelector(".loading-3d");const scene = new THREE.Scene();const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);camera.position.set(0, 0, 10);const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});renderer.setSize(canvas.clientWidth, canvas.clientHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));const controls = new THREE.OrbitControls(camera, canvas);controls.enableDamping = true;controls.dampingFactor = 0.05;controls.minDistance = 6;controls.maxDistance = 20;const ambient = new THREE.AmbientLight(0x404060, 0.5);scene.add(ambient);const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);dirLight.position.set(5, 5, 5);scene.add(dirLight);const bodyGroup = new THREE.Group();scene.add(bodyGroup);const bodyMat = new THREE.MeshPhongMaterial({color:0x1e3a5f, transparent:true, opacity:0.25, side:THREE.DoubleSide});const bodyGeo = new THREE.CylinderGeometry(0.8, 1.2, 7, 32);const body = new THREE.Mesh(bodyGeo, bodyMat);body.userData = {name:"Human Body", type:"anatomy"};bodyGroup.add(body);const headGeo = new THREE.SphereGeometry(0.9, 32, 32);const head = new THREE.Mesh(headGeo, bodyMat);head.position.y = 3.8;head.userData = {name:"Head", type:"anatomy"};bodyGroup.add(head);const brainGroup = new THREE.Group();const brainMat = new THREE.MeshPhongMaterial({color:0xd4a5a5, shininess:60});const brainL = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), brainMat);brainL.position.set(-0.3, 4, 0);const brainR = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), brainMat);brainR.position.set(0.3, 4, 0);const cerebellum = new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 32), brainMat);cerebellum.position.set(0, 3.6, -0.3);const brainstem = new THREE.M     async function startPdfTest(test){if(!test.file_path){ toast("No paper uploaded"); return; }try{const {data, error} = await db.storage.from("content").createSignedUrl(test.file_path, 7200);if(error) throw error;if(!data?.signedUrl) throw new Error("No link");if(!window.pdfjsLib) await loadPdfJs();if(!window.pdfjsLib){ toast("PDF viewer failed"); return; }const modal = el(`<div class="modal-bg"><div class="modal-box" style="max-width:920px"><div class="timer" id="tmr"></div><h3>${escapeHtml(test.title)}</h3><div style="overflow:auto;text-align:center"><canvas id="pc"></canvas></div><div class="zoom-row"><button id="zo">−</button><span id="zl">100%</span><button id="zi">+</button></div><button class="btn" style="width:100%;margin-top:14px" id="submitTest">Submit Test</button></div></div>`);document.body.appendChild(modal);let remaining = (Number(test.duration_minutes) || 60) * 60;const timerEl = document.getElementById("tmr");let timerRef = null;const finish = () => { if(timerRef) clearInterval(timerRef); modal.remove(); toast("Test submitted"); };const tick = () => {const m = Math.floor(remaining/60), s = remaining % 60;timerEl.textContent = `${m}:${s<10?"0":""}${s} remaining`;if(remaining <= 0){ finish(); return; }remaining--;};tick();timerRef = setInterval(tick, 1000);document.getElementById("submitTest").onclick = () => { if(confirm("Submit now?")) finish(); };pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";let scale = 1.2;const pdfDoc = await pdfjsLib.getDocument({url: data.signedUrl, withCredentials:false}).promise;const page = await pdfDoc.getPage(1);const render = async () => {const vp = page.getViewport({scale});const canvas = document.getElementById("pc");if(!canvas) return;canvas.width = vp.width;canvas.height = vp.height;await page.render({canvasContext: canvas.getContext("2d"), viewport: vp}).promise;const zl = document.getElementById("zl");if(zl) zl.textContent = Math.round(scale / 1 <body>
  <div id="app"></div>

  <script>
    const SUPABASE_URL = "https://qhggamgxfwlwtpmwxfwk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_X9_aDiQcrKhYyPfuQdnKPA_K8F7RPjM";
    let db = null, session = null, profile = null, activeTab = "home";
    let selSubject = null, selChapter = null, selCategory = "general", adminTab = "dashboard";
    let cbtTest = null, cbtQuestions = [], cbtAnswers = {}, cbtMarked = new Set(), cbtBookmarks = new Set(), cbtIndex = 0, cbtTimerRef = null, cbtRemaining = 0;
    let pr = null;
    let atom3D = null, nerve3D = null;
    const app = document.getElementById("app");

    function escapeHtml(v){return (v??"").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
    function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild}
    function fmtDate(iso){if(!iso)return"";const d=new Date(iso);if(Number.isNaN(d.getTime()))return"";return d.toLocaleString(undefined,{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
    function ytId(url){const m=(url||"").match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null}
    function showFatalError(m){document.body.innerHTML=`<div style="min-height:100vh;background:var(--bg);color:#fff;padding:24px"><div style="max-width:700px;margin:40px auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px"><h2 style="color:var(--danger)">NEETrix Error</h2><div style="color:#c5cada;line-height:1.6;white-space:pre-wrap">${escapeHtml(m)}</div></div></div>`}
    function getLastScore(){try{return JSON.parse(localStorage.getItem("neetrix_last_score")||"null")}catch(e){return null}}
    function saveLastScore(obj){try{localStorage.setItem("neetrix_last_score",JSON.stringify(obj))}catch(e){}}
    function lsGet(key,fallback){try{const v=localStorage.getItem(key);return v!=null?JSON.parse(v):fallback}catch(e){return fallback}}
    function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
    function skelList(n,cls){let h="";for(let i=0;i<n;i++)h+=`<div class="skel ${cls||"skel-card"}"></div>`;return h}
    function toast(msg, ms=2500){
      let t = document.getElementById("globalToast");
      if(!t){ t = el(`<div class="toast" id="globalToast"></div>`); document.body.appendChild(t); }
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._tm);
      t._tm = setTimeout(()=>t.classList.remove("show"), ms);
    }
    function confirmAction(title, message){
      return new Promise(resolve=>{
        const modal = el(`<div class="modal-bg"><div class="modal-box" style="max-width:420px">
          <h3 style="margin-bottom:10px">${escapeHtml(title)}</h3>
          <p class="muted" style="line-height:1.55;margin-bottom:18px;white-space:pre-wrap">${escapeHtml(message)}</p>
          <div style="display:flex;gap:10px">
            <button class="btn-outline" style="flex:1" id="cNo">Cancel</button>
            <button class="btn-danger" style="flex:1" id="cYes">Confirm</button>
          </div>
        </div></div>`);
        document.body.appendChild(modal);
        document.getElementById("cNo").onclick = ()=>{ modal.remove(); resolve(false); };
        document.getElementById("cYes").onclick = ()=>{ modal.remove(); resolve(true); };
        modal.onclick = e => { if(e.target===modal){ modal.remove(); resolve(false); } };
      });
    }
    function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error("Failed: "+src));document.head.appendChild(s)})}
    async function loadSupabase(){if(window.supabase)return true;const srcs=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"];let last=null;for(const s of srcs){try{await loadScript(s);if(window.supabase)return true}catch(e){last=e}}throw last||new Error("Supabase load failed")}
    async function loadPdfJs(){if(window.pdfjsLib)return true;const srcs=["https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js","https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"];for(const s of srcs){try{await loadScript(s);if(window.pdfjsLib)return true}catch(e){}}return false}
    async function initializeApp(){
      try{
        await loadSupabase();
        if(!SUPABASE_URL || !SUPABASE_ANON_KEY) throw new Error("Supabase not configured");
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        loadPdfJs().catch(()=>{});
        await boot();
      }catch(e){
        console.error(e);
        showFatalError(e?.message || "Could not start");
      }
    }
    async function boot(){
      const stored = localStorage.getItem("neetrix_session");
      if(stored){
        try{
          const parsed = JSON.parse(stored);
          if(parsed?.session?.user){
            session = parsed.session;
            await afterLogin();
            return;
          }
        }catch(e){}
      }
      renderAuth();
    }

    /* ===================== AUTH ===================== */
    function renderAuth(mode){
      mode = mode || "login";
      app.innerHTML = "";
      app.appendChild(el(`<div class="auth-wrap"><div class="auth-card">
        <div class="brand">NEETrix</div>
        <div class="sub">The focused way to prepare.</div>
        <div class="msg" id="msg"></div>
        <div id="fields"></div>
        <button class="btn" style="width:100%" id="mainBtn"></button>
        <button class="link" id="link1"></button>
        <button class="link" id="link2" style="display:none"></button>
      </div></div>`));
      const fields = document.getElementById("fields");
      const mainBtn = document.getElementById("mainBtn");
      const link1 = document.getElementById("link1");
      const link2 = document.getElementById("link2");
      const msg = document.getElementById("msg");
      if(mode === "login" || mode === "signup"){
        fields.innerHTML = `<input id="email" type="email" placeholder="Email address" autocomplete="email"/>
          <input id="pass" type="password" placeholder="Password (8+ characters)" autocomplete="${mode==="login"?"current-password":"new-password"}"/>`;
        mainBtn.textContent = mode === "login" ? "Log in" : "Create account";
        link1.textContent = mode === "login" ? "New here? Create an account" : "Already have an account? Log in";
        link1.onclick = () => renderAuth(mode === "login" ? "signup" : "login");
        link2.style.display = mode === "login" ? "block" : "none";
        link2.textContent = "Forgot password?";
        link2.onclick = () => renderAuth("forgot");
        mainBtn.onclick = async () => {
          msg.textContent = "";
          mainBtn.disabled = true;
          const email = document.getElementById("email").value.trim();
          const pass = document.getElementById("pass").value;
          if(!email || !pass){ msg.style.color="var(--muted)"; msg.textContent="Enter both fields."; mainBtn.disabled=false; return; }
          try{
            if(mode === "signup"){
              const {error} = await db.auth.signUp({email, password: pass});
              if(error) throw error;
              msg.style.color = "var(--green)";
              msg.textContent = "Account created! Check email if needed, then log in.";
              setTimeout(() => renderAuth("login"), 1800);
            } else {
              const {data, error} = await db.auth.signInWithPassword({email, password: pass});
              if(error) throw error;
              session = data.session;
              localStorage.setItem("neetrix_session", JSON.stringify({session}));
              await afterLogin();
            }
          }catch(e){
            msg.style.color = "var(--danger)";
            msg.textContent = e?.message || "Something went wrong";
          } finally {
            mainBtn.disabled = false;
          }
        };
      } else if(mode === "forgot"){
        fields.innerHTML = `<input id="email" type="email" placeholder="Email address"/>`;
        mainBtn.textContent = "Send reset link";
        link1.textContent = "Back to log in";
        link1.onclick = () => renderAuth("login");
        mainBtn.onclick = async () => {
          msg.textContent = "";
          mainBtn.disabled = true;
          const email = document.getElementById("email").value.trim();
          if(!email){ msg.style.color="var(--muted)"; msg.textContent="Enter email"; mainBtn.disabled=false; return; }
          try{
            const {error} = await db.auth.resetPasswordForEmail(email);
            if(error) throw error;
            msg.style.color = "var(--green)";
            msg.textContent = "Reset link sent";
          }catch(e){
            msg.style.color = "var(--danger)";
            msg.textContent = e?.message || "Error";
          } finally {
            mainBtn.disabled = false;
          }
        };
      }
    }
    function renderStatusScreen(status){
      app.innerHTML = "";
      const msgs = {
        pending: ["Request sent", "Your access request has been sent. Wait for admin approval."],
        paused: ["Account paused", "Your account is paused by admin."],
        blocked: ["Account blocked", "Access blocked by admin."]
      };
      const [t,b] = msgs[status] || ["Access unavailable", "Contact admin."];
      app.appendChild(el(`<div class="auth-wrap"><div class="auth-card">
        <div class="brand">NEETrix</div>
        <h2 style="margin-top:14px">${escapeHtml(t)}</h2>
        <p class="muted" style="line-height:1.6;margin:10px 0 16px">${escapeHtml(b)}</p>
        <button class="btn-outline" style="width:100%" id="out">Log out</button>
      </div></div>`));
      document.getElementById("out").onclick = async () => {
        try{ await db.auth.signOut(); }catch(e){}
        session = null; profile = null;
        localStorage.removeItem("neetrix_session");
        renderAuth();
      };
    }
    async function afterLogin(){
      if(!session?.user){ renderAuth(); return; }
      try{
        try{ await db.from("login_events").insert({user_id: session.user.id, email: session.user.email}); }catch(e){}
        const {data, error} = await db.from("profiles").select("*").eq("id", session.user.id).single();
        if(error){
          if(error.code === "PGRST116"){ profile = null; renderStatusScreen("pending"); return; }
          throw error;
        }
        profile = data;
        if(!profile || profile.status !== "active"){
          renderStatusScreen(profile ? profile.status : "pending");
          return;
        }
        activeTab = "home";
        selSubject = null;
        selChapter = null;
        renderShell();
      }catch(e){
        showFatalError(e?.message || "Unable to load account");
      }
    }

    /* ===================== SHELL ===================== */
    function renderShell(){
      app.innerHTML = "";
      const isAdmin = profile?.role === "admin";
      const initial = (profile?.name || profile?.email || "U").toUpperCase();
      app.appendChild(el(`<div>
        <div class="topbar">
          <div class="brand">NEETrix</div>
          <button class="navbtn" data-t="home">Home</button>
          <button class="navbtn" data-t="content">Content</button>
          <button class="navbtn" data-t="questions">Questions</button>
          <button class="navbtn" data-t="bookmarks">Bookmarks</button>
          <button class="navbtn" data-t="tests">Test</button>
          ${isAdmin ? `<button class="navbtn" data-t="admin">Admin</button>` : ""}
          <div class="spacer"></div>
          <div class="profile-wrap"><button class="profile-btn" id="profileBtn">${escapeHtml(initial)}</button></div>
        </div>
        <div class="content" id="content"></div>
      </div>`));
      document.getElementById("profileBtn").onclick = () => openProfileModal();
      document.querySelectorAll(".navbtn").forEach(btn => {
        btn.onclick = () => {
          activeTab = btn.dataset.t;
          selSubject = null;
          selChapter = null;
          if(cbtTimerRef){ clearInterval(cbtTimerRef); cbtTimerRef = null; }
          renderTabsUI();
          renderBody();
        };
      });
      renderTabsUI();
      renderBody();
    }
    function renderTabsUI(){
      document.querySelectorAll(".navbtn").forEach(b => b.classList.toggle("active", b.dataset.t === activeTab));
    }
    function renderBody(){
      const c = document.getElementById("content");
      if(!c) return;
      c.classList.remove("page-fade");
      void c.offsetWidth;
      c.classList.add("page-fade");
      if(activeTab === "home") renderHome(c);
      else if(activeTab === "content") renderSubjectBrowser(c, "video");
      else if(activeTab === "questions") renderSubjectBrowser(c, "pdf");
      else if(activeTab === "tests") renderTests(c);
      else if(activeTab === "bookmarks") renderBookmarks(c);
      else if(activeTab === "admin"){
        if(profile?.role === "admin") renderAdmin(c);
        else { activeTab = "home"; renderTabsUI(); renderHome(c); }
      }
    }

    /* ===================== PROFILE ===================== */
    function openProfileModal(){
      const modal = el(`<div class="modal-bg" id="profileModal"><div class="modal-box">
        <button class="modal-close" id="pmClose">×</button>
        <h2 style="margin-bottom:16px">My Profile</h2>

        <button class="btn" style="width:100%;margin-top:6px" id="pfSave">Save Profile</button>
        <button class="btn-outline" style="width:100%;margin-top:10px" id="pfReport">Report to Owner</button>
        <button class="btn-danger" style="width:100%;margin-top:10px" id="pfLogout">Log out</button>
      </div></div>`);
      document.body.appendChild(modal);
      document.getElementById("pmClose").onclick = () => modal.remove();
      modal.onclick = e => { if(e.target === modal) modal.remove(); };
      document.getElementById("pfSave").onclick = async () => {
        const name = document.getElementById("pfName").value.trim();
        const phone = document.getElementById("pfPhone").value.trim();
        try{
          const {error} = await db.from("profiles").update({name, phone}).eq("id", session.user.id);
          if(error) throw error;
          profile.name = name;
          profile.phone = phone;
          toast("Profile saved");
          modal.remove();
          renderShell();
        }catch(e){ toast(e?.message || "Error saving"); }
      };
      document.getElementById("pfReport").onclick = async () => {
        if(!await confirmAction("Send Report", "Send report to owner?")) return;
        try{
          await db.from("reports").insert({user_id: session.user.id, email: profile?.email || session.user.email, message: "User reported from profile"});
          toast("Report sent to owner");
        }catch(e){ toast(e?.message || "Could not send report"); }
      };
      document.getElementById("pfLogout").onclick = async () => {
        if(!await confirmAction("Log out", "Are you sure you want to log out?")) return;
        modal.remove();
        try{ await db.auth.signOut(); }catch(e){}
        session = null; profile = null; activeTab = "home";
        selSubject = null; selChapter = null;
        localStorage.removeItem("neetrix_session");
        renderAuth();
      };
    }

    /* ===================== 3D ATOM ===================== */
    function initAtom3D(){
      const canvas = document.getElementById("atom3dCanvas");
      const wrap = document.getElementById("atom3dWrap");
      const info = document.getElementById("atomInfo");
      if(!canvas || !wrap) return;
      const loading = wrap.querySelector(".loading-3d");
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
      camera.position.set(0, 0, 8);
      const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      const controls = new THREE.OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 4;
      controls.maxDistance = 15;
      const ambient = new THREE.AmbientLight(0x404060, 0.6);
      scene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5, 5, 5);
      scene.add(dirLight);
      const atomGroup = new THREE.Group();
      scene.add(atomGroup);
      const nucleusGroup = new THREE.Group();
      const protonMat = new THREE.MeshPhongMaterial({color:0xef4444, shininess:80});
      const neutronMat = new THREE.MeshPhongMaterial({color:0x4f8cff, shininess:80});
      const particleGeo = new THREE.SphereGeometry(0.25, 32, 32);
      const positions = [];
      for(let i=0; i<12; i++){
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 0.6 * Math.cbrt(Math.random());
        positions.push({x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi)});
      }
      positions.forEach((pos, i) => {
        const isProton = i % 2 === 0;
        const particle = new THREE.Mesh(particleGeo, isProton ? protonMat : neutronMat);
        particle.position.set(pos.x, pos.y, pos.z);
        nucleusGroup.add(particle);
      });
      atomGroup.add(nucleusGroup);
      const orbitals = {};
      const orbitalMat1s = new THREE.MeshPhongMaterial({color:0x22d3a3, transparent:true, opacity:0.15, side:THREE.DoubleSide});
      const orbitalMat2s = new THREE.MeshPhongMaterial({color:0x22d3a3, transparent:true, opacity:0.12, side:THREE.DoubleSide});
      const orbitalMat2p = new THREE.MeshPhongMaterial({color:0x4f8cff, transparent:true, opacity:0.12, side:THREE.DoubleSide});
      const orbitalMat3s = new THREE.MeshPhongMaterial({color:0xf59e0b, transparent:true, opacity:0.1, side:THREE.DoubleSide});
      const orbitalMat3p = new THREE.MeshPhongMaterial({color:0xf59e0b, transparent:true, opacity:0.1, side:THREE.DoubleSide});
      const orb1s = new THREE.Mesh(new THREE.SphereGeometry(1.8, 48, 48), orbitalMat1s);
      orb1s.userData = {type:"1s", name:"1s Orbital", shape:"Spherical", capacity:2};
      orbitals["1s"] = orb1s;
      atomGroup.add(orb1s);
      const orb2s = new THREE.Mesh(new THREE.SphereGeometry(2.8, 48, 48), orbitalMat2s);
      orb2s.userData = {type:"2s", name:"2s Orbital", shape:"Spherical", capacity:2};
      orbitals["2s"] = orb2s;
      atomGroup.add(orb2s);
      const pGeo = new THREE.CylinderGeometry(0.4, 0.4, 3.5, 32);
      const pSphereGeo = new THREE.SphereGeometry(0.9, 32, 32);
      const createPOrbital = (rotX, rotZ, name) => {
        const group = new THREE.Group();
        const cyl = new THREE.Mesh(pGeo, orbitalMat2p);
        cyl.rotation.x = rotX;
        cyl.rotation.z = rotZ;
        const sph1 = new THREE.Mesh(pSphereGeo, orbitalMat2p);
        sph1.position.set(0, 1.7, 0);
        const sph2 = new THREE.Mesh(pSphereGeo, orbitalMat2p);
        sph2.position.set(0, -1.7, 0);
        group.add(cyl, sph1, sph2);
        group.userData = {type:"2p", name:name, shape:"Dumbbell", capacity:6};
        return group;
      };
      orbitals["2p"] = [
        createPOrbital(Math.PI/2, 0, "2pₓ"),
        createPOrbital(0, Math.PI/2, "2pᵧ"),
        createPOrbital(0, 0, "2p_z")
      ];
      orbitals["2p"].forEach(p => atomGroup.add(p));
      const orb3s = new THREE.Mesh(new THREE.SphereGeometry(3.8, 48, 48), orbitalMat3s);
      orb3s.userData = {type:"3s", name:"3s Orbital", shape:"Spherical", capacity:2};
      orbitals["3s"] = orb3s;
      atomGroup.add(orb3s);
      const pGeo3 = new THREE.CylinderGeometry(0.5, 0.5, 5, 32);
      const pSphereGeo3 = new THREE.SphereGeometry(1.2, 32, 32);
      const createP3Orbital = (rotX, rotZ, name) => {
        const group = new THREE.Group();
        const cyl = new THREE.Mesh(pGeo3, orbitalMat3p);
        cyl.rotation.x = rotX;
        cyl.rotation.z = rotZ;
        const sph1 = new THREE.Mesh(pSphereGeo3, orbitalMat3p);
        sph1.position.set(0, 2.5, 0);
        const sph2 = new THREE.Mesh(pSphereGeo3, orbitalMat3p);
        sph2.position.set(0, -2.5, 0);
        group.add(cyl, sph1, sph2);
        group.userData = {type:"3p", name:name, shape:"Dumbbell", capacity:6};
        return group;
      };
      orbitals["3p"] = [
        createP3Orbital(Math.PI/2, 0, "3pₓ"),
        createP3Orbital(0, Math.PI/2, "3pᵧ"),
        createP3Orbital(0, 0, "3p_z")
      ];
      orbitals["3p"].forEach(p => atomGroup.add(p));
      const electrons = [];
      const electronGeo = new THREE.SphereGeometry(0.12, 24, 24);
      const electronMat = new THREE.MeshPhongMaterial({color:0xfbbf24, emissive:0xfbbf24, emissiveIntensity:0.5});
      const electronConfigs = [
        {orbital:"1s", speed:0.02, radius:1.6},
        {orbital:"1s", speed:0.018, radius:1.6},
        {orbital:"2s", speed:0.015, radius:2.6},
        {orbital:"2s", speed:0.014, radius:2.6},
        {orbital:"2p", speed:0.012, radius:2.2, axis:"x"},
        {orbital:"2p", speed:0.011, radius:2.2, axis:"y"},
        {orbital:"3s", speed:0.01, radius:3.6},
        {orbital:"3p", speed:0.009, radius:3.2, axis:"z"}
      ];
      electronConfigs.forEach((cfg, i) => {
        const electron = new THREE.Mesh(electronGeo, electronMat);
        electron.userData = {orbital: cfg.orbital, speed: cfg.speed, radius: cfg.radius, axis: cfg.axis || "random", angle: Math.random() * Math.PI * 2, incl: (Math.random() - 0.5) * 0.5};
        electrons.push(electron);
        atomGroup.add(electron);
      });
      let autoRotate = true;
      const orbitalSel = document.getElementById("atomOrbitalSel");
      const autoBtn = document.getElementById("atomAutoRotate");
      const resetBtn = document.getElementById("atomReset");
      autoBtn.onclick = () => {
        autoRotate = !autoRotate;
        autoBtn.textContent = `Auto Rotate: ${autoRotate ? "ON" : "OFF"}`;
      };
      resetBtn.onclick = () => {
        controls.reset();
        camera.position.set(0, 0, 8);
      };
      orbitalSel.onchange = () => {
        const sel = orbitalSel.value;
        Object.keys(orbitals).forEach(key => {
          const orbs = Array.isArray(orbitals[key]) ? orbitals[key] : [orbitals[key]];
          orbs.forEach(o => { o.visible = (sel === "all" || key === sel); });
        });
      };
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / canvas.clientHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(atomGroup.children, true);
        if(intersects.length > 0){
          const obj = intersects.object;
          if(obj.userData && obj.userData.name){
            info.innerHTML = `<h4>${escapeHtml(obj.userData.name)}</h4><p><b>Type:</b> ${escapeHtml(obj.userData.type||"")}</p><p><b>Shape:</b> ${escapeHtml(obj.userData.shape||"")}</p><p><b>Capacity:</b> ${escapeHtml(obj.userData.capacity||"")}</p>`;
            info.classList.add("show");
          }else if(obj.material === electronMat){
            info.innerHTML = `<h4>Electron</h4><p><b>Charge:</b> -1e</p><p><b>Mass:</b> 9.11×10⁻³¹ kg</p><p><b>Orbital:</b> ${escapeHtml(obj.userData.orbital||"")}</p>`;
            info.classList.add("show");
          }else{
            info.classList.remove("show");
          }
        }else{
          info.classList.remove("show");
        }
      });
      let frame = 0;
      function animate(){
        requestAnimationFrame(animate);
        frame++;
        if(autoRotate){ atomGroup.rotation.y += 0.002; }
        electrons.forEach(e => {
          e.userData.angle += e.userData.speed;
          const r = e.userData.radius;
          const incl = e.userData.incl;
          if(e.userData.axis === "x"){
            e.position.set(r * Math.cos(e.userData.angle), r * Math.sin(e.userData.angle) * Math.sin(incl), r * Math.sin(e.userData.angle) * Math.cos(incl));
          }else if(e.userData.axis === "y"){
            e.position.set(r * Math.sin(e.userData.angle) * Math.cos(incl), r * Math.cos(e.userData.angle), r * Math.sin(e.userData.angle) * Math.sin(incl));
          }else if(e.userData.axis === "z"){
            e.position.set(r * Math.sin(e.userData.angle) * Math.sin(incl), r * Math.sin(e.userData.angle) * Math.cos(incl), r * Math.cos(e.userData.angle));
          }else{
            e.position.set(r * Math.cos(e.userData.angle) * Math.cos(incl), r * Math.sin(e.userData.angle), r * Math.cos(e.userData.angle) * Math.sin(incl));
          }
        });
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
      function onResize(){
        const w = wrap.clientWidth, h = wrap.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      window.addEventListener("resize", onResize);
      if(loading) loading.remove();
      atom3D = {scene, camera, renderer, controls, atomGroup};
    }

    /* ===================== 3D NERVOUS SYSTEM ===================== */
    function initNerve3D(){
      const canvas = document.getElementById("nerve3dCanvas");
      const wrap = document.getElementById("nerve3dWrap");
      const info = document.getElementById("nerveInfo");
      if(!canvas || !wrap) return;
      const loading = wrap.querySelector(".loading-3d");
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
      camera.position.set(0, 0, 10);
      const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      const controls = new THREE.OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 6;
      controls.maxDistance = 20;
      const ambient = new THREE.AmbientLight(0x404060, 0.5);
      scene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
      dirLight.position.set(5, 5, 5);
      scene.add(dirLight);
      const bodyGroup = new THREE.Group();
      scene.add(bodyGroup);
      const bodyMat = new THREE.MeshPhongMaterial({color:0x1e3a5f, transparent:true, opacity:0.25, side:THREE.DoubleSide});
      const bodyGeo = new THREE.CylinderGeometry(0.8, 1.2, 7, 32);
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.userData = {name:"Human Body", type:"anatomy"};
      bodyGroup.add(body);
      const headGeo = new THREE.SphereGeometry(0.9, 32, 32);
      const head = new THREE.Mesh(headGeo, bodyMat);
      head.position.y = 3.8;
      head.userData = {name:"Head", type:"anatomy"};
      bodyGroup.add(head);
      const brainGroup = new THREE.Group();
      const brainMat = new THREE.MeshPhongMaterial({color:0xd4a5a5, shininess:60});
      const brainL = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), brainMat);
      brainL.position.set(-0.3, 4, 0);
      const brainR = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), brainMat);
      brainR.position.set(0.3, 4, 0);
      const cerebellum = new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 32), brainMat);
      cerebellum.position.set(0, 3.6, -0.3);
      const brainstem = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.6, 16), brainMat);
      brainstem.position.set(0, 3.3, 0);
      brainGroup.add(brainL, brainR, cerebellum, brainstem);
      brainGroup.userData = {name:"Brain", type:"cns", parts:["Cerebrum","Cerebellum","Brainstem"]};
      bodyGroup.add(brainGroup);
      const spineGeo = new THREE.CylinderGeometry(0.12, 0.15, 4.5, 16);
      const spineMat = new THREE.MeshPhongMaterial({color:0xf0a0a0});
      const spine = new THREE.Mesh(spineGeo, spineMat);
      spine.position.y = 1;
      spine.userData = {name:"Spinal Cord", type:"cns"};
      bodyGroup.add(spine);
      const nerveMat = new THREE.LineBasicMaterial({color:0xfbbf24, linewidth:2, transparent:true, opacity:0.8});
      const nerves = [];
      function createNerve(start, end, branches=3){
        const points = [start, end];
        const geom = new THREE.BufferGeometry().setFromPoints(points);
        const nerve = new THREE.Line(geom, nerveMat);
        nerve.userData = {name:"Peripheral Nerve", type:"pns"};
        bodyGroup.add(nerve);
        nerves.push(nerve);
        for(let i=1; i<=branches; i++){
          const t = i / (branches + 1);
          const branchStart = new THREE.Vector3().lerpVectors(start, end, t);
          const angle = (Math.random() - 0.5) * 1.5;
          const len = 0.5 + Math.random() * 0.8;
          const branchEnd = new THREE.Vector3(branchStart.x + Math.sin(angle) * len, branchStart.y - Math.random() * len * 0.5, branchStart.z + Math.cos(angle) * len);
          const branchPoints = [branchStart, branchEnd];
          const branchGeom = new THREE.BufferGeometry().setFromPoints(branchPoints);
          const branch = new THREE.Line(branchGeom, nerveMat);
          branch.userData = {name:"Nerve Branch", type:"pns"};
          bodyGroup.add(branch);
          nerves.push(branch);
        }
      }
      for(let side of [-1, 1]){
        createNerve(new THREE.Vector3(side * 0.2, 2.5, 0), new THREE.Vector3(side * 1.5, 1, 0), 4);
        createNerve(new THREE.Vector3(side * 1.5, 1, 0), new THREE.Vector3(side * 2.2, 0.2, 0), 3);
      }
      for(let side of [-1, 1]){
        createNerve(new THREE.Vector3(side * 0.3, -1, 0), new THREE.Vector3(side * 1, -2.5, 0), 4);
        createNerve(new THREE.Vector3(side * 1, -2.5, 0), new THREE.Vector3(side * 1.5, -3.5, 0), 3);
      }
      for(let i=0; i<5; i++){
        const y = 2 - i * 0.5;
        createNerve(new THREE.Vector3(0, y, 0), new THREE.Vector3(0.8, y - 0.3, 0.5), 2);
        createNerve(new THREE.Vector3(0, y, 0), new THREE.Vector3(-0.8, y - 0.3, 0.5), 2);
      }
      const impulseMat = new THREE.LineBasicMaterial({color:0xffffff, linewidth:3, transparent:true, opacity:0.9});
      const impulses = [];
      function createImpulse(nerve){
        if(!nerve.geometry.attributes.position) return;
        const positions = nerve.geometry.attributes.position.array;
        const start = new THREE.Vector3(positions, positions, positions);[1]
        const end = new THREE.Vector3(positions, positions, positions);
        const impulseGeom = new THREE.BufferGeometry().setFromPoints([start, end]);
        const impulse = new THREE.Line(impulseGeom, impulseMat);
        impulse.userData = {progress:0, direction:1, speed:0.02 + Math.random() * 0.02};
        bodyGroup.add(impulse);
        impulses.push(impulse);
      }
      nerves.forEach(n => { if(Math.random() > 0.3) createImpulse(n); });
      const modeSel = document.getElementById("nerveModeSel");
      const dirBtn = document.getElementById("nerveDirection");
      const resetBtn = document.getElementById("nerveReset");
      let showMode = "full";
      let direction = "both";
      modeSel.onchange = () => {
        showMode = modeSel.value;
        bodyGroup.children.forEach(c => {
          if(c.type === "anatomy"){ c.visible = (showMode !== "cns"); }
          else if(c.type === "cns"){ c.visible = (showMode === "full" || showMode === "cns" || showMode === "anatomy"); }
          else if(c.type === "pns"){ c.visible = (showMode === "full" || showMode === "pns" || showMode === "signal"); }
        });
      };
      dirBtn.onclick = () => {
        if(direction === "both"){ direction = "brain"; dirBtn.textContent = "Direction: Brain→Body"; }
        else if(direction === "brain"){ direction = "body"; dirBtn.textContent = "Direction: Body→Brain"; }
        else{ direction = "both"; dirBtn.textContent = "Direction: Both"; }
      };
      resetBtn.onclick = () => { controls.reset(); camera.position.set(0, 0, 10); };
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / canvas.clientHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(bodyGroup.children, true);
        if(intersects.length > 0){
          const obj = intersects.object;
          if(obj.userData && obj.userData.name){
            let html = `<h4>${escapeHtml(obj.userData.name)}</h4>`;
            if(obj.userData.type === "cns"){ html += `<p><b>Type:</b> Central Nervous System</p>`; if(obj.userData.parts){ html += `<p><b>Parts:</b> ${obj.userData.parts.join(", ")}</p>`; } }
            else if(obj.userData.type === "pns"){ html += `<p><b>Type:</b> Peripheral Nervous System</p>`; }
            else if(obj.userData.type === "anatomy"){ html += `<p><b>Type:</b> Anatomical Structure</p>`; }
            info.innerHTML = html;
            info.classList.add("show");
          }else{ info.classList.remove("show"); }
        }else{ info.classList.remove("show"); }
      });
      function animate(){
        requestAnimationFrame(animate);
        impulses.forEach(imp => {
          imp.userData.progress += imp.userData.speed * imp.userData.direction;
          if(imp.userData.progress >= 1 || imp.userData.progress <= 0){ imp.userData.direction *= -1; }
          const positions = imp.geometry.attributes.position.array;
          const start = new THREE.Vector3(positions, positions, positions);[1]
          const end = new THREE.Vector3(positions, positions, positions);
          const current = new THREE.Vector3().lerpVectors(start, end, imp.userData.progress);
          imp.geometry.setFromPoints([current, current]);
          imp.geometry.attributes.position.needsUpdate = true;
        });
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
      function onResize(){
        const w = wrap.clientWidth, h = wrap.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      window.addEventListener("resize", onResize);
      if(loading) loading.remove();
      nerve3D = {scene, camera, renderer, controls, bodyGroup};
    }

    function pr_drawAnnotations(){
      const anno = document.getElementById("pdfAnnoCanvas");
      if(!anno) return;
      const ctx = anno.getContext("2d");
      ctx.clearRect(0, 0, anno.width, anno.height);
      const strokes = pr.annotations[pr.pageNum] || [];
      strokes.forEach(s => {
        ctx.strokeStyle = s.color;
        ctx.lineWidth = s.width * pr.scale;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.globalAlpha = s.alpha || 1;
        ctx.beginPath();
        s.points.forEach((p, i) => {
          const x = p * pr.scale, y = p * pr.scale;[1]
          if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
    }
    function pr_eraseAt(pos){
      const strokes = pr.annotations[pr.pageNum] || [];
      const idx = strokes.findIndex(s => s.points.some(p => Math.hypot(p-pos, p-pos) < 14/pr.scale));[1]
      if(idx > -1){ strokes.splice(idx, 1); pr_drawAnnotations(); pr_saveAnno(); }
    }
    function pr_undo(){
      const strokes = pr.annotations[pr.pageNum] || [];
      if(!strokes.length) return;
      const s = strokes.pop();
      if(!pr.redoStack[pr.pageNum]) pr.redoStack[pr.pageNum] = [];
      pr.redoStack[pr.pageNum].push(s);
      pr_drawAnnotations();
      pr_saveAnno();
    }
    function pr_redo(){
      const redo = pr.redoStack[pr.pageNum] || [];
      if(!redo.length) return;
      const s = redo.pop();
      if(!pr.annotations[pr.pageNum]) pr.annotations[pr.pageNum] = [];
      pr.annotations[pr.pageNum].push(s);
      pr_drawAnnotations();
      pr_saveAnno();
    }
    function pr_bindDrawing(){
      const anno = document.getElementById("pdfAnnoCanvas");
      let drawing = false, stroke = null;
      const getPos = (e) => {
        const rect = anno.getBoundingClientRect();
        return [(e.clientX - rect.left)/pr.scale, (e.clientY - rect.top)/pr.scale];
      };
      anno.addEventListener("pointerdown", e => {
        if(!pr.tool) return;
        e.preventDefault();
        if(pr.tool === "eraser"){ pr_eraseAt(getPos(e)); return; }
        drawing = true;
        stroke = {color: pr.color, width: pr.tool === "highlighter" ? 18 : 3, alpha: pr.tool === "highlighter" ? 0.35 : 1, points: [getPos(e)]};
        anno.setPointerCapture(e.pointerId);
      });
      anno.addEventListener("pointermove", e => {
        if(!drawing || !stroke) return;
        stroke.points.push(getPos(e));
        pr_drawAnnotations();
        const ctx = anno.getContext("2d");
        ctx.strokeStyle = stroke.color;
        ctx.lineWidth = stroke.width * pr.scale;
        ctx.lineCap = "round";
        ctx.globalAlpha = stroke.alpha;
        ctx.beginPath();
        const pts = stroke.points;
        pts.forEach((p,i) => {
          const x = p*pr.scale, y = p*pr.scale;[1]
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
        ctx.globalAlpha = 1;
      });
      anno.addEventListener("pointerup", e => {
        if(!drawing || !stroke) return;
        drawing = false;
        if(!pr.annotations[pr.pageNum]) pr.annotations[pr.pageNum] = [];
        pr.annotations[pr.pageNum].push(stroke);
        stroke = null;
        pr_drawAnnotations();
        pr_saveAnno();
      });
    }
    async function pr_renderPage(){
      if(!pr) return;
      const page = await pr.pdfDoc.getPage(pr.pageNum);
      const canvas = document.getElementById("pdfCanvas");
      const anno = document.getElementById("pdfAnnoCanvas");
      const wrap = document.getElementById("pdfCanvasWrap");
      if(!canvas || !anno || !wrap) return;
      let scale = pr.scale;
      if(pr.fitMode === "width"){
        const avail = wrap.clientWidth - 32;
        const vp1 = page.getViewport({scale: 1});
        scale = avail / vp1.width;
        pr.scale = scale;
      } else if(pr.fitMode === "page"){
        const availW = wrap.clientWidth - 32;
        const availH = wrap.clientHeight - 32;
        const vp1 = page.getViewport({scale: 1});
        scale = Math.min(availW / vp1.width, availH / vp1.height);
        pr.scale = scale;
      }
      const outputScale = window.devicePixelRatio || 1;
      const viewport = page.getViewport({scale: pr.scale * outputScale});
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = (viewport.width / outputScale) + "px";
      canvas.style.height = (viewport.height / outputScale) + "px";
      anno.width = viewport.width;
      anno.height = viewport.height;
      anno.style.width = canvas.style.width;
      anno.style.height = canvas.style.height;
      const ctx = canvas.getContext("2d");
      await page.render({canvasContext: ctx, viewport, transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null}).promise;
      const textLayerDiv = document.getElementById("pdfTextLayer");
      if(textLayerDiv){
        textLayerDiv.innerHTML = "";
        textLayerDiv.style.width = canvas.style.width;
        textLayerDiv.style.height = canvas.style.height;
        try{
          const textContent = await page.getTextContent();
          await pdfjsLib.renderTextLayer({textContentSource: textContent, container: textLayerDiv, viewport: page.getViewport({scale: pr.scale}), textDivs: []}).promise;
        }catch(e){}
      }
      pr_drawAnnotations();
      const zl = document.getElementById("pdfZoomLabel");
      if(zl) zl.textContent = Math.round(pr.scale * 100) + "%";
      const pi = document.getElementById("pdfPageInput");
      if(pi) pi.value = pr.pageNum;
      const pt = document.getElementById("pdfPageTotal");
      if(pt) pt.textContent = pr.totalPages;
      const bm = pr.bookmarks[pr.pageNum];
      const bb = document.getElementById("pdfBookmarkPage");
      if(bb){ bb.textContent = bm ? "★" : "☆"; bb.classList.toggle("active-tool", !!bm); }
      const infoPage = document.getElementById("pdfInfoPage");
      if(infoPage) infoPage.textContent = `Page ${pr.pageNum} / ${pr.totalPages}`;
      lsSet("pdfprog_" + pr.storageKey, {page: pr.pageNum, scale: pr.fitMode === "width" || pr.fitMode === "page" ? null : pr.scale});
    }

          <div class="pdf-color" style="background:#ffffff" data-c="#ffffff"></div>
          <button class="pdf-tbtn" id="toolUndo">↺</button>

          <button class="pdf-tbtn" id="pdfNext">›</button>

          <div class="pdf-panel-tabs">

            <button class="pdf-panel-tab" data-pt="notes">Notes</button>

      document.body.appendChild(modal);

      canvasWrap.addEventListener("touchend", e => {
        const dx = e.changedTouches.screenX - touchStartX;
        if(Math.abs(dx) > 70){ if(dx < 0) pr_goToPage(pr.pageNum + 1); else pr_goToPage(pr.pageNum - 1); }
      }, {passive:true});
      try{
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
        const pdfDoc = await pdfjsLib.getDocument({url, withCredentials:false}).promise;
        const progress = lsGet("pdfprog_" + storageKey, {page:1, scale:null});
        const bookmarks = lsGet("pdfpagebm_" + storageKey, {});
        const annotations = lsGet("pdfanno_" + storageKey, {});
        pr = {pdfDoc, pageNum: Math.min(progress.page || 1, pdfDoc.numPages), totalPages: pdfDoc.numPages, scale: progress.scale || 1, fitMode: progress.scale ? "custom" : "width", storageKey, annotations, bookmarks, redoStack: {}, tool: null, color: "#5b9dff", width: 3, hideTimer: null, searchMatches: [], searchIndex: -1, originalUrl: url, title: title || "Document"};
        await pr_renderPage();
        pr_bindDrawing();
        if(progress.page && progress.page > 1){ pr_toast("Resumed from page " + progress.page); }
      }catch(e){
        modal.remove();
        pr = null;
        toast(e?.message || "Unable to load PDF");
        return;
      }
      document.getElementById("pdfClose").onclick = () => { if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); modal.remove(); pr = null; };
      document.getElementById("pdfZoomIn").onclick = () => { pr.fitMode = "custom"; pr.scale = Math.min(4, pr.scale + 0.25); pr_renderPage(); };
      document.getElementById("pdfZoomOut").onclick = () => { pr.fitMode = "custom"; pr.scale = Math.max(0.4, pr.scale - 0.25); pr_renderPage(); };
      document.getElementById("pdfFitWidth").onclick = () => { pr.fitMode = "width"; pr_renderPage(); };
      document.getElementById("pdfFitPage").onclick = () => { pr.fitMode = "page"; pr_renderPage(); };
      document.getElementById("pdfPrev").onclick = () => pr_goToPage(pr.pageNum - 1);
      document.getElementById("pdfNext").onclick = () => pr_goToPage(pr.pageNum + 1);
      document.getElementById("pdfPageInput").onchange = e => pr_goToPage(parseInt(e.target.value) || 1);
      document.getElementById("pdfBookmarkPage").onclick = () => {
        if(pr.bookmarks[pr.pageNum]){ delete pr.bookmarks[pr.pageNum]; pr_toast("Bookmark removed"); }
        else { pr.bookmarks[pr.pageNum] = {label: "Page " + pr.pageNum, at: Date.now()}; pr_toast("Page bookmarked"); }
        lsSet("pdfpagebm_" + pr.storageKey, pr.bookmarks);
        pr_renderPage();
      };
      document.getElementById("pdfAnnoToggle").onclick = () => {
        const bar = document.getElementById("pdfAnnoBar");
        const showing = bar.style.display !== "none";
        bar.style.display = showing ? "none" : "flex";
        document.getElementById("pdfAnnoToggle").classList.toggle("active-tool", !showing);
        if(showing){ pr.tool = null; pr_setToolActive(false); pr_highlightToolBtn(null); }
      };
      document.getElementById("toolPen").onclick = () => { pr.tool = "pen"; pr_setToolActive(true); pr_highlightToolBtn("toolPen"); };
      document.getElementById("toolHi").onclick = () => { pr.tool = "highlighter"; pr_setToolActive(true); pr_highlightToolBtn("toolHi"); };
      document.getElementById("toolEraser").onclick = () => { pr.tool = "eraser"; pr_setToolActive(true); pr_highlightToolBtn("toolEraser"); };
      document.getElementById("toolUndo").onclick = pr_undo;
      document.getElementById("toolRedo").onclick = pr_redo;
      document.querySelectorAll(".pdf-color").forEach(sw => {
        sw.onclick = () => {
          pr.color = sw.dataset.c;
          document.querySelectorAll(".pdf-color").forEach(x => x.classList.remove("selected"));
          sw.classList.add("selected");
        };
      });
      document.getElementById("pdfPanelBtn").onclick = () => {
        const panel = document.getElementById("pdfPanel");
        panel.classList.toggle("open");
        if(panel.classList.contains("open")) pr_renderPanel("pages");
      };
      document.querySelectorAll(".pdf-panel-tab").forEach(t => {
        t.onclick = () => {
          document.querySelectorAll(".pdf-panel-tab").forEach(x => x.classList.remove("active"));
          t.classList.add("active");
          pr_renderPanel(t.dataset.pt);
        };
      });
      document.getElementById("pdfFullscreenBtn").onclick = async () => { try{ if(!document.fullscreenElement) await modal.requestFullscreen(); else await document.exitFullscreen(); }catch(e){} };
      document.getElementById("pdfDownload").onclick = () => { const a = document.createElement("a"); a.href = pr.originalUrl; a.download = (title || "document") + ".pdf"; a.target = "_blank"; a.click(); };
      document.getElementById("pdfSearchBtn").onclick = () => { const bar = document.getElementById("pdfSearchBar"); bar.style.display = bar.style.display === "none" ? "flex" : "none"; if(bar.style.display === "flex") document.getElementById("pdfSearchInput").focus(); };
      document.getElementById("pdfSearchClose").onclick = () => { document.getElementById("pdfSearchBar").style.display = "none"; };
      let searchTimeout;
      document.getElementById("pdfSearchInput").oninput = (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(async () => {
          const q = e.target.value.trim().toLowerCase();
          pr.searchMatches = [];
          pr.searchIndex = -1;
          if(!q){ document.getElementById("pdfSearchCount").textContent = ""; return; }
          for(let i=1; i<=pr.totalPages; i++){
            const page = await pr.pdfDoc.getPage(i);
            const tc = await page.getTextContent();
            const text = tc.items.map(it => it.str).join(" ").toLowerCase();
            if(text.includes(q)) pr.searchMatches.push(i);
          }
          document.getElementById("pdfSearchCount").textContent = pr.searchMatches.length ? `1/${pr.searchMatches.length}` : "0 found";
          if(pr.searchMatches.length){ pr.searchIndex = 0; pr_goToPage(pr.searchMatches); }
        }, 450);
      };
      document.getElementById("pdfSearchNext").onclick = () => {
        if(!pr.searchMatches.length) return;
        pr.searchIndex = (pr.searchIndex + 1) % pr.searchMatches.length;
        pr_goToPage(pr.searchMatches[pr.searchIndex]);
        document.getElementById("pdfSearchCount").textContent = `${pr.searchIndex+1}/${pr.searchMatches.length}`;
      };
      document.getElementById("pdfSearchPrev").onclick = () => {
        if(!pr.searchMatches.length) return;
        pr.searchIndex = (pr.searchIndex - 1 + pr.searchMatches.length) % pr.searchMatches.length;
        pr_goToPage(pr.searchMatches[pr.searchIndex]);
        document.getElementById("pdfSearchCount").textContent = `${pr.searchIndex+1}/${pr.searchMatches.length}`;
      };
      document.getElementById("pdfCanvasWrap").addEventListener("pointerdown", () => {
        document.getElementById("pdfToolbar")?.classList.remove("hidden");
        document.getElementById("pdfPagebar")?.classList.remove("hidden");
        pr_scheduleHide();
      });
      window.addEventListener("resize", () => { if(pr && (pr.fitMode === "width" || pr.fitMode === "page")) pr_renderPage(); });
    }

    /* ===================== BOOKMARKS ===================== */
    async function renderBookmarks(c){
