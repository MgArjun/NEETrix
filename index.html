<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NEETrix</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060912;--panel:#0f1524;--panel2:#151d30;--border:#243049;
  --text:#eef2fb;--muted:#8b97b3;--accent:#5b9dff;--accent2:#6b7cff;
  --green:#3dd68c;--danger:#ef5a5a;--warn:#f0b429;--shadow:0 8px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{min-height:100vh;padding-bottom:52px}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit;transition:border-color .2s ease,box-shadow .2s ease}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,157,255,.12)}
textarea{min-height:90px;resize:vertical}
button{cursor:pointer;font-family:inherit;transition:all .22s cubic-bezier(.25,.8,.25,1)}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 4px 14px rgba(91,157,255,.25)}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(91,157,255,.35)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:9px;font-size:13px}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-outline:active{transform:scale(.97)}
.btn-danger{background:var(--danger);border:none;color:#fff;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600}
.btn-good{background:var(--green);border:none;color:#06281a;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600}
.btn-warn{background:var(--warn);border:none;color:#3a2a00;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600}
.btn-small{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:7px;font-size:12px}
.btn-small:active{transform:scale(.96)}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,#121a2e 0%,var(--bg) 70%)}
.auth-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:36px 32px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.brand{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13.5px;margin:8px 0 22px}
.msg{font-size:12.5px;margin:-4px 0 12px;min-height:16px}
.link{color:var(--accent);background:none;border:none;font-size:13px;text-align:center;width:100%;margin-top:10px}

.topbar{display:flex;align-items:center;gap:4px;padding:10px 14px;border-bottom:1px solid var(--border);background:rgba(15,21,36,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow-x:auto;position:sticky;top:0;z-index:50}
.topbar .brand{font-size:17px;margin:0;flex-shrink:0;margin-right:6px}
.navbtn{background:none;border:1px solid transparent;color:var(--muted);padding:7px 12px;border-radius:8px;font-size:12.5px;white-space:nowrap;transition:color .2s ease,background .2s ease,border-color .2s ease,transform .18s ease}
.navbtn:hover{color:var(--text)}
.navbtn.active{background:var(--panel2);color:var(--text);border-color:var(--border)}
.navbtn:active{transform:scale(.96)}
.spacer{flex:1;min-width:8px}
.profile-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}

.content{max-width:920px;margin:0 auto;padding:22px 16px 40px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;transition:transform .22s cubic-bezier(.25,.8,.25,1),border-color .22s ease,box-shadow .22s ease}
.card:hover{border-color:rgba(91,157,255,.35)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.subject-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 18px;cursor:pointer;transition:transform .25s cubic-bezier(.25,.8,.25,1),border-color .25s ease,box-shadow .25s ease}
.subject-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 28px rgba(0,0,0,.28)}
.subject-card:active{transform:scale(.97)}
.subject-card h3{margin:0;font-size:15.5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row-wrap{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.muted{color:var(--muted);font-size:12.5px}
.badge{font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--muted)}
.badge.admin{color:var(--accent);border-color:var(--accent)}
.back{background:none;border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;font-size:12.5px;margin-bottom:16px}
.tabs2{display:flex;gap:6px;margin:12px 0 16px;flex-wrap:wrap}
.tab2{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:8px 15px;border-radius:9px;font-size:12.5px;transition:all .2s ease}
.tab2.active{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.tab2:active{transform:scale(.96)}
h2{font-size:20px;margin:2px 0 10px;font-weight:700}
h3{font-size:15px;margin:16px 0 10px;font-weight:600}
.empty{color:var(--muted);font-size:13.5px;padding:32px 0;text-align:center}

.home-hero{text-align:center;padding:28px 16px;background:linear-gradient(180deg,rgba(91,157,255,.08) 0%,transparent 100%);border:1px solid var(--border);border-radius:20px;margin-bottom:18px}
.welcome{font-size:22px;font-weight:700;margin-bottom:4px}
.progress-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px;cursor:pointer;transition:transform .2s ease}
.progress-box:active{transform:scale(.98)}
.progress-bar-bg{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-bottom:10px}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:4px;transition:width .7s cubic-bezier(.25,.8,.25,1)}
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:600px){.home-grid{grid-template-columns:1fr}}
.home-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px 14px;text-align:center;cursor:pointer;transition:transform .25s cubic-bezier(.25,.8,.25,1),border-color .25s ease,box-shadow .25s ease}
.home-card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 14px 32px rgba(0,0,0,.3)}
.home-card:active{transform:scale(.97)}
.home-card .icon{font-size:28px;margin-bottom:8px}
.home-card h3{margin:0 0 4px;font-size:15px}

.powered{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);padding:11px 0;background:rgba(6,9,18,.94);border-top:1px solid rgba(36,48,73,.6);z-index:40}

.yt-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden;background:#000;margin-bottom:14px;border:1px solid var(--border)}
.yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:11.5px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px;animation:fadeIn .22s ease both}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:22px;animation:modalPop .28s cubic-bezier(.25,.8,.25,1) both}
.modal-close{background:none;border:none;color:var(--muted);float:right;font-size:24px;line-height:1}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalPop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}

.timer{font-size:22px;font-weight:800;color:var(--warn);text-align:center;padding:12px;background:var(--panel2);border-radius:10px;margin-bottom:12px}
.cbt-layout{display:grid;grid-template-columns:1fr 220px;gap:16px}
@media(max-width:720px){.cbt-layout{grid-template-columns:1fr}}
.cbt-qbox{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}
.cbt-palette{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:70px}
.cbt-palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.cbt-pbtn{width:100%;aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:12px;font-weight:600}
.cbt-pbtn.answered{background:rgba(91,157,255,.2);border-color:var(--accent);color:var(--accent)}
.cbt-pbtn.marked{background:rgba(240,180,41,.2);border-color:var(--warn);color:var(--warn)}
.cbt-pbtn.current{outline:2px solid var(--green)}
.cbt-opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;transition:all .18s ease}
.cbt-opt.selected{border-color:var(--accent);background:rgba(91,157,255,.12)}
.cbt-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.score-card{text-align:center;padding:28px 16px}
.score-num{font-size:48px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.profile-field{margin-bottom:14px}
.profile-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.q-img{max-width:100%;border-radius:10px;margin:10px 0;border:1px solid var(--border)}

.skel{background:linear-gradient(90deg,var(--panel2) 25%,rgba(255,255,255,.05) 37%,var(--panel2) 63%);background-size:400% 100%;animation:skelShine 1.5s ease infinite;border-radius:12px}
@keyframes skelShine{0%{background-position:100% 0}100%{background-position:0 0}}
.skel-card{height:64px;margin-bottom:10px}
.skel-subj{height:74px;border-radius:14px}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.page-fade{animation:fadeSlideIn .35s cubic-bezier(.25,.8,.25,1) both}

.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(10px);background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:10px;font-size:12.5px;opacity:0;transition:opacity .28s ease,transform .28s cubic-bezier(.25,.8,.25,1);z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* PDF Reader */
.pdf-modal{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column}
.pdf-toolbar{display:flex;align-items:center;gap:6px;padding:10px 12px;background:rgba(15,21,36,.97);border-bottom:1px solid var(--border);z-index:5}
.pdf-tbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s ease,background .2s ease,border-color .2s ease}
.pdf-tbtn:active{transform:scale(.9)}
.pdf-tbtn.active-tool{background:var(--accent);border-color:var(--accent);color:#fff}
.pdf-title{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding:0 6px}
.pdf-tools{display:flex;align-items:center;gap:5px;flex-shrink:0;overflow-x:auto}
.pdf-zoom-label{font-size:11.5px;color:var(--muted);min-width:36px;text-align:center}
.pdf-canvas-wrap{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:12px;position:relative;-webkit-overflow-scrolling:touch}
.pdf-canvas-stack{position:relative;flex-shrink:0}
.pdf-canvas-stack canvas{display:block}
#pdfAnnoCanvas{position:absolute;top:0;left:0;touch-action:none}
#pdfAnnoCanvas.tool-active{pointer-events:auto}
.pdf-pagebar{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;background:rgba(15,21,36,.97);border-top:1px solid var(--border);z-index:5}
.pdf-pagebar input{width:52px;text-align:center;margin:0;padding:6px}
.pdf-annobar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(15,21,36,.97);border-top:1px solid var(--border);overflow-x:auto}
.pdf-color{width:24px;height:24px;border-radius:50%;border:2px solid transparent;flex-shrink:0;transition:transform .15s ease}
.pdf-color.selected{border-color:#fff;transform:scale(1.12)}
.pdf-panel{position:absolute;right:0;top:0;bottom:0;width:280px;max-width:82vw;background:var(--panel);border-left:1px solid var(--border);z-index:10;transform:translateX(100%);transition:transform .25s ease;overflow:auto}
.pdf-panel.open{transform:translateX(0)}
.pdf-panel-tabs{display:flex;border-bottom:1px solid var(--border)}
.pdf-panel-tab{flex:1;padding:12px;text-align:center;font-size:12px;color:var(--muted);background:none;border:none}
.pdf-panel-tab.active{color:var(--accent);border-bottom:2px solid var(--accent)}
.pdf-panel-body{padding:10px}
.pdf-panel-item{padding:10px;border-radius:9px;background:var(--panel2);margin-bottom:8px;font-size:12.5px;cursor:pointer}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>

<div id="app"></div>
<div class="powered"><span>Powered by Suraj Kumar</span></div>

<script>
const SUPABASE_URL = "https://qhggamgxfwlwtpmwxfwk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_X9_aDiQcrKhYyPfuQdnKPA_K8F7RPjM";

let db=null,session=null,profile=null,activeTab="home";
let selSubject=null,selChapter=null,selCategory="general",adminTab="dashboard";
let cbtTest=null,cbtQuestions=[],cbtAnswers={},cbtMarked=new Set(),cbtIndex=0,cbtTimerRef=null,cbtRemaining=0;
let pr=null;

const app=document.getElementById("app");

function escapeHtml(v){return(v??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild}
function fmtDate(iso){if(!iso)return"";const d=new Date(iso);if(Number.isNaN(d.getTime()))return"";return d.toLocaleString(undefined,{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function ytId(url){const m=(url||"").match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null}
function showFatalError(m){document.body.innerHTML=`<div style="min-height:100vh;background:#060912;color:#fff;padding:24px"><div style="max-width:700px;margin:40px auto;background:#0f1524;border:1px solid #243049;border-radius:14px;padding:24px"><h2 style="color:#ef5a5a">NEETrix Error</h2><div style="color:#c5cada;line-height:1.6;white-space:pre-wrap">${escapeHtml(m)}</div></div></div>`}
function getLastScore(){try{return JSON.parse(localStorage.getItem("neetrix_last_score")||"null")}catch(e){return null}}
function saveLastScore(obj){try{localStorage.setItem("neetrix_last_score",JSON.stringify(obj))}catch(e){}}
function lsGet(key,fallback){try{const v=localStorage.getItem(key);return v!=null?JSON.parse(v):fallback}catch(e){return fallback}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function skelList(n,cls){let h="";for(let i=0;i<n;i++)h+=`<div class="skel ${cls||"skel-card"}"></div>`;return h}
function toast(msg,ms=2500){let t=document.getElementById("globalToast");if(!t){t=el(`<div class="toast" id="globalToast"></div>`);document.body.appendChild(t)}t.textContent=msg;t.classList.add("show");clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove("show"),ms)}
function confirmAction(title,message){return new Promise(resolve=>{const modal=el(`<div class="modal-bg"><div class="modal-box" style="max-width:420px"><h3 style="margin-bottom:10px">${escapeHtml(title)}</h3><p class="muted" style="line-height:1.55;margin-bottom:18px;white-space:pre-wrap">${escapeHtml(message)}</p><div style="display:flex;gap:10px"><button class="btn-outline" style="flex:1" id="cNo">Cancel</button><button class="btn-danger" style="flex:1" id="cYes">Confirm</button></div></div></div>`);document.body.appendChild(modal);document.getElementById("cNo").onclick=()=>{modal.remove();resolve(false)};document.getElementById("cYes").onclick=()=>{modal.remove();resolve(true)};modal.onclick=e=>{if(e.target===modal){modal.remove();resolve(false)}}})}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error("Failed: "+src));document.head.appendChild(s)})}
async function loadSupabase(){if(window.supabase)return true;const srcs=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"];for(const s of srcs){try{await loadScript(s);if(window.supabase)return true}catch(e){}}throw new Error("Supabase load failed")}
async function loadPdfJs(){if(window.pdfjsLib)return true;const srcs=["https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js","https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"];for(const s of srcs){try{await loadScript(s);if(window.pdfjsLib)return true}catch(e){}}return false}

async function initializeApp(){try{await loadSupabase();db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);loadPdfJs().catch(()=>{});await boot()}catch(e){console.error(e);showFatalError(e?.message||"Could not start")}}

function renderAuth(mode="login"){if(!app)return;app.innerHTML="";app.appendChild(el(`<div class="auth-wrap"><div class="auth-card"><div class="brand">NEETrix</div><div class="sub">The focused way to prepare.</div><div class="msg" id="msg"></div><div id="fields"></div><button class="btn" style="width:100%" id="mainBtn"></button><button class="link" id="link1"></button><button class="link" id="link2" style="display:none"></button></div></div>`));
const fields=document.getElementById("fields"),mainBtn=document.getElementById("mainBtn"),link1=document.getElementById("link1"),link2=document.getElementById("link2"),msg=document.getElementById("msg");
if(mode==="login"||mode==="signup"){fields.innerHTML=`<input id="email" type="email" placeholder="Email address" autocomplete="email"/><input id="pass" type="password" placeholder="Password (8+ characters)" autocomplete="${mode==="login"?"current-password":"new-password"}"/>`;mainBtn.textContent=mode==="login"?"Log in":"Create account";link1.textContent=mode==="login"?"New here? Create an account":"Already have an account? Log in";link1.onclick=()=>renderAuth(mode==="login"?"signup":"login");link2.style.display=mode==="login"?"block":"none";link2.textContent="Forgot password?";link2.onclick=()=>renderAuth("forgot");
mainBtn.onclick=async()=>{msg.textContent="";mainBtn.disabled=true;const email=document.getElementById("email").value.trim(),pass=document.getElementById("pass").value;if(!email||!pass){msg.style.color="var(--muted)";msg.textContent="Enter both fields.";mainBtn.disabled=false;return}try{if(mode==="signup"){const{error}=await db.auth.signUp({email,password:pass});if(error)throw error;msg.style.color="var(--green)";msg.textContent="Account created! Check email if needed, then log in.";setTimeout(()=>renderAuth("login"),1800)}else{const{data,error}=await db.auth.signInWithPassword({email,password:pass});if(error)throw error;session=data.session;await afterLogin()}}catch(e){msg.style.color="var(--danger)";msg.textContent=e?.message||"Something went wrong"}finally{mainBtn.disabled=false}}}
else{fields.innerHTML=`<input id="email" type="email" placeholder="Email address"/>`;mainBtn.textContent="Send reset link";link1.textContent="Back to log in";link1.onclick=()=>renderAuth("login");mainBtn.onclick=async()=>{msg.textContent="";mainBtn.disabled=true;const email=document.getElementById("email").value.trim();if(!email){msg.style.color="var(--muted)";msg.textContent="Enter email";mainBtn.disabled=false;return}try{const{error}=await db.auth.resetPasswordForEmail(email);if(error)throw error;msg.style.color="var(--green)";msg.textContent="Reset link sent"}catch(e){msg.style.color="var(--danger)";msg.textContent=e?.message||"Error"}finally{mainBtn.disabled=false}}}}

/* ===== FIXED PDF ANNOTATION ===== */
function pr_toast(msg){const t=document.getElementById("pdfToast");if(!t)return;t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}
function pr_saveAnno(){lsSet("pdfanno_"+pr.storageKey,pr.annotations)}
function pr_drawAnnotations(){const anno=document.getElementById("pdfAnnoCanvas");if(!anno||!pr)return;const ctx=anno.getContext("2d");ctx.clearRect(0,0,anno.width,anno.height);const strokes=pr.annotations[pr.pageNum]||[];strokes.forEach(s=>{ctx.strokeStyle=s.color;ctx.lineWidth=s.width*pr.scale;ctx.lineCap="round";ctx.lineJoin="round";ctx.globalAlpha=s.alpha||1;ctx.beginPath();s.points.forEach((p,i)=>{const x=p[0]*pr.scale,y=p[1]*pr.scale;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()});ctx.globalAlpha=1}
function pr_eraseAt(pos){const strokes=pr.annotations[pr.pageNum]||[];const threshold=16/pr.scale;const idx=strokes.findIndex(s=>s.points.some(p=>Math.hypot(p[0]-pos[0],p[1]-pos[1])<threshold));if(idx>-1){strokes.splice(idx,1);pr_drawAnnotations();pr_saveAnno()}}
function pr_undo(){const strokes=pr.annotations[pr.pageNum]||[];if(!strokes.length)return;const s=strokes.pop();if(!pr.redoStack[pr.pageNum])pr.redoStack[pr.pageNum]=[];pr.redoStack[pr.pageNum].push(s);pr_drawAnnotations();pr_saveAnno()}
function pr_redo(){const redo=pr.redoStack[pr.pageNum]||[];if(!redo.length)return;const s=redo.pop();if(!pr.annotations[pr.pageNum])pr.annotations[pr.pageNum]=[];pr.annotations[pr.pageNum].push(s);pr_drawAnnotations();pr_saveAnno()}

function pr_bindDrawing(){
  const anno=document.getElementById("pdfAnnoCanvas");if(!anno)return;
  let drawing=false,stroke=null;
  const getPos=e=>{const rect=anno.getBoundingClientRect();return[(e.clientX-rect.left)/pr.scale,(e.clientY-rect.top)/pr.scale]};
  const onDown=e=>{if(!pr.tool)return;e.preventDefault();e.stopPropagation();if(pr.tool==="eraser"){pr_eraseAt(getPos(e));return}drawing=true;stroke={color:pr.color,width:pr.tool==="highlighter"?15:2.5,alpha:pr.tool==="highlighter"?0.3:1,points:[getPos(e)]};try{anno.setPointerCapture(e.pointerId)}catch(err){}};
  const onMove=e=>{if(!drawing||!stroke)return;e.preventDefault();stroke.points.push(getPos(e));pr_drawAnnotations();const ctx=anno.getContext("2d");ctx.strokeStyle=stroke.color;ctx.lineWidth=stroke.width*pr.scale;ctx.lineCap="round";ctx.lineJoin="round";ctx.globalAlpha=stroke.alpha;ctx.beginPath();stroke.points.forEach((p,i)=>{const x=p[0]*pr.scale,y=p[1]*pr.scale;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.globalAlpha=1};
  const onUp=e=>{if(!drawing||!stroke)return;drawing=false;if(!pr.annotations[pr.pageNum])pr.annotations[pr.pageNum]=[];pr.annotations[pr.pageNum].push(stroke);stroke=null;pr_drawAnnotations();pr_saveAnno()};
  anno.addEventListener("pointerdown",onDown);anno.addEventListener("pointermove",onMove);anno.addEventListener("pointerup",onUp);anno.addEventListener("pointercancel",onUp);
}

async function pr_renderPage(){
  if(!pr)return;const page=await pr.pdfDoc.getPage(pr.pageNum);const canvas=document.getElementById("pdfCanvas");const anno=document.getElementById("pdfAnnoCanvas");const wrap=document.getElementById("pdfCanvasWrap");if(!canvas||!anno||!wrap)return;
  if(pr.fitMode==="width"){const avail=wrap.clientWidth-24;const vp1=page.getViewport({scale:1});pr.scale=avail/vp1.width}
  else if(pr.fitMode==="page"){const availW=wrap.clientWidth-24;const availH=wrap.clientHeight-24;const vp1=page.getViewport({scale:1});pr.scale=Math.min(availW/vp1.width,availH/vp1.height)}
  const dpr=window.devicePixelRatio||1;const viewport=page.getViewport({scale:pr.scale*dpr});
  canvas.width=viewport.width;canvas.height=viewport.height;canvas.style.width=(viewport.width/dpr)+"px";canvas.style.height=(viewport.height/dpr)+"px";
  const displayW=viewport.width/dpr,displayH=viewport.height/dpr;anno.width=displayW;anno.height=displayH;anno.style.width=displayW+"px";anno.style.height=displayH+"px";
  await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise;pr_drawAnnotations();
  const zl=document.getElementById("pdfZoomLabel");if(zl)zl.textContent=Math.round(pr.scale*100)+"%";
  const pi=document.getElementById("pdfPageInput");if(pi)pi.value=pr.pageNum;const pt=document.getElementById("pdfPageTotal");if(pt)pt.textContent=pr.totalPages;
  const bm=pr.bookmarks[pr.pageNum];const bb=document.getElementById("pdfBookmarkPage");if(bb){bb.textContent=bm?"★":"☆";bb.classList.toggle("active-tool",!!bm)}
  lsSet("pdfprog_"+pr.storageKey,{page:pr.pageNum,scale:(pr.fitMode==="width"||pr.fitMode==="page")?null:pr.scale});
}

async function pr_goToPage(n){if(!pr)return;n=Math.max(1,Math.min(pr.totalPages,n));pr.pageNum=n;await pr_renderPage()}
function pr_renderPanel(tab){const body=document.getElementById("pdfPanelBody");if(!body)return;if(tab==="pages"){let h="";for(let i=1;i<=pr.totalPages;i++)h+=`<div class="pdf-panel-item" data-p="${i}">Page ${i}${pr.bookmarks[i]?" ★":""}</div>`;body.innerHTML=h}else if(tab==="bookmarks"){const keys=Object.keys(pr.bookmarks);if(!keys.length){body.innerHTML=`<div class="empty">No bookmarks</div>`;return}body.innerHTML=keys.map(k=>`<div class="pdf-panel-item" data-p="${k}">Page ${k}</div>`).join("")}else{const keys=Object.keys(pr.annotations).filter(k=>(pr.annotations[k]||[]).length);if(!keys.length){body.innerHTML=`<div class="empty">No notes</div>`;return}body.innerHTML=keys.map(k=>`<div class="pdf-panel-item" data-p="${k}">Page ${k} · ${pr.annotations[k].length} strokes</div>`).join("")}body.querySelectorAll(".pdf-panel-item").forEach(it=>{it.onclick=()=>{pr_goToPage(parseInt(it.dataset.p));document.getElementById("pdfPanel")?.classList.remove("open")}})}

async function openPdfReader(url,title,storageKeyRaw){
  if(!window.pdfjsLib)await loadPdfJs();if(!window.pdfjsLib){toast("PDF viewer failed");return}
  const storageKey=encodeURIComponent(storageKeyRaw||url).slice(0,180);
  const modal=el(`<div class="pdf-modal" id="pdfModal">
    <div class="pdf-toolbar"><button class="pdf-tbtn" id="pdfClose" style="color:#ff6b6b">✕</button><div class="pdf-title">${escapeHtml(title||"")}</div>

      <button class="pdf-tbtn" id="pdfZoomOut" style="color:#74c0fc">−</button><span class="pdf-zoom-label" id="pdfZoomLabel">100%</span><button class="pdf-tbtn" id="pdfZoomIn" style="color:#74c0fc">+</button>
      <button class="pdf-tbtn" id="pdfFitWidth" style="color:#69db7c">↔</button><button class="pdf-tbtn" id="pdfFitPage" style="color:#69db7c">⤢</button>

      <button class="pdf-tbtn" id="pdfAnnoToggle" style="color:#da77f2">✎</button><button class="pdf-tbtn" id="pdfDownload" style="color:#4dabf7">⬇</button>
      <button class="pdf-tbtn" id="pdfPanelBtn" style="color:#adb5bd">☰</button><button class="pdf-tbtn" id="pdfFullscreenBtn" style="color:#adb5bd">⛶</button>
    </div></div>
    <div id="pdfSearchBar" style="display:none;padding:8px 12px;background:rgba(15,21,36,.97);border-bottom:1px solid var(--border);gap:8px;align-items:center">
      <input id="pdfSearchInput" placeholder="Search in PDF..." style="margin:0;flex:1"/><button class="pdf-tbtn" id="pdfSearchPrev">‹</button><button class="pdf-tbtn" id="pdfSearchNext">›</button>
      <span class="muted" id="pdfSearchCount" style="font-size:12px;min-width:50px"></span><button class="pdf-tbtn" id="pdfSearchClose">✕</button>
    </div>
    <div class="pdf-canvas-wrap" id="pdfCanvasWrap"><div class="pdf-canvas-stack"><canvas id="pdfCanvas"></canvas><canvas id="pdfAnnoCanvas"></canvas></div></div>
    <div class="pdf-annobar" id="pdfAnnoBar" style="display:none">
      <button class="pdf-tbtn" id="toolPen" style="color:#74c0fc">✎</button><button class="pdf-tbtn" id="toolHi" style="color:#ffd43b">▮</button><button class="pdf-tbtn" id="toolEraser" style="color:#ff8787">⌫</button>
      <div class="pdf-color selected" style="background:#5b9dff" data-c="#5b9dff"></div><div class="pdf-color" style="background:#f0b429" data-c="#f0b429"></div>
      <div class="pdf-color" style="background:#3dd68c" data-c="#3dd68c"></div><div class="pdf-color" style="background:#ef5a5a" data-c="#ef5a5a"></div><div class="pdf-color" style="background:#ffffff" data-c="#ffffff"></div>
      <button class="pdf-tbtn" id="toolUndo" style="color:#adb5bd">↺</button><button class="pdf-tbtn" id="toolRedo" style="color:#adb5bd">↻</button>
    </div>
    <div class="pdf-pagebar"><button class="pdf-tbtn" id="pdfPrev">‹</button><input id="pdfPageInput" type="number" min="1"/><span class="muted">/ <span id="pdfPageTotal"></span></span><button class="pdf-tbtn" id="pdfNext">›</button></div>
    <div class="pdf-panel" id="pdfPanel"><div class="pdf-panel-tabs"><button class="pdf-panel-tab active" data-pt="pages">Pages</button><button class="pdf-panel-tab" data-pt="bookmarks">Bookmarks</button><button class="pdf-panel-tab" data-pt="notes">Notes</button></div><div class="pdf-panel-body" id="pdfPanelBody"></div></div>
    <div class="toast" id="pdfToast"></div>
  </div>`);
  document.body.appendChild(modal);

  let touchStartX=0;const wrap=document.getElementById("pdfCanvasWrap");
  wrap.addEventListener("touchstart",e=>{touchStartX=e.changedTouches[0].screenX},{passive:true});
  wrap.addEventListener("touchend",e=>{const dx=e.changedTouches[0].screenX-touchStartX;if(Math.abs(dx)>70){if(dx<0)pr_goToPage(pr.pageNum+1);else pr_goToPage(pr.pageNum-1)}},{passive:true});

  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    const pdfDoc=await pdfjsLib.getDocument({url,withCredentials:false}).promise;
    const progress=lsGet("pdfprog_"+storageKey,{page:1,scale:null});
    const bookmarks=lsGet("pdfpagebm_"+storageKey,{});
    const annotations=lsGet("pdfanno_"+storageKey,{});
    pr={pdfDoc,pageNum:Math.min(progress.page||1,pdfDoc.numPages),totalPages:pdfDoc.numPages,scale:progress.scale||1,fitMode:progress.scale?"custom":"width",storageKey,annotations,bookmarks,redoStack:{},tool:null,color:"#5b9dff",originalUrl:url,searchMatches:[],searchIndex:-1};

async function renderBookmarks(c){c.innerHTML=`<h2>My Bookmarks</h2><div id="bmList">${skelList(3)}</div>`;const list=document.getElementById("bmList");try{const{data,error}=await db.from("bookmarks").select("pdf_id, pdfs(title, id, file_path)").eq("user_id",session.user.id);if(error)throw error;if(!data?.length){list.innerHTML=`<div class="empty">No bookmarks yet.</div>`;return}list.innerHTML="";data.forEach(bm=>{if(!bm.pdfs)return;const row=el(`<div class="card row"><span style="cursor:pointer;flex:1" class="open">${escapeHtml(bm.pdfs.title)}</span><button class="btn-small rm">Remove</button></div>`);row.querySelector(".open").onclick=()=>openPdf(bm.pdfs);row.querySelector(".rm").onclick=async()=>{try{await db.from("bookmarks").delete().eq("user_id",session.user.id).eq("pdf_id",bm.pdfs.id);renderBookmarks(c)}catch(e){toast(e?.message||"Error")}};list.appendChild(row)})}catch(e){list.innerHTML=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}}

async function renderTests(c){c.innerHTML=`<h2>Tests</h2><div id="testList">${skelList(3)}</div>`;const list=document.getElementById("testList");try{const{data,error}=await db.from("tests").select("*").order("created_at",{ascending:false});if(error)throw error;if(!data?.length){list.innerHTML=`<div class="empty">No tests yet.</div>`;return}list.innerHTML="";data.forEach(test=>{const isCbt=test.type==="cbt"||!test.file_path;const row=el(`<div class="card row"><div><div style="font-weight:600">${escapeHtml(test.title)}</div><div class="muted">${test.duration_minutes||60} min · ${isCbt?"CBT":"PDF"}</div></div><button class="btn">Start</button></div>`);row.querySelector("button").onclick=()=>{if(isCbt)startCbtTest(test);else toast("PDF test mode")};list.appendChild(row)})}catch(e){list.innerHTML=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}}

async function startCbtTest(test){try{const cols=profile?.role==="admin"?"*":"id, question_text, option_a, option_b, option_c, option_d, sort_order, question_image";const{data,error}=await db.from("test_questions").select(cols).eq("test_id",test.id).order("sort_order");if(error)throw error;if(!data?.length){toast("No questions yet");return}cbtTest=test;cbtQuestions=data;cbtAnswers={};cbtMarked=new Set();cbtIndex=0;cbtRemaining=(Number(test.duration_minutes)||60)*60;if(cbtTimerRef)clearInterval(cbtTimerRef);cbtTimerRef=setInterval(()=>{cbtRemaining--;const tEl=document.getElementById("cbtTimer");if(tEl){const m=Math.floor(cbtRemaining/60),s=cbtRemaining%60;tEl.textContent=`${m}:${s<10?"0":""}${s}`}if(cbtRemaining<=0){clearInterval(cbtTimerRef);cbtTimerRef=null;finishCbt(true)}},1000);renderCbtUI()}catch(e){toast(e?.message||"Unable to start")}}

function renderCbtUI(){const c=document.getElementById("content");if(!c||!cbtQuestions.length)return;const q=cbtQuestions[cbtIndex];const selected=cbtAnswers[q.id]||null;const imgHtml=q.question_image?`<img class="q-img" src="${escapeHtml(q.question_image)}"/>`:"";
c.innerHTML=`<div class="timer" id="cbtTimer">${Math.floor(cbtRemaining/60)}:${(cbtRemaining%60)<10?"0":""}${cbtRemaining%60}</div><div class="cbt-layout"><div class="cbt-qbox"><div class="muted" style="margin-bottom:8px">Question ${cbtIndex+1} of ${cbtQuestions.length}</div><div style="font-size:15.5px;line-height:1.5;margin-bottom:12px">${escapeHtml(q.question_text)}</div>${imgHtml}
<button class="cbt-opt ${selected==="A"?"selected":""}" data-o="A">A. ${escapeHtml(q.option_a)}</button><button class="cbt-opt ${selected==="B"?"selected":""}" data-o="B">B. ${escapeHtml(q.option_b)}</button>
<button class="cbt-opt ${selected==="C"?"selected":""}" data-o="C">C. ${escapeHtml(q.option_c)}</button><button class="cbt-opt ${selected==="D"?"selected":""}" data-o="D">D. ${escapeHtml(q.option_d)}</button>
<div class="cbt-nav"><button class="btn-outline" id="cbtPrev" ${cbtIndex===0?"disabled":""}>← Prev</button><button class="btn-outline" id="cbtMark">${cbtMarked.has(q.id)?"Unmark":"Mark"}</button><button class="btn" id="cbtNext">${cbtIndex===cbtQuestions.length-1?"Review":"Next →"}</button></div>
<button class="btn-danger" style="width:100%;margin-top:14px" id="cbtSubmit">Submit Test</button></div><div class="cbt-palette"><div style="font-weight:600;font-size:13px;margin-bottom:8px">Palette</div><div class="cbt-palette-grid" id="palette"></div></div></div>`;
c.querySelectorAll(".cbt-opt").forEach(btn=>{btn.onclick=()=>{cbtAnswers[q.id]=btn.dataset.o;renderCbtUI()}});
document.getElementById("cbtPrev").onclick=()=>{if(cbtIndex>0){cbtIndex--;renderCbtUI()}};document.getElementById("cbtNext").onclick=()=>{if(cbtIndex<cbtQuestions.length-1){cbtIndex++;renderCbtUI()}};
document.getElementById("cbtMark").onclick=()=>{if(cbtMarked.has(q.id))cbtMarked.delete(q.id);else cbtMarked.add(q.id);renderCbtUI()};
document.getElementById("cbtSubmit").onclick=async()=>{if(await confirmAction("Submit Test","Submit now?"))finishCbt(false)};
const palette=document.getElementById("palette");cbtQuestions.forEach((qq,i)=>{const btn=el(`<button class="cbt-pbtn">${i+1}</button>`);if(cbtAnswers[qq.id])btn.classList.add("answered");if(cbtMarked.has(qq.id))btn.classList.add("marked");if(i===cbtIndex)btn.classList.add("current");btn.onclick=()=>{cbtIndex=i;renderCbtUI()};palette.appendChild(btn)})}

async function finishCbt(auto){if(cbtTimerRef){clearInterval(cbtTimerRef);cbtTimerRef=null}const c=document.getElementById("content");c.innerHTML=`<div class="card score-card"><div class="muted">Calculating...</div></div>`;
let score=0,total=cbtQuestions.length*4,correct=0,wrong=0,unattempted=0,reviewQs=[];
try{const{data:fullQs}=await db.from("test_questions").select("id, question_text, option_a, option_b, option_c, option_d, correct_option, sort_order").eq("test_id",cbtTest.id).order("sort_order");if(fullQs?.length)cbtQuestions=fullQs}catch(e){}
cbtQuestions.forEach(q=>{const ans=cbtAnswers[q.id]||null;const corr=(q.correct_option||"").toUpperCase();let status="unattempted";if(!ans)unattempted++;else if(corr&&ans===corr){correct++;status="correct"}else{wrong++;status="wrong"}reviewQs.push({id:q.id,question_text:q.question_text,option_a:q.option_a,option_b:q.option_b,option_c:q.option_c,option_d:q.option_d,correct_option:corr||null,user_answer:ans,status})});
score=correct*4+wrong*(-1);total=cbtQuestions.length*4;
const lastScoreData={score,total,correct,wrong,unattempted,title:cbtTest?.title,at:Date.now(),review:reviewQs};saveLastScore(lastScoreData);showScoreAndReview(c,lastScoreData,auto)}

function showScoreAndReview(c,data,auto){const den=(data.correct||0)+(data.wrong||0)+(data.unattempted||0);const accuracy=den?Math.round(((data.correct||0)/den)*100):0;
c.innerHTML=`<div class="card score-card"><div class="muted">${auto?"Time's up!":"Submitted"}</div><h2>${escapeHtml(data.title||"Test")}</h2><div class="score-num">${data.score}</div><div class="muted" style="margin-bottom:16px">out of ${data.total}</div>
<div class="grid2" style="max-width:320px;margin:0 auto 16px"><div class="card" style="margin:0;text-align:center"><div class="muted">Correct</div><div style="color:var(--green);font-weight:700">${data.correct||0}</div></div><div class="card" style="margin:0;text-align:center"><div class="muted">Wrong</div><div style="color:var(--danger);font-weight:700">${data.wrong||0}</div></div></div>
<button class="btn" style="width:100%;margin-bottom:8px" id="viewReview">Review</button><button class="btn-outline" style="width:100%" id="backTests">Back</button></div>`;
document.getElementById("backTests").onclick=()=>{cbtTest=null;cbtQuestions=[];cbtAnswers={};renderTests(c)};document.getElementById("viewReview").onclick=()=>renderQuestionReview(c,data)}

function renderQuestionReview(c,data){if(!data.review?.length){c.innerHTML=`<div class="empty">No review data</div><button class="btn" id="backScore">Back</button>`;document.getElementById("backScore").onclick=()=>showScoreAndReview(c,data,false);return}
let html=`<button class="back" id="backScore">← Score</button><h2>${escapeHtml(data.title||"Review")}</h2><div class="muted" style="margin-bottom:14px">${data.correct||0} correct · ${data.wrong||0} wrong</div>`;
data.review.forEach((q,i)=>{const statusColor=q.status==="correct"?"var(--green)":q.status==="wrong"?"var(--danger)":"var(--muted)";const statusText=q.status==="correct"?"Correct":q.status==="wrong"?"Wrong":"Skipped";
const opt=(letter,text)=>{let extra="";if(q.user_answer===letter)extra+=` <span style="color:var(--accent)">(Yours)</span>`;if(q.correct_option===letter)extra+=` <span style="color:var(--green)">(Correct)</span>`;let bg="var(--panel2)";if(q.correct_option===letter)bg="rgba(61,214,140,.12)";else if(q.user_answer===letter&&q.status==="wrong")bg="rgba(239,90,90,.12)";return`<div style="padding:10px 12px;margin:5px 0;border-radius:8px;border:1px solid var(--border);background:${bg}"><b>${letter}.</b> ${escapeHtml(text||"")}${extra}</div>`};
html+=`<div class="card" style="margin-bottom:12px"><div class="row" style="margin-bottom:6px"><div style="font-weight:600">Q${i+1}</div><div style="color:${statusColor};font-size:13px;font-weight:600">${statusText}</div></div><div style="margin-bottom:8px;line-height:1.45">${escapeHtml(q.question_text)}</div>${opt("A",q.option_a)}${opt("B",q.option_b)}${opt("C",q.option_c)}${opt("D",q.option_d)}</div>`});
html+=`<button class="btn" style="width:100%" id="backTests2">Back to Tests</button>`;c.innerHTML=html;document.getElementById("backScore").onclick=()=>showScoreAndReview(c,data,false);document.getElementById("backTests2").onclick=()=>{cbtTest=null;cbtQuestions=[];cbtAnswers={};renderTests(c)}}

async function renderAdminContent(body){
  body.innerHTML=`<div class="card"><h3 style="margin-top:0">Add Chapter</h3><select id="chSubj"></select><input id="newChap" placeholder="Chapter name"/><button class="btn" id="addChap">Add Chapter</button></div>
  <div class="card"><h3>Add PDF</h3><select id="pdfSubj"></select><select id="pdfChap"></select><select id="pdfCat"><option value="general">Practice</option><option value="ncert">Important</option><option value="pyq">PYQs</option></select><input id="pdfTitle" placeholder="PDF title"/><input type="file" id="pdfFile" accept="application/pdf"/><button class="btn" id="addPdf">Upload</button></div>
  <div class="card"><h3>Add Video</h3><select id="vidSubj"></select><select id="vidChap"></select><input id="vidTitle" placeholder="Title"/><input id="vidUrl" placeholder="YouTube URL"/><button class="btn" id="addVid">Add Video</button></div>
  <h3>Manage Chapters</h3><input id="chapSearch" placeholder="Search chapters..." style="margin-bottom:10px"/><div id="chapItems">${skelList(3)}</div>
  <h3 style="margin-top:24px">PDFs</h3><input id="pdfSearch" placeholder="Search PDFs..." style="margin-bottom:10px"/><div id="pdfItems">${skelList(3)}</div>
  <h3 style="margin-top:24px">Videos</h3><input id="vidSearch" placeholder="Search videos..." style="margin-bottom:10px"/><div id="vidItems">${skelList(2)}</div>`;

  try{
    const{data:subjects}=await db.from("subjects").select("*").order("sort_order");
    const opts=(subjects||[]).map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("")||`<option value="">No subjects</option>`;
    ["chSubj","pdfSubj","vidSubj"].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML=opts});
    const loadCh=async(subId,chapId)=>{const sid=document.getElementById(subId)?.value;const chap=document.getElementById(chapId);if(!sid||!chap)return;const{data:chs}=await db.from("chapters").select("*").eq("subject_id",sid).order("sort_order");chap.innerHTML=(chs||[]).map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")||`<option value="">No chapters</option>`};
    if(subjects?.length){await loadCh("pdfSubj","pdfChap");await loadCh("vidSubj","vidChap")}
    document.getElementById("pdfSubj").onchange=()=>loadCh("pdfSubj","pdfChap");document.getElementById("vidSubj").onchange=()=>loadCh("vidSubj","vidChap");

    document.getElementById("addChap").onclick=async()=>{const subject_id=document.getElementById("chSubj").value,name=document.getElementById("newChap").value.trim();if(!subject_id||!name)return toast("Fill fields");try{await db.from("chapters").insert({subject_id,name});toast("Chapter added");renderAdminContent(body)}catch(e){toast(e?.message||"Error")}};
    document.getElementById("addPdf").onclick=async()=>{const title=document.getElementById("pdfTitle").value.trim(),file=document.getElementById("pdfFile").files[0],chapter_id=document.getElementById("pdfChap").value,category=document.getElementById("pdfCat").value;if(!title||!file||!chapter_id)return toast("Fill all");if(file.type!=="application/pdf")return toast("PDF only");try{const path=`pdfs/${crypto.randomUUID()}_${file.name}`;const{error:up}=await db.storage.from("content").upload(path,file);if(up)throw up;const{error:ins}=await db.from("pdfs").insert({chapter_id,category,title,file_path:path});if(ins){await db.storage.from("content").remove([path]);throw ins}toast("PDF uploaded");renderAdminContent(body)}catch(e){toast(e?.message||"Upload failed")}};
    document.getElementById("addVid").onclick=async()=>{const title=document.getElementById("vidTitle").value.trim(),url=document.getElementById("vidUrl").value.trim(),youtube_id=ytId(url),chapter_id=document.getElementById("vidChap").value;if(!title||!youtube_id||!chapter_id)return toast("Fill all + valid YouTube");try{await db.from("videos").insert({chapter_id,title,youtube_id});toast("Video added");renderAdminContent(body)}catch(e){toast(e?.message||"Error")}};

    // Chapters
    let allChapters=[];const renderChapters=(filter="")=>{const box=document.getElementById("chapItems");const q=filter.toLowerCase().trim();const filtered=q?allChapters.filter(c=>(c.name||"").toLowerCase().includes(q)||(c.subjects?.name||"").toLowerCase().includes(q)):allChapters;if(!filtered.length){box.innerHTML=`<div class="empty">${q?"No match":"No chapters"}</div>`;return}box.innerHTML="";
    filtered.forEach(ch=>{const row=el(`<div class="card"><div class="row"><div style="flex:1"><div style="font-weight:600">${escapeHtml(ch.name)}</div><div class="muted">${escapeHtml(ch.subjects?.name||"")} · ${ch._pdfCount||0} PDFs · ${ch._vidCount||0} Videos</div></div><div class="row-wrap"><button class="btn-small renChap">Rename</button><button class="btn-danger delChap">Delete</button></div></div></div>`);
    row.querySelector(".renChap").onclick=async()=>{const nn=prompt("New chapter name:",ch.name);if(nn===null||!nn.trim())return;try{await db.from("chapters").update({name:nn.trim()}).eq("id",ch.id);toast("Renamed");renderAdminContent(body)}catch(e){toast(e?.message||"Error")}};
    row.querySelector(".delChap").onclick=async()=>{if(!await confirmAction("Delete Chapter",`Delete "${ch.name}" permanently?\n\nThis will also delete:\n• ${ch._pdfCount||0} PDFs\n• ${ch._vidCount||0} Videos`))return;try{const{data:pdfs}=await db.from("pdfs").select("file_path").eq("chapter_id",ch.id);if(pdfs?.length){const paths=pdfs.map(p=>p.file_path).filter(Boolean);if(paths.length)await db.storage.from("content").remove(paths)}await db.from("pdfs").delete().eq("chapter_id",ch.id);await db.from("videos").delete().eq("chapter_id",ch.id);await db.from("chapters").delete().eq("id",ch.id);toast("Chapter deleted");renderAdminContent(body)}catch(e){toast(e?.message||"Error")}};box.appendChild(row)})};
    const{data:chs}=await db.from("chapters").select("*, subjects(name)").order("sort_order");allChapters=chs||[];for(const ch of allChapters){const{count:pdfCount}=await db.from("pdfs").select("id",{count:"exact",head:true}).eq("chapter_id",ch.id);const{count:vidCount}=await db.from("videos").select("id",{count:"exact",head:true}).eq("chapter_id",ch.id);ch._pdfCount=pdfCount||0;ch._vidCount=vidCount||0}renderChapters();document.getElementById("chapSearch").oninput=e=>renderChapters(e.target.value);

    // PDFs
    let allPdfs=[];const renderPdfs=(filter="")=>{const box=document.getElementById("pdfItems");const q=filter.toLowerCase().trim();const filtered=q?allPdfs.filter(p=>(p.title||"").toLowerCase().includes(q)):allPdfs;if(!filtered.length){box.innerHTML=`<div class="empty">${q?"No match":"No PDFs"}</div>`;return}box.innerHTML="";
    filtered.forEach(p=>{const row=el(`<div class="card"><div class="row"><div style="flex:1;min-width:0"><div style="font-weight:600">${escapeHtml(p.title)}</div><div class="muted">${escapeHtml(p.chapters?.subjects?.name||"")} → ${escapeHtml(p.chapters?.name||"")}</div></div><div class="row-wrap"><button class="btn-small movP">Move</button><button class="btn-small repP">Replace</button><button class="btn-danger delP">Delete</button></div></div></div>`);
    row.querySelector(".movP").onclick=async()=>{try{const{data:subs}=await db.from("subjects").select("id,name").order("sort_order");if(!subs?.length)return toast("No subjects");const modal=el(`<div class="modal-bg"><div class="modal-box" style="max-width:480px"><h3 style="margin-bottom:6px">Move PDF</h3><div class="muted" style="margin-bottom:14px">${escapeHtml(p.title)}</div><label class="muted" style="font-size:12px">Subject</label><select id="moveSubj" style="margin-bottom:12px">${subs.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("")}</select><label class="muted" style="font-size:12px">Chapter</label><select id="moveChap" style="margin-bottom:18px"><option value="">Loading...</option></select><div style="display:flex;gap:10px"><button class="btn-outline" style="flex:1" id="moveCancel">Cancel</button><button class="btn" style="flex:1" id="moveConfirm">Move</button></div></div></div>`);document.body.appendChild(modal);
    const loadChapters=async(subjectId)=>{const{data:chs}=await db.from("chapters").select("id,name").eq("subject_id",subjectId).order("sort_order");document.getElementById("moveChap").innerHTML=(chs||[]).map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")||`<option value="">No chapters</option>`};
    await loadChapters(subs[0].id);document.getElementById("moveSubj").onchange=e=>loadChapters(e.target.value);document.getElementById("moveCancel").onclick=()=>modal.remove();
    document.getElementById("moveConfirm").onclick=async()=>{const newChapId=document.getElementById("moveChap").value;if(!newChapId)return toast("Select chapter");try{await db.from("pdfs").update({chapter_id:newChapId}).eq("id",p.id);toast("PDF moved");modal.remove();renderAdminContent(body)}catch(e){toast(e?.message||"Move failed")}}}catch(e){toast(e?.message||"Error")}};
    row.querySelector(".repP").onclick=()=>{const input=document.createElement("input");input.type="file";input.accept="application/pdf";input.onchange=async()=>{const file=input.files[0];if(!file)return;if(file.type!=="application/pdf")return toast("Only PDF");try{toast("Uploading...");const path=`pdfs/${crypto.randomUUID()}_${file.name}`;const{error:upErr}=await db.storage.from("content").upload(path,file);if(upErr)throw upErr;if(p.file_path)try{await db.storage.from("content").remove([p.file_path])}catch(e){}await db.from("pdfs").update({file_path:path}).eq("id",p.id);toast("PDF replaced");renderAdminContent(body)}catch(e){toast(e?.message||"Replace failed")}};input.click()};
    row.querySelector(".delP").onclick=async()=>{if(!await confirmAction("Delete PDF",`Delete "${p.title}" permanently?`))return;try{if(p.file_path)await db.storage.from("content").remove([p.file_path]);await db.from("pdfs").delete().eq("id",p.id);toast("Deleted");renderAdminContent(body)}catch(e){toast(e?.message||"Error")}};box.appendChild(row)})};
    const{data:pdfs}=await db.from("pdfs").select("*, chapters(name, subjects(name))").order("created_at",{ascending:false}).limit(100);allPdfs=pdfs||[];renderPdfs();document.getElementById("pdfSearch").oninput=e=>renderPdfs(e.target.value);

    // Videos
    let allVids=[];const renderVids=(filter="")=>{const box=document.getElementById("vidItems");const q=filter.toLowerCase().trim();const filtered=q?allVids.filter(v=>(v.title||"").toLowerCase().includes(q)):allVids;if(!filtered.length){box.innerHTML=`<div class="empty">${q?"No match":"No videos"}</div>`;return}box.innerHTML="";
    filtered.forEach(v=>{const row=el(`<div class="card"><div class="row"><div style="flex:1"><div style="font-weight:600">${escapeHtml(v.title)}</div><div class="muted">${escapeHtml(v.chapters?.subjects?.name||"")} → ${escapeHtml(v.chapters?.name||"")}</div></div><button class="btn-danger delV">Delete</button></div></div>`);
    row.querySelector(".delV").onclick=async()=>{if(!await confirmAction("Delete Video",`Delete "${v.title}"?`))return;try{await db.from("videos").delete().eq("id",v.id);toast("Deleted");renderAdminContent(body)}catch(e){toast(e?.message||"Error")}};box.appendChild(row)})};
    const{data:vids}=await db.from("videos").select("*, chapters(name, subjects(name))").order("created_at",{ascending:false}).limit(100);allVids=vids||[];renderVids();document.getElementById("vidSearch").oninput=e=>renderVids(e.target.value);
  }catch(e){body.innerHTML+=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}
}

async function renderAdminUsers(body){body.innerHTML=`<div style="margin-bottom:12px"><input id="userSearch" placeholder="Search by email..." style="margin-bottom:0"/></div><div id="userTableWrap">${skelList(3)}</div>`;
let allUsers=[];const renderList=(filter="")=>{const wrap=document.getElementById("userTableWrap");const q=filter.toLowerCase().trim();const filtered=q?allUsers.filter(u=>(u.email||"").toLowerCase().includes(q)):allUsers;if(!filtered.length){wrap.innerHTML=`<div class="empty">${q?"No match":"No users"}</div>`;return}
wrap.innerHTML=`<table><thead><tr><th>Email</th><th>Status</th><th>Actions</th></tr></thead><tbody id="uRows"></tbody></table>`;const rows=document.getElementById("uRows");
filtered.forEach(user=>{if(user.role==="admin")return;const tr=el(`<tr><td>${escapeHtml(user.email)}</td><td><span class="badge">${escapeHtml(user.status)}</span></td><td class="row-wrap" id="act-${user.id}"></td></tr>`);rows.appendChild(tr);const act=document.getElementById(`act-${user.id}`);
const setStatus=async st=>{try{await db.from("profiles").update({status:st}).eq("id",user.id);renderAdmin(document.getElementById("content"))}catch(e){toast(e?.message||"Error")}};
if(user.status==="pending"){const a=el(`<button class="btn-good">Approve</button>`);a.onclick=()=>setStatus("active");act.appendChild(a);const r=el(`<button class="btn-danger">Reject</button>`);r.onclick=()=>setStatus("blocked");act.appendChild(r)}
else{const p=el(`<button class="btn-warn">${user.status==="paused"?"Resume":"Pause"}</button>`);p.onclick=()=>setStatus(user.status==="paused"?"active":"paused");act.appendChild(p);const b=el(`<button class="btn-danger">${user.status==="blocked"?"Unblock":"Block"}</button>`);b.onclick=()=>setStatus(user.status==="blocked"?"active":"blocked");act.appendChild(b)}})};
try{const{data,error}=await db.from("profiles").select("*").order("created_at",{ascending:false});if(error)throw error;allUsers=data||[];renderList();document.getElementById("userSearch").oninput=e=>renderList(e.target.value)}catch(e){document.getElementById("userTableWrap").innerHTML=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}}

async function renderAdminCbt(body){body.innerHTML=`<h3>Select Test</h3><select id="cbtTestSel"><option value="">Select…</option></select><h3 style="margin-top:16px">Bulk Add</h3><div class="muted" style="margin-bottom:6px">Question<br>A) ...<br>B) ...<br>C) ...<br>D) ...</div><textarea id="bulkText" style="min-height:120px"></textarea><button class="btn" id="bulkAdd">Add Questions</button><h3 style="margin-top:16px">Questions</h3><div id="cbtQList" class="muted">Select a test</div>`;
try{const{data:tests}=await db.from("tests").select("id,title").order("created_at",{ascending:false});const sel=document.getElementById("cbtTestSel");(tests||[]).forEach(t=>{const o=document.createElement("option");o.value=t.id;o.textContent=t.title;sel.appendChild(o)});
const loadQs=async()=>{const testId=sel.value;const list=document.getElementById("cbtQList");if(!testId){list.innerHTML=`<div class="muted">Select a test</div>`;return}const{data,error}=await db.from("test_questions").select("*").eq("test_id",testId).order("sort_order");if(error){list.innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`;return}if(!data?.length){list.innerHTML=`<div class="empty">No questions</div>`;return}list.innerHTML="";
data.forEach((q,i)=>{const row=el(`<div class="card"><div class="row"><div style="flex:1"><div class="muted">Q${i+1} · <select class="corr" style="width:auto;display:inline;padding:3px 6px;margin:0"><option value="A" ${q.correct_option==="A"?"selected":""}>A</option><option value="B" ${q.correct_option==="B"?"selected":""}>B</option><option value="C" ${q.correct_option==="C"?"selected":""}>C</option><option value="D" ${q.correct_option==="D"?"selected":""}>D</option></select></div><div style="margin-top:4px">${escapeHtml(q.question_text)}</div></div><button class="btn-danger delQ">Delete</button></div></div>`);
row.querySelector(".delQ").onclick=async()=>{if(!await confirmAction("Delete","Delete this question?"))return;try{await db.from("test_questions").delete().eq("id",q.id);loadQs()}catch(e){toast(e?.message||"Error")}};
row.querySelector(".corr").onchange=async e=>{try{await db.from("test_questions").update({correct_option:e.target.value}).eq("id",q.id)}catch(err){toast(err?.message||"Error")}};list.appendChild(row)})};
sel.onchange=loadQs;
document.getElementById("bulkAdd").onclick=async()=>{const test_id=sel.value;const raw=document.getElementById("bulkText").value.trim();if(!test_id)return toast("Select test");if(!raw)return toast("Paste questions");
const blocks=raw.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);const rows=[];for(const block of blocks){const lines=block.split("\n").map(l=>l.trim()).filter(Boolean);if(lines.length<5)continue;const getOpt=l=>{const m=l.match(/^[A-Da-d][\.\)\]]\s*(.+)/);return m?m[1]:l};rows.push({test_id,question_text:lines[0].replace(/^\d+[\.\)]\s*/,""),option_a:getOpt(lines[1]),option_b:getOpt(lines[2]),option_c:getOpt(lines[3]),option_d:getOpt(lines[4]),correct_option:"A",sort_order:rows.length+1})}
if(!rows.length)return toast("No valid questions");try{await db.from("test_questions").insert(rows);document.getElementById("bulkText").value="";toast(`${rows.length} added`);loadQs()}catch(e){toast(e?.message||"Error")}}}catch(e){body.innerHTML+=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}}

async function boot(){if(!db)throw new Error("Supabase not init");const{data,error}=await db.auth.getSession();if(error)throw error;session=data?.session||null;if(session)await afterLogin();else renderAuth();db.auth.onAuthStateChange((e,ns)=>{session=ns||null})}
initializeApp();
</script>
</body>
