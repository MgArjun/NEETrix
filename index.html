<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NEETrix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    :root{
      --bg:#050812;
      --panel:#0f1420;
      --panel2:#0a0f1a;
      --border:#1a2235;
      --text:#e8ecf5;
      --muted:#94a3b8;
      --accent:#4f8cff;
      --green:#22d3a3;
      --warn:#f59e0b;
      --danger:#ef4444;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow-x:hidden}
    body{
      font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    #app{min-height:100%;display:flex;flex-direction:column}
    
    /* Auth */
    .auth-wrap{display:grid;place-items:center;min-height:100vh;padding:24px}
    .auth-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px}
    .brand{font-size:24px;font-weight:800;letter-spacing:.5px}
    .sub{color:var(--muted);font-size:13px;margin-top:4px}
    .msg{margin-top:14px;font-size:13px;min-height:18px}
    input,select{width:100%;padding:11px 12px;margin:8px 0;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--text);outline:none;font-size:14px}
    input:focus,select:focus{border-color:var(--accent)}
    .btn,.btn-outline,.btn-danger,.btn-small{width:100%;padding:11px 14px;margin-top:10px;border-radius:10px;border:1px solid var(--border);background:var(--accent);color:#050812;font-weight:700;cursor:pointer;font-size:14px}
    .btn-outline{background:transparent;color:var(--text)}
    .btn-danger{background:rgba(239,68,68,.12);color:var(--danger);border-color:var(--danger)}
    .btn-small{width:auto;padding:6px 10px;font-size:12px;margin-top:0}
    .link{background:none;border:none;color:var(--muted);cursor:pointer;margin-top:10px;font-size:13px}
    
    /* Topbar - Scrollable on mobile */
    .topbar{
      display:flex;align-items:center;gap:10px;padding:10px 14px;
      border-bottom:1px solid var(--border);
      background:rgba(5,8,18,.95);
      position:sticky;top:0;z-index:10;
      backdrop-filter:blur(8px);
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .topbar::-webkit-scrollbar{display:none}
    .topbar .brand{font-size:18px;white-space:nowrap}
    .navbtn{
      background:transparent;border:1px solid transparent;color:var(--muted);
      padding:7px 11px;border-radius:8px;cursor:pointer;font-size:13px;
      white-space:nowrap;flex-shrink:0;
    }
    .navbtn.active{color:var(--text);border-color:var(--border);background:var(--panel2)}
    .spacer{flex:1;min-width:20px}
    .profile-wrap{display:flex;align-items:center}
    .profile-btn{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#050812;font-weight:800;border:none;cursor:pointer;font-size:15px}
    
    /* Content */
    .content{padding:16px;max-width:1200px;margin:0 auto;width:100%;flex:1}
    
    /* Skeletons */
    .skel{background:linear-gradient(90deg,var(--panel2),#1a2440,var(--panel2));border-radius:10px}
    .skel-card{height:90px}
    .skel-subj{height:70px}
    
    /* Home */
    .home-hero{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px}
    .welcome{font-size:20px;font-weight:700;margin-bottom:4px}
    .muted{color:var(--muted);font-size:13px}
    .progress-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:16px;cursor:pointer}
    .progress-head{display:flex;justify-content:space-between;margin-bottom:8px}
    .progress-bar-bg{height:10px;background:var(--panel2);border-radius:999px;overflow:hidden}
    .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#22d3a3);width:0%;transition:width .6s ease}
    .progress-stats{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:13px}
    .progress-stats b{color:var(--text)}
    .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
    .home-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:transform .15s}
    .home-card:hover{transform:translateY(-2px)}
    .home-card .icon{font-size:24px;margin-bottom:6px}
    .home-card h3{margin:0 0 4px;font-size:15px}
    
    /* Subject & cards */
    .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
    .subject-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;transition:transform .15s}
    .subject-card:hover{transform:translateY(-2px)}
    .subject-card h3{margin:0;font-size:15px}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
    .card.row{display:flex;align-items:center;gap:10px}
    .empty{color:var(--muted);padding:18px;text-align:center}
    .tabs2{display:flex;gap:8px;margin:12px 0;overflow-x:auto;padding-bottom:4px}
    .tab2{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
    .tab2.active{color:var(--text);border-color:var(--accent)}
    .back{background:none;border:none;color:var(--muted);cursor:pointer;margin-bottom:8px;font-size:14px}
    .yt-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin-top:8px}
    .yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
    
    /* PDF Modal */
    .pdf-modal{position:fixed;inset:0;background:rgba(5,8,18,.95);z-index:20;display:flex;flex-direction:column}
    .pdf-toolbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);background:rgba(15,21,36,.98);flex-shrink:0;overflow-x:auto}
    .pdf-title{flex:1;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:100px}
    .pdf-tools{display:flex;gap:6px;flex-wrap:nowrap;flex-shrink:0}
    .pdf-tbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap;flex-shrink:0}
    .pdf-tbtn.active-tool{border-color:var(--accent);background:rgba(79,140,255,.15)}
    .pdf-zoom-label{font-size:12px;color:var(--muted);min-width:45px;text-align:center}
    .pdf-canvas-wrap{position:relative;overflow:auto;flex:1;background:rgba(5,8,18,.7);display:flex;justify-content:center;align-items:flex-start;padding:16px}
    .pdf-canvas-stack{position:relative;max-width:100%}
    #pdfCanvas,#pdfAnnoCanvas{display:block;max-width:100%;background:#fff}
    .textLayer{transform-origin:0 0;opacity:0.2}
    .pdf-pagebar{display:flex;justify-content:center;gap:8px;padding:10px;border-top:1px solid var(--border);background:rgba(15,21,36,.98);flex-shrink:0}
    #pdfPageInput{width:60px;margin:0 4px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px;text-align:center}
    .pdf-annobar{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;border-bottom:1px solid var(--border);background:rgba(15,21,36,.98);flex-wrap:wrap;flex-shrink:0}
    .pdf-color{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);cursor:pointer}
    .pdf-color.selected{border-color:#fff;transform:scale(1.15)}
    .pdf-panel{position:absolute;top:48px;right:10px;width:260px;max-height:calc(100% - 100px);background:rgba(15,21,36,.98);border:1px solid var(--border);border-radius:12px;overflow:hidden;transform:translateX(110%);transition:transform .2s ease;z-index:5}
    .pdf-panel.open{transform:translateX(0)}
    .pdf-panel-tabs{display:flex;border-bottom:1px solid var(--border)}
    .pdf-panel-tab{flex:1;background:transparent;border:none;color:var(--muted);padding:8px;font-size:12px;cursor:pointer}
    .pdf-panel-tab.active{color:var(--text);border-bottom:2px solid var(--accent)}
    .pdf-panel-body{padding:8px;overflow:auto;max-height:260px}
    .pdf-panel-item{padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
    .pdf-panel-item:hover{background:var(--panel2);border-color:var(--border)}
    
    /* Toast & Modal */
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
    .modal-bg{position:fixed;inset:0;background:rgba(5,8,18,.85);z-index:30;display:grid;place-items:center;padding:16px}
    .modal-box{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;position:relative}
    .modal-close{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
    
    /* Profile */
    .profile-field{margin-top:10px}
    .profile-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
    
    /* CBT */
    .timer{position:sticky;top:60px;z-index:4;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px 12px;margin-bottom:12px;font-weight:700;text-align:center}
    .cbt-layout{display:grid;grid-template-columns:1fr 260px;gap:12px}
    @media(max-width:900px){.cbt-layout{grid-template-columns:1fr}}
    .cbt-qbox{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
    .cbt-opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:11px 12px;border-radius:10px;margin-top:8px;cursor:pointer;font-size:14px}
    .cbt-opt.selected{border-color:var(--accent);background:rgba(79,140,255,.12)}
    .cbt-nav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .cbt-palette{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px}
    .cbt-palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
    .cbt-pbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px;border-radius:8px;cursor:pointer;font-size:13px}
    .cbt-pbtn.answered{background:rgba(79,140,255,.25);border-color:var(--accent)}
    .cbt-pbtn.marked{background:rgba(245,158,11,.25);border-color:var(--warn)}
    .cbt-pbtn.current{outline:2px solid var(--accent)}
    .cbt-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--muted)}
    .cbt-dot{width:14px;height:14px;border-radius:3px;display:inline-block;margin-right:6px}
    .score-card{text-align:center}
    .score-num{font-size:38px;font-weight:800;color:var(--accent);margin:8px 0}
    .q-img{max-width:100%;border-radius:10px;margin:8px 0}
    
    /* Admin */
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{border:1px solid var(--border);padding:8px;text-align:left;font-size:13px}
    th{background:var(--panel2)}
    .row-wrap{display:flex;gap:6px;flex-wrap:wrap}
    
    .page-fade{animation:fade .15s ease}
    @keyframes fade{from{opacity:.85}to{opacity:1}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"></script>

  <script>
    const SUPABASE_URL = "https://qhggamgxfwlwtpmwxfwk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_X9_aDiQcrKhYyPfuQdnKPA_K8F7RPjM";
    let db = null, session = null, profile = null, activeTab = "home";
    let selSubject = null, selChapter = null, selCategory = "general", adminTab = "dashboard";
    let cbtTest = null, cbtQuestions = [], cbtAnswers = {}, cbtMarked = new Set(), cbtBookmarks = new Set(), cbtIndex = 0, cbtTimerRef = null, cbtRemaining = 0;
    let pr = null;
    const app = document.getElementById("app");

    function escapeHtml(v){return (v??"").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
    function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild}
    function showFatalError(m){document.body.innerHTML=`<div style="min-height:100vh;background:var(--bg);color:#fff;padding:24px;display:grid;place-items:center"><div style="max-width:600px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px"><h2 style="color:var(--danger);margin:0 0 12px">NEETrix Error</h2><div style="color:#c5cada;line-height:1.6;white-space:pre-wrap">${escapeHtml(m)}</div></div></div>`}
    function getLastScore(){try{return JSON.parse(localStorage.getItem("neetrix_last_score")||"null")}catch(e){return null}}
    function saveLastScore(obj){try{localStorage.setItem("neetrix_last_score",JSON.stringify(obj))}catch(e){}}
    function lsGet(key,fallback){try{const v=localStorage.getItem(key);return v!=null?JSON.parse(v):fallback}catch(e){return fallback}}
    function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
    function skelList(n,cls){let h="";for(let i=0;i<n;i++)h+=`<div class="skel ${cls||"skel-card"}"></div>`;return h}
    function toast(msg, ms=2500){let t=document.getElementById("globalToast");if(!t){t=el(`<div class="toast" id="globalToast"></div>`);document.body.appendChild(t);}t.textContent=msg;t.classList.add("show");clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove("show"),ms);}
    function confirmAction(title,message){return new Promise(resolve=>{const modal=el(`<div class="modal-bg"><div class="modal-box" style="max-width:420px"><h3 style="margin:0 0 10px">${escapeHtml(title)}</h3><p class="muted" style="line-height:1.55;margin:0 0 18px;white-space:pre-wrap">${escapeHtml(message)}</p><div style="display:flex;gap:10px"><button class="btn-outline" style="flex:1" id="cNo">Cancel</button><button class="btn-danger" style="flex:1" id="cYes">Confirm</button></div></div></div>`);document.body.appendChild(modal);document.getElementById("cNo").onclick=()=>{modal.remove();resolve(false);};document.getElementById("cYes").onclick=()=>{modal.remove();resolve(true);};modal.onclick=e=>{if(e.target===modal){modal.remove();resolve(false);}};});}
    function ytId(url){const m=(url||"").match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null}

    async function initializeApp(){
      try{
        if(!SUPABASE_URL || !SUPABASE_ANON_KEY) throw new Error("Supabase not configured");
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
        await boot();
      }catch(e){
        console.error(e);
        showFatalError(e?.message || "Could not start");
      }
    }

    async function boot(){
      const stored = localStorage.getItem("neetrix_session");
      if(stored){
        try{
          const parsed = JSON.parse(stored);
          if(parsed?.session?.user){
            session = parsed.session;
            await afterLogin();
            return;
          }
        }catch(e){}
      }
      renderAuth();
    }

    /* ===================== AUTH ===================== */
    function renderAuth(mode){
      mode = mode || "login";
      app.innerHTML = "";
      app.appendChild(el(`<div class="auth-wrap"><div class="auth-card">
        <div class="brand">NEETrix</div>
        <div class="sub">The focused way to prepare.</div>
        <div class="msg" id="msg"></div>
        <div id="fields"></div>
        <button class="btn" style="width:100%" id="mainBtn"></button>
        <button class="link" id="link1"></button>
        <button class="link" id="link2" style="display:none"></button>
      </div></div>`));
      const fields = document.getElementById("fields");
      const mainBtn = document.getElementById("mainBtn");
      const link1 = document.getElementById("link1");
      const link2 = document.getElementById("link2");
      const msg = document.getElementById("msg");
      if(mode === "login" || mode === "signup"){
        fields.innerHTML = `<input id="email" type="email" placeholder="Email address" autocomplete="email"/>
          <input id="pass" type="password" placeholder="Password (8+ characters)" autocomplete="${mode==="login"?"current-password":"new-password"}"/>`;
        mainBtn.textContent = mode === "login" ? "Log in" : "Create account";
        link1.textContent = mode === "login" ? "New here? Create an account" : "Already have an account? Log in";
        link1.onclick = () => renderAuth(mode === "login" ? "signup" : "login");
        link2.style.display = mode === "login" ? "block" : "none";
        link2.textContent = "Forgot password?";
        link2.onclick = () => renderAuth("forgot");
        mainBtn.onclick = async () => {
          msg.textContent = "";
          mainBtn.disabled = true;
          const email = document.getElementById("email").value.trim();
          const pass = document.getElementById("pass").value;
          if(!email || !pass){ msg.style.color="var(--muted)"; msg.textContent="Enter both fields."; mainBtn.disabled=false; return; }
          try{
            if(mode === "signup"){
              const {error} = await db.auth.signUp({email, password: pass});
              if(error) throw error;
              msg.style.color = "var(--green)";
              msg.textContent = "Account created! Check email if needed, then log in.";
              setTimeout(() => renderAuth("login"), 1800);
            } else {
              const {data, error} = await db.auth.signInWithPassword({email, password: pass});
              if(error) throw error;
              session = data.session;
              localStorage.setItem("neetrix_session", JSON.stringify({session}));
              await afterLogin();
            }
          }catch(e){
            msg.style.color = "var(--danger)";
            msg.textContent = e?.message || "Something went wrong";
          } finally {
            mainBtn.disabled = false;
          }
        };
      } else if(mode === "forgot"){
        fields.innerHTML = `<input id="email" type="email" placeholder="Email address"/>`;
        mainBtn.textContent = "Send reset link";
        link1.textContent = "Back to log in";
        link1.onclick = () => renderAuth("login");
        mainBtn.onclick = async () => {
          msg.textContent = "";
          mainBtn.disabled = true;
          const email = document.getElementById("email").value.trim();
          if(!email){ msg.style.color="var(--muted)"; msg.textContent="Enter email"; mainBtn.disabled=false; return; }
          try{
            const {error} = await db.auth.resetPasswordForEmail(email);
            if(error) throw error;
            msg.style.color = "var(--green)";
            msg.textContent = "Reset link sent";
          }catch(e){
            msg.style.color = "var(--danger)";
            msg.textContent = e?.message || "Error";
          } finally {
            mainBtn.disabled = false;
          }
        };
      }
    }

    function renderStatusScreen(status){
      app.innerHTML = "";
      const msgs = {pending: ["Request sent", "Your access request has been sent. Wait for admin approval."],paused: ["Account paused", "Your account is paused by admin."],blocked: ["Account blocked", "Access blocked by admin."]};
      const [t,b] = msgs[status] || ["Access unavailable", "Contact admin."];
      app.appendChild(el(`<div class="auth-wrap"><div class="auth-card">
        <div class="brand">NEETrix</div>
        <h2 style="margin:14px 0 10px">${escapeHtml(t)}</h2>
        <p class="muted" style="line-height:1.6;margin:0 0 16px">${escapeHtml(b)}</p>
        <button class="btn-outline" style="width:100%" id="out">Log out</button>
      </div></div>`));
      document.getElementById("out").onclick = async () => {try{ await db.auth.signOut(); }catch(e){}session=null;profile=null;localStorage.removeItem("neetrix_session");renderAuth();};
    }

    async function afterLogin(){
      if(!session?.user){ renderAuth(); return; }
      try{
        try{ await db.from("login_events").insert({user_id: session.user.id, email: session.user.email}); }catch(e){}
        const {data, error} = await db.from("profiles").select("*").eq("id", session.user.id).single();
        if(error){if(error.code === "PGRST116"){profile=null;renderStatusScreen("pending");return;}throw error;}
        profile = data;
        if(!profile || profile.status !== "active"){renderStatusScreen(profile ? profile.status : "pending");return;}
        activeTab = "home";
        selSubject = null;
        selChapter = null;
        renderShell();
      }catch(e){
        showFatalError(e?.message || "Unable to load account");
      }
    }

    /* ===================== SHELL ===================== */
    function renderShell(){
      app.innerHTML = "";
      const isAdmin = profile?.role === "admin";
      const initial = (profile?.name || profile?.email || "U")[0].toUpperCase();
      app.appendChild(el(`<div style="display:flex;flex-direction:column;min-height:100%">
        <div class="topbar">
          <div class="brand">NEETrix</div>
          <button class="navbtn" data-t="home">Home</button>
          <button class="navbtn" data-t="content">Content</button>
          <button class="navbtn" data-t="questions">Questions</button>
          <button class="navbtn" data-t="bookmarks">Bookmarks</button>
          <button class="navbtn" data-t="tests">Test</button>
          ${isAdmin ? `<button class="navbtn" data-t="admin">Admin</button>` : ""}
          <div class="spacer"></div>
          <div class="profile-wrap"><button class="profile-btn" id="profileBtn">${escapeHtml(initial)}</button></div>
        </div>
        <div class="content" id="content"></div>
      </div>`));
      document.getElementById("profileBtn").onclick = () => openProfileModal();
      document.querySelectorAll(".navbtn").forEach(btn => {
        btn.onclick = () => {
          activeTab = btn.dataset.t;
          selSubject = null;
          selChapter = null;
          if(cbtTimerRef){ clearInterval(cbtTimerRef); cbtTimerRef = null; }
          renderTabsUI();
          renderBody();
        };
      });
      renderTabsUI();
      renderBody();
    }

    /* ===================== PDF READER - FULL VERSION ===================== */
    async function openPdfReader(url, title, storageKey){
      const progress = lsGet("pdfprog_" + storageKey, {page:1, scale:null});
      const modal = el(`<div class="pdf-modal" id="pdfModal">
        <div class="pdf-toolbar">
          <button class="pdf-tbtn" id="pdfClose">✕ Close</button>
          <div class="pdf-title">${escapeHtml(title)}</div>
          <button class="pdf-tbtn" id="pdfPrev">‹ Prev</button>
          <input id="pdfPageInput" type="number" min="1" value="${progress.page||1}"/>
          <span class="muted">/ <span id="pdfPageTotal">?</span></span>
          <button class="pdf-tbtn" id="pdfNext">Next ›</button>
          <button class="pdf-tbtn" id="pdfZoomOut">−</button>
          <span class="pdf-zoom-label" id="pdfZoomLabel">100%</span>
          <button class="pdf-tbtn" id="pdfZoomIn">+</button>
          <button class="pdf-tbtn" id="pdfFitWidth">Fit Width</button>
          <button class="pdf-tbtn" id="pdfFullscreen">⛶ Fullscreen</button>
        </div>
        <div class="pdf-canvas-wrap" id="pdfCanvasWrap">
          <div class="pdf-canvas-stack">
            <canvas id="pdfCanvas"></canvas>
          </div>
        </div>
        <div class="toast" id="pdfToast"></div>
      </div>`);
      document.body.appendChild(modal);
      modal.focus();

      try{
        const pdfDoc = await pdfjsLib.getDocument(url).promise;
        const canvas = document.getElementById("pdfCanvas");
        const ctx = canvas.getContext("2d");
        const pageNum = Math.min(progress.page || 1, pdfDoc.numPages);
        let scale = progress.scale || 1.0;
        let fitMode = "custom";

        document.getElementById("pdfPageTotal").textContent = pdfDoc.numPages;
        document.getElementById("pdfPageInput").value = pageNum;
        document.getElementById("pdfZoomLabel").textContent = Math.round(scale * 100) + "%";

        async function renderPage(n){
          const page = await pdfDoc.getPage(n);
          let viewport;
          
          if(fitMode === "width"){
            const wrap = document.getElementById("pdfCanvasWrap");
            const availWidth = wrap.clientWidth - 32;
            const unscaledViewport = page.getViewport({scale: 1});
            scale = availWidth / unscaledViewport.width;
            viewport = page.getViewport({scale});
          }else{
            viewport = page.getViewport({scale});
          }

          canvas.width = viewport.width;
          canvas.height = viewport.height;
          await page.render({canvasContext: ctx, viewport}).promise;
          document.getElementById("pdfPageInput").value = n;
          document.getElementById("pdfZoomLabel").textContent = Math.round(scale * 100) + "%";
          lsSet("pdfprog_" + storageKey, {page: n, scale});
        }

        await renderPage(pageNum);

        document.getElementById("pdfClose").onclick = () => { modal.remove(); };
        document.getElementById("pdfPrev").onclick = () => {
          const p = parseInt(document.getElementById("pdfPageInput").value) || 1;
          if(p > 1) renderPage(p - 1);
        };
        document.getElementById("pdfNext").onclick = () => {
          const p = parseInt(document.getElementById("pdfPageInput").value) || 1;
          if(p < pdfDoc.numPages) renderPage(p + 1);
        };
        document.getElementById("pdfPageInput").onchange = () => {
          const p = parseInt(document.getElementById("pdfPageInput").value) || 1;
          if(p >= 1 && p <= pdfDoc.numPages) renderPage(p);
        };
        document.getElementById("pdfZoomIn").onclick = () => {
          fitMode = "custom";
          scale = Math.min(4, scale + 0.25);
          renderPage(parseInt(document.getElementById("pdfPageInput").value));
        };
        document.getElementById("pdfZoomOut").onclick = () => {
          fitMode = "custom";
          scale = Math.max(0.4, scale - 0.25);
          renderPage(parseInt(document.getElementById("pdfPageInput").value));
        };
        document.getElementById("pdfFitWidth").onclick = () => {
          fitMode = "width";
          renderPage(parseInt(document.getElementById("pdfPageInput").value));
        };
        document.getElementById("pdfFullscreen").onclick = async () => {
          try{
            if(!document.fullscreenElement){
              await modal.requestFullscreen();
              document.getElementById("pdfFullscreen").textContent = "❌ Exit Fullscreen";
            }else{
              await document.exitFullscreen();
              document.getElementById("pdfFullscreen").textContent = "⛶ Fullscreen";
            }
          }catch(e){}
        };

        // Keyboard navigation
        modal.addEventListener("keydown", (e) => {
          if(e.key === "ArrowLeft" || e.key === "PageUp"){
            document.getElementById("pdfPrev").click();
          }else if(e.key === "ArrowRight" || e.key === "PageDown"){
            document.getElementById("pdfNext").click();
          }else if(e.key === "Escape"){
            if(document.fullscreenElement){
              document.exitFullscreen();
            }else{
              modal.remove();
            }
          }
        });

        // Handle fullscreen change
        document.addEventListener("fullscreenchange", () => {
          if(!document.fullscreenElement){
            document.getElementById("pdfFullscreen").textContent = "⛶ Fullscreen";
          }
        });

      }catch(e){
        modal.remove();
        toast(e?.message || "Unable to load PDF");
      }
    }

    async function startCbtTest(test){
      try{
        const {data, error} = await db.from("test_questions").select("id, question_text, option_a, option_b, option_c, option_d, sort_order").eq("test_id", test.id).order("sort_order");
        if(error) throw error;
        if(!data?.length){ toast("No questions for this CBT yet."); return; }
        cbtTest = test;
        cbtQuestions = data;
        cbtAnswers = {};
        cbtMarked = new Set();
        cbtBookmarks = new Set();
        cbtIndex = 0;
        cbtRemaining = (Number(test.duration_minutes) || 60) * 60;
        if(cbtTimerRef) clearInterval(cbtTimerRef);
        cbtTimerRef = setInterval(() => {
          cbtRemaining--;
          const tEl = document.getElementById("cbtTimer");
          if(tEl){ const m = Math.floor(cbtRemaining/60), s = cbtRemaining % 60; tEl.textContent = `${m}:${s<10?"0":""}${s}`; }
          if(cbtRemaining <= 0){ clearInterval(cbtTimerRef); cbtTimerRef = null; finishCbt(true); }
        }, 1000);
        renderCbtUI();
      }catch(e){
        toast(e?.message || "Unable to start CBT");
      }
    }

    function renderCbtUI(){
      const c = document.getElementById("content");
      if(!c || !cbtQuestions.length) return;
      const q = cbtQuestions[cbtIndex];
      const selected = cbtAnswers[q.id] || null;
      c.innerHTML = `<div class="timer" id="cbtTimer">${Math.floor(cbtRemaining/60)}:${(cbtRemaining%60)<10?"0":""}${cbtRemaining%60}</div><div class="cbt-layout"><div class="cbt-qbox"><div class="muted" style="margin-bottom:8px">Question ${cbtIndex+1} of ${cbtQuestions.length}</div><div style="font-size:15px;line-height:1.55;margin-bottom:12px">${escapeHtml(q.question_text)}</div><button class="cbt-opt ${selected==="A"?"selected":""}" data-o="A">${escapeHtml(q.option_a)}</button><button class="cbt-opt ${selected==="B"?"selected":""}" data-o="B">${escapeHtml(q.option_b)}</button><button class="cbt-opt ${selected==="C"?"selected":""}" data-o="C">${escapeHtml(q.option_c)}</button><button class="cbt-opt ${selected==="D"?"selected":""}" data-o="D">${escapeHtml(q.option_d)}</button><div class="cbt-nav"><button class="btn-outline" id="cbtPrev" ${cbtIndex===0?"disabled":""}>← Previous</button><button class="btn-outline" id="cbtMark">${cbtMarked.has(q.id)?"Unmark":"Mark"}</button><button class="btn" id="cbtNext">${cbtIndex===cbtQuestions.length-1?"Review":"Next →"}</button></div><button class="btn-danger" style="width:100%;margin-top:14px" id="cbtSubmit">Submit Test</button></div><div class="cbt-palette"><div style="font-weight:600;font-size:13px;margin-bottom:8px">Question Palette</div><div class="cbt-palette-grid" id="palette"></div></div></div>`;
      c.querySelectorAll(".cbt-opt").forEach(btn => { btn.onclick = () => { cbtAnswers[q.id] = btn.dataset.o; renderCbtUI(); }; });
      document.getElementById("cbtPrev").onclick = () => { if(cbtIndex > 0){ cbtIndex--; renderCbtUI(); } };
      document.getElementById("cbtNext").onclick = () => { if(cbtIndex < cbtQuestions.length-1){ cbtIndex++; renderCbtUI(); } else { finishCbt(false); } };
      document.getElementById("cbtMark").onclick = () => { if(cbtMarked.has(q.id)) cbtMarked.delete(q.id); else cbtMarked.add(q.id); renderCbtUI(); };
      document.getElementById("cbtSubmit").onclick = async () => { if(await confirmAction("Submit Test", "Submit test? Answers cannot be changed.")) finishCbt(false); };
      const palette = document.getElementById("palette");
      cbtQuestions.forEach((qq, i) => {
        const btn = el(`<button class="cbt-pbtn">${i+1}</button>`);
        if(cbtAnswers[qq.id]) btn.classList.add("answered");
        if(cbtMarked.has(qq.id)) btn.classList.add("marked");
        if(i === cbtIndex) btn.classList.add("current");
        btn.onclick = () => { cbtIndex = i; renderCbtUI(); };
        palette.appendChild(btn);
      });
    }

    async function finishCbt(auto){
      if(cbtTimerRef){ clearInterval(cbtTimerRef); cbtTimerRef = null; }
      const c = document.getElementById("content");
      c.innerHTML = `<div class="card score-card"><div class="muted">Calculating score...</div></div>`;
      let score = 0, total = cbtQuestions.length * 4, correct = 0, wrong = 0, unattempted = 0;
      let reviewQs = [];
      cbtQuestions.forEach(q => {
        const ans = cbtAnswers[q.id] || null;
        const corr = (q.correct_option || "A").toUpperCase();
        let status = "unattempted";
        if(!ans) unattempted++;
        else if(ans === corr){ correct++; status = "correct"; }
        else { wrong++; status = "wrong"; }
        reviewQs.push({id: q.id, question_text: q.question_text, option_a: q.option_a, option_b: q.option_b, option_c: q.option_c, option_d: q.option_d, correct_option: corr, user_answer: ans, status});
      });
      score = (correct * 4) + (wrong * -1);
      total = cbtQuestions.length * 4;
      const lastScoreData = {score, total, correct, wrong, unattempted, title: cbtTest?.title, at: Date.now(), review: reviewQs};
      saveLastScore(lastScoreData);
      showScoreAndReview(c, lastScoreData, auto);
    }

    function showScoreAndReview(c, data, auto){
      const den = (data.correct||0) + (data.wrong||0) + (data.unattempted||0);
      const accuracy = den ? Math.round(((data.correct||0) / den) * 100) : 0;
      c.innerHTML = `<div class="card score-card"><div class="muted" style="margin-bottom:6px">${auto ? "Time's up!" : "Test Submitted"}</div><h2 style="margin:0 0 4px">${escapeHtml(data.title || "Test")}</h2><div class="score-num">${data.score}</div><div class="muted" style="margin-bottom:18px">out of ${data.total}</div><div class="grid2" style="max-width:360px;margin:0 auto 20px;text-align:left"><div class="card" style="margin:0"><div class="muted">Correct</div><div style="font-weight:700;color:var(--green)">${data.correct||0}</div></div><div class="card" style="margin:0"><div class="muted">Wrong</div><div style="font-weight:700;color:var(--danger)">${data.wrong||0}</div></div><div class="card" style="margin:0"><div class="muted">Unattempted</div><div style="font-weight:700">${data.unattempted||0}</div></div><div class="card" style="margin:0"><div class="muted">Accuracy</div><div style="font-weight:700">${accuracy}%</div></div></div><button class="btn" style="width:100%;margin-bottom:10px" id="viewReview">Question-wise Review</button><button class="btn-outline" style="width:100%" id="backTests">Back to Tests</button></div>`;
      document.getElementById("backTests").onclick = () => { cbtTest = null; cbtQuestions = []; cbtAnswers = {}; renderTests(c); };
      document.getElementById("viewReview").onclick = () => renderQuestionReview(c, data);
    }

    function renderQuestionReview(c, data){
      if(!data.review || !data.review.length){
        c.innerHTML = `<div class="empty">Review data not available.</div><button class="btn" id="backScore">Back</button>`;
        document.getElementById("backScore").onclick = () => showScoreAndReview(c, data, false);
        return;
      }
      let html = `<button class="back" id="backScore">Score Summary</button><h2 style="margin:0 0 12px">${escapeHtml(data.title || "Review")}</h2><div class="muted" style="margin-bottom:16px">${data.correct||0} correct · ${data.wrong||0} wrong · ${data.unattempted||0} skipped</div>`;
      data.review.forEach((q, i) => {
        const statusColor = q.status === "correct" ? "var(--green)" : q.status === "wrong" ? "var(--danger)" : "var(--muted)";
        const statusText = q.status === "correct" ? "Correct" : q.status === "wrong" ? "Wrong" : "Not Attempted";
        const optHtml = (letter, text) => {
          let extra = "";
          if(q.user_answer === letter) extra += ` <span style="color:var(--accent);font-weight:600">(Your answer)</span>`;
          if(q.correct_option === letter) extra += ` <span style="color:var(--green);font-weight:600">(Correct)</span>`;
          let bg = "var(--panel2)";
          if(q.correct_option === letter) bg = "rgba(34,211,163,.12)";
          else if(q.user_answer === letter && q.status === "wrong") bg = "rgba(239,68,68,.12)";
          return `<div style="padding:10px 12px;margin:6px 0;border-radius:8px;border:1px solid var(--border);background:${bg}"><b>${letter}.</b> ${escapeHtml(text||"")}${extra}</div>`;
        };
        html += `<div class="card" style="margin-bottom:14px"><div class="row" style="margin-bottom:8px"><div style="font-weight:600">Q${i+1}</div><div style="color:${statusColor};font-weight:600;font-size:13px">${statusText}</div></div><div style="line-height:1.5;margin-bottom:10px">${escapeHtml(q.question_text)}</div>${optHtml("A", q.option_a)}${optHtml("B", q.option_b)}${optHtml("C", q.option_c)}${optHtml("D", q.option_d)}</div>`;
      });
      html += `<button class="btn" style="width:100%;margin-top:10px" id="backTests2">Back to Tests</button>`;
      c.innerHTML = html;
      document.getElementById("backScore").onclick = () => showScoreAndReview(c, data, false);
      document.getElementById("backTests2").onclick = () => { cbtTest = null; cbtQuestions = []; cbtAnswers = {}; renderTests(c); };
    }

    /* ===================== ADMIN ===================== */
    async function renderAdmin(c){
      c.innerHTML = `<h2 style="margin:0 0 12px">Admin</h2><div class="tabs2"><button class="tab2 ${adminTab==="dashboard"?"active":""}" data-a="dashboard">Dashboard</button><button class="tab2 ${adminTab==="subjects"?"active":""}" data-a="subjects">Subjects</button><button class="tab2 ${adminTab==="content"?"active":""}" data-a="content">Content</button><button class="tab2 ${adminTab==="users"?"active":""}" data-a="users">Users</button></div><div id="adminBody"></div>`;
      c.querySelectorAll(".tab2").forEach(b => { b.onclick = () => { adminTab = b.dataset.a; renderAdmin(c); }; });
      const body = document.getElementById("adminBody");
      if(adminTab === "dashboard") await renderAdminDashboard(body);
      else if(adminTab === "subjects") await renderAdminSubjects(body);
      else if(adminTab === "content") await renderAdminContent(body);
      else if(adminTab === "users") await renderAdminUsers(body);
    }

    async function renderAdminDashboard(body){
      body.innerHTML = `<div class="grid2" id="dashStats">${skelList(6,"skel-card")}</div>`;
      try{
        const [subjects, chapters, pdfs, videos, tests, users] = await Promise.all([
          db.from("subjects").select("id", {count:"exact", head:true}),
          db.from("chapters").select("id", {count:"exact", head:true}),
          db.from("pdfs").select("id", {count:"exact", head:true}),
          db.from("videos").select("id", {count:"exact", head:true}),
          db.from("tests").select("id", {count:"exact", head:true}),
          db.from("profiles").select("id", {count:"exact", head:true})
        ]);
        const stats = [{label:"Subjects", value: subjects.count||0},{label:"Chapters", value: chapters.count||0},{label:"PDFs", value: pdfs.count||0},{label:"Videos", value: videos.count||0},{label:"Tests", value: tests.count||0},{label:"Users", value: users.count||0}];
        document.getElementById("dashStats").innerHTML = stats.map(s => `<div class="card" style="text-align:center;margin:0"><div class="muted">${s.label}</div><div style="font-size:28px;font-weight:700;margin-top:6px">${s.value}</div></div>`).join("");
      }catch(e){
        document.getElementById("dashStats").innerHTML = `<div class="empty">${escapeHtml(e?.message||"Error")}</div>`;
      }
    }

    async function renderAdminSubjects(body){
      body.innerHTML = `<div class="card"><h3 style="margin:0 0 10px">Add Subject</h3><input id="newSubj" placeholder="Subject name"/><button class="btn" id="addSubj">Add Subject</button></div><h3 style="margin:16px 0 10px">All Subjects</h3><div id="subjManageList">${skelList(4)}</div>`;
      document.getElementById("addSubj").onclick = async () => {
        const name = document.getElementById("newSubj").value.trim();
        if(!name) return toast("Enter subject name");
        try{
          const {data: existing} = await db.from("subjects").select("sort_order").order("sort_order",{ascending:false}).limit(1);
          const nextOrder = (existing?.[0]?.sort_order || 0) + 1;
          await db.from("subjects").insert({name, sort_order: nextOrder});
          toast("Subject added");
          renderAdminSubjects(body);
        }catch(e){ toast(e?.message || "Error"); }
      };
      try{
        const {data, error} = await db.from("subjects").select("*").order("sort_order");
        if(error) throw error;
        const list = document.getElementById("subjManageList");
        if(!data?.length){ list.innerHTML = `<div class="empty">No subjects yet.</div>`; return; }
        list.innerHTML = "";
        data.forEach(s => {
          const row = el(`<div class="card row"><div style="flex:1"><div style="font-weight:600">${escapeHtml(s.name)}</div></div><button class="btn-small delS">Delete</button></div>`);
          row.querySelector(".delS").onclick = async () => {
            const ok = await confirmAction("Delete Subject", `Delete "${s.name}"?`);
            if(!ok) return;
            try{await db.from("subjects").delete().eq("id", s.id);toast("Subject deleted");renderAdminSubjects(body);}catch(e){toast(e?.message || "Delete failed");}
          };
          list.appendChild(row);
        });
      }catch(e){
        document.getElementById("subjManageList").innerHTML = `<div class="empty">${escapeHtml(e?.message||"Error")}</div>`;
      }
    }

    async function renderAdminContent(body){
      body.innerHTML = `<div class="card"><h3 style="margin:0 0 10px">Add Chapter</h3><select id="chSubj"></select><input id="newChap" placeholder="Chapter name"/><button class="btn" id="addChap">Add Chapter</button></div><h3 style="margin:16px 0 10px">Chapters</h3><div id="chapManageList">${skelList(3)}</div>`;
      try{
        const {data: subjects} = await db.from("subjects").select("*").order("sort_order");
        const opts = (subjects||[]).map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join("") || `<option value="">No subjects</option>`;
        document.getElementById("chSubj").innerHTML = opts;
        document.getElementById("addChap").onclick = async () => {
          const subject_id = document.getElementById("chSubj").value;
          const name = document.getElementById("newChap").value.trim();
          if(!subject_id || !name) return toast("Select subject and enter name");
          try{
            const {data: existing} = await db.from("chapters").select("sort_order").eq("subject_id", subject_id).order("sort_order",{ascending:false}).limit(1);
            const nextOrder = (existing?.[0]?.sort_order || 0) + 1;
            await db.from("chapters").insert({subject_id, name, sort_order: nextOrder});
            toast("Chapter added");
            renderAdminContent(body);
          }catch(e){ toast(e?.message || "Error"); }
        };
        const {data: allChaps} = await db.from("chapters").select("*, subjects(name)").order("sort_order");
        const chapList = document.getElementById("chapManageList");
        if(!allChaps?.length) chapList.innerHTML = `<div class="empty">No chapters</div>`;
        else {
          chapList.innerHTML = "";
          allChaps.forEach(ch => {
            const row = el(`<div class="card row"><div style="flex:1"><div style="font-weight:600">${escapeHtml(ch.name)}</div><div class="muted">${escapeHtml(ch.subjects?.name||"")}</div></div><button class="btn-small delChap">Delete</button></div>`);
            row.querySelector(".delChap").onclick = async () => {
              const ok = await confirmAction("Delete Chapter", `Delete "${ch.name}"?`);
              if(!ok) return;
              try{await db.from("chapters").delete().eq("id", ch.id);toast("Chapter deleted");renderAdminContent(body);}catch(e){toast(e?.message||"Delete failed");}
            };
            chapList.appendChild(row);
          });
        }
      }catch(e){
        body.innerHTML += `<div class="empty">${escapeHtml(e?.message||"Error")}</div>`;
      }
    }

    async function renderAdminUsers(body){
      try{
        const {data, error} = await db.from("profiles").select("*").order("created_at",{ascending:false});
        if(error) throw error;
        if(!data?.length){ body.innerHTML = `<div class="empty">No users yet.</div>`; return; }
        body.innerHTML = `<table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody id="uRows"></tbody></table>`;
        const rows = document.getElementById("uRows");
        rows.innerHTML = "";
        data.forEach(p => {
          const tr = el(`<tr><td>${escapeHtml(p.email||"")}</td><td>${escapeHtml(p.role||"user")}</td><td>${escapeHtml(p.status||"pending")}</td><td class="row-wrap"><button class="btn-small">Activate</button><button class="btn-small">Pause</button><button class="btn-small">Block</button></td></tr>`);
          rows.appendChild(tr);
        });
      }catch(e){
        body.innerHTML = `<div class="empty">${escapeHtml(e?.message||"Error")}</div>`;
      }
    }

    // Start app
    initializeApp();
  </script>
</body>
</html>
