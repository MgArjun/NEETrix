<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEETrix</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070a12;
    --panel:#121826;
    --panel2:#181f30;
    --border:#252e42;
    --text:#eef1f8;
    --muted:#8b95ad;
    --accent:#5b8aff;
    --accent2:#7c6bff;
    --danger:#ef5a5a;
    --good:#3ecf8e;
    --warn:#f4b752;
    --radius:14px;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  #app{min-height:100vh;}

  input,textarea,select{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:11px 13px;
    font-size:14px;
    margin-bottom:10px;
    outline:none;
    font-family:inherit;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}

  button{cursor:pointer;font-family:inherit;}

  .btn{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;
    padding:11px 16px;border-radius:10px;
    font-size:13.5px;font-weight:600;
    transition:0.2s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(91,138,255,0.3);}
  .btn:disabled{opacity:.5;}

  .btn-outline{
    background:none;border:1px solid var(--border);
    color:var(--text);padding:9px 14px;border-radius:9px;font-size:13px;
  }
  .btn-outline:hover{border-color:var(--accent);color:var(--accent);}

  .btn-danger{background:var(--danger);border:none;color:#fff;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;}
  .btn-good{background:var(--good);border:none;color:#06281a;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;}
  .btn-warn{background:var(--warn);border:none;color:#3a2a00;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;}
  .btn-small{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-size:12px;}

  .auth-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;background:radial-gradient(ellipse at top,#121a2e 0%,var(--bg) 65%);
  }
  .auth-card{
    background:var(--panel);border:1px solid var(--border);
    border-radius:18px;padding:32px;width:100%;max-width:380px;
  }
  .brand{
    font-size:24px;font-weight:800;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{color:var(--muted);font-size:13.5px;margin:6px 0 20px;}
  .msg{font-size:12.5px;margin:-2px 0 10px;min-height:14px;}
  .link{color:var(--accent);background:none;border:none;font-size:13px;text-align:center;width:100%;margin-top:8px;cursor:pointer;}

  .topbar{
    display:flex;align-items:center;gap:6px;
    padding:12px 16px;border-bottom:1px solid var(--border);
    background:var(--panel);overflow-x:auto;position:sticky;top:0;z-index:40;
  }
  .topbar .brand{font-size:17px;margin:0;flex-shrink:0;}
  .navbtn{
    background:none;border:1px solid transparent;color:var(--muted);
    padding:7px 12px;border-radius:8px;font-size:12.5px;white-space:nowrap;flex-shrink:0;
  }
  .navbtn.active{background:var(--panel2);color:var(--text);border-color:var(--border);}
  .spacer{flex:1;min-width:8px;}

  .profile-btn{
    width:34px;height:34px;border-radius:50%;background:var(--panel2);
    border:1px solid var(--border);color:var(--text);font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }

  .content{max-width:920px;margin:0 auto;padding:20px 16px 70px;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.grid2{grid-template-columns:1fr;}}

  .subject-card{
    background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:18px;cursor:pointer;transition:0.2s;
  }
  .subject-card:hover{border-color:var(--accent);transform:translateY(-2px);}

  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .row-wrap{display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
  .muted{color:var(--muted);font-size:12.5px;}
  .badge{font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--muted);}
  .badge.admin{color:var(--accent);border-color:var(--accent);}
  .badge.active{color:var(--good);border-color:var(--good);}
  .badge.paused{color:var(--warn);border-color:var(--warn);}
  .badge.blocked{color:var(--danger);border-color:var(--danger);}
  .badge.pending{color:var(--muted);}

  .back{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;}
  .tabs2{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap;}
  .tab2{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:8px;font-size:12.5px;}
  .tab2.active{color:#fff;background:var(--accent);border-color:var(--accent);}

  h2{font-size:19px;margin:4px 0 8px;font-weight:700;}
  h3{font-size:15px;margin:14px 0 8px;}
  .empty{color:var(--muted);font-size:13px;padding:24px 0;text-align:center;}

  /* Home */
  .home-hero{
    text-align:center;padding:28px 16px 22px;
    background:linear-gradient(180deg,rgba(91,138,255,0.07) 0%,transparent 100%);
    border:1px solid var(--border);border-radius:16px;margin-bottom:20px;
  }
  .atom-wrap{width:110px;height:110px;margin:0 auto 14px;position:relative;}
  .atom-core{
    width:16px;height:16px;background:var(--accent);border-radius:50%;
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    box-shadow:0 0 16px var(--accent);
  }
  .orbit{
    position:absolute;top:50%;left:50%;border:1px solid rgba(91,138,255,0.3);
    border-radius:50%;transform:translate(-50%,-50%);
    animation:spin 8s linear infinite;
  }
  .orbit1{width:55px;height:36px;animation-duration:6s;}
  .orbit2{width:82px;height:50px;animation-duration:9s;animation-direction:reverse;}
  .orbit3{width:100px;height:64px;animation-duration:12s;}
  .electron{width:7px;height:7px;background:#7dd3fc;border-radius:50%;position:absolute;top:-3.5px;left:50%;margin-left:-3.5px;box-shadow:0 0 6px #7dd3fc;}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg);}}

  .welcome{font-size:21px;font-weight:700;margin-bottom:4px;}
  .progress-box{
    background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:16px;margin-bottom:20px;text-align:center;
  }
  .home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:600px){.home-grid{grid-template-columns:1fr;}}
  .home-card{
    background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:20px 14px;text-align:center;cursor:pointer;transition:0.2s;
  }
  .home-card:hover{border-color:var(--accent);transform:translateY(-3px);}
  .home-card .icon{font-size:26px;margin-bottom:8px;}
  .powered{text-align:center;font-size:11px;color:var(--muted);padding:20px 0 8px;opacity:0.7;}

  .yt-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden;background:#000;margin-bottom:10px;}
  .yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;}
  .modal-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;max-width:900px;width:100%;max-height:88vh;overflow:auto;padding:16px;}
  .modal-close{background:none;border:none;color:var(--muted);float:right;font-size:22px;}
  .timer{font-size:22px;font-weight:800;color:var(--warn);text-align:center;padding:10px;background:var(--panel2);border-radius:10px;margin-bottom:10px;}
  .zoom-row{display:flex;gap:8px;justify-content:center;margin-top:8px;}
  .zoom-row button{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;}

  .fatal-error{min-height:100vh;background:var(--bg);color:#fff;padding:24px;}
  .fatal-box{max-width:700px;margin:40px auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;}
  .fatal-title{color:var(--danger);margin-top:0;}
  .fatal-text{color:#c5cada;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const SUPABASE_URL = "https://qhggamgxfwlwtpmwxfwk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_X9_aDiQcrKhYyPfuQdnKPA_K8F7RPjM";
const GEMINI_API_KEY = "";

/* =========================================================
   GLOBALS
   ========================================================= */
let db = null;
let pdfjsReady = false;
let session = null;
let profile = null;
let activeTab = "home";
let selSubject = null;
let selChapter = null;
let selCategory = "general";
let adminTab = "users";

/* =========================================================
   HELPERS
   ========================================================= */
const app = document.getElementById("app");

function escapeHtml(value){
  return (value ?? "").toString().replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}
function el(html){
  const d = document.createElement("div");
  d.innerHTML = html.trim();
  return d.firstElementChild;
}
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(Number.isNaN(d.getTime())) return "";
  return d.toLocaleString(undefined,{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function ytId(url){
  const m = (url||"").match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}
function showFatalError(message){
  document.body.innerHTML = `
    <div class="fatal-error">
      <div class="fatal-box">
        <h2 class="fatal-title">NEETrix Error</h2>
        <div class="fatal-text">${escapeHtml(message)}</div>
      </div>
    </div>`;
}

/* =========================================================
   LOADERS
   ========================================================= */
function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Failed to load: "+src));
    document.head.appendChild(s);
  });
}
async function loadSupabase(){
  if(window.supabase) return true;
  const sources = [
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
    "https://unpkg.com/@supabase/supabase-js@2"
  ];
  let lastError = null;
  for(const src of sources){
    try{
      await loadScript(src);
      if(window.supabase) return true;
    }catch(e){ lastError = e; }
  }
  throw lastError || new Error("Supabase library could not be loaded.");
}
async function loadPdfJs(){
  if(window.pdfjsLib){ pdfjsReady = true; return true; }
  const sources = [
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",
    "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"
  ];
  for(const src of sources){
    try{
      await loadScript(src);
      if(window.pdfjsLib){ pdfjsReady = true; return true; }
    }catch(e){}
  }
  return false;
}

/* =========================================================
   INIT
   ========================================================= */
async function initializeApp(){
  try{
    await loadSupabase();
    if(!SUPABASE_URL || !SUPABASE_ANON_KEY ||
       SUPABASE_URL === "YOUR_SUPABASE_URL" ||
       SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY"){
      throw new Error("Supabase is not configured.\n\nAdd your existing Supabase Project URL and public/anon key in the CONFIG section.");
    }
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    loadPdfJs().catch(()=>{});
    await boot();
  }catch(error){
    console.error(error);
    showFatalError(error?.message || "NEETrix could not start.");
  }
}

/* =========================================================
   AUTH
   ========================================================= */
function renderAuth(mode){
  mode = mode || "login";
  app.innerHTML = "";
  app.appendChild(el(`
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="brand">NEETrix</div>
        <div class="sub">The focused way to prepare.</div>
        <div class="msg" id="msg"></div>
        <div id="fields"></div>
        <button class="btn" style="width:100%" id="mainBtn"></button>
        <button class="link" id="link1"></button>
        <button class="link" id="link2" style="display:none"></button>
      </div>
    </div>
  `));

  const fields = document.getElementById("fields");
  const mainBtn = document.getElementById("mainBtn");
  const link1 = document.getElementById("link1");
  const link2 = document.getElementById("link2");
  const msg = document.getElementById("msg");

  if(mode === "login" || mode === "signup"){
    fields.innerHTML = `
      <input id="email" type="email" placeholder="Email address" autocomplete="email" />
      <input id="pass" type="password" placeholder="Password (8+ characters)" autocomplete="${mode==="login"?"current-password":"new-password"}" />
    `;
    mainBtn.textContent = mode === "login" ? "Log in" : "Create account";
    link1.textContent = mode === "login" ? "New here? Create an account" : "Already have an account? Log in";
    link1.onclick = () => renderAuth(mode === "login" ? "signup" : "login");
    link2.style.display = mode === "login" ? "block" : "none";
    link2.textContent = "Forgot password?";
    link2.onclick = () => renderAuth("forgot");

    mainBtn.onclick = async () => {
      msg.textContent = "";
      mainBtn.disabled = true;
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("pass").value;
      if(!email || !pass){
        msg.style.color = "var(--muted)";
        msg.textContent = "Enter both fields.";
        mainBtn.disabled = false;
        return;
      }
      try{
        if(mode === "signup"){
          const {error} = await db.auth.signUp({email, password:pass});
          if(error) throw error;
          msg.style.color = "var(--good)";
          msg.textContent = "Account created! Check your email if confirmation is required, then log in.";
          setTimeout(() => renderAuth("login"), 1800);
        }else{
          const {data, error} = await db.auth.signInWithPassword({email, password:pass});
          if(error) throw error;
          session = data.session;
          await afterLogin();
        }
      }catch(error){
        msg.style.color = "var(--danger)";
        msg.textContent = error?.message || "Something went wrong.";
      }finally{
        mainBtn.disabled = false;
      }
    };
  }else if(mode === "forgot"){
    fields.innerHTML = `<input id="email" type="email" placeholder="Email address" autocomplete="email" />`;
    mainBtn.textContent = "Send reset link";
    link1.textContent = "Back to log in";
    link1.onclick = () => renderAuth("login");
    mainBtn.onclick = async () => {
      msg.textContent = "";
      mainBtn.disabled = true;
      const email = document.getElementById("email").value.trim();
      if(!email){
        msg.style.color = "var(--muted)";
        msg.textContent = "Enter your email address.";
        mainBtn.disabled = false;
        return;
      }
      try{
        const {error} = await db.auth.resetPasswordForEmail(email);
        if(error) throw error;
        msg.style.color = "var(--good)";
        msg.textContent = "Reset link sent — check your email.";
      }catch(error){
        msg.style.color = "var(--danger)";
        msg.textContent = error?.message || "Something went wrong.";
      }finally{
        mainBtn.disabled = false;
      }
    };
  }
}

/* =========================================================
   STATUS SCREEN
   ========================================================= */
function renderStatusScreen(status){
  app.innerHTML = "";
  const msgs = {
    pending:["Request sent","Your access request has been sent to the admin. You'll be able to log in once approved."],
    paused:["Account paused","Your account has been paused by the admin. Please check back later."],
    blocked:["Account blocked","Your account access has been blocked by the admin."]
  };
  const [title,body] = msgs[status] || ["Access unavailable","Please contact the admin."];
  app.appendChild(el(`
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="brand">NEETrix</div>
        <h2 style="margin-top:14px;">${escapeHtml(title)}</h2>
        <p class="muted" style="line-height:1.6;margin:10px 0 16px;">${escapeHtml(body)}</p>
        <button class="btn-outline" style="width:100%;" id="out">Log out</button>
      </div>
    </div>
  `));
  document.getElementById("out").onclick = async () => {
    try{ await db.auth.signOut(); }catch(e){}
    session = null; profile = null;
    renderAuth();
  };
}

/* =========================================================
   AFTER LOGIN
   ========================================================= */
async function afterLogin(){
  if(!session || !session.user){ renderAuth(); return; }
  try{
    try{
      await db.from("login_events").insert({user_id:session.user.id, email:session.user.email});
    }catch(e){}
    const {data, error} = await db.from("profiles").select("*").eq("id",session.user.id).single();
    if(error){
      if(error.code === "PGRST116"){
        profile = null;
        renderStatusScreen("pending");
        return;
      }
      throw error;
    }
    profile = data;
    if(!profile || profile.status !== "active"){
      renderStatusScreen(profile ? profile.status : "pending");
      return;
    }
    activeTab = "home";
    selSubject = null;
    selChapter = null;
    renderShell();
  }catch(error){
    showFatalError(error?.message || "Unable to load your account.");
  }
}

/* =========================================================
   SHELL
   ========================================================= */
function renderShell(){
  app.innerHTML = "";
  const isAdmin = profile && profile.role === "admin";
  const initial = (profile?.email || "U")[0].toUpperCase();

  app.appendChild(el(`
    <div>
      <div class="topbar">
        <div class="brand">NEETrix</div>
        <button class="navbtn" data-t="home">Home</button>
        <button class="navbtn" data-t="content">Content</button>
        <button class="navbtn" data-t="questions">Questions</button>
        <button class="navbtn" data-t="bookmarks">Bookmarks</button>
        <button class="navbtn" data-t="tests">Test</button>
        ${isAdmin ? `<button class="navbtn" data-t="admin">Admin</button>` : ""}
        <div class="spacer"></div>
        <button class="profile-btn" id="logout">${initial}</button>
      </div>
      <div class="content" id="content"></div>
      <div class="powered">Powered by Suraj Kumar</div>
    </div>
  `));

  document.getElementById("logout").onclick = async () => {
    if(!confirm("Log out?")) return;
    try{ await db.auth.signOut(); }catch(e){}
    session = null; profile = null;
    activeTab = "home"; selSubject = null; selChapter = null;
    renderAuth();
  };

  document.querySelectorAll(".navbtn").forEach(btn => {
    btn.onclick = () => {
      activeTab = btn.dataset.t;
      selSubject = null;
      selChapter = null;
      renderTabsUI();
      renderBody();
    };
  });

  renderTabsUI();
  renderBody();
}

function renderTabsUI(){
  document.querySelectorAll(".navbtn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.t === activeTab);
  });
}

function renderBody(){
  const c = document.getElementById("content");
  if(!c) return;
  if(activeTab === "home") renderHome(c);
  else if(activeTab === "content") renderSubjectBrowser(c, "video");
  else if(activeTab === "questions") renderSubjectBrowser(c, "pdf");
  else if(activeTab === "tests") renderTests(c);
  else if(activeTab === "bookmarks") renderBookmarks(c);
  else if(activeTab === "admin"){
    if(profile?.role === "admin") renderAdmin(c);
    else { activeTab = "home"; renderTabsUI(); renderHome(c); }
  }
}

/* =========================================================
   HOME
   ========================================================= */
function renderHome(c){
  const name = profile?.email ? profile.email.split("@")[0] : "Student";
  c.innerHTML = `
    <div class="home-hero">
      <div class="atom-wrap">
        <div class="atom-core"></div>
        <div class="orbit orbit1"><div class="electron"></div></div>
        <div class="orbit orbit2"><div class="electron"></div></div>
        <div class="orbit orbit3"><div class="electron"></div></div>
      </div>
      <div class="welcome">Hey ${escapeHtml(name)}</div>
      <div class="muted">Ready to study today?</div>
    </div>
    <div class="progress-box">
      <div style="font-weight:600;margin-bottom:6px;">Your Progress</div>
      <div class="muted">Attempt questions & tests to see your progress here.</div>
    </div>
    <div class="home-grid">
      <div class="home-card" data-go="content">
        <div class="icon">▶️</div>
        <h3 style="margin:0 0 4px;font-size:15px;">Content</h3>
        <div class="muted">Video lessons</div>
      </div>
      <div class="home-card" data-go="questions">
        <div class="icon">📄</div>
        <h3 style="margin:0 0 4px;font-size:15px;">Questions</h3>
        <div class="muted">Practice & PYQs</div>
      </div>
      <div class="home-card" data-go="tests">
        <div class="icon">📝</div>
        <h3 style="margin:0 0 4px;font-size:15px;">Tests</h3>
        <div class="muted">Mock tests</div>
      </div>
    </div>
  `;
  c.querySelectorAll(".home-card").forEach(card => {
    card.onclick = () => {
      activeTab = card.dataset.go;
      renderTabsUI();
      renderBody();
    };

}

    `;
    if(mode === "pdf"){
      c.querySelectorAll(".tab2").forEach(btn => {

      <h2>Chapters</h2>
      <div id="chapList"></div>
    `;

      const row = el(`<div class="card row" style="cursor:pointer;"><span>${escapeHtml(chapter.name)}</span><span class="muted">→</span></div>`);

      wrap.appendChild(row);
    });

  }

  c.innerHTML = `<button class="back" id="b2">← ${escapeHtml(selChapter.name)}</button>`;
  document.getElementById("b2").onclick = () => { selChapter = null; renderBody(); };

  if(mode === "video"){
    const box = el(`<div id="vidBox"></div>`);
    c.appendChild(box);
    const {data, error} = await db.from("videos").select("*").eq("chapter_id", selChapter.id).order("sort_order");
    if(error){ box.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`; return; }
    if(!data || !data.length){ box.innerHTML = `<div class="empty">No videos yet.</div>`; return; }

      <h3>${escapeHtml(v.title)}</h3>
      <div class="yt-wrap">
        <iframe src="https://www.youtube-nocookie.com/embed/${escapeHtml(v.youtube_id)}?modestbranding=1&rel=0"
          title="${escapeHtml(v.title)}" allowfullscreen></iframe>
      </div>
    `).join("");
  }else{
    const list = el(`<div id="pdfList"></div>`);
    c.appendChild(list);
    const {data, error} = await db.from("pdfs").select("*")
      .eq("chapter_id", selChapter.id).eq("category", selCategory)
      .order("created_at", {ascending:false});
    if(error){ list.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`; return; }
    if(!data || !data.length){ list.innerHTML = `<div class="empty">No content in this category yet.</div>`; return; }

    let bmSet = new Set();
    try{
      const {data:bms} = await db.from("bookmarks").select("pdf_id").eq("user_id", session.user.id);
      if(bms) bmSet = new Set(bms.map(b => b.pdf_id));
    }catch(e){}

    list.innerHTML = "";
    data.forEach(pdf => {
      const row = el(`
        <div class="card row">
          <span style="cursor:pointer;flex:1;" class="openPdf">${escapeHtml(pdf.title)}</span>
          <button class="btn-small bmBtn">${bmSet.has(pdf.id) ? "★ Saved" : "☆ Save"}</button>
        </div>
      `);
      row.querySelector(".openPdf").onclick = () => openPdf(pdf);
      row.querySelector(".bmBtn").onclick = async (e) => {
        e.stopPropagation();
        try{
          if(bmSet.has(pdf.id)){
            await db.from("bookmarks").delete().eq("user_id", session.user.id).eq("pdf_id", pdf.id);
          }else{
            await db.from("bookmarks").insert({user_id:session.user.id, pdf_id:pdf.id});
          }
          renderBody();
        }catch(err){
          alert(err?.message || "Could not update bookmark.");
        }
      };
      list.appendChild(row);
    });
  }
}

/* =========================================================
   PDF
   ========================================================= */
async function openPdf(pdf){
  try{
    const {data, error} = await db.storage.from("content").createSignedUrl(pdf.file_path, 3600);
    if(error) throw error;
    if(!data?.signedUrl) throw new Error("Could not create PDF link.");
    await showPdfModal(data.signedUrl, pdf.title);
  }catch(error){
    alert(error?.message || "Unable to open PDF.");
  }
}
async function showPdfModal(url, title){
  if(!window.pdfjsLib) await loadPdfJs();
  if(!window.pdfjsLib){ alert("PDF viewer could not be loaded."); return; }
  const modal = el(`
    <div class="modal-bg">
      <div class="modal-box">
        <button class="modal-close" id="mc">×</button>
        <h3>${escapeHtml(title||"")}</h3>
        <div style="overflow:auto;text-align:center;"><canvas id="pc"></canvas></div>
        <div class="zoom-row">
          <button id="zo">−</button>
          <span id="zl">100%</span>
          <button id="zi">+</button>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(modal);
  document.getElementById("mc").onclick = () => modal.remove();

  const pdfjsLib = window.pdfjsLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  let scale = 1.2;
  try{
    const pdfDoc = await pdfjsLib.getDocument({url, withCredentials:false}).promise;
    const page = await pdfDoc.getPage(1);
    const render = async () => {
      const viewport = page.getViewport({scale});
      const canvas = document.getElementById("pc");
      if(!canvas) return;
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({canvasContext:canvas.getContext("2d"), viewport}).promise;
      document.getElementById("zl").textContent = Math.round(scale/1.2*100) + "%";
    };
    await render();
    document.getElementById("zi").onclick = () => { scale += 0.3; render().catch(console.error); };
    document.getElementById("zo").onclick = () => { scale = Math.max(0.5, scale-0.3); render().catch(console.error); };
  }catch(error){
    modal.querySelector(".modal-box").innerHTML += `<div class="empty">Unable to render this PDF.<br>${escapeHtml(error?.message||"")}</div>`;
  }
}

async function startTest(test){
  if(!test.file_path){
    alert("No question paper uploaded for this test yet.");
    return;
  }
  try{
    const {data, error} = await db.storage.from("content").createSignedUrl(test.file_path, 7200);
    if(error) throw error;
    if(!data?.signedUrl) throw new Error("Could not create test PDF link.");
    if(!window.pdfjsLib) await loadPdfJs();
    if(!window.pdfjsLib){ alert("PDF viewer could not be loaded."); return; }

    const modal = el(`
      <div class="modal-bg">
        <div class="modal-box">
          <div class="timer" id="tmr"></div>
          <h3>${escapeHtml(test.title)}</h3>
          <div style="overflow:auto;text-align:center;"><canvas id="pc"></canvas></div>
          <div class="zoom-row">
            <button id="zo">−</button>
            <span id="zl">100%</span>
            <button id="zi">+</button>
          </div>
          <button class="btn" style="width:100%;margin-top:14px;" id="submitTest">Submit Test</button>
        </div>
      </div>
    `);
    document.body.appendChild(modal);

    let remaining = (Number(test.duration_minutes) || 60) * 60;
    const timerEl = document.getElementById("tmr");
    let timerRef = null;
    const finish = () => {
      if(timerRef) clearInterval(timerRef);
      modal.remove();
      alert("Test submitted.");
    };
    const tick = () => {
      const m = Math.floor(remaining/60);
      const s = remaining % 60;
      timerEl.textContent = `${m}:${s<10?"0":""}${s} remaining`;
      if(remaining <= 0){ finish(); return; }
      remaining--;
    };
    tick();
    timerRef = setInterval(tick, 1000);
    document.getElementById("submitTest").onclick = () => {
      if(confirm("Submit the test now?")) finish();
    };

    const pdfjsLib = window.pdfjsLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    let scale = 1.2;
    const pdfDoc = await pdfjsLib.getDocument({url:data.signedUrl, withCredentials:false}).promise;
    const page = await pdfDoc.getPage(1);
    const render = async () => {
      const viewport = page.getViewport({scale});
      const canvas = document.getElementById("pc");
      if(!canvas) return;
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({canvasContext:canvas.getContext("2d"), viewport}).promise;
      document.getElementById("zl").textContent = Math.round(scale/1.2*100) + "%";
    };
    await render();
    document.getElementById("zi").onclick = () => { scale += 0.3; render().catch(console.error); };
    document.getElementById("zo").onclick = () => { scale = Math.max(0.5, scale-0.3); render().catch(console.error); };
  }catch(error){
    alert(error?.message || "Unable to start test.");
  }
}

async function renderAdmin(c){
  c.innerHTML = `
    <h2>Admin</h2>
    <div class="tabs2">
      <button class="tab2 ${adminTab==="users"?"active":""}" data-a="users">Users</button>
      <button class="tab2 ${adminTab==="logins"?"active":""}" data-a="logins">Login History</button>
      <button class="tab2 ${adminTab==="settings"?"active":""}" data-a="settings">Settings</button>

    </div>
    <div id="adminBody"></div>
  `;
  c.querySelectorAll(".tab2").forEach(btn => {
    btn.onclick = () => { adminTab = btn.dataset.a; renderAdmin(c); };
  });
  const body = document.getElementById("adminBody");
  if(adminTab === "users") await renderAdminUsers(body);
  else if(adminTab === "logins") await renderAdminLogins(body);

async function renderAdminUsers(body){
  try{
    const {data, error} = await db.from("profiles").select("*").order("created_at",{ascending:false});
    if(error) throw error;
    if(!data || !data.length){ body.innerHTML = `<div class="empty">No users yet.</div>`; return; }
    body.innerHTML = `<table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody id="uRows"></tbody></table>`;
    const rows = document.getElementById("uRows");
    data.forEach(user => {
      const tr = el(`
        <tr>
          <td>${escapeHtml(user.email)}</td>
          <td><span class="badge ${user.role==="admin"?"admin":""}">${escapeHtml(user.role)}</span></td>
          <td><span class="badge ${escapeHtml(user.status)}">${escapeHtml(user.status)}</span></td>
          <td class="row-wrap" id="act-${escapeHtml(user.id)}"></td>
        </tr>
      `);
      rows.appendChild(tr);
      const actBox = tr.querySelector(`#act-${CSS.escape(user.id)}`);
      if(user.role === "admin"){ actBox.innerHTML = `<span class="muted">—</span>`; return; }
      const setStatus = async (status) => {
        try{
          await db.from("profiles").update({status}).eq("id", user.id);
          renderAdmin(document.getElementById("content"));
        }catch(e){ alert(e?.message || "Could not update user."); }
      };
      if(user.status === "pending"){
        const approve = el(`<button class="btn-good">Approve</button>`);
        approve.onclick = () => setStatus("active");
        actBox.appendChild(approve);
        const reject = el(`<button class="btn-danger">Reject</button>`);
        reject.onclick = () => setStatus("blocked");
        actBox.appendChild(reject);
      }else{
        const pauseBtn = el(`<button class="btn-warn">${user.status==="paused"?"Resume":"Pause"}</button>`);
        pauseBtn.onclick = () => setStatus(user.status==="paused"?"active":"paused");
        actBox.appendChild(pauseBtn);
        const blockBtn = el(`<button class="btn-danger">${user.status==="blocked"?"Unblock":"Block"}</button>`);
        blockBtn.onclick = () => setStatus(user.status==="blocked"?"active":"blocked");
        actBox.appendChild(blockBtn);
      }
    });
  }catch(error){
    body.innerHTML = `<div class="empty">${escapeHtml(error?.message || "Unable to load users.")}</div>`;
  }
}

async function renderAdminContent(body){
  body.innerHTML = `
    <h3>Add Subject</h3>
    <input id="newSubj" placeholder="Subject name (e.g. Physics)" />
    <button class="btn" id="addSubj">Add Subject</button>

    <h3>Add Chapter</h3>
    <select id="chSubj"></select>
    <input id="newChap" placeholder="Chapter name" />
    <button class="btn" id="addChap">Add Chapter</button>

    <h3>Add Video (YouTube link)</h3>
    <select id="vidSubj"></select>
    <select id="vidChap"></select>
    <input id="vidTitle" placeholder="Video title" />
    <input id="vidUrl" placeholder="Paste YouTube link" />
    <button class="btn" id="addVid">Add Video</button>

    <h3>Add Question PDF</h3>
    <select id="pdfSubj"></select>
    <select id="pdfChap"></select>
    <select id="pdfCat">
      <option value="general">Practice</option>
      <option value="ncert">Important</option>
      <option value="pyq">PYQs</option>
    </select>
    <input id="pdfTitle" placeholder="PDF title" />
    <input type="file" id="pdfFile" accept="application/pdf" />
    <button class="btn" id="addPdf">Upload PDF</button>

    <h3>Add Test</h3>
    <input id="testTitle" placeholder="Test title" />
    <input id="testDur" type="number" placeholder="Duration (minutes)" value="60" />
    <input type="file" id="testFile" accept="application/pdf" />
    <button class="btn" id="addTest">Create Test</button>
  `;

  try{
    const {data:subjects, error} = await db.from("subjects").select("*").order("sort_order");
    if(error) throw error;
    const subjectOptions = (subjects||[]).map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join("");
    ["chSubj","vidSubj","pdfSubj"].forEach(id => {
      const sel = document.getElementById(id);
      if(sel) sel.innerHTML = subjectOptions || `<option value="">No subjects yet</option>`;
    });

    const loadChapters = async (subId, chapId) => {
      const subSel = document.getElementById(subId);
      const chapSel = document.getElementById(chapId);
      if(!subSel || !chapSel) return;
      const subjectId = subSel.value;
      if(!subjectId){ chapSel.innerHTML = `<option value="">No chapters</option>`; return; }
      const {data:chapters} = await db.from("chapters").select("*").eq("subject_id", subjectId).order("sort_order");
      chapSel.innerHTML = (chapters||[]).map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join("") || `<option value="">No chapters</option>`;
    };

    if(subjects && subjects.length){
      await loadChapters("vidSubj","vidChap");
      await loadChapters("pdfSubj","pdfChap");
    }
    document.getElementById("vidSubj").onchange = () => loadChapters("vidSubj","vidChap");
    document.getElementById("pdfSubj").onchange = () => loadChapters("pdfSubj","pdfChap");

    document.getElementById("addSubj").onclick = async () => {
      const name = document.getElementById("newSubj").value.trim();
      if(!name) return;
      try{
        await db.from("subjects").insert({name});
        renderAdminContent(body);
      }catch(e){ alert(e?.message || "Could not add subject."); }
    };

    document.getElementById("addChap").onclick = async () => {
      const subject_id = document.getElementById("chSubj").value;
      const name = document.getElementById("newChap").value.trim();
      if(!subject_id || !name) return;
      try{
        await db.from("chapters").insert({subject_id, name});
        renderAdminContent(body);
      }catch(e){ alert(e?.message || "Could not add chapter."); }
    };

    document.getElementById("addVid").onclick = async () => {
      const chapter_id = document.getElementById("vidChap").value;
      const title = document.getElementById("vidTitle").value.trim();
      const url = document.getElementById("vidUrl").value.trim();
      const youtubeId = ytId(url);
      if(!chapter_id || !title || !youtubeId){
        alert("Check chapter, title and valid YouTube link.");
        return;
      }
      try{
        await db.from("videos").insert({chapter_id, title, youtube_id:youtubeId});
        renderAdminContent(body);
      }catch(e){ alert(e?.message || "Could not add video."); }
    };

    document.getElementById("addPdf").onclick = async () => {
      const chapter_id = document.getElementById("pdfChap").value;
      const category = document.getElementById("pdfCat").value;
      const title = document.getElementById("pdfTitle").value.trim();
      const file = document.getElementById("pdfFile").files[0];
      if(!chapter_id || !title || !file){
        alert("Select chapter, title and PDF.");
        return;
      }
      if(file.type !== "application/pdf"){ alert("Please select a PDF."); return; }
      try{
        const path = `pdfs/${crypto.randomUUID()}_${file.name}`;
        const {error:upErr} = await db.storage.from("content").upload(path, file, {cacheControl:"3600", upsert:false});
        if(upErr) throw upErr;
        const {error:insErr} = await db.from("pdfs").insert({chapter_id, category, title, file_path:path});
        if(insErr){
          try{ await db.storage.from("content").remove([path]); }catch(e){}
          throw insErr;
        }
        renderAdminContent(body);
      }catch(e){ alert(e?.message || "Could not upload PDF."); }
    };

    document.getElementById("addTest").onclick = async () => {
      const title = document.getElementById("testTitle").value.trim();
      const duration_minutes = parseInt(document.getElementById("testDur").value) || 60;
      const file = document.getElementById("testFile").files[0];
      if(!title){ alert("Enter a test title."); return; }
      try{
        let file_path = null;
        if(file){
          if(file.type !== "application/pdf"){ alert("Test file must be PDF."); return; }
          file_path = `tests/${crypto.randomUUID()}_${file.name}`;
          const {error:upErr} = await db.storage.from("content").upload(file_path, file, {cacheControl:"3600", upsert:false});
          if(upErr) throw upErr;
        }
        const {error} = await db.from("tests").insert({title, duration_minutes, file_path});
        if(error){
          if(file_path) try{ await db.storage.from("content").remove([file_path]); }catch(e){}
          throw error;
        }
        renderAdminContent(body);
      }catch(e){ alert(e?.message || "Could not create test."); }
    };
  }catch(error){
    body.innerHTML += `<div class="empty">${escapeHtml(error?.message || "Unable to load admin content.")}</div>`;
  }
}

/* =========================================================
   BOOT
   ========================================================= */
async function boot(){
  if(!db) throw new Error("Supabase is not initialized.");
  try{
    const {data, error} = await db.auth.getSession();
    if(error) throw error;
    session = data?.session || null;
    if(session) await afterLogin();
    else renderAuth();
    db.auth.onAuthStateChange((event, newSession) => {
      session = newSession || null;
    });
  }catch(error){
    throw error;
  }
}
