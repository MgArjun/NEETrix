<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NEETrix</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060912;--panel:#0f1524;--panel2:#151d30;--border:#243049;
  --text:#eef2fb;--muted:#8b97b3;--accent:#5b9dff;--accent2:#6b7cff;
  --green:#3dd68c;--danger:#ef5a5a;--warn:#f0b429;--shadow:0 8px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{min-height:100vh;padding-bottom:52px}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
button{cursor:pointer;font-family:inherit;transition:all .18s ease;-webkit-tap-highlight-color:transparent}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 4px 14px rgba(91,157,255,.25)}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(91,157,255,.35)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:9px;font-size:13px}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-outline:active{transform:scale(.96)}
.btn-danger{background:var(--danger);border:none;color:#fff;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600}
.btn-good{background:var(--green);border:none;color:#06281a;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600}
.btn-warn{background:var(--warn);border:none;color:#3a2a00;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600}
.btn-small{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:7px;font-size:12px}
.btn-small:active{transform:scale(.95)}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,#121a2e 0%,var(--bg) 70%)}
.auth-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:36px 32px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.brand{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:13.5px;margin:8px 0 22px}
.msg{font-size:12.5px;margin:-4px 0 12px;min-height:16px}
.link{color:var(--accent);background:none;border:none;font-size:13px;text-align:center;width:100%;margin-top:10px}

.topbar{display:flex;align-items:center;gap:4px;padding:10px 14px;border-bottom:1px solid var(--border);background:rgba(15,21,36,.92);backdrop-filter:blur(12px);overflow-x:auto;position:sticky;top:0;z-index:50}
.topbar .brand{font-size:17px;margin:0;flex-shrink:0;margin-right:6px}
.navbtn{background:none;border:1px solid transparent;color:var(--muted);padding:7px 12px;border-radius:8px;font-size:12.5px;white-space:nowrap;flex-shrink:0}
.navbtn:hover{color:var(--text)}
.navbtn.active{background:var(--panel2);color:var(--text);border-color:var(--border)}
.navbtn:active{transform:scale(.96)}
.spacer{flex:1;min-width:8px}
.profile-wrap{position:relative;flex-shrink:0}
.profile-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(91,157,255,.3)}
.profile-btn:active{transform:scale(.9)}

.content{max-width:920px;margin:0 auto;padding:22px 16px 40px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.subject-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 18px;cursor:pointer;transition:.2s}
.subject-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.25)}
.subject-card:active{transform:scale(.97)}
.subject-card h3{margin:0;font-size:15.5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row-wrap{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.muted{color:var(--muted);font-size:12.5px}
.badge{font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--muted)}
.badge.admin{color:var(--accent);border-color:var(--accent)}
.badge.active{color:var(--green);border-color:var(--green)}
.back{background:none;border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;font-size:12.5px;margin-bottom:16px}
.tabs2{display:flex;gap:6px;margin:12px 0 16px;flex-wrap:wrap}
.tab2{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:8px 15px;border-radius:9px;font-size:12.5px;font-weight:500}
.tab2.active{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
h2{font-size:20px;margin:2px 0 10px;font-weight:700;letter-spacing:-.02em}
h3{font-size:15px;margin:16px 0 10px;font-weight:600}
.empty{color:var(--muted);font-size:13.5px;padding:32px 0;text-align:center}

.home-hero{text-align:center;padding:28px 16px 24px;background:linear-gradient(180deg,rgba(91,157,255,.07) 0%,transparent 100%);border:1px solid var(--border);border-radius:18px;margin-bottom:18px}
.anim-row{display:flex;justify-content:center;align-items:center;gap:40px;margin-bottom:18px;flex-wrap:wrap;min-height:140px}

.atom-wrap{width:120px;height:120px;position:relative;flex-shrink:0}
.atom-core{width:18px;height:18px;background:radial-gradient(circle at 30% 30%,#a5d0ff,var(--accent));border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 24px var(--accent),0 0 10px #fff}
.orbit{position:absolute;top:50%;left:50%;border:1px solid rgba(91,157,255,.28);border-radius:50%;transform:translate(-50%,-50%);animation:spin linear infinite}
.orbit1{width:56px;height:36px;animation-duration:4.5s}
.orbit2{width:82px;height:52px;animation-duration:7s;animation-direction:reverse}
.orbit3{width:106px;height:66px;animation-duration:9.5s}
.orbit4{width:118px;height:74px;animation-duration:12s;animation-direction:reverse;opacity:.55}
.electron{width:8px;height:8px;background:#7dd3fc;border-radius:50%;position:absolute;top:-4px;left:50%;margin-left:-4px;box-shadow:0 0 12px #7dd3fc}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.nerve-wrap{width:110px;height:140px;position:relative;flex-shrink:0}
.nerve-brain{width:40px;height:30px;background:radial-gradient(ellipse at 40% 40%,#8ec5ff,var(--accent));border-radius:50% 50% 45% 45%;position:absolute;top:2px;left:50%;transform:translateX(-50%);box-shadow:0 0 18px rgba(91,157,255,.55)}
.nerve-spine{width:5px;height:85px;background:linear-gradient(180deg,var(--accent),rgba(91,157,255,.25));position:absolute;top:30px;left:50%;transform:translateX(-50%);border-radius:3px}
.nerve-wave{position:absolute;left:50%;width:7px;height:7px;background:var(--green);border-radius:50%;transform:translateX(-50%);box-shadow:0 0 10px var(--green);animation:nerveDown 2.6s ease-in-out infinite}
.nerve-wave:nth-child(3){animation-delay:.65s}
.nerve-wave:nth-child(4){animation-delay:1.3s}
.nerve-wave:nth-child(5){animation-delay:1.95s}
.nerve-branch{position:absolute;height:2px;background:rgba(91,157,255,.4);border-radius:1px}
.nerve-branch.arm-l{width:28px;top:48px;left:calc(50% - 28px);transform:rotate(-25deg)}
.nerve-branch.arm-r{width:28px;top:48px;left:50%;transform:rotate(25deg)}
.nerve-branch.leg-l{width:22px;top:95px;left:calc(50% - 18px);transform:rotate(-35deg)}
.nerve-branch.leg-r{width:22px;top:95px;left:50%;transform:rotate(35deg)}
.nerve-branch.org{width:16px;top:70px;left:calc(50% - 16px);transform:rotate(-12deg);opacity:.7}
@keyframes nerveDown{0%{top:34px;opacity:0;transform:translateX(-50%) scale(.5)}12%{opacity:1}88%{opacity:1}100%{top:112px;opacity:0;transform:translateX(-50%) scale(.3)}}

.welcome{font-size:22px;font-weight:700;margin-bottom:4px}
.progress-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px;cursor:pointer}
.progress-box:active{transform:scale(.98)}
.progress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.progress-bar-bg{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-bottom:10px}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:4px;transition:width .6s ease}
.progress-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px}
.progress-stats span{color:var(--muted)}
.progress-stats b{color:var(--text);font-weight:600}

.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:600px){.home-grid{grid-template-columns:1fr}}
.home-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px 14px;text-align:center;cursor:pointer;transition:.22s}
.home-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.28)}
.home-card:active{transform:scale(.96)}
.home-card .icon{font-size:30px;margin-bottom:10px}
.home-card h3{margin:0 0 4px;font-size:15px}

.powered{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);padding:11px 0;background:rgba(6,9,18,.94);backdrop-filter:blur(10px);border-top:1px solid rgba(36,48,73,.6);z-index:40}
.powered span{background:linear-gradient(90deg,var(--muted),var(--accent),var(--muted));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:500}

.yt-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden;background:#000;margin-bottom:14px;border:1px solid var(--border)}
.yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.modal-close{background:none;border:none;color:var(--muted);float:right;font-size:24px;line-height:1;padding:0 4px}

.timer{font-size:22px;font-weight:800;color:var(--warn);text-align:center;padding:12px;background:var(--panel2);border-radius:10px;margin-bottom:12px}
.zoom-row{display:flex;gap:8px;justify-content:center;margin-top:10px}
.zoom-row button{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px}

.cbt-layout{display:grid;grid-template-columns:1fr 220px;gap:16px}
@media(max-width:720px){.cbt-layout{grid-template-columns:1fr}}
.cbt-qbox{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}
.cbt-palette{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;height:fit-content;position:sticky;top:70px}
.cbt-palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.cbt-pbtn{width:100%;aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:12px;font-weight:600}
.cbt-pbtn.answered{background:rgba(91,157,255,.2);border-color:var(--accent);color:var(--accent)}
.cbt-pbtn.marked{background:rgba(240,180,41,.2);border-color:var(--warn);color:var(--warn)}
.cbt-pbtn.current{outline:2px solid var(--green);outline-offset:1px}
.cbt-opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px}
.cbt-opt.selected{border-color:var(--accent);background:rgba(91,157,255,.12)}
.cbt-opt:active{transform:scale(.985)}
.cbt-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.cbt-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11px;color:var(--muted)}
.cbt-legend span{display:flex;align-items:center;gap:4px}
.cbt-dot{width:10px;height:10px;border-radius:3px}
.score-card{text-align:center;padding:28px 16px}
.score-num{font-size:48px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.profile-field{margin-bottom:14px}
.profile-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.q-img{max-width:100%;border-radius:10px;margin:10px 0;border:1px solid var(--border)}
</style>
</head>
<body>
<div id="app"></div>
<div class="powered"><span>Powered by Suraj Kumar</span></div>

<script>
const SUPABASE_URL = "https://qhggamgxfwlwtpmwxfwk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_X9_aDiQcrKhYyPfuQdnKPA_K8F7RPjM";

let db=null,session=null,profile=null,activeTab="home",selSubject=null,selChapter=null,selCategory="general",adminTab="users";
let cbtTest=null,cbtQuestions=[],cbtAnswers={},cbtMarked=new Set(),cbtBookmarks=new Set(),cbtIndex=0,cbtTimerRef=null,cbtRemaining=0;

const app=document.getElementById("app");
function escapeHtml(v){return(v??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild}
function fmtDate(iso){if(!iso)return"";const d=new Date(iso);if(Number.isNaN(d.getTime()))return"";return d.toLocaleString(undefined,{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function ytId(url){const m=(url||"").match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null}
function showFatalError(m){document.body.innerHTML=`<div style="min-height:100vh;background:var(--bg);color:#fff;padding:24px"><div style="max-width:700px;margin:40px auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px"><h2 style="color:var(--danger)">NEETrix Error</h2><div style="color:#c5cada;line-height:1.6;white-space:pre-wrap">${escapeHtml(m)}</div></div></div>`}
function getLastScore(){try{return JSON.parse(localStorage.getItem("neetrix_last_score")||"null")}catch(e){return null}}
function saveLastScore(obj){try{localStorage.setItem("neetrix_last_score",JSON.stringify(obj))}catch(e){}}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error("Failed: "+src));document.head.appendChild(s)})}
async function loadSupabase(){if(window.supabase)return true;const srcs=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"];let last=null;for(const s of srcs){try{await loadScript(s);if(window.supabase)return true}catch(e){last=e}}throw last||new Error("Supabase load failed")}
async function loadPdfJs(){if(window.pdfjsLib)return true;const srcs=["https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js","https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"];for(const s of srcs){try{await loadScript(s);if(window.pdfjsLib)return true}catch(e){}}return false}

async function initializeApp(){try{await loadSupabase();if(!SUPABASE_URL||!SUPABASE_ANON_KEY)throw new Error("Supabase not configured");db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);loadPdfJs().catch(()=>{});await boot()}catch(e){console.error(e);showFatalError(e?.message||"Could not start")}}
function renderAuth(mode){mode=mode||"login";app.innerHTML="";app.appendChild(el(`<div class="auth-wrap"><div class="auth-card"><div class="brand">NEETrix</div><div class="sub">The focused way to prepare.</div><div class="msg" id="msg"></div><div id="fields"></div><button class="btn" style="width:100%" id="mainBtn"></button><button class="link" id="link1"></button><button class="link" id="link2" style="display:none"></button></div></div>`));
const fields=document.getElementById("fields"),mainBtn=document.getElementById("mainBtn"),link1=document.getElementById("link1"),link2=document.getElementById("link2"),msg=document.getElementById("msg");
if(mode==="login"||mode==="signup"){fields.innerHTML=`<input id="email" type="email" placeholder="Email address" autocomplete="email"/><input id="pass" type="password" placeholder="Password (8+ characters)" autocomplete="${mode==="login"?"current-password":"new-password"}"/>`;mainBtn.textContent=mode==="login"?"Log in":"Create account";link1.textContent=mode==="login"?"New here? Create an account":"Already have an account? Log in";link1.onclick=()=>renderAuth(mode==="login"?"signup":"login");link2.style.display=mode==="login"?"block":"none";link2.textContent="Forgot password?";link2.onclick=()=>renderAuth("forgot");
mainBtn.onclick=async()=>{msg.textContent="";mainBtn.disabled=true;const email=document.getElementById("email").value.trim(),pass=document.getElementById("pass").value;if(!email||!pass){msg.style.color="var(--muted)";msg.textContent="Enter both fields.";mainBtn.disabled=false;return}try{if(mode==="signup"){const{error}=await db.auth.signUp({email,password:pass});if(error)throw error;msg.style.color="var(--green)";msg.textContent="Account created! Check email if needed, then log in.";setTimeout(()=>renderAuth("login"),1800)}else{const{data,error}=await db.auth.signInWithPassword({email,password:pass});if(error)throw error;session=data.session;await afterLogin()}}catch(e){msg.style.color="var(--danger)";msg.textContent=e?.message||"Something went wrong"}finally{mainBtn.disabled=false}}}
else if(mode==="forgot"){fields.innerHTML=`<input id="email" type="email" placeholder="Email address"/>`;mainBtn.textContent="Send reset link";link1.textContent="Back to log in";link1.onclick=()=>renderAuth("login");mainBtn.onclick=async()=>{msg.textContent="";mainBtn.disabled=true;const email=document.getElementById("email").value.trim();if(!email){msg.style.color="var(--muted)";msg.textContent="Enter email";mainBtn.disabled=false;return}try{const{error}=await db.auth.resetPasswordForEmail(email);if(error)throw error;msg.style.color="var(--green)";msg.textContent="Reset link sent"}catch(e){msg.style.color="var(--danger)";msg.textContent=e?.message||"Error"}finally{mainBtn.disabled=false}}}}

function renderStatusScreen(status){app.innerHTML="";const msgs={pending:["Request sent","Your access request has been sent. Wait for admin approval."],paused:["Account paused","Your account is paused by admin."],blocked:["Account blocked","Access blocked by admin."]};const[t,b]=msgs[status]||["Access unavailable","Contact admin."];app.appendChild(el(`<div class="auth-wrap"><div class="auth-card"><div class="brand">NEETrix</div><h2 style="margin-top:14px">${escapeHtml(t)}</h2><p class="muted" style="line-height:1.6;margin:10px 0 16px">${escapeHtml(b)}</p><button class="btn-outline" style="width:100%" id="out">Log out</button></div></div>`));document.getElementById("out").onclick=async()=>{try{await db.auth.signOut()}catch(e){}session=null;profile=null;renderAuth()}}

async function afterLogin(){if(!session?.user){renderAuth();return}try{try{await db.from("login_events").insert({user_id:session.user.id,email:session.user.email})}catch(e){}const{data,error}=await db.from("profiles").select("*").eq("id",session.user.id).single();if(error){if(error.code==="PGRST116"){profile=null;renderStatusScreen("pending");return}throw error}profile=data;if(!profile||profile.status!=="active"){renderStatusScreen(profile?profile.status:"pending");return}activeTab="home";selSubject=null;selChapter=null;renderShell()}catch(e){showFatalError(e?.message||"Unable to load account")}}

function renderShell(){app.innerHTML="";const isAdmin=profile?.role==="admin";const initial=(profile?.name||profile?.email||"U")[0].toUpperCase();app.appendChild(el(`<div><div class="topbar"><div class="brand">NEETrix</div><button class="navbtn" data-t="home">Home</button><button class="navbtn" data-t="content">Content</button><button class="navbtn" data-t="questions">Questions</button><button class="navbtn" data-t="bookmarks">Bookmarks</button><button class="navbtn" data-t="tests">Test</button>${isAdmin?`<button class="navbtn" data-t="admin">Admin</button>`:""}<div class="spacer"></div><div class="profile-wrap"><button class="profile-btn" id="profileBtn">${escapeHtml(initial)}</button></div></div><div class="content" id="content"></div></div>`));
document.getElementById("profileBtn").onclick=()=>openProfileModal();
document.querySelectorAll(".navbtn").forEach(btn=>{btn.onclick=()=>{activeTab=btn.dataset.t;selSubject=null;selChapter=null;if(cbtTimerRef){clearInterval(cbtTimerRef);cbtTimerRef=null}renderTabsUI();renderBody()}});
renderTabsUI();renderBody()}

function renderTabsUI(){document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.t===activeTab))}

async function openPdf(pdf){try{const{data,error}=await db.storage.from("content").createSignedUrl(pdf.file_path,3600);if(error)throw error;if(!data?.signedUrl)throw new Error("No link");await showPdfModal(data.signedUrl,pdf.title)}catch(e){alert(e?.message||"Unable to open PDF")}}
async function showPdfModal(url,title){if(!window.pdfjsLib)await loadPdfJs();if(!window.pdfjsLib){alert("PDF viewer failed");return}const modal=el(`<div class="modal-bg"><div class="modal-box" style="max-width:920px"><button class="modal-close" id="mc">×</button><h3>${escapeHtml(title||"")}</h3><div style="overflow:auto;text-align:center"><canvas id="pc"></canvas></div><div class="zoom-row"><button id="zo">−</button><span id="zl">100%</span><button id="zi">+</button></div></div></div>`);document.body.appendChild(modal);document.getElementById("mc").onclick=()=>modal.remove();const pdfjsLib=window.pdfjsLib;pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";let scale=1.2;try{const pdfDoc=await pdfjsLib.getDocument({url,withCredentials:false}).promise;const page=await pdfDoc.getPage(1);const render=async()=>{const vp=page.getViewport({scale});const canvas=document.getElementById("pc");if(!canvas)return;canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;const zl=document.getElementById("zl");if(zl)zl.textContent=Math.round(scale/1.2*100)+"%"};await render();document.getElementById("zi").onclick=()=>{scale+=0.3;render().catch(console.error)};document.getElementById("zo").onclick=()=>{scale=Math.max(0.5,scale-0.3);render().catch(console.error)}}catch(e){modal.querySelector(".modal-box").innerHTML+=`<div class="empty">Unable to render<br>${escapeHtml(e?.message||"")}</div>`}}

async function startPdfTest(test){if(!test.file_path){alert("No paper uploaded");return}try{const{data,error}=await db.storage.from("content").createSignedUrl(test.file_path,7200);if(error)throw error;if(!data?.signedUrl)throw new Error("No link");if(!window.pdfjsLib)await loadPdfJs();if(!window.pdfjsLib){alert("PDF viewer failed");return}const modal=el(`<div class="modal-bg"><div class="modal-box" style="max-width:920px"><div class="timer" id="tmr"></div><h3>${escapeHtml(test.title)}</h3><div style="overflow:auto;text-align:center"><canvas id="pc"></canvas></div><div class="zoom-row"><button id="zo">−</button><span id="zl">100%</span><button id="zi">+</button></div><button class="btn" style="width:100%;margin-top:14px" id="submitTest">Submit Test</button></div></div>`);document.body.appendChild(modal);let remaining=(Number(test.duration_minutes)||60)*60;const timerEl=document.getElementById("tmr");let timerRef=null;const finish=()=>{if(timerRef)clearInterval(timerRef);modal.remove();alert("Test submitted")};const tick=()=>{const m=Math.floor(remaining/60),s=remaining%60;timerEl.textContent=`${m}:${s<10?"0":""}${s} remaining`;if(remaining<=0){finish();return}remaining--};tick();timerRef=setInterval(tick,1000);document.getElementById("submitTest").onclick=()=>{if(confirm("Submit now?"))finish()};const pdfjsLib=window.pdfjsLib;pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";let scale=1.2;const pdfDoc=await pdfjsLib.getDocument({url:data.signedUrl,withCredentials:false}).promise;const page=await pdfDoc.getPage(1);const render=async()=>{const vp=page.getViewport({scale});const canvas=document.getElementById("pc");if(!canvas)return;canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;const zl=document.getElementById("zl");if(zl)zl.textContent=Math.round(scale/1.2*100)+"%"};await render();document.getElementById("zi").onclick=()=>{scale+=0.3;render().catch(console.error)};document.getElementById("zo").onclick=()=>{scale=Math.max(0.5,scale-0.3);render().catch(console.error)}}catch(e){alert(e?.message||"Unable to start")}}

async function startCbtTest(test){
  try{
    const isAdmin = profile?.role === "admin";
    const cols = isAdmin ? "*" : "id, question_text, option_a, option_b, option_c, option_d, sort_order, question_image";
    const{data,error}=await db.from("test_questions").select(cols).eq("test_id",test.id).order("sort_order");
    if(error)throw error;
    if(!data?.length){alert("No questions for this CBT yet.");return}
    cbtTest=test;cbtQuestions=data;cbtAnswers={};cbtMarked=new Set();cbtBookmarks=new Set();cbtIndex=0;
    cbtRemaining=(Number(test.duration_minutes)||60)*60;
    if(cbtTimerRef)clearInterval(cbtTimerRef);
    cbtTimerRef=setInterval(()=>{
      cbtRemaining--;
      const tEl=document.getElementById("cbtTimer");
      if(tEl){const m=Math.floor(cbtRemaining/60),s=cbtRemaining%60;tEl.textContent=`${m}:${s<10?"0":""}${s}`}
      if(cbtRemaining<=0){clearInterval(cbtTimerRef);cbtTimerRef=null;finishCbt(true)}
    },1000);
    renderCbtUI();
  }catch(e){alert(e?.message||"Unable to start CBT")}
}

function renderCbtUI(){
  const c=document.getElementById("content");
  if(!c||!cbtQuestions.length)return;
  const q=cbtQuestions[cbtIndex];
  const selected=cbtAnswers[q.id]||null;
  const imgHtml = q.question_image ? `<img class="q-img" src="${escapeHtml(q.question_image)}" alt="Question image"/>` : "";
  c.innerHTML=`<div class="timer" id="cbtTimer">${Math.floor(cbtRemaining/60)}:${(cbtRemaining%60)<10?"0":""}${cbtRemaining%60}</div>
  <div class="cbt-layout"><div class="cbt-qbox">
    <div class="muted" style="margin-bottom:8px">Question ${cbtIndex+1} of ${cbtQuestions.length}</div>
    <div style="font-size:15.5px;line-height:1.55;margin-bottom:12px">${escapeHtml(q.question_text)}</div>
    ${imgHtml}
    <button class="cbt-opt ${selected==="A"?"selected":""}" data-o="A">A. ${escapeHtml(q.option_a)}</button>
    <button class="cbt-opt ${selected==="B"?"selected":""}" data-o="B">B. ${escapeHtml(q.option_b)}</button>
    <button class="cbt-opt ${selected==="C"?"selected":""}" data-o="C">C. ${escapeHtml(q.option_c)}</button>
    <button class="cbt-opt ${selected==="D"?"selected":""}" data-o="D">D. ${escapeHtml(q.option_d)}</button>
    <div class="cbt-nav">
      <button class="btn-outline" id="cbtPrev" ${cbtIndex===0?"disabled":""}>← Previous</button>
      <button class="btn-outline" id="cbtMark">${cbtMarked.has(q.id)?"Unmark":"Mark for Review"}</button>
      <button class="btn-outline" id="cbtBm">${cbtBookmarks.has(q.id)?"★ Bookmarked":"☆ Bookmark"}</button>
      <button class="btn" id="cbtNext">${cbtIndex===cbtQuestions.length-1?"Review":"Next →"}</button>
    </div>
    <button class="btn-danger" style="width:100%;margin-top:14px" id="cbtSubmit">Submit Test</button>
  </div>
  <div class="cbt-palette">
    <div style="font-weight:600;font-size:13px">Question Palette</div>
    <div class="cbt-palette-grid" id="palette"></div>
    <div class="cbt-legend">
      <span><div class="cbt-dot" style="background:rgba(91,157,255,.35);border:1px solid var(--accent)"></div> Answered</span>
      <span><div class="cbt-dot" style="background:rgba(240,180,41,.35);border:1px solid var(--warn)"></div> Marked</span>
      <span><div class="cbt-dot" style="background:var(--panel2);border:1px solid var(--border)"></div> Not visited</span>
    </div>
  </div></div>`;
  c.querySelectorAll(".cbt-opt").forEach(btn=>{btn.onclick=()=>{cbtAnswers[q.id]=btn.dataset.o;renderCbtUI()}});
  document.getElementById("cbtPrev").onclick=()=>{if(cbtIndex>0){cbtIndex--;renderCbtUI()}};
  document.getElementById("cbtNext").onclick=()=>{if(cbtIndex<cbtQuestions.length-1){cbtIndex++;renderCbtUI()}};
  document.getElementById("cbtMark").onclick=()=>{if(cbtMarked.has(q.id))cbtMarked.delete(q.id);else cbtMarked.add(q.id);renderCbtUI()};
  document.getElementById("cbtBm").onclick=()=>{if(cbtBookmarks.has(q.id))cbtBookmarks.delete(q.id);else cbtBookmarks.add(q.id);renderCbtUI()};
  document.getElementById("cbtSubmit").onclick=()=>{if(confirm("Submit test? Answers cannot be changed."))finishCbt(false)};
  const palette=document.getElementById("palette");
  cbtQuestions.forEach((qq,i)=>{
    const btn=el(`<button class="cbt-pbtn">${i+1}</button>`);
    if(cbtAnswers[qq.id])btn.classList.add("answered");
    if(cbtMarked.has(qq.id))btn.classList.add("marked");
    if(i===cbtIndex)btn.classList.add("current");
    btn.onclick=()=>{cbtIndex=i;renderCbtUI()};
    palette.appendChild(btn);
  });
}

async function finishCbt(auto){
  if(cbtTimerRef){clearInterval(cbtTimerRef);cbtTimerRef=null}
  const c=document.getElementById("content");
  c.innerHTML=`<div class="card score-card"><div class="muted">Calculating score...</div></div>`;

  try{
    const answersPayload = {};
    Object.keys(cbtAnswers).forEach(id => { answersPayload[id] = cbtAnswers[id]; });

    const { data, error } = await db.rpc("score_cbt_test", {
      p_test_id: cbtTest.id,
      p_answers: answersPayload
    });

    if(error) throw error;

    const result = data || {};
    const score = result.score ?? 0;
    const total = result.total ?? (cbtQuestions.length * 4);
    const correct = result.correct ?? 0;
    const wrong = result.wrong ?? 0;
    const unattempted = result.unattempted ?? 0;
    const accuracy = cbtQuestions.length ? Math.round((correct / cbtQuestions.length) * 100) : 0;

    saveLastScore({score, total, correct, wrong, unattempted, title: cbtTest?.title, at: Date.now()});

    c.innerHTML=`<div class="card score-card">
      <div class="muted" style="margin-bottom:6px">${auto?"Time's up!":"Test Submitted"}</div>
      <h2 style="margin-bottom:4px">${escapeHtml(cbtTest?.title||"Test")}</h2>
      <div class="score-num">${score}</div>
      <div class="muted" style="margin-bottom:18px">out of ${total}</div>
      <div class="grid2" style="max-width:360px;margin:0 auto 20px;text-align:left">
        <div class="card" style="margin:0"><div class="muted">Correct</div><div style="font-weight:700;color:var(--green)">${correct}</div></div>
        <div class="card" style="margin:0"><div class="muted">Wrong</div><div style="font-weight:700;color:var(--danger)">${wrong}</div></div>
        <div class="card" style="margin:0"><div class="muted">Unattempted</div><div style="font-weight:700">${unattempted}</div></div>
        <div class="card" style="margin:0"><div class="muted">Accuracy</div><div style="font-weight:700">${accuracy}%</div></div>
      </div>
      <button class="btn" id="backTests">Back to Tests</button>
    </div>`;
    document.getElementById("backTests").onclick=()=>{cbtTest=null;cbtQuestions=[];renderTests(c)};
  }catch(e){
    // Fallback for admin testing
    let correct=0, wrong=0, unattempted=0;
    cbtQuestions.forEach(q=>{
      const ans = cbtAnswers[q.id];
      if(!ans){ unattempted++; return; }
      if(q.correct_option && ans === (q.correct_option||"").toUpperCase()) correct++;
      else wrong++;
    });
    const score = (correct*4) + (wrong*-1);
    const total = cbtQuestions.length*4;
    const accuracy = cbtQuestions.length ? Math.round((correct / cbtQuestions.length)*100) : 0;
    saveLastScore({score, total, correct, wrong, unattempted, title: cbtTest?.title, at: Date.now()});

    c.innerHTML=`<div class="card score-card">
      <div class="muted" style="margin-bottom:6px">${auto?"Time's up!":"Test Submitted"}</div>
      <h2 style="margin-bottom:4px">${escapeHtml(cbtTest?.title||"Test")}</h2>
      <div class="score-num">${score}</div>
      <div class="muted" style="margin-bottom:18px">out of ${total}</div>
      <div class="grid2" style="max-width:360px;margin:0 auto 20px;text-align:left">
        <div class="card" style="margin:0"><div class="muted">Correct</div><div style="font-weight:700;color:var(--green)">${correct}</div></div>
        <div class="card" style="margin:0"><div class="muted">Wrong</div><div style="font-weight:700;color:var(--danger)">${wrong}</div></div>
        <div class="card" style="margin:0"><div class="muted">Unattempted</div><div style="font-weight:700">${unattempted}</div></div>
        <div class="card" style="margin:0"><div class="muted">Accuracy</div><div style="font-weight:700">${accuracy}%</div></div>
      </div>
      <button class="btn" id="backTests">Back to Tests</button>
    </div>`;
    document.getElementById("backTests").onclick=()=>{cbtTest=null;cbtQuestions=[];renderTests(c)};
  }
}

async function renderAdmin(c){
  c.innerHTML=`<h2>Admin</h2><div class="tabs2">
    <button class="tab2 ${adminTab==="users"?"active":""}" data-a="users">Users</button>
    <button class="tab2 ${adminTab==="logins"?"active":""}" data-a="logins">Login History</button>
    <button class="tab2 ${adminTab==="settings"?"active":""}" data-a="settings">Settings</button>
    <button class="tab2 ${adminTab==="content"?"active":""}" data-a="content">Content Manager</button>
    <button class="tab2 ${adminTab==="cbt"?"active":""}" data-a="cbt">CBT Questions</button>
  </div><div id="adminBody"></div>`;
  c.querySelectorAll(".tab2").forEach(b=>{b.onclick=()=>{adminTab=b.dataset.a;renderAdmin(c)}});
  const body=document.getElementById("adminBody");
  if(adminTab==="users")await renderAdminUsers(body);
  else if(adminTab==="logins")await renderAdminLogins(body);
  else if(adminTab==="settings")await renderAdminSettings(body);
  else if(adminTab==="content")await renderAdminContent(body);
  else if(adminTab==="cbt")await renderAdminCbt(body);
}

async function renderAdminUsers(body){
  try{
    const{data,error}=await db.from("profiles").select("*").order("created_at",{ascending:false});
    if(error)throw error;
    if(!data?.length){body.innerHTML=`<div class="empty">No users yet.</div>`;return}
    body.innerHTML=`<table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody id="uRows"></tbody></table>`;
    const rows=document.getElementById("uRows");
    data.forEach(user=>{
      const tr=el(`<tr><td>${escapeHtml(user.email)}</td><td><span class="badge ${user.role==="admin"?"admin":""}">${escapeHtml(user.role)}</span></td><td><span class="badge ${escapeHtml(user.status)}">${escapeHtml(user.status)}</span></td><td class="row-wrap" id="act-${escapeHtml(user.id)}"></td></tr>`);
      rows.appendChild(tr);
      const act=tr.querySelector(`#act-${CSS.escape(user.id)}`);
      if(user.role==="admin"){act.innerHTML=`<span class="muted">—</span>`;return}
      const setStatus=async st=>{try{await db.from("profiles").update({status:st}).eq("id",user.id);renderAdmin(document.getElementById("content"))}catch(e){alert(e?.message||"Error")}};
      if(user.status==="pending"){
        const a=el(`<button class="btn-good">Approve</button>`);a.onclick=()=>setStatus("active");act.appendChild(a);
        const r=el(`<button class="btn-danger">Reject</button>`);r.onclick=()=>setStatus("blocked");act.appendChild(r);
      }else{
        const p=el(`<button class="btn-warn">${user.status==="paused"?"Resume":"Pause"}</button>`);p.onclick=()=>setStatus(user.status==="paused"?"active":"paused");act.appendChild(p);
        const b=el(`<button class="btn-danger">${user.status==="blocked"?"Unblock":"Block"}</button>`);b.onclick=()=>setStatus(user.status==="blocked"?"active":"blocked");act.appendChild(b);
      }
    });
  }catch(e){body.innerHTML=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}
}

async function renderAdminLogins(body){
  try{
    const{data,error}=await db.from("login_events").select("*").order("logged_in_at",{ascending:false}).limit(200);
    if(error)throw error;
    if(!data?.length){body.innerHTML=`<div class="empty">No login activity.</div>`;return}
    body.innerHTML=`<table><thead><tr><th>Email</th><th>Logged in at</th></tr></thead><tbody>${data.map(l=>`<tr><td>${escapeHtml(l.email)}</td><td>${escapeHtml(fmtDate(l.logged_in_at))}</td></tr>`).join("")}</tbody></table>`;
  }catch(e){body.innerHTML=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}
}

async function renderAdminSettings(body){
  try{
    const{data,error}=await db.from("app_settings").select("*").eq("id",1).single();
    if(error&&error.code!=="PGRST116")throw error;
    const open=data?Boolean(data.registration_open):true;
    body.innerHTML=`<div class="card"><div class="row"><div><div>Accept new users</div><div class="muted">When off, new signups go pending.</div></div><button class="btn" id="toggleReg">${open?"Turn OFF":"Turn ON"}</button></div></div>`;
    document.getElementById("toggleReg").onclick=async()=>{try{await db.from("app_settings").update({registration_open:!open}).eq("id",1);renderAdminSettings(body)}catch(e){alert(e?.message||"Error")}};
  }catch(e){body.innerHTML=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}
}

async function renderAdminContent(body){
  body.innerHTML=`<h3>Add Subject</h3><input id="newSubj" placeholder="Subject name"/><button class="btn" id="addSubj">Add Subject</button>
  <h3>Add Chapter</h3><select id="chSubj"></select><input id="newChap" placeholder="Chapter name"/><button class="btn" id="addChap">Add Chapter</button>
  <h3>Add Video</h3><select id="vidSubj"></select><select id="vidChap"></select><input id="vidTitle" placeholder="Video title"/><input id="vidUrl" placeholder="YouTube link"/><button class="btn" id="addVid">Add Video</button>
  <h3>Add Question PDF</h3><select id="pdfSubj"></select><select id="pdfChap"></select><select id="pdfCat"><option value="general">Practice</option><option value="ncert">Important</option><option value="pyq">PYQs</option></select><input id="pdfTitle" placeholder="PDF title"/><input type="file" id="pdfFile" accept="application/pdf"/><button class="btn" id="addPdf">Upload PDF</button>
  <h3>Add Test</h3><input id="testTitle" placeholder="Test title"/><input id="testDur" type="number" value="60" placeholder="Duration (min)"/><input type="file" id="testFile" accept="application/pdf"/><div class="muted" style="margin-bottom:8px">Leave file empty = CBT test</div><button class="btn" id="addTest">Create Test</button>`;
  try{
    const{data:subjects,error}=await db.from("subjects").select("*").order("sort_order");
    if(error)throw error;
    const opts=(subjects||[]).map(s=>`<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join("");
    ["chSubj","vidSubj","pdfSubj"].forEach(id=>{const sel=document.getElementById(id);if(sel)sel.innerHTML=opts||`<option value="">No subjects</option>`});
    const loadChapters=async(subId,chapId)=>{const subSel=document.getElementById(subId),chapSel=document.getElementById(chapId);if(!subSel||!chapSel)return;const sid=subSel.value;if(!sid){chapSel.innerHTML=`<option value="">No chapters</option>`;return}const{data:chs}=await db.from("chapters").select("*").eq("subject_id",sid).order("sort_order");chapSel.innerHTML=(chs||[]).map(c=>`<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join("")||`<option value="">No chapters</option>`};
    if(subjects?.length){await loadChapters("vidSubj","vidChap");await loadChapters("pdfSubj","pdfChap")}
    document.getElementById("vidSubj").onchange=()=>loadChapters("vidSubj","vidChap");
    document.getElementById("pdfSubj").onchange=()=>loadChapters("pdfSubj","pdfChap");
    document.getElementById("addSubj").onclick=async()=>{const name=document.getElementById("newSubj").value.trim();if(!name)return;try{await db.from("subjects").insert({name});renderAdminContent(body)}catch(e){alert(e?.message||"Error")}};
    document.getElementById("addChap").onclick=async()=>{const subject_id=document.getElementById("chSubj").value,name=document.getElementById("newChap").value.trim();if(!subject_id||!name)return;try{await db.from("chapters").insert({subject_id,name});renderAdminContent(body)}catch(e){alert(e?.message||"Error")}};
    document.getElementById("addVid").onclick=async()=>{const chapter_id=document.getElementById("vidChap").value,title=document.getElementById("vidTitle").value.trim(),url=document.getElementById("vidUrl").value.trim(),youtubeId=ytId(url);if(!chapter_id||!title||!youtubeId){alert("Check fields + valid YouTube link");return}try{await db.from("videos").insert({chapter_id,title,youtube_id:youtubeId});renderAdminContent(body)}catch(e){alert(e?.message||"Error")}};
    document.getElementById("addPdf").onclick=async()=>{const chapter_id=document.getElementById("pdfChap").value,category=document.getElementById("pdfCat").value,title=document.getElementById("pdfTitle").value.trim(),file=document.getElementById("pdfFile").files[0];if(!chapter_id||!title||!file){alert("Fill all");return}if(file.type!=="application/pdf"){alert("PDF only");return}try{const path=`pdfs/${crypto.randomUUID()}_${file.name}`;const{error:upErr}=await db.storage.from("content").upload(path,file,{cacheControl:"3600",upsert:false});if(upErr)throw upErr;const{error:insErr}=await db.from("pdfs").insert({chapter_id,category,title,file_path:path});if(insErr){try{await db.storage.from("content").remove([path])}catch(e){}throw insErr}renderAdminContent(body)}catch(e){alert(e?.message||"Error")}};
    document.getElementById("addTest").onclick=async()=>{const title=document.getElementById("testTitle").value.trim(),duration_minutes=parseInt(document.getElementById("testDur").value)||60,file=document.getElementById("testFile").files[0];if(!title){alert("Enter title");return}try{let file_path=null,type="cbt";if(file){if(file.type!=="application/pdf"){alert("PDF only");return}file_path=`tests/${crypto.randomUUID()}_${file.name}`;type="pdf";const{error:upErr}=await db.storage.from("content").upload(file_path,file,{cacheControl:"3600",upsert:false});if(upErr)throw upErr}const payload={title,duration_minutes,file_path};try{const{error}=await db.from("tests").insert({...payload,type});if(error)throw error}catch(e){const{error}=await db.from("tests").insert(payload);if(error){if(file_path)try{await db.storage.from("content").remove([file_path])}catch(x){}throw error}}renderAdminContent(body)}catch(e){alert(e?.message||"Error")}};
  }catch(e){body.innerHTML+=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}
}

async function renderAdminCbt(body){
  body.innerHTML=`
    <h3>1. Select Test</h3>
    <select id="cbtTestSel"><option value="">Select test…</option></select>

    <h3 style="margin-top:20px">2. Bulk Add Questions</h3>
    <div class="muted" style="margin-bottom:8px">Format (blank line se alag):<br>
    Question text<br>A) option<br>B) option<br>C) option<br>D) option</div>
    <textarea id="bulkText" style="min-height:150px" placeholder="Paste multiple questions here..."></textarea>
    <button class="btn" id="bulkAdd">Add All Questions</button>

    <h3 style="margin-top:22px">3. Set Correct Answers (Number-wise)</h3>
    <div class="muted" style="margin-bottom:8px">Example:<br>1. B<br>2. A<br>3. D</div>
    <textarea id="ansText" style="min-height:100px" placeholder="1. A&#10;2. B&#10;3. C..."></textarea>
    <button class="btn" id="setAnswers">Update Answers</button>

    <h3 style="margin-top:22px">4. Existing Questions (Edit / Delete / Image)</h3>
    <div id="cbtQList" class="muted">Select a test first</div>
  `;

  try{
    const{data:tests}=await db.from("tests").select("id,title,file_path").order("created_at",{ascending:false});
    const sel=document.getElementById("cbtTestSel");
    (tests||[]).forEach(t=>{
      const o=document.createElement("option");
      o.value=t.id;
      o.textContent=t.title+(t.file_path?" (PDF)":" (CBT)");
      sel.appendChild(o);
    });

    const loadQs=async()=>{
      const testId=sel.value;
      const list=document.getElementById("cbtQList");
      if(!testId){list.innerHTML=`<div class="muted">Select a test</div>`;return}
      try{
        const{data,error}=await db.from("test_questions").select("*").eq("test_id",testId).order("sort_order");
        if(error)throw error;
        if(!data?.length){list.innerHTML=`<div class="empty">No questions yet</div>`;return}
        list.innerHTML="";
        data.forEach((q,i)=>{
          const imgPreview = q.question_image ? `<img src="${escapeHtml(q.question_image)}" style="max-width:120px;border-radius:8px;margin-top:8px;border:1px solid var(--border)"/>` : "";
          const row=el(`<div class="card">
            <div class="row">
              <div style="flex:1">
                <div class="muted">Q${i+1} · Correct: 
                  <select class="corrSel" data-id="${q.id}" style="width:auto;display:inline;padding:4px 8px;margin:0">
                    <option value="A" ${q.correct_option==="A"?"selected":""}>A</option>
                    <option value="B" ${q.correct_option==="B"?"selected":""}>B</option>
                    <option value="C" ${q.correct_option==="C"?"selected":""}>C</option>
                    <option value="D" ${q.correct_option==="D"?"selected":""}>D</option>
                  </select>
                </div>
                <div style="margin-top:6px">${escapeHtml(q.question_text)}</div>
                ${imgPreview}
                <div style="margin-top:8px">
                  <input type="file" accept="image/*" class="imgInput" data-id="${q.id}" style="font-size:12px"/>
                </div>
              </div>
              <button class="btn-danger delQ">Delete</button>
            </div>
          </div>`);
          row.querySelector(".delQ").onclick=async()=>{
            if(!confirm("Delete this question?"))return;
            try{await db.from("test_questions").delete().eq("id",q.id);loadQs()}catch(e){alert(e?.message||"Error")}
          };
          row.querySelector(".corrSel").onchange=async(e)=>{
            try{await db.from("test_questions").update({correct_option:e.target.value}).eq("id",q.id)}catch(err){alert(err?.message||"Error")}
          };
          row.querySelector(".imgInput").onchange=async(e)=>{
            const file = e.target.files[0];
            if(!file)return;
            try{
              const path = `question-images/${crypto.randomUUID()}_${file.name}`;
              const {error:upErr} = await db.storage.from("content").upload(path, file, {cacheControl:"3600", upsert:false});
              if(upErr)throw upErr;
              const {data:urlData} = await db.storage.from("content").getPublicUrl(path);
              const publicUrl = urlData?.publicUrl;
              if(!publicUrl)throw new Error("No public URL");
              await db.from("test_questions").update({question_image: publicUrl}).eq("id", q.id);
              loadQs();
            }catch(err){alert(err?.message||"Image upload failed")}
          };
          list.appendChild(row);
        });
      }catch(e){list.innerHTML=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}
    };

    sel.onchange=loadQs;

    document.getElementById("bulkAdd").onclick=async()=>{
      const test_id=sel.value;
      const raw=document.getElementById("bulkText").value.trim();
      if(!test_id){alert("Select test first");return}
      if(!raw){alert("Paste questions");return}

      const blocks=raw.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
      const rows=[];
      for(const block of blocks){
        const lines=block.split("\n").map(l=>l.trim()).filter(Boolean);
        if(lines.length<5)continue;
        const question_text=lines[0].replace(/^\d+[\.\)]\s*/,"");
        const getOpt=l=>{
          const m=l.match(/^[A-Da-d][\.\)\]]\s*(.+)/);
          return m?m[1]:l;
        };
        const option_a=getOpt(lines[1]);
        const option_b=getOpt(lines[2]);
        const option_c=getOpt(lines[3]);
        const option_d=getOpt(lines[4]);
        let correct_option=null;
        const ansLine=lines.find(l=>/answer\s*[:=]/i.test(l));
        if(ansLine){
          const am=ansLine.match(/[A-Da-d]/);
          if(am)correct_option=am[0].toUpperCase();
        }
        rows.push({
          test_id,
          question_text,
          option_a,
          option_b,
          option_c,
          option_d,
          correct_option: correct_option || "A",
          sort_order: rows.length + 1
        });
      }
      if(!rows.length){alert("No valid questions found.");return}
      try{
        const{error}=await db.from("test_questions").insert(rows);
        if(error)throw error;
        document.getElementById("bulkText").value="";
        alert(`${rows.length} questions added`);
        loadQs();
      }catch(e){alert(e?.message||"Bulk add failed")}
    };

    document.getElementById("setAnswers").onclick=async()=>{
      const test_id=sel.value;
      const raw=document.getElementById("ansText").value.trim();
      if(!test_id){alert("Select test first");return}
      if(!raw){alert("Paste answers");return}

      const{data:qs,error}=await db.from("test_questions").select("id,sort_order").eq("test_id",test_id).order("sort_order");
      if(error)throw error;
      if(!qs?.length){alert("No questions found");return}

      const lines=raw.split("\n").map(l=>l.trim()).filter(Boolean);
      let updated=0;
      for(const line of lines){
        const m=line.match(/^(\d+)\s*[\.\)\-\:]?\s*([A-Da-d])/i);
        if(!m)continue;
        const num=parseInt(m[1]);
        const ans=m[2].toUpperCase();
        if(num<1||num>qs.length)continue;
        const q=qs[num-1];
        try{
          await db.from("test_questions").update({correct_option:ans}).eq("id",q.id);
          updated++;
        }catch(e){}
      }
      alert(`${updated} answers updated`);
      document.getElementById("ansText").value="";
      loadQs();
    };

  }catch(e){body.innerHTML+=`<div class="empty">${escapeHtml(e?.message||"Error")}</div>`}
}

async function boot(){
  if(!db)throw new Error("Supabase not init");
  try{
    const{data,error}=await db.auth.getSession();
    if(error)throw error;
    session=data?.session||null;
    if(session)await afterLogin();
    else renderAuth();
    db.auth.onAuthStateChange((e,ns)=>{session=ns||null});
  }catch(e){throw e}
}
initializeApp();
</script>
