<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NEETrix — Premium Learning Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050812" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    :root{
      --bg:#050812;
      --panel:#0f1420;
      --panel2:#0a0f1a;
      --border:#1a2235;
      --text:#e8ecf5;
      --muted:#94a3b8;
      --accent:#4f8cff;
      --green:#22d3a3;
      --warn:#f59e0b;
      --danger:#ef4444;
      --shadow:0 4px 20px rgba(0,0,0,.4);
      --shadow-lg:0 8px 40px rgba(0,0,0,.5);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;overflow-x:hidden;overscroll-behavior:none}
    body{
      font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    #app{min-height:100%;display:flex;flex-direction:column}
    
    /* Auth */
    .auth-wrap{display:grid;place-items:center;min-height:100vh;padding:24px}
    .auth-card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:var(--shadow-lg)}
    .brand{font-size:28px;font-weight:800;letter-spacing:.5px;background:linear-gradient(135deg,#4f8cff,#22d3a3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .sub{color:var(--muted);font-size:14px;margin-top:6px}
    .msg{margin-top:16px;font-size:14px;min-height:20px}
    input,select{width:100%;padding:12px 14px;margin:10px 0;background:var(--panel2);border:1px solid var(--border);border-radius:12px;color:var(--text);outline:none;font-size:15px;transition:all .2s}
    input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
    .btn,.btn-outline,.btn-danger,.btn-small{width:100%;padding:13px 16px;margin-top:12px;border-radius:12px;border:1px solid var(--border);background:var(--accent);color:#050812;font-weight:700;cursor:pointer;font-size:15px;transition:all .2s;position:relative;overflow:hidden}
    .btn::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent);opacity:0;transition:opacity .2s}
    .btn:hover::after{opacity:1}
    .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(79,140,255,.3)}
    .btn:active{transform:translateY(0)}
    .btn-outline{background:transparent;color:var(--text)}
    .btn-outline:hover{background:var(--panel2)}
    .btn-danger{background:rgba(239,68,68,.12);color:var(--danger);border-color:var(--danger)}
    .btn-danger:hover{background:rgba(239,68,68,.2)}
    .btn-small{width:auto;padding:7px 12px;font-size:13px;margin-top:0}
    .link{background:none;border:none;color:var(--muted);cursor:pointer;margin-top:12px;font-size:14px;transition:color .2s}
    .link:hover{color:var(--text)}
    
    /* Topbar */
    .topbar{
      display:flex;align-items:center;gap:10px;padding:10px 14px;
      border-bottom:1px solid var(--border);
      background:rgba(5,8,18,.95);
      position:sticky;top:0;z-index:10;
      backdrop-filter:blur(12px);
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .topbar::-webkit-scrollbar{display:none}
    .topbar .brand{font-size:19px;white-space:nowrap;background:linear-gradient(135deg,#4f8cff,#22d3a3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .navbtn{
      background:transparent;border:1px solid transparent;color:var(--muted);
      padding:8px 12px;border-radius:10px;cursor:pointer;font-size:13px;
      white-space:nowrap;flex-shrink:0;transition:all .25s;
    }
    .navbtn:hover{color:var(--text);background:var(--panel2);transform:translateY(-1px)}
    .navbtn.active{color:var(--text);border-color:var(--border);background:var(--panel2);box-shadow:0 2px 8px rgba(0,0,0,.2)}
    .spacer{flex:1;min-width:20px}
    .profile-wrap{display:flex;align-items:center}
    .profile-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#4f8cff,#22d3a3);color:#050812;font-weight:800;border:none;cursor:pointer;font-size:16px;transition:transform .25s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .profile-btn:hover{transform:scale(1.1)}
    
    /* Content */
    .content{padding:16px;max-width:1200px;margin:0 auto;width:100%;flex:1}
    
    /* Skeletons */
    .skel{background:linear-gradient(90deg,var(--panel2),#1a2440,var(--panel2));border-radius:12px;animation:shimmer 1.5s infinite linear}
    @keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
    .skel-card{height:96px}
    .skel-subj{height:74px}
    
    /* Home */
    .home-hero{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
    .welcome{font-size:24px;font-weight:700;margin-bottom:6px}
    .muted{color:var(--muted);font-size:14px}
    .progress-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:18px;cursor:pointer;transition:all .25s}
    .progress-box:hover{transform:translateY(-3px);box-shadow:0 6px 24px rgba(79,140,255,.2)}
    .progress-head{display:flex;justify-content:space-between;margin-bottom:10px}
    .progress-bar-bg{height:14px;background:var(--panel2);border-radius:999px;overflow:hidden}
    .progress-bar-fill{height:100%;background:linear-gradient(90deg,#4f8cff,#22d3a3);width:0%;transition:width .6s cubic-bezier(.4,0,.2,1)}
    .progress-stats{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:14px}
    .progress-stats b{color:var(--text)}
    .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
    .home-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;transition:all .25s}
    .home-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
    .home-card .icon{font-size:28px;margin-bottom:8px}
    .home-card h3{margin:0 0 6px;font-size:16px}
    
    /* Subject & cards */
    .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    .subject-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:all .25s}
    .subject-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
    .subject-card h3{margin:0;font-size:16px}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;transition:transform .2s}
    .card:hover{transform:translateY(-2px)}
    .card.row{display:flex;align-items:center;gap:10px}
    .empty{color:var(--muted);padding:24px;text-align:center;font-size:15px}
    .tabs2{display:flex;gap:8px;margin:14px 0;overflow-x:auto;padding-bottom:4px}
    .tab2{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:7px 11px;border-radius:10px;cursor:pointer;font-size:13px;white-space:nowrap;transition:all .2s}
    .tab2:hover{color:var(--text);transform:translateY(-1px)}
    .tab2.active{color:var(--text);border-color:var(--accent);background:rgba(79,140,255,.1)}
    .back{background:none;border:none;color:var(--muted);cursor:pointer;margin-bottom:10px;font-size:15px;transition:color .2s}
    .back:hover{color:var(--text)}
    .yt-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-top:10px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
    .yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
    
    /* PDF Modal - Premium */
    .pdf-modal{position:fixed;inset:0;background:rgba(5,8,18,.98);z-index:20;display:flex;flex-direction:column}
    .pdf-toolbar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);background:rgba(15,21,36,.98);flex-shrink:0;overflow-x:auto;box-shadow:0 2px 16px rgba(0,0,0,.4)}
    .pdf-title{flex:1;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:100px}
    .pdf-tools{display:flex;gap:6px;flex-wrap:nowrap;flex-shrink:0}
    .pdf-tbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer;font-size:13px;white-space:nowrap;flex-shrink:0;transition:all .2s;display:flex;align-items:center;gap:6px}
    .pdf-tbtn:hover{background:var(--border);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
    .pdf-tbtn:active{transform:translateY(0)}
    .pdf-tbtn.active-tool{border-color:var(--accent);background:rgba(79,140,255,.2);box-shadow:0 0 0 2px rgba(79,140,255,.3)}
    .pdf-zoom-label{font-size:12px;color:var(--muted);min-width:55px;text-align:center;font-weight:600}
    .pdf-canvas-wrap{position:relative;overflow:auto;flex:1;background:rgba(5,8,18,.7);display:flex;justify-content:center;align-items:flex-start;padding:24px;cursor:grab;touch-action:pan-x pan-y}
    .pdf-canvas-wrap:active{cursor:grabbing}
    .pdf-canvas-stack{position:relative;max-width:100%;box-shadow:0 12px 48px rgba(0,0,0,.6);background:#fff;border-radius:4px}
    #pdfCanvas,#pdfAnnoCanvas{display:block;max-width:100%;background:#fff;touch-action:none}
    .textLayer{transform-origin:0 0;opacity:0.2}
    .pdf-pagebar{display:flex;justify-content:center;gap:10px;padding:14px;border-top:1px solid var(--border);background:rgba(15,21,36,.98);flex-shrink:0;box-shadow:0 -2px 16px rgba(0,0,0,.4)}
    #pdfPageInput{width:70px;margin:0 6px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 10px;text-align:center;font-size:14px;font-weight:600}
    .pdf-annobar{display:flex;gap:8px;align-items:center;justify-content:center;padding:14px;border-bottom:1px solid var(--border);background:rgba(15,21,36,.98);flex-wrap:wrap;flex-shrink:0;box-shadow:0 2px 16px rgba(0,0,0,.4)}
    .pdf-color{width:38px;height:38px;border-radius:50%;border:3px solid var(--border);cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .pdf-color:hover{transform:scale(1.2);border-color:var(--text)}
    .pdf-color.selected{border-color:#fff;transform:scale(1.25);box-shadow:0 0 0 3px var(--accent),0 4px 12px rgba(0,0,0,.4)}
    .pdf-panel{position:absolute;top:56px;right:12px;width:300px;max-height:calc(100% - 120px);background:rgba(15,21,36,.98);border:1px solid var(--border);border-radius:14px;overflow:hidden;transform:translateX(110%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:5;box-shadow:var(--shadow-lg)}
    .pdf-panel.open{transform:translateX(0)}
    .pdf-panel-tabs{display:flex;border-bottom:1px solid var(--border)}
    .pdf-panel-tab{flex:1;background:transparent;border:none;color:var(--muted);padding:10px;font-size:12px;cursor:pointer;transition:all .2s;font-weight:600}
    .pdf-panel-tab:hover{color:var(--text)}
    .pdf-panel-tab.active{color:var(--text);border-bottom:3px solid var(--accent)}
    .pdf-panel-body{padding:10px;overflow:auto;max-height:320px}
    .pdf-panel-item{padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:all .2s}
    .pdf-panel-item:hover{background:var(--panel2);border-color:var(--border);transform:translateX(2px)}
    
    /* Toast & Modal */
    .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);color:var(--text);padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:50;box-shadow:var(--shadow-lg);font-size:14px;font-weight:500}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
    .modal-bg{position:fixed;inset:0;background:rgba(5,8,18,.9);z-index:30;display:grid;place-items:center;padding:16px;backdrop-filter:blur(6px)}
    .modal-box{width:100%;max-width:540px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:22px;position:relative;box-shadow:var(--shadow-lg)}
    .modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;transition:all .2s;width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
    .modal-close:hover{color:var(--text);background:var(--panel2)}
    
    /* Profile */
    .profile-field{margin-top:12px}
    .profile-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
    
    /* CBT */
    .timer{position:sticky;top:68px;z-index:4;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:9px 16px;margin-bottom:14px;font-weight:700;text-align:center;box-shadow:0 2px 16px rgba(0,0,0,.3);font-size:15px}
    .cbt-layout{display:grid;grid-template-columns:1fr 300px;gap:16px}
    @media(max-width:950px){.cbt-layout{grid-template-columns:1fr}}
    .cbt-qbox{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 2px 16px rgba(0,0,0,.2)}
    .cbt-opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:13px 15px;border-radius:12px;margin-top:10px;cursor:pointer;font-size:14px;transition:all .25s;font-weight:500}
    .cbt-opt:hover{transform:translateX(3px);background:var(--panel)}
    .cbt-opt.selected{border-color:var(--accent);background:rgba(79,140,255,.15);box-shadow:0 0 0 2px rgba(79,140,255,.2)}
    .cbt-nav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
    .cbt-palette{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:0 2px 16px rgba(0,0,0,.2)}
    .cbt-palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
    .cbt-pbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:9px;border-radius:10px;cursor:pointer;font-size:13px;transition:all .2s;font-weight:600}
    .cbt-pbtn:hover{transform:scale(1.08);background:var(--panel)}
    .cbt-pbtn.answered{background:rgba(79,140,255,.25);border-color:var(--accent)}
    .cbt-pbtn.marked{background:rgba(245,158,11,.25);border-color:var(--warn)}
    .cbt-pbtn.current{outline:2px solid var(--accent);transform:scale(1.12);box-shadow:0 2px 12px rgba(79,140,255,.3)}
    .cbt-legend{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:12px;color:var(--muted)}
    .cbt-dot{width:14px;height:14px;border-radius:3px;display:inline-block;margin-right:6px}
    .score-card{text-align:center}
    .score-num{font-size:46px;font-weight:800;color:var(--accent);margin:8px 0}
    .q-img{max-width:100%;border-radius:12px;margin:10px 0;box-shadow:0 2px 16px rgba(0,0,0,.3)}
    
    /* Admin */
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{border:1px solid var(--border);padding:9px;text-align:left;font-size:13px}
    th{background:var(--panel2);font-weight:600}
    .row-wrap{display:flex;gap:6px;flex-wrap:wrap}
    
    .page-fade{animation:fade .2s cubic-bezier(.4,0,.2,1)}
    @keyframes fade{from{opacity:.85;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    
    /* Mobile optimizations */
    @media(max-width:600px){
      .home-hero{padding:16px}
      .welcome{font-size:20px}
      .content{padding:12px}
      .pdf-toolbar{padding:10px}
      .pdf-tbtn{padding:8px 10px;font-size:12px}
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>

  <script>
    const SUPABASE_URL = "https://qhggamgxfwlwtpmwxfwk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_X9_aDiQcrKhYyPfuQdnKPA_K8F7RPjM";
    let db = null, session = null, profile = null, activeTab = "home";
    let selSubject = null, selChapter = null, selCategory = "general", adminTab = "dashboard";
    let cbtTest = null, cbtQuestions = [], cbtAnswers = {}, cbtMarked = new Set(), cbtBookmarks = new Set(), cbtIndex = 0, cbtTimerRef = null, cbtRemaining = 0;
    let pr = null;
    const app = document.getElementById("app");

    // Utility functions
    function escapeHtml(v){return (v??"").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
    function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild}
    function showFatalError(m){document.body.innerHTML=`<div style="min-height:100vh;background:var(--bg);color:#fff;padding:24px;display:grid;place-items:center"><div style="max-width:620px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px;box-shadow:var(--shadow-lg)"><h2 style="color:var(--danger);margin:0 0 14px;font-size:22px">NEETrix Error</h2><div style="color:#c5cada;line-height:1.7;white-space:pre-wrap;font-size:15px">${escapeHtml(m)}</div></div></div>`}
    function getLastScore(){try{return JSON.parse(localStorage.getItem("neetrix_last_score")||"null")}catch(e){return null}}
    function saveLastScore(obj){try{localStorage.setItem("neetrix_last_score",JSON.stringify(obj))}catch(e){}}
    function lsGet(key,fallback){try{const v=localStorage.getItem(key);return v!=null?JSON.parse(v):fallback}catch(e){return fallback}}
    function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
    function skelList(n,cls){let h="";for(let i=0;i<n;i++)h+=`<div class="skel ${cls||"skel-card"}"></div>`;return h}
    function toast(msg, ms=2800){let t=document.getElementById("globalToast");if(!t){t=el(`<div class="toast" id="globalToast"></div>`);document.body.appendChild(t);}t.textContent=msg;t.classList.add("show");clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove("show"),ms);}
    function confirmAction(title,message){return new Promise(resolve=>{const modal=el(`<div class="modal-bg"><div class="modal-box" style="max-width:440px"><button class="modal-close" id="mcClose">×</button><h3 style="margin:0 0 12px;font-size:18px">${escapeHtml(title)}</h3><p class="muted" style="line-height:1.6;margin:0 0 20px;white-space:pre-wrap;font-size:14px">${escapeHtml(message)}</p><div style="display:flex;gap:10px"><button class="btn-outline" style="flex:1" id="cNo">Cancel</button><button class="btn-danger" style="flex:1" id="cYes">Confirm</button></div></div></div>`);document.body.appendChild(modal);document.getElementById("mcClose").onclick=()=>{modal.remove();resolve(false);};document.getElementById("cNo").onclick=()=>{modal.remove();resolve(false);};document.getElementById("cYes").onclick=()=>{modal.remove();resolve(true);};modal.onclick=e=>{if(e.target===modal){modal.remove();resolve(false);}};});}
    function ytId(url){const m=(url||"").match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null}

    // Initialize app
    async function initializeApp(){
      try{
        if(!SUPABASE_URL || !SUPABASE_ANON_KEY) throw new Error("Supabase not configured");
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        await boot();
      }catch(e){
        console.error(e);
        showFatalError(e?.message || "Could not start application");
      }
    }

    async function boot(){
      const stored = localStorage.getItem("neetrix_session");
      if(stored){
        try{
          const parsed = JSON.parse(stored);
          if(parsed?.session?.user){
            session = parsed.session;
            await afterLogin();
            return;
          }
        }catch(e){console.error("Session parse error",e)}
      }
      renderAuth();
    }

    /* ===================== AUTHENTICATION ===================== */
    function renderAuth(mode){
      mode = mode || "login";
      app.innerHTML = "";
      app.appendChild(el(`<div class="auth-wrap"><div class="auth-card">
        <div class="brand">NEETrix</div>
        <div class="sub">The focused way to prepare for NEET.</div>
        <div class="msg" id="msg"></div>
        <div id="fields"></div>
        <button class="btn" style="width:100%" id="mainBtn"></button>
        <button class="link" id="link1"></button>
        <button class="link" id="link2" style="display:none"></button>
      </div></div>`));
      const fields = document.getElementById("fields");
      const mainBtn = document.getElementById("mainBtn");
      const link1 = document.getElementById("link1");
      const link2 = document.getElementById("link2");
      const msg = document.getElementById("msg");
      if(mode === "login" || mode === "signup"){
        fields.innerHTML = `<input id="email" type="email" placeholder="Email address" autocomplete="email" inputmode="email"/>
          <input id="pass" type="password" placeholder="Password (8+ characters)" autocomplete="${mode==="login"?"current-password":"new-password"}" inputmode="text"/>`;
        mainBtn.textContent = mode === "login" ? "Log in" : "Create account";
        link1.textContent = mode === "login" ? "New here? Create an account" : "Already have an account? Log in";
        link1.onclick = () => renderAuth(mode === "login" ? "signup" : "login");
        link2.style.display = mode === "login" ? "block" : "none";
        link2.textContent = "Forgot password?";
        link2.onclick = () => renderAuth("forgot");
        mainBtn.onclick = async () => {
          msg.textContent = "";
          mainBtn.disabled = true;
          mainBtn.style.opacity = "0.6";
          const email = document.getElementById("email").value.trim();
          const pass = document.getElementById("pass").value;
          if(!email || !pass){ msg.style.color="var(--muted)"; msg.textContent="Please enter both email and password."; mainBtn.disabled=false; mainBtn.style.opacity="1"; return; }
          try{
            if(mode === "signup"){
              const {error} = await db.auth.signUp({email, password: pass});
              if(error) throw error;
              msg.style.color = "var(--green)";
              msg.textContent = "Account created! Please check your email to verify, then log in.";
              setTimeout(() => renderAuth("login"), 2000);
            } else {
              const {data, error} = await db.auth.signInWithPassword({email, password: pass});
              if(error) throw error;
              session = data.session;
              localStorage.setItem("neetrix_session", JSON.stringify({session}));
              await afterLogin();
            }
          }catch(e){
            msg.style.color = "var(--danger)";
            msg.textContent = e?.message || "Something went wrong. Please try again.";
          } finally {
            mainBtn.disabled = false;
            mainBtn.style.opacity = "1";
          }
        };
      } else if(mode === "forgot"){
        fields.innerHTML = `<input id="email" type="email" placeholder="Email address" inputmode="email"/>`;
        mainBtn.textContent = "Send reset link";
        link1.textContent = "Back to log in";
        link1.onclick = () => renderAuth("login");
        mainBtn.onclick = async () => {
          msg.textContent = "";
          mainBtn.disabled = true;
          mainBtn.style.opacity = "0.6";
          const email = document.getElementById("email").value.trim();
          if(!email){ msg.style.color="var(--muted)"; msg.textContent="Please enter your email address."; mainBtn.disabled=false; mainBtn.style.opacity="1"; return; }
          try{
            const {error} = await db.auth.resetPasswordForEmail(email);
            if(error) throw error;
            msg.style.color = "var(--green)";
            msg.textContent = "Password reset link sent to your email!";
          }catch(e){
            msg.style.color = "var(--danger)";
            msg.textContent = e?.message || "Error sending reset link.";
          } finally {
            mainBtn.disabled = false;
            mainBtn.style.opacity = "1";
          }
        };
      }
    }

    function renderStatusScreen(status){
      app.innerHTML = "";
      const msgs = {pending: ["Request sent", "Your access request has been sent. Please wait for admin approval."],paused: ["Account paused", "Your account is temporarily paused by admin."],blocked: ["Account blocked", "Access has been blocked by admin. Please contact support."]};
      const [t,b] = msgs[status] || ["Access unavailable", "Please contact admin for assistance."];
      app.appendChild(el(`<div class="auth-wrap"><div class="auth-card">
        <div class="brand">NEETrix</div>
        <h2 style="margin:16px 0 12px;font-size:20px">${escapeHtml(t)}</h2>

        <button class="btn-outline" style="width:100%" id="out">Log out</button>

      document.getElementById("out").onclick = async () => {try{ await db.auth.signOut(); }catch(e){}session=null;profile=null;localStorage.removeItem("neetrix_session");renderAuth();};
    }

    async function afterLogin(){
      if(!session?.user){ renderAuth(); return; }
      try{
        try{ await db.from("login_events").insert({user_id: session.user.id, email: session.user.email}); }catch(e){}
        const {data, error} = await db.from("profiles").select("*").eq("id", session.user.id).single();
        if(error){if(error.code === "PGRST116"){profile=null;renderStatusScreen("pending");return;}throw error;}
        profile = data;
        if(!profile || profile.status !== "active"){renderStatusScreen(profile ? profile.status : "pending");return;}
        activeTab = "home";
        selSubject = null;
        selChapter = null;
        renderShell();
      }catch(e){
        showFatalError(e?.message || "Unable to load your account");
      }

    function renderBody(){

      c.classList.remove("page-fade");

      if(activeTab === "home") renderHome(c);
      else if(activeTab === "content") renderSubjectBrowser(c, "video");

    /* ===================== PDF READER - PREMIUM ===================== */
    async function openPdfReader(url, title, storageKey){
      const progress = lsGet("pdfprog_" + storageKey, {page:1, scale:null});
      const modal = el(`<div class="pdf-modal" id="pdfModal">
        <div class="pdf-toolbar">
          <button class="pdf-tbtn" id="pdfClose">✕ Close</button>
          <div class="pdf-title">${escapeHtml(title)}</div>

          <span class="muted">/ <span id="pdfPageTotal">?</span></span>
          <button class="pdf-tbtn" id="pdfNext">Next ›</button>
          <div style="width:1px;height:26px;background:var(--border);margin:0 8px"></div>
          <button class="pdf-tbtn" id="pdfZoomOut">−</button>
          <span class="pdf-zoom-label" id="pdfZoomLabel">100%</span>
          <button class="pdf-tbtn" id="pdfZoomIn">+</button>
          <button class="pdf-tbtn" id="pdfFitWidth">Fit Width</button>
          <button class="pdf-tbtn" id="pdfFitPage">Fit Page</button>
          <div style="width:1px;height:26px;background:var(--border);margin:0 8px"></div>
          <button class="pdf-tbtn" id="pdfAnnotate">✎ Annotate</button>
          <button class="pdf-tbtn" id="pdfFullscreen">⛶ Fullscreen</button>
        </div>
        <div class="pdf-annobar" id="pdfAnnoBar" style="display:none">
          <button class="pdf-tbtn" id="toolPen" title="Pen (P)">✎ Pen</button>
          <button class="pdf-tbtn" id="toolHi" title="Highlighter (H)">▮ Highlighter</button>
          <button class="pdf-tbtn" id="toolEraser" title="Eraser (E)">⌫ Eraser</button>
          <div style="width:1px;height:28px;background:var(--border);margin:0 8px"></div>
          <div class="pdf-color selected" style="background:#4f8cff" data-c="#4f8cff" title="Blue"></div>
          <div class="pdf-color" style="background:#f59e0b" data-c="#f59e0b" title="Orange"></div>
          <div class="pdf-color" style="background:#22d3a3" data-c="#22d3a3" title="Green"></div>
          <div class="pdf-color" style="background:#ef4444" data-c="#ef4444" title="Red"></div>
          <div class="pdf-color" style="background:#ffffff" data-c="#ffffff" title="White"></div>
          <div style="width:1px;height:28px;background:var(--border);margin:0 8px"></div>
          <button class="pdf-tbtn" id="toolUndo" title="Undo (Ctrl+Z)">↺ Undo</button>
          <button class="pdf-tbtn" id="toolRedo" title="Redo (Ctrl+Y)">↻ Redo</button>
        </div>
        <div class="pdf-canvas-wrap" id="pdfCanvasWrap">
          <div class="pdf-canvas-stack">
            <canvas id="pdfCanvas"></canvas>
            <canvas id="pdfAnnoCanvas" style="position:absolute;top:0;left:0;touch-action:none"></canvas>
          </div>
        </div>
        <div class="pdf-pagebar">
          <button class="pdf-tbtn" id="pdfPrev2">‹ Previous</button>
          <input id="pdfPageInput2" type="number" min="1" value="${progress.page||1}"/>
          <span class="muted">/ <span id="pdfPageTotal2">?</span></span>
          <button class="pdf-tbtn" id="pdfNext2">Next ›</button>
        </div>
        <div class="toast" id="pdfToast"></div>
      </div>`);
      document.body.appendChild(modal);
      modal.focus();

      try{
        const pdfDoc = await pdfjsLib.getDocument(url).promise;
        const canvas = document.getElementById("pdfCanvas");
        const annoCanvas = document.getElementById("pdfAnnoCanvas");
        const ctx = canvas.getContext("2d");
        const annoCtx = annoCanvas.getContext("2d");
        const pageNum = Math.min(progress.page || 1, pdfDoc.numPages);
        let scale = progress.scale || 1.2;
        let fitMode = "custom";
        let annotations = lsGet("pdfanno_" + storageKey, {});
        let redoStack = {};
        let currentTool = null;
        let currentColor = "#4f8cff";
        let isDrawing = false;
        let currentStroke = null;
        let lastTouchDistance = null;

        document.getElementById("pdfPageTotal").textContent = pdfDoc.numPages;
        document.getElementById("pdfPageTotal2").textContent = pdfDoc.numPages;
        document.getElementById("pdfZoomLabel").textContent = Math.round(scale * 100) + "%";

        function drawAnnotations(pageNum){
          annoCtx.clearRect(0, 0, annoCanvas.width, annoCanvas.height);
          const strokes = (annotations[pageNum] || []);
          strokes.forEach(s => {
            annoCtx.strokeStyle = s.color;
            annoCtx.lineWidth = s.width * scale;
            annoCtx.lineCap = "round";
            annoCtx.lineJoin = "round";
            annoCtx.globalAlpha = s.alpha || 1;
            annoCtx.beginPath();
            s.points.forEach((p, i) => {
              const x = p.x * scale, y = p.y * scale;
              if(i === 0) annoCtx.moveTo(x, y); else annoCtx.lineTo(x, y);
            });
            annoCtx.stroke();
          });
          annoCtx.globalAlpha = 1;
        }

        function saveAnnotations(){
          lsSet("pdfanno_" + storageKey, annotations);
        }

        async function renderPage(n){
          const page = await pdfDoc.getPage(n);
          let viewport;
          
          if(fitMode === "width"){
            const wrap = document.getElementById("pdfCanvasWrap");
            const availWidth = wrap.clientWidth - 48;
            const unscaledViewport = page.getViewport({scale: 1});
            scale = availWidth / unscaledViewport.width;
            viewport = page.getViewport({scale});
          }else if(fitMode === "page"){
            const wrap = document.getElementById("pdfCanvasWrap");
            const availWidth = wrap.clientWidth - 48;
            const availHeight = wrap.clientHeight - 48;
            const unscaledViewport = page.getViewport({scale: 1});
            scale = Math.min(availWidth / unscaledViewport.width, availHeight / unscaledViewport.height);
            viewport = page.getViewport({scale});
          }else{
            viewport = page.getViewport({scale});
          }

          canvas.width = viewport.width;
          canvas.height = viewport.height;
          annoCanvas.width = viewport.width;
          annoCanvas.height = viewport.height;
          
          await page.render({canvasContext: ctx, viewport}).promise;
          drawAnnotations(n);
          
          document.getElementById("pdfPageInput").value = n;
          document.getElementById("pdfPageInput2").value = n;
          document.getElementById("pdfZoomLabel").textContent = Math.round(scale * 100) + "%";
          lsSet("pdfprog_" + storageKey, {page: n, scale});
        }

        await renderPage(pageNum);

        // Annotation drawing with pointer events
        annoCanvas.addEventListener("pointerdown", (e) => {
          if(!currentTool) return;
          e.preventDefault();
          e.stopPropagation();
          isDrawing = true;
          annoCanvas.setPointerCapture(e.pointerId);
          const rect = annoCanvas.getBoundingClientRect();
          const x = (e.clientX - rect.left) / scale;
          const y = (e.clientY - rect.top) / scale;
          
          if(currentTool === "eraser"){
            const strokes = annotations[pageNum] || [];
            const idx = strokes.findIndex(s => s.points.some(p => Math.hypot(p.x-x, p.y-y) < 15/scale));
            if(idx > -1){
              strokes.splice(idx, 1);
              drawAnnotations(pageNum);
              saveAnnotations();
              toast("Erased!");
            }
          }else{
            currentStroke = {
              color: currentColor,
              width: currentTool === "highlighter" ? 20 : 3,
              alpha: currentTool === "highlighter" ? 0.35 : 1,
              points: [{x, y}]
            };
          }
        });

        annoCanvas.addEventListener("pointermove", (e) => {
          if(!isDrawing || !currentStroke) return;
          e.preventDefault();
          e.stopPropagation();
          const rect = annoCanvas.getBoundingClientRect();
          const x = (e.clientX - rect.left) / scale;
          const y = (e.clientY - rect.top) / scale;
          currentStroke.points.push({x, y});
          
          annoCtx.strokeStyle = currentStroke.color;
          annoCtx.lineWidth = currentStroke.width * scale;
          annoCtx.lineCap = "round";
          annoCtx.lineJoin = "round";
          annoCtx.globalAlpha = currentStroke.alpha;
          const pts = currentStroke.points;
          annoCtx.beginPath();
          pts.forEach((p, i) => {
            const px = p.x * scale, py = p.y * scale;
            if(i === 0) annoCtx.moveTo(px, py); else annoCtx.lineTo(px, py);
          });
          annoCtx.stroke();
          annoCtx.globalAlpha = 1;
        });

        annoCanvas.addEventListener("pointerup", (e) => {
          if(!isDrawing) return;
          isDrawing = false;
          annoCanvas.releasePointerCapture(e.pointerId);
          if(currentStroke){
            if(!annotations[pageNum]) annotations[pageNum] = [];
            annotations[pageNum].push(currentStroke);
            currentStroke = null;
            saveAnnotations();
          }
        });

        // Touch gestures for zoom
        const wrap = document.getElementById("pdfCanvasWrap");
        wrap.addEventListener("touchstart", (e) => {
          if(e.touches.length === 2){
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            lastTouchDistance = Math.sqrt(dx*dx + dy*dy);
          }
        }, {passive:true});

        wrap.addEventListener("touchmove", (e) => {
          if(e.touches.length === 2 && lastTouchDistance){
            e.preventDefault();
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const distance = Math.sqrt(dx*dx + dy*dy);
            const delta = distance - lastTouchDistance;
            if(Math.abs(delta) > 5){
              fitMode = "custom";
              scale += delta * 0.005;
              scale = Math.max(0.4, Math.min(4, scale));
              renderPage(parseInt(document.getElementById("pdfPageInput").value));
              lastTouchDistance = distance;
            }
          }
        }, {passive:false});

        wrap.addEventListener("touchend", () => {
          lastTouchDistance = null;
        });

        // Toolbar buttons
        document.getElementById("pdfClose").onclick = () => { modal.remove(); };
        document.getElementById("pdfPrev").onclick = () => {
          const p = parseInt(document.getElementById("pdfPageInput").value) || 1;
          if(p > 1) renderPage(p - 1);
        };
        document.getElementById("pdfNext").onclick = () => {
          const p = parseInt(document.getElementById("pdfPageInput").value) || 1;
          if(p < pdfDoc.numPages) renderPage(p + 1);
        };
        document.getElementById("pdfPrev2").onclick = () => document.getElementById("pdfPrev").click();
        document.getElementById("pdfNext2").onclick = () => document.getElementById("pdfNext").click();
        document.getElementById("pdfPageInput").onchange = () => {
          const p = parseInt(document.getElementById("pdfPageInput").value) || 1;
          if(p >= 1 && p <= pdfDoc.numPages) renderPage(p);
        };
        document.getElementById("pdfPageInput2").onchange = () => document.getElementById("pdfPageInput").onchange();
        document.getElementById("pdfZoomIn").onclick = () => {
          fitMode = "custom";
          scale = Math.min(4, scale + 0.25);
          renderPage(parseInt(document.getElementById("pdfPageInput").value));
          toast("Zoomed in");
        };
        document.getElementById("pdfZoomOut").onclick = () => {
          fitMode = "custom";
          scale = Math.max(0.4, scale - 0.25);
          renderPage(parseInt(document.getElementById("pdfPageInput").value));
          toast("Zoomed out");
        };
        document.getElementById("pdfFitWidth").onclick = () => {
          fitMode = "width";
          renderPage(parseInt(document.getElementById("pdfPageInput").value));
          toast("Fit to width");
        };
        document.getElementById("pdfFitPage").onclick = () => {
          fitMode = "page";
          renderPage(parseInt(document.getElementById("pdfPageInput").value));
          toast("Fit to page");
        };
        document.getElementById("pdfAnnotate").onclick = () => {
          const bar = document.getElementById("pdfAnnoBar");
          const showing = bar.style.display !== "none";
          bar.style.display = showing ? "none" : "flex";
          document.getElementById("pdfAnnotate").classList.toggle("active-tool", !showing);
          if(showing){ 
            currentTool = null; 
            annoCanvas.style.pointerEvents = "none";
            toast("Annotation mode off");
          }else { 
            annoCanvas.style.pointerEvents = "auto"; 
            currentTool = "pen";
            toast("Annotation mode on - Pen selected");
          }
        };
        document.getElementById("toolPen").onclick = () => { 
          currentTool = "pen"; 
          annoCanvas.style.pointerEvents = "auto";
          document.querySelectorAll("#pdfAnnoBar .pdf-tbtn").forEach(b => b.classList.remove("active-tool"));
          document.getElementById("toolPen").classList.add("active-tool");
          toast("Pen tool selected");
        };
        document.getElementById("toolHi").onclick = () => { 
          currentTool = "highlighter"; 
          annoCanvas.style.pointerEvents = "auto";
          document.querySelectorAll("#pdfAnnoBar .pdf-tbtn").forEach(b => b.classList.remove("active-tool"));
          document.getElementById("toolHi").classList.add("active-tool");
          toast("Highlighter selected");
        };
        document.getElementById("toolEraser").onclick = () => { 
          currentTool = "eraser"; 
          annoCanvas.style.pointerEvents = "auto";
          document.querySelectorAll("#pdfAnnoBar .pdf-tbtn").forEach(b => b.classList.remove("active-tool"));
          document.getElementById("toolEraser").classList.add("active-tool");
          toast("Eraser selected");
        };
        document.getElementById("toolUndo").onclick = () => {
          const strokes = annotations[pageNum] || [];
          if(strokes.length){
            const s = strokes.pop();
            if(!redoStack[pageNum]) redoStack[pageNum] = [];
            redoStack[pageNum].push(s);
            drawAnnotations(pageNum);
            saveAnnotations();
            toast("Undone");
          }else{
            toast("Nothing to undo");
          }
        };
        document.getElementById("toolRedo").onclick = () => {
          const redo = redoStack[pageNum] || [];
          if(redo.length){
            const s = redo.pop();
            if(!annotations[pageNum]) annotations[pageNum] = [];
            annotations[pageNum].push(s);
            drawAnnotations(pageNum);
            saveAnnotations();
            toast("Redone");
          }else{
            toast("Nothing to redo");
          }
        };
        document.querySelectorAll(".pdf-color").forEach(sw => {
          sw.onclick = () => {
            currentColor = sw.dataset.c;
            document.querySelectorAll(".pdf-color").forEach(x => x.classList.remove("selected"));
            sw.classList.add("selected");
            toast(`Color: ${sw.title}`);
          };
        });
        document.getElementById("pdfFullscreen").onclick = async () => {
          try{
            if(!document.fullscreenElement){
              await modal.requestFullscreen();
              document.getElementById("pdfFullscreen").textContent = "❌ Exit Fullscreen";
              toast("Fullscreen enabled");
            }else{
              await document.exitFullscreen();
              document.getElementById("pdfFullscreen").textContent = "⛶ Fullscreen";
              toast("Fullscreen disabled");
            }
          }catch(e){toast("Fullscreen not supported")}
        };

        // Keyboard shortcuts
        modal.addEventListener("keydown", (e) => {
          if(e.key === "ArrowLeft" || e.key === "PageUp"){
            e.preventDefault();
            document.getElementById("pdfPrev").click();
          }else if(e.key === "ArrowRight" || e.key === "PageDown"){
            e.preventDefault();
            document.getElementById("pdfNext").click();
          }else if(e.key === "Escape"){
            if(document.fullscreenElement){
              document.exitFullscreen();
            }else{
              modal.remove();
            }
          }else if((e.ctrlKey || e.metaKey) && e.key === "z"){
            e.preventDefault();
            document.getElementById("toolUndo").click();
          }else if((e.ctrlKey || e.metaKey) && e.key === "y"){
            e.preventDefault();
            document.getElementById("toolRedo").click();
          }else if(e.key === "p" || e.key === "P"){
            document.getElementById("toolPen").click();
          }else if(e.key === "h" || e.key === "H"){
            document.getElementById("toolHi").click();
          }else if(e.key === "e" || e.key === "E"){
            document.getElementById("toolEraser").click();
          }else if(e.key === "+" || e.key === "="){
            document.getElementById("pdfZoomIn").click();
          }else if(e.key === "-"){
            document.getElementById("pdfZoomOut").click();
          }
        });

        document.addEventListener("fullscreenchange", () => {
          if(!document.fullscreenElement){
            document.getElementById("pdfFullscreen").textContent = "⛶ Fullscreen";
          }
        });

      }catch(e){
        modal.remove();
        toast(e?.message || "Unable to load PDF");
      }
    }

    /* ===================== TESTS ===================== */
    async function renderTests(c){
      c.innerHTML = `<h2 style="margin:0 0 14px;font-size:20px">Tests</h2><div id="testList">${skelList(3)}</div>`;
      const list = document.getElementById("testList");

        const {data, error} = await db.from("tests").select("*").order("created_at", {ascending:false});

    async function startPdfTest(test){
      if(!test.file_path){ toast("No paper uploaded"); return; }
      try{
        const {data, error} = await db.storage.from("content").createSignedUrl(test.file_path, 7200);
        if(error) throw error;
        if(!data?.signedUrl) throw new Error("No link");
        await openPdfReader(data.signedUrl, test.title, "test_" + test.id);
      }catch(e){
        toast(e?.message || "Unable to start");
      }
    }

    async function startCbtTest(test){
      try{
        const {data, error} = await db.from("test_questions").select("id, question_text, option_a, option_b, option_c, option_d, sort_order").eq("test_id", test.id).order("sort_order");
        if(error) throw error;
        if(!data?.length){ toast("No questions for this CBT yet."); return; }
        cbtTest = test;
        cbtQuestions = data;
        cbtAnswers = {};
        cbtMarked = new Set();
        cbtBookmarks = new Set();
        cbtIndex = 0;
        cbtRemaining = (Number(test.duration_minutes) || 60) * 60;
        if(cbtTimerRef) clearInterval(cbtTimerRef);
        cbtTimerRef = setInterval(() => {
          cbtRemaining--;
          const tEl = document.getElementById("cbtTimer");
          if(tEl){ const m = Math.floor(cbtRemaining/60), s = cbtRemaining % 60; tEl.textContent = `${m}:${s<10?"0":""}${s}`; }
          if(cbtRemaining <= 0){ clearInterval(cbtTimerRef); cbtTimerRef = null; finishCbt(true); }
        }, 1000);
        renderCbtUI();
      }catch(e){
        toast(e?.message || "Unable to start CBT");
      }
    }

    function renderCbtUI(){
      const c = document.getElementById("content");
      if(!c || !cbtQuestions.length) return;
      const q = cbtQuestions[cbtIndex];
      const selected = cbtAnswers[q.id] || null;
      c.innerHTML = `<div class="timer" id="cbtTimer">${Math.floor(cbtRemaining/60)}:${(cbtRemaining%60)<10?"0":""}${cbtRemaining%60}</div><div class="cbt-layout"><div class="cbt-qbox"><div class="muted" style="margin-bottom:10px;font-size:13px">Question ${cbtIndex+1} of ${cbtQuestions.length}</div><div style="font-size:16px;line-height:1.6;margin-bottom:14px">${escapeHtml(q.question_text)}</div><button class="cbt-opt ${selected==="A"?"selected":""}" data-o="A">${escapeHtml(q.option_a)}</button><button class="cbt-opt ${selected==="B"?"selected":""}" data-o="B">${escapeHtml(q.option_b)}</button><button class="cbt-opt ${selected==="C"?"selected":""}" data-o="C">${escapeHtml(q.option_c)}</button><button class="cbt-opt ${selected==="D"?"selected":""}" data-o="D">${escapeHtml(q.option_d)}</button><div class="cbt-nav"><button class="btn-outline" id="cbtPrev" ${cbtIndex===0?"disabled":""}>← Previous</button><button class="btn-outline" id="cbtMark">${cbtMarked.has(q.id)?"✓ Unmark":"○ Mark"}</button><button class="btn" id="cbtNext">${cbtIndex===cbtQuestions.length-1?"Submit":"Next →"}</button></div><button class="btn-danger" style="width:100%;margin-top:16px" id="cbtSubmit">Submit Test</button></div><div class="cbt-palette"><div style="font-weight:600;font-size:13px;margin-bottom:10px">Question Palette</div><div class="cbt-palette-grid" id="palette"></div><div class="cbt-legend"><span><div class="cbt-dot" style="background:rgba(79,140,255,.3);border:1px solid var(--accent)"></div> Answered</span><span><div class="cbt-dot" style="background:rgba(245,158,11,.3);border:1px solid var(--warn)"></div> Marked</span><span><div class="cbt-dot" style="background:var(--panel2);border:1px solid var(--border)"></div> Not Visited</span></div></div></div>`;
      c.querySelectorAll(".cbt-opt").forEach(btn => { btn.onclick = () => { cbtAnswers[q.id] = btn.dataset.o; renderCbtUI(); }; });
      document.getElementById("cbtPrev").onclick = () => { if(cbtIndex > 0){ cbtIndex--; renderCbtUI(); } };
      document.getElementById("cbtNext").onclick = () => { if(cbtIndex < cbtQuestions.length-1){ cbtIndex++; renderCbtUI(); } else { finishCbt(false); } };
      document.getElementById("cbtMark").onclick = () => { if(cbtMarked.has(q.id)) cbtMarked.delete(q.id); else cbtMarked.add(q.id); renderCbtUI(); };
      document.getElementById("cbtSubmit").onclick = async () => { if(await confirmAction("Submit Test", "Submit test? You cannot change answers after submission.")) finishCbt(false); };
      const palette = document.getElementById("palette");
      cbtQuestions.forEach((qq, i) => {
        const btn = el(`<button class="cbt-pbtn">${i+1}</button>`);
        if(cbtAnswers[qq.id]) btn.classList.add("answered");
        if(cbtMarked.has(qq.id)) btn.classList.add("marked");
        if(i === cbtIndex) btn.classList.add("current");
        btn.onclick = () => { cbtIndex = i; renderCbtUI(); };
        palette.appendChild(btn);
      });
    }

    async function finishCbt(auto){
      if(cbtTimerRef){ clearInterval(cbtTimerRef); cbtTimerRef = null; }
      const c = document.getElementById("content");
      c.innerHTML = `<div class="card score-card"><div class="muted">Calculating score...</div></div>`;
      let score = 0, total = cbtQuestions.length * 4, correct = 0, wrong = 0, unattempted = 0;
      let reviewQs = [];
      cbtQuestions.forEach(q => {
        const ans = cbtAnswers[q.id] || null;
        const corr = (q.correct_option || "A").toUpperCase();
        let status = "unattempted";
        if(!ans) unattempted++;
        else if(ans === corr){ correct++; status = "correct"; }
        else { wrong++; status = "wrong"; }
        reviewQs.push({id: q.id, question_text: q.question_text, option_a: q.option_a, option_b: q.option_b, option_c: q.option_c, option_d: q.option_d, correct_option: corr, user_answer: ans, status});
      });
      score = (correct * 4) + (wrong * -1);
      total = cbtQuestions.length * 4;
      const lastScoreData = {score, total, correct, wrong, unattempted, title: cbtTest?.title, at: Date.now(), review: reviewQs};
      saveLastScore(lastScoreData);
      showScoreAndReview(c, lastScoreData, auto);
    }

    function showScoreAndReview(c, data, auto){
      const den = (data.correct||0) + (data.wrong||0) + (data.unattempted||0);
      const accuracy = den ? Math.round(((data.correct||0) / den) * 100) : 0;
      c.innerHTML = `<div class="card score-card"><div class="muted" style="margin-bottom:8px">${auto ? "⏰ Time's up!" : "✅ Test Submitted"}</div><h2 style="margin:0 0 6px;font-size:22px">${escapeHtml(data.title || "Test")}</h2><div class="score-num">${data.score}</div><div class="muted" style="margin-bottom:20px;font-size:15px">out of ${data.total}</div><div class="grid2" style="max-width:380px;margin:0 auto 22px;text-align:left">
        <div class="card" style="margin:0"><div class="muted">Correct</div><div style="font-weight:700;color:var(--green);font-size:18px">${data.correct||0}</div></div>
        <div class="card" style="margin:0"><div class="muted">Wrong</div><div style="font-weight:700;color:var(--danger);font-size:18px">${data.wrong||0}</div></div>
        <div class="card" style="margin:0"><div class="muted">Unattempted</div><div style="font-weight:700;font-size:18px">${data.unattempted||0}</div></div>
        <div class="card" style="margin:0"><div class="muted">Accuracy</div><div style="font-weight:700;font-size:18px">${accuracy}%</div></div>
      </div><button class="btn" style="width:100%;margin-bottom:12px" id="viewReview">📊 Question-wise Review</button><button class="btn-outline" style="width:100%" id="backTests">Back to Tests</button></div>`;
      document.getElementById("backTests").onclick = () => { cbtTest = null; cbtQuestions = []; cbtAnswers = {}; renderTests(c); };
      document.getElementById("viewReview").onclick = () => renderQuestionReview(c, data);
    }

    function renderQuestionReview(c, data){
      if(!data.review || !data.review.length){
        c.innerHTML = `<div class="empty">Review data not available.</div><button class="btn" id="backScore">Back</button>`;
        document.getElementById("backScore").onclick = () => showScoreAndReview(c, data, false);
        return;
      }
      let html = `<button class="back" id="backScore">← Score Summary</button><h2 style="margin:0 0 14px;font-size:20px">${escapeHtml(data.title || "Review")}</h2><div class="muted" style="margin-bottom:18px;font-size:14px">${data.correct||0} correct · ${data.wrong||0} wrong · ${data.unattempted||0} skipped</div>`;
      data.review.forEach((q, i) => {
        const statusColor = q.status === "correct" ? "var(--green)" : q.status === "wrong" ? "var(--danger)" : "var(--muted)";
        const statusText = q.status === "correct" ? "✓ Correct" : q.status === "wrong" ? "✗ Wrong" : "○ Not Attempted";
        const optHtml = (letter, text) => {
          let extra = "";
          if(q.user_answer === letter) extra += ` <span style="color:var(--accent);font-weight:600">(Your answer)</span>`;
          if(q.correct_option === letter) extra += ` <span style="color:var(--green);font-weight:600">(Correct)</span>`;
          let bg = "var(--panel2)";
          if(q.correct_option === letter) bg = "rgba(34,211,163,.12)";
          else if(q.user_answer === letter && q.status === "wrong") bg = "rgba(239,68,68,.12)";
          return `<div style="padding:11px 13px;margin:7px 0;border-radius:10px;border:1px solid var(--border);background:${bg};font-size:14px"><b>${letter}.</b> ${escapeHtml(text||"")}${extra}</div>`;
        };
        html += `<div class="card" style="margin-bottom:16px"><div class="row" style="margin-bottom:10px"><div style="font-weight:600;font-size:15px">Q${i+1}</div><div style="color:${statusColor};font-weight:600;font-size:13px;margin-left:auto">${statusText}</div></div><div style="line-height:1.6;margin-bottom:12px;font-size:15px">${escapeHtml(q.question_text)}</div>${optHtml("A", q.option_a)}${optHtml("B", q.option_b)}${optHtml("C", q.option_c)}${optHtml("D", q.option_d)}</div>`;
      });
      html += `<button class="btn" style="width:100%;margin-top:12px" id="backTests2">Back to Tests</button>`;
      c.innerHTML = html;
      document.getElementById("backScore").onclick = () => showScoreAndReview(c, data, false);
      document.getElementById("backTests2").onclick = () => { cbtTest = null; cbtQuestions = []; cbtAnswers = {}; renderTests(c); };
    }

    /* ===================== ADMIN PANEL ===================== */
    async function renderAdmin(c){
      c.innerHTML = `<h2 style="margin:0 0 14px;font-size:20px">Admin Panel</h2><div class="tabs2"><button class="tab2 ${adminTab==="dashboard"?"active":""}" data-a="dashboard">Dashboard</button><button class="tab2 ${adminTab==="subjects"?"active":""}" data-a="subjects">Subjects</button><button class="tab2 ${adminTab==="content"?"active":""}" data-a="content">Content</button><button class="tab2 ${adminTab==="users"?"active":""}" data-a="users">Users</button></div><div id="adminBody"></div>`;
      c.querySelectorAll(".tab2").forEach(b => { b.onclick = () => { adminTab = b.dataset.a; renderAdmin(c); }; });
      const body = document.getElementById("adminBody");
      if(adminTab === "dashboard") await renderAdminDashboard(body);
      else if(adminTab === "subjects") await renderAdminSubjects(body);
      else if(adminTab === "content") await renderAdminContent(body);
      else if(adminTab === "users") await renderAdminUsers(body);
    }

    async function renderAdminDashboard(body){
      body.innerHTML = `<div class="grid2" id="dashStats">${skelList(6,"skel-card")}</div>`;
      try{
        const [subjects, chapters, pdfs, videos, tests, users] = await Promise.all([
          db.from("subjects").select("id", {count:"exact", head:true}),
          db.from("chapters").select("id", {count:"exact", head:true}),
          db.from("pdfs").select("id", {count:"exact", head:true}),
          db.from("videos").select("id", {count:"exact", head:true}),
          db.from("tests").select("id", {count:"exact", head:true}),
          db.from("profiles").select("id", {count:"exact", head:true})
        ]);
        const stats = [{label:"Subjects", value: subjects.count||0},{label:"Chapters", value: chapters.count||0},{label:"PDFs", value: pdfs.count||0},{label:"Videos", value: videos.count||0},{label:"Tests", value: tests.count||0},{label:"Users", value: users.count||0}];
        document.getElementById("dashStats").innerHTML = stats.map(s => `<div class="card" style="text-align:center;margin:0"><div class="muted">${s.label}</div><div style="font-size:32px;font-weight:700;margin-top:8px">${s.value}</div></div>`).join("");
      }catch(e){
        document.getElementById("dashStats").innerHTML = `<div class="empty">${escapeHtml(e?.message||"Error")}</div>`;
      }
    }

    async function renderAdminSubjects(body){
      body.innerHTML = `<div class="card"><h3 style="margin:0 0 12px;font-size:16px">Add Subject</h3><input id="newSubj" placeholder="Subject name"/><button class="btn" id="addSubj">Add Subject</button></div><h3 style="margin:18px 0 12px;font-size:16px">All Subjects</h3><div id="subjManageList">${skelList(4)}</div>`;
      document.getElementById("addSubj").onclick = async () => {
        const name = document.getElementById("newSubj").value.trim();
        if(!name) return toast("Enter subject name");
        try{
          const {data: existing} = await db.from("subjects").select("sort_order").order("sort_order",{ascending:false}).limit(1);
          const nextOrder = (existing?.[0]?.sort_order || 0) + 1;
          await db.from("subjects").insert({name, sort_order: nextOrder});
          toast("Subject added!");
          renderAdminSubjects(body);
        }catch(e){ toast(e?.message || "Error"); }
      };
      try{
        const {data, error} = await db.from("subjects").select("*").order("sort_order");
        if(error) throw error;
        const list = document.getElementById("subjManageList");
        if(!data?.length){ list.innerHTML = `<div class="empty">No subjects yet.</div>`; return; }
        list.innerHTML = "";
        data.forEach(s => {
          const row = el(`<div class="card row"><div style="flex:1"><div style="font-weight:600;font-size:15px">${escapeHtml(s.name)}</div></div><button class="btn-small delS">Delete</button></div>`);
          row.querySelector(".delS").onclick = async () => {
            const ok = await confirmAction("Delete Subject", `Delete "${s.name}"?\n\nThis will also delete all chapters and content under it.`);
            if(!ok) return;
            try{await db.from("subjects").delete().eq("id", s.id);toast("Subject deleted");renderAdminSubjects(body);}catch(e){toast(e?.message || "Delete failed");}
          };
          list.appendChild(row);
        });
      }catch(e){
        document.getElementById("subjManageList").innerHTML = `<div class="empty">${escapeHtml(e?.message||"Error")}</div>`;
      }
    }

    async function renderAdminContent(body){
      body.innerHTML = `<div class="card"><h3 style="margin:0 0 12px;font-size:16px">Add Chapter</h3><select id="chSubj"></select><input id="newChap" placeholder="Chapter name"/><button class="btn" id="addChap">Add Chapter</button></div><h3 style="margin:18px 0 12px;font-size:16px">Chapters</h3><div id="chapManageList">${skelList(3)}</div>`;
      try{
        const {data: subjects} = await db.from("subjects").select("*").order("sort_order");
        const opts = (subjects||[]).map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join("") || `<option value="">No subjects</option>`;
        document.getElementById("chSubj").innerHTML = opts;
        document.getElementById("addChap").onclick = async () => {
          const subject_id = document.getElementById("chSubj").value;
          const name = document.getElementById("newChap").value.trim();
          if(!subject_id || !name) return toast("Select subject and enter name");
          try{
            const {data: existing} = await db.from("chapters").select("sort_order").eq("subject_id", subject_id).order("sort_order",{ascending:false}).limit(1);
            const nextOrder = (existing?.[0]?.sort_order || 0) + 1;
            await db.from("chapters").insert({subject_id, name, sort_order: nextOrder});
            toast("Chapter added!");
            renderAdminContent(body);
          }catch(e){ toast(e?.message || "Error"); }
        };
        const {data: allChaps} = await db.from("chapters").select("*, subjects(name)").order("sort_order");
        const chapList = document.getElementById("chapManageList");
        if(!allChaps?.length) chapList.innerHTML = `<div class="empty">No chapters</div>`;
        else {
          chapList.innerHTML = "";
          allChaps.forEach(ch => {
            const row = el(`<div class="card row"><div style="flex:1"><div style="font-weight:600;font-size:15px">${escapeHtml(ch.name)}</div><div class="muted" style="font-size:13px">${escapeHtml(ch.subjects?.name||"")}</div></div><button class="btn-small delChap">Delete</button></div>`);
            row.querySelector(".delChap").onclick = async () => {
              const ok = await confirmAction("Delete Chapter", `Delete "${ch.name}"?\n\nThis will also delete all PDFs and videos under it.`);
              if(!ok) return;
              try{await db.from("chapters").delete().eq("id", ch.id);toast("Chapter deleted");renderAdminContent(body);}catch(e){toast(e?.message||"Delete failed");}
            };
            chapList.appendChild(row);
          });
        }
      }catch(e){
        body.innerHTML += `<div class="empty">${escapeHtml(e?.message||"Error")}</div>`;
      }
    }

    async function renderAdminUsers(body){
      try{
        const {data, error} = await db.from("profiles").select("*").order("created_at",{ascending:false});
        if(error) throw error;
        if(!data?.length){ body.innerHTML = `<div class="empty">No users yet.</div>`; return; }
        body.innerHTML = `<table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody id="uRows"></tbody></table>`;
        const rows = document.getElementById("uRows");
        rows.innerHTML = "";
        data.forEach(p => {
          const tr = el(`<tr><td>${escapeHtml(p.email||"")}</td><td>${escapeHtml(p.role||"user")}</td><td>${escapeHtml(p.status||"pending")}</td><td class="row-wrap"><button class="btn-small">Activate</button><button class="btn-small">Pause</button><button class="btn-small">Block</button></td></tr>`);
          rows.appendChild(tr);
        });
      }catch(e){
        body.innerHTML = `<div class="empty">${escapeHtml(e?.message||"Error")}</div>`;
      }
    }

    // Start app
    initializeApp();
  </script>
</body>
</html>
