<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NEETrix — Premium LMS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root{
      --bg:#0a0e1a;
      --bg-gradient:linear-gradient(135deg,#0a0e1a 0%,#1a1025 50%,#0d1524 100%);
      --panel:rgba(255,255,255,0.03);
      --panel-glass:rgba(255,255,255,0.05);
      --panel2:rgba(255,255,255,0.06);
      --border:rgba(255,255,255,0.08);
      --text:#f0f4f8;
      --text-muted:#94a3b8;
      --accent:#6366f1;
      --accent-gradient:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);
      --accent-glow:0 0 30px rgba(99,102,241,0.3);
      --green:#10b981;
      --danger:#ef4444;
      --warn:#f59e0b;
      --shadow-sm:0 2px 8px rgba(0,0,0,0.3);
      --shadow-md:0 4px 16px rgba(0,0,0,0.4);
      --shadow-lg:0 8px 32px rgba(0,0,0,0.5);
      --radius-sm:10px;
      --radius-md:14px;
      --radius-lg:18px;
      --radius-xl:24px;
      --transition-smooth:all 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      background:var(--bg-gradient);
      color:var(--text);
      line-height:1.6;
      min-height:100vh;
    }
    body::before{
      content:'';
      position:fixed;
      top:-50%;left:-50%;
      width:200%;height:200%;
      background:radial-gradient(circle at 30% 40%,rgba(99,102,241,0.08) 0%,transparent 50%),
                 radial-gradient(circle at 70% 60%,rgba(139,92,246,0.08) 0%,transparent 50%);
      animation:bgFloat 20s ease-in-out infinite;
      z-index:-1;
      pointer-events:none;
    }
    @keyframes bgFloat{
      0%,100%{transform:translate(0,0)}
      50%{transform:translate(2%,2%)}
    }
    #app{min-height:100vh}
    h1,h2,h3{font-weight:700;line-height:1.2}
    h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
    button{
      font:inherit;color:inherit;background:transparent;border:0;outline:0;cursor:pointer;
      transition:var(--transition-smooth);
    }
    .btn{
      background:var(--accent-gradient);color:#fff;padding:12px 20px;border-radius:var(--radius-md);
      font-weight:600;font-size:14px;box-shadow:var(--shadow-md),var(--accent-glow);
    }
    .btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg),0 0 40px rgba(99,102,241,0.4)}
    .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
    .btn-outline{
      border:1.5px solid var(--border);padding:12px 20px;border-radius:var(--radius-md);
      background:var(--panel-glass);font-weight:600;font-size:14px;backdrop-filter:blur(10px);
    }
    .btn-outline:hover{border-color:var(--accent);background:rgba(99,102,241,0.1);transform:translateY(-2px)}
    .btn-danger{
      background:linear-gradient(135deg,#ef4444,#f87171);color:#fff;padding:12px 20px;
      border-radius:var(--radius-md);font-weight:600;font-size:14px;box-shadow:var(--shadow-md);
    }
    .btn-danger:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg),0 0 30px rgba(239,68,68,0.4)}
    .btn-small{
      padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;
      background:var(--panel2);border:1px solid var(--border);backdrop-filter:blur(8px);
    }
    .btn-small:hover{background:var(--panel-glass);border-color:var(--accent);transform:translateY(-1px)}
    .link{background:0 0;color:var(--accent);padding:6px 0;font-weight:500}
    .link:hover{color:#8b5cf6}
    .topbar{
      display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);
      background:rgba(10,14,26,0.8);backdrop-filter:blur(20px);position:sticky;top:0;z-index:10;box-shadow:var(--shadow-sm);
    }
    .brand{
      font-weight:800;font-size:20px;background:var(--accent-gradient);-webkit-background-clip:text;
      -webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.03em;
    }
    .navbtn{
      padding:8px 14px;border-radius:var(--radius-sm);font-weight:600;color:var(--text-muted);
      background:0 0;transition:var(--transition-smooth);font-size:13px;
    }
    .navbtn:hover{color:var(--text);background:var(--panel)}
    .navbtn.active{color:#fff;background:var(--panel-glass)}
    .spacer{flex:1}
    .profile-wrap{display:flex;align-items:center}
    .profile-btn{
      width:38px;height:38px;border-radius:50%;background:var(--accent-gradient);color:#fff;
      font-weight:700;display:grid;place-items:center;box-shadow:var(--shadow-md),var(--accent-glow);
      transition:var(--transition-smooth);
    }
    .profile-btn:hover{transform:scale(1.08)}
    .content{padding:20px;max-width:1100px;margin:0 auto}
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
    .auth-card{
      width:100%;max-width:440px;background:var(--panel-glass);border:1px solid var(--border);
      border-radius:var(--radius-xl);padding:32px;backdrop-filter:blur(20px);box-shadow:var(--shadow-lg);
    }
    .auth-card input{
      width:100%;padding:14px 16px;border-radius:var(--radius-md);border:1.5px solid var(--border);
      background:var(--panel);color:var(--text);font-size:14px;margin:12px 0;transition:var(--transition-smooth);
    }
    .auth-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,0.15);outline:none}
    .msg{min-height:22px;margin:10px 0 16px;font-size:14px}
    .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
    .card{
      background:var(--panel-glass);border:1px solid var(--border);border-radius:var(--radius-lg);
      padding:16px;backdrop-filter:blur(12px);transition:var(--transition-smooth);
    }
    .card:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-4px)}
    .card.row{display:flex;align-items:center;gap:12px}
    .subject-card{
      background:var(--panel-glass);border:1px solid var(--border);border-radius:var(--radius-lg);
      padding:22px;text-align:center;cursor:pointer;transition:var(--transition-smooth);
    }
    .subject-card:hover{border-color:var(--accent);transform:translateY(-6px);box-shadow:var(--shadow-lg)}
    .back{
      background:0 0;color:var(--text-muted);padding:8px 0;margin-bottom:14px;font-weight:600;
      display:flex;align-items:center;gap:8px;transition:var(--transition-smooth);
    }
    .back:hover{color:var(--accent);transform:translateX(-4px)}
    .tabs2{
      display:flex;gap:10px;margin:16px 0;padding:6px;background:var(--panel);
      border-radius:var(--radius-md);border:1px solid var(--border);flex-wrap:wrap;
    }
    .tab2{
      padding:10px 16px;border-radius:var(--radius-sm);font-weight:600;border:0;background:0 0;
      color:var(--text-muted);transition:var(--transition-smooth);font-size:13px;
    }
    .tab2:hover{color:var(--text)}
    .tab2.active{background:var(--accent-gradient);color:#fff;box-shadow:var(--shadow-md)}
    .empty{
      text-align:center;color:var(--text-muted);padding:32px;border:2px dashed var(--border);
      border-radius:var(--radius-lg);background:var(--panel);
    }
    .modal-bg{
      position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:grid;
      place-items:center;padding:20px;z-index:50;
    }
    .modal-box{
      width:100%;max-width:540px;background:var(--panel-glass);border:1px solid var(--border);
      border-radius:var(--radius-xl);padding:24px;backdrop-filter:blur(20px);box-shadow:var(--shadow-lg);
      max-height:90vh;overflow:auto;
    }
    .modal-close{
      position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
      background:var(--panel2);color:#fff;font-size:20px;display:grid;place-items:center;
    }
    .modal-close:hover{background:var(--danger);transform:rotate(90deg)}
    .profile-field{margin:14px 0}
    .profile-field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:8px}
    .profile-field input{
      width:100%;padding:12px 14px;border-radius:var(--radius-md);border:1.5px solid var(--border);
      background:var(--panel);color:var(--text);
    }
    .profile-field input:focus{border-color:var(--accent);outline:none}
    .home-hero{
      text-align:center;padding:32px 20px;background:var(--panel-glass);border:1px solid var(--border);
      border-radius:var(--radius-xl);margin-bottom:20px;backdrop-filter:blur(12px);
    }
    .welcome{
      font-size:26px;font-weight:800;margin-top:14px;background:var(--accent-gradient);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .progress-box{
      background:var(--panel-glass);border:1px solid var(--border);border-radius:var(--radius-lg);
      padding:20px;margin-bottom:20px;cursor:pointer;backdrop-filter:blur(12px);
    }
    .progress-box:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-3px)}
    .progress-head{display:flex;justify-content:space-between;margin-bottom:12px}
    .progress-bar-bg{height:12px;background:var(--panel);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
    .progress-bar-fill{height:100%;background:var(--accent-gradient);border-radius:999px;transition:width 0.6s}
    .progress-stats{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:14px}
    .progress-stats b{color:var(--accent);font-weight:700}
    .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
    .home-card{
      background:var(--panel-glass);border:1px solid var(--border);border-radius:var(--radius-lg);
      padding:24px;text-align:center;cursor:pointer;transition:var(--transition-smooth);
    }
    .home-card:hover{border-color:var(--accent);transform:translateY(-6px);box-shadow:var(--shadow-lg)}
    .home-card .icon{font-size:32px;margin-bottom:10px;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .home-card h3{font-size:16px;margin-bottom:6px}
    .yt-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--radius-md);overflow:hidden;margin-top:12px;border:1px solid var(--border)}
    .yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%}
    .timer{
      font-size:22px;font-weight:800;text-align:center;padding:12px;background:var(--panel-glass);
      border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:14px;backdrop-filter:blur(12px);font-family:monospace;color:var(--accent);
    }
    .cbt-layout{display:grid;grid-template-columns:1fr 240px;gap:16px}
    @media(max-width:850px){.cbt-layout{grid-template-columns:1fr}}
    .cbt-qbox{background:var(--panel-glass);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;backdrop-filter:blur(12px)}
    .cbt-opt{
      width:100%;text-align:left;padding:14px 16px;border-radius:var(--radius-md);border:1.5px solid var(--border);
      background:var(--panel);margin:10px 0;font-weight:600;transition:var(--transition-smooth);
    }
    .cbt-opt:hover{border-color:var(--accent);background:var(--panel-glass);transform:translateX(4px)}
    .cbt-opt.selected{border-color:var(--accent);background:rgba(99,102,241,0.15);box-shadow:0 0 0 3px rgba(99,102,241,0.2)}
    .cbt-nav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
    .cbt-palette{background:var(--panel-glass);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;backdrop-filter:blur(12px)}
    .cbt-palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
    .cbt-pbtn{aspect-ratio:1;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--panel);font-weight:700;cursor:pointer}
    .cbt-pbtn:hover{transform:scale(1.08)}
    .cbt-pbtn.answered{background:rgba(99,102,241,0.25);border-color:var(--accent)}
    .cbt-pbtn.marked{background:rgba(245,158,11,0.25);border-color:var(--warn)}
    .cbt-pbtn.current{outline:2px solid var(--accent);transform:scale(1.1)}
    .cbt-legend{display:grid;gap:8px;font-size:12px;color:var(--text-muted)}
    .cbt-dot{width:16px;height:16px;border-radius:5px;display:inline-block;vertical-align:middle;margin-right:8px}
    .score-card{text-align:center;padding:32px}
    .score-num{font-size:52px;font-weight:800;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:14px 0}
    .q-img{max-width:100%;border-radius:var(--radius-md);margin:12px 0;border:1px solid var(--border)}
    .toast{
      position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(30px);
      background:var(--panel-glass);border:1px solid var(--border);padding:12px 20px;border-radius:999px;
      opacity:0;pointer-events:none;transition:var(--transition-smooth);z-index:100;backdrop-filter:blur(12px);box-shadow:var(--shadow-lg);font-weight:600;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .skel{background:linear-gradient(90deg,var(--panel) 0%,var(--panel2) 50%,var(--panel) 100%);animation:shimmer 1.4s infinite;border-radius:var(--radius-md)}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .skel-card{height:90px}
    .skel-subj{height:100px}
    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-track{background:var(--bg);border-radius:8px}
    ::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:8px;border:2px solid var(--bg)}
    ::-webkit-scrollbar-thumb:hover{background:var(--accent)}
    .page-fade{animation:pageFade 0.35s ease-out}
    @keyframes pageFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .hidden{display:none!important}
    .pdf-modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:flex;flex-direction:column;z-index:60}
    .pdf-toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:rgba(10,14,26,0.98);backdrop-filter:blur(12px)}
    .pdf-title{flex:1;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pdf-tools{display:flex;gap:6px;flex-wrap:wrap}
    .pdf-tbtn{padding:8px 10px;border-radius:var(--radius-sm);background:var(--panel2);border:1px solid var(--border);color:#fff;font-size:14px}
    .pdf-tbtn:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-2px)}
    .pdf-tbtn.active-tool{background:var(--accent-gradient);border-color:var(--accent)}
    .pdf-canvas-wrap{flex:1;overflow:auto;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,0.5)}
    .pdf-canvas-stack{position:relative}
    #pdfCanvas{display:block;border-radius:var(--radius-sm)}
    #pdfAnnoCanvas{position:absolute;top:0;left:0;touch-action:none;border-radius:var(--radius-sm)}
    .textLayer{transform-origin:0 0}
    .pdf-pagebar{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;border-top:1px solid var(--border);background:rgba(10,14,26,0.98);backdrop-filter:blur(12px)}
    #pdfPageInput{width:70px;padding:8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--panel);text-align:center;color:var(--text)}
    #pdfPageInput:focus{border-color:var(--accent);outline:none}
    .pdf-panel{position:absolute;top:58px;right:0;width:280px;bottom:50px;background:rgba(10,14,26,0.98);border-left:1px solid var(--border);transform:translateX(100%);transition:transform 0.3s;backdrop-filter:blur(12px)}
    .pdf-panel.open{transform:translateX(0)}
    .pdf-panel-tabs{display:flex;border-bottom:1px solid var(--border)}
    .pdf-panel-tab{flex:1;padding:12px;text-align:center;font-weight:600;font-size:13px;border-bottom:2px solid transparent}
    .pdf-panel-tab.active{border-bottom-color:var(--accent);color:var(--accent)}
    .pdf-panel-body{padding:12px;overflow:auto;max-height:calc(100% - 48px)}
    .pdf-panel-item{padding:12px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border);background:var(--panel);margin-bottom:10px}
    .pdf-panel-item:hover{border-color:var(--accent);background:var(--panel-glass);transform:translateX(4px)}
    .pdf-annobar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:rgba(10,14,26,0.98);align-items:center;flex-wrap:wrap;backdrop-filter:blur(12px)}
    .pdf-color{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);cursor:pointer}
    .pdf-color:hover{transform:scale(1.15)}
    .pdf-color.selected{border-color:#fff;transform:scale(1.2)}
    .pdf-zoom-label{font-size:12px;font-weight:700;min-width:46px;text-align:center;font-family:monospace}
  </style>
</head>

<div id="app"></div>

<script>
const SUPABASE_URL = "https://qhggamgxfwlwtpmwxfwk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_X9_aDiQcrKhYyPfuQdnKPA_K8F7RPjM";

let db = null, session = null, profile = null, activeTab = "home";
let selSubject = null, selChapter = null, selCategory = "general", adminTab = "dashboard";
let cbtTest = null, cbtQuestions = [], cbtAnswers = {}, cbtMarked = new Set(), cbtBookmarks = new Set(), cbtIndex = 0, cbtTimerRef = null, cbtRemaining = 0;
let pr = null;
const app = document.getElementById("app");

function escapeHtml(v){return (v??"" ).toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild}
function fmtDate(iso){if(!iso)return"";const d=new Date(iso);if(Number.isNaN(d.getTime()))return"";return d.toLocaleString(undefined,{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function ytId(url){const m=(url||"").match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null}
function showFatalError(m){document.body.innerHTML=`<div style="min-height:100vh;background:var(--bg);color:#fff;padding:24px;display:grid;place-items:center"><div style="max-width:700px;background:var(--panel-glass);border:1px solid var(--border);border-radius:24px;padding:32px;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,0.6)"><h2 style="background:var(--danger);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px">NEETrix Error</h2><div style="color:var(--text-muted);line-height:1.7;white-space:pre-wrap;font-size:15px">${escapeHtml(m)}</div></div></div>`}
function getLastScore(){try{return JSON.parse(localStorage.getItem("neetrix_last_score")||"null")}catch(e){return null}}
function saveLastScore(obj){try{localStorage.setItem("neetrix_last_score",JSON.stringify(obj))}catch(e){}}
function lsGet(key,fallback){try{const v=localStorage.getItem(key);return v!=null?JSON.parse(v):fallback}catch(e){return fallback}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function skelList(n,cls){let h="";for(let i=0;i<n;i++)h+=`<div class="skel ${cls||"skel-card"}"></div>`;return h}

function toast(msg, ms=2500){
  let t = document.getElementById("globalToast");
  if(!t){ t = el(`<div class="toast" id="globalToast"></div>`); document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove("show"), ms);
}

function confirmAction(title, message){
  return new Promise(resolve=>{
    const modal = el(`<div class="modal-bg"><div class="modal-box" style="max-width:440px">
      <h3 style="margin-bottom:12px;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${escapeHtml(title)}</h3>
      <p style="line-height:1.65;margin-bottom:20px;color:var(--text-muted);white-space:pre-wrap">${escapeHtml(message)}</p>
      <div style="display:flex;gap:12px">
        <button class="btn-outline" style="flex:1" id="cNo">Cancel</button>
        <button class="btn-danger" style="flex:1" id="cYes">Confirm</button>
      </div>
    </div></div>`);
    document.body.appendChild(modal);
    document.getElementById("cNo").onclick = ()=>{ modal.remove(); resolve(false); };
    document.getElementById("cYes").onclick = ()=>{ modal.remove(); resolve(true); };
    modal.onclick = e => { if(e.target===modal){ modal.remove(); resolve(false); } };
  });
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error("Failed: "+src));document.head.appendChild(s)})}
async function loadSupabase(){if(window.supabase)return true;const srcs=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"];let last=null;for(const s of srcs){try{await loadScript(s);if(window.supabase)return true}catch(e){last=e}}throw last||new Error("Supabase load failed")}
async function loadPdfJs(){if(window.pdfjsLib)return true;const srcs=["https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js","https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"];for(const s of srcs){try{await loadScript(s);if(window.pdfjsLib)return true}catch(e){}}return false}

async function initializeApp(){
  try{
    await loadSupabase();
    if(!SUPABASE_URL || !SUPABASE_ANON_KEY) throw new Error("Supabase not configured");
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    loadPdfJs().catch(()=>{});
    await boot();
  }catch(e){
    console.error(e);
    showFatalError(e?.message || "Could not start");
  }
}

async function boot(){
  db.auth.onAuthStateChange(async (event, sess)=>{
    session = sess;
    if(event === "SIGNED_OUT"){ profile = null; renderAuth("login"); return; }
    if(event === "SIGNED_IN" || event === "TOKEN_REFRESHED"){ await afterLogin(); }
  });
  const {data:{session:s}} = await db.auth.getSession();
  session = s;
  if(session){ await afterLogin(); } else { renderAuth("login"); }
}

function renderAuth(mode){
  mode = mode || "login";
  app.innerHTML = "";
  app.appendChild(el(`<div class="auth-wrap"><div class="auth-card">
    <div class="brand" style="text-align:center;font-size:28px;margin-bottom:6px">NEETrix</div>
    <div style="text-align:center;color:var(--text-muted);margin-bottom:20px">Premium Learning Platform</div>
    <div class="msg" id="msg"></div>
    <div id="fields"></div>
    <button class="btn" style="width:100%" id="mainBtn"></button>
    <button class="link" id="link1" style="display:block;text-align:center;margin-top:14px"></button>
    <button class="link" id="link2" style="display:none;text-align:center;margin-top:10px"></button>
  </div></div>`));

  const fields = document.getElementById("fields");
  const mainBtn = document.getElementById("mainBtn");
  const link1 = document.getElementById("link1");
  const link2 = document.getElementById("link2");
  const msg = document.getElementById("msg");

  if(mode === "login" || mode === "signup"){
    fields.innerHTML = `<input id="email" type="email" placeholder="Email address" autocomplete="email"/>
      <input id="pass" type="password" placeholder="Password (8+ characters)" autocomplete="${mode==="login"?"current-password":"new-password"}"/>`;
    mainBtn.textContent = mode === "login" ? "Log in" : "Create account";
    link1.textContent = mode === "login" ? "New here? Create an account" : "Already have an account? Log in";
    link1.onclick = () => renderAuth(mode === "login" ? "signup" : "login");
    link2.style.display = mode === "login" ? "block" : "none";
    link2.textContent = "Forgot password?";
    link2.onclick = () => renderAuth("forgot");

    mainBtn.onclick = async () => {
      msg.textContent = "";
      mainBtn.disabled = true;
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("pass").value;
      if(!email || !pass){ msg.style.color="var(--text-muted)"; msg.textContent="Enter both fields."; mainBtn.disabled=false; return; }
      try{
        if(mode === "signup"){
          const {error} = await db.auth.signUp({email, password: pass});
          if(error) throw error;
          msg.style.color = "var(--green)";
          msg.textContent = "Account created! Check email if needed, then log in.";
          setTimeout(() => renderAuth("login"), 1800);
        } else {
          const {data, error} = await db.auth.signInWithPassword({email, password: pass});
          if(error) throw error;
          session = data.session;
          await afterLogin();
        }
      }catch(e){
        msg.style.color = "var(--danger)";
        msg.textContent = e?.message || "Something went wrong";
      } finally {
        mainBtn.disabled = false;
      }
    };
  } else if(mode === "forgot"){
    fields.innerHTML = `<input id="email" type="email" placeholder="Email address"/>`;
    mainBtn.textContent = "Send reset link";
    link1.textContent = "Back to log in";
    link1.onclick = () => renderAuth("login");
    mainBtn.onclick = async () => {
      msg.textContent = "";
      mainBtn.disabled = true;
      const email = document.getElementById("email").value.trim();
      if(!email){ msg.style.color="var(--text-muted)"; msg.textContent="Enter email"; mainBtn.disabled=false; return; }
      try{
        const {error} = await db.auth.resetPasswordForEmail(email);
        if(error) throw error;
        msg.style.color = "var(--green)";
        msg.textContent = "Reset link sent";
      }catch(e){
        msg.style.color = "var(--danger)";
        msg.textContent = e?.message || "Error";
      } finally {
        mainBtn.disabled = false;
      }
    };
  }
}

function renderStatusScreen(status){
  app.innerHTML = "";
  const msgs = {
    pending: ["Request sent", "Your access request has been sent. Wait for admin approval."],
    paused: ["Account paused", "Your account is paused by admin."],
    blocked: ["Account blocked", "Access blocked by admin."]
  };
  const [t,b] = msgs[status] || ["Access unavailable", "Contact admin."];
  app.appendChild(el(`<div class="auth-wrap"><div class="auth-card">
    <div class="brand" style="text-align:center;font-size:28px;margin-bottom:14px">NEETrix</div>
    <h2 style="margin-top:16px;background:var(--danger);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center">${escapeHtml(t)}</h2>
    <p style="text-align:center;color:var(--text-muted);line-height:1.7;margin:14px 0 20px">${escapeHtml(b)}</p>
    <button class="btn-outline" style="width:100%" id="out">Log out</button>
  </div></div>`));
  document.getElementById("out").onclick = async () => {
    try{ await db.auth.signOut(); }catch(e){}
    session = null; profile = null;
    renderAuth();
  };
}

async function afterLogin(){
  if(!session?.user){ renderAuth(); return; }
  try{
    try{ await db.from("login_events").insert({user_id: session.user.id, email: session.user.email}); }catch(e){}
    const {data, error} = await db.from("profiles").select("*").eq("id", session.user.id).single();
    if(error){
      if(error.code === "PGRST116"){ profile = null; renderStatusScreen("pending"); return; }
      throw error;
    }
    profile = data;
    if(!profile || profile.status !== "active"){
      renderStatusScreen(profile ? profile.status : "pending");
      return;
    }
    activeTab = "home";
    selSubject = null;
    selChapter = null;
    renderShell();
  }catch(e){
    showFatalError(e?.message || "Unable to load account");
  }
}

function renderShell(){
  app.innerHTML = "";
  const isAdmin = profile?.role === "admin" || profile?.role === "owner";
  const initial = (profile?.name || profile?.email || "U")[0].toUpperCase();
  app.appendChild(el(`<div>
    <div class="topbar">
      <div class="brand"><i class="fas fa-graduation-cap" style="margin-right:8px"></i>NEETrix</div>
      <button class="navbtn" data-t="home"><i class="fas fa-home" style="margin-right:6px"></i>Home</button>
      <button class="navbtn" data-t="content"><i class="fas fa-play-circle" style="margin-right:6px"></i>Content</button>
      <button class="navbtn" data-t="questions"><i class="fas fa-book-open" style="margin-right:6px"></i>Questions</button>
      <button class="navbtn" data-t="bookmarks"><i class="fas fa-bookmark" style="margin-right:6px"></i>Bookmarks</button>
      <button class="navbtn" data-t="tests"><i class="fas fa-file-alt" style="margin-right:6px"></i>Tests</button>
      ${isAdmin ? `<button class="navbtn" data-t="admin"><i class="fas fa-cog" style="margin-right:6px"></i>Admin</button>` : ""}
      <div class="spacer"></div>
      <div class="profile-wrap"><button class="profile-btn" id="profileBtn">${escapeHtml(initial)}</button></div>
    </div>
    <div class="content" id="content"></div>
  </div>`));

  document.getElementById("profileBtn").onclick = () => openProfileModal();
  document.querySelectorAll(".navbtn").forEach(btn => {
    btn.onclick = () => {
      activeTab = btn.dataset.t;
      selSubject = null;
      selChapter = null;
      if(cbtTimerRef){ clearInterval(cbtTimerRef); cbtTimerRef = null; }
      renderTabsUI();
      renderBody();
    };
  });
  renderTabsUI();
  renderBody();
}

function renderTabsUI(){
  document.querySelectorAll(".navbtn").forEach(b => b.classList.toggle("active", b.dataset.t === activeTab));
}

function renderBody(){
  const c = document.getElementById("content");
  if(!c) return;
  c.classList.remove("page-fade");
  void c.offsetWidth;
  c.classList.add("page-fade");
  if(activeTab === "home") renderHome(c);
  else if(activeTab === "content") renderSubjectBrowser(c, "video");
  else if(activeTab === "questions") renderSubjectBrowser(c, "pdf");
  else if(activeTab === "tests") renderTests(c);
  else if(activeTab === "bookmarks") renderBookmarks(c);
  else if(activeTab === "admin"){
    if(profile?.role === "admin" || profile?.role === "owner") renderAdmin(c);
    else { activeTab = "home"; renderTabsUI(); renderHome(c); }
  }
}

function openProfileModal(){
  const modal = el(`<div class="modal-bg" id="profileModal"><div class="modal-box">
    <button class="modal-close" id="pmClose"><i class="fas fa-times"></i></button>
    <h2 style="margin-bottom:18px;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">My Profile</h2>
    <div class="profile-field"><label><i class="fas fa-user" style="margin-right:6px"></i>Name</label><input id="pfName" value="${escapeHtml(profile?.name||"")}" placeholder="Your name"/></div>
    <div class="profile-field"><label><i class="fas fa-phone" style="margin-right:6px"></i>Phone</label><input id="pfPhone" value="${escapeHtml(profile?.phone||"")}" placeholder="Phone number"/></div>
    <div class="profile-field"><label><i class="fas fa-envelope" style="margin-right:6px"></i>Email</label><input value="${escapeHtml(profile?.email||"")}" disabled style="opacity:0.6;cursor:not-allowed"/></div>
    <button class="btn" style="width:100%;margin-top:10px" id="pfSave"><i class="fas fa-save" style="margin-right:6px"></i>Save Profile</button>
    <button class="btn-outline" style="width:100%;margin-top:12px" id="pfReport"><i class="fas fa-flag" style="margin-right:6px"></i>Report to Owner</button>
    <button class="btn-danger" style="width:100%;margin-top:12px" id="pfLogout"><i class="fas fa-sign-out-alt" style="margin-right:6px"></i>Log out</button>
  </div></div>`);
  document.body.appendChild(modal);
  document.getElementById("pmClose").onclick = () => modal.remove();
  modal.onclick = e => { if(e.target === modal) modal.remove(); };

  document.getElementById("pfSave").onclick = async () => {
    const name = document.getElementById("pfName").value.trim();
    const phone = document.getElementById("pfPhone").value.trim();
    try{
      const {error} = await db.from("profiles").update({name, phone}).eq("id", session.user.id);
      if(error) throw error;
      profile.name = name;
      profile.phone = phone;
      toast("Profile saved");
      modal.remove();
      renderShell();
    }catch(e){ toast(e?.message || "Error saving"); }
  };

  document.getElementById("pfReport").onclick = async () => {
    if(!await confirmAction("Send Report", "Send report to owner?")) return;
    try{
      await db.from("reports").insert({user_id: session.user.id, email: profile?.email || session.user.email, message: "User reported from profile"});
      toast("Report sent to owner");
    }catch(e){ toast(e?.message || "Could not send report"); }
  };

  document.getElementById("pfLogout").onclick = async () => {
    if(!await confirmAction("Log out", "Are you sure you want to log out?")) return;
    modal.remove();
    try{ await db.auth.signOut(); }catch(e){}
    session = null; profile = null; activeTab = "home";
    selSubject = null; selChapter = null;
    renderAuth();
  };
}

function showDetailedReport(last){
  if(last && last.review && last.review.length){
    const c = document.getElementById("content");
    if(c) renderQuestionReview(c, last);
    return;
  }
  const modal = el(`<div class="modal-bg"><div class="modal-box" style="max-width:580px">
    <button class="modal-close" id="drClose"><i class="fas fa-times"></i></button>
    <h2 style="margin-bottom:10px;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${escapeHtml(last.title||"Last Test")}</h2>
    <div style="color:var(--text-muted);margin-bottom:18px;font-size:14px">${last.at ? new Date(last.at).toLocaleString() : ""}</div>
    <div class="grid2" style="margin-bottom:20px">
      <div class="card" style="margin:0;text-align:center">
        <div style="color:var(--text-muted);font-size:13px">Score</div>
        <div style="font-size:28px;font-weight:800;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${last.score}/${last.total}</div>
      </div>
      <div class="card" style="margin:0;text-align:center">
        <div style="color:var(--text-muted);font-size:13px">Accuracy</div>
        <div style="font-size:28px;font-weight:800;background:linear-gradient(135deg,#10b981,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${last.total ? Math.round((last.correct/(last.correct+last.wrong+last.unattempted||1))*100) : 0}%</div>
      </div>
      <div class="card" style="margin:0;text-align:center">
        <div style="color:var(--text-muted);font-size:13px">Correct</div>
        <div style="font-weight:800;color:var(--green);font-size:20px">${last.correct||0}</div>
      </div>
      <div class="card" style="margin:0;text-align:center">
        <div style="color:var(--text-muted);font-size:13px">Wrong</div>
        <div style="font-weight:800;color:var(--danger);font-size:20px">${last.wrong||0}</div>

}

async function renderSubjectBrowser(c, mode){
  if(!selSubject){
    c.innerHTML = `<h2 style="margin-bottom:16px"><i class="fas ${mode==="video"?"fa-play-circle":"fa-book-open"}" style="margin-right:10px;color:var(--accent)"></i>${mode==="video"?"Video Lessons":"Question Bank"}</h2>
      ${mode==="pdf" ? `<div class="tabs2">
        <button class="tab2 ${selCategory==="general"?"active":""}" data-c="general"><i class="fas fa-book" style="margin-right:6px"></i>Practice</button>
        <button class="tab2 ${selCategory==="pyq"?"active":""}" data-c="pyq"><i class="fas fa-history" style="margin-right:6px"></i>PYQs</button>
        <button class="tab2 ${selCategory==="ncert"?"active":""}" data-c="ncert"><i class="fas fa-star" style="margin-right:6px"></i>Important</button>
      </div>` : ""}
      <div class="grid2" id="subjList">${skelList(4,"skel-subj")}</div>`;

    if(mode === "pdf"){
      c.querySelectorAll(".tab2").forEach(b => {
        b.onclick = () => { selCategory = b.dataset.c; renderBody(); };
      });
    }

    const {data, error} = await db.from("subjects").select("*").order("sort_order");
    const wrap = document.getElementById("subjList");
    if(error){ wrap.innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle" style="margin-bottom:8px;font-size:24px"></i><br>${escapeHtml(error.message)}</div>`; return; }
    if(!data?.length){ wrap.innerHTML = `<div class="empty"><i class="fas fa-inbox" style="margin-bottom:8px;font-size:24px"></i><br>No subjects yet.</div>`; return; }

    wrap.innerHTML = "";
    data.forEach(s => {
      const card = el(`<div class="subject-card"><h3><i class="fas fa-book" style="margin-right:8px;color:var(--accent)"></i>${escapeHtml(s.name)}</h3></div>`);
      card.onclick = () => { selSubject = s; selChapter = null; renderBody(); };
      wrap.appendChild(card);
    });
    return;
  }

  if(!selChapter){
    c.innerHTML = `<button class="back" id="b1"><i class="fas fa-arrow-left"></i> ${escapeHtml(selSubject.name)}</button>
      <h2 style="margin-bottom:16px"><i class="fas fa-folder" style="margin-right:10px;color:var(--accent)"></i>Chapters</h2>
      <div id="chapList">${skelList(3)}</div>`;
    document.getElementById("b1").onclick = () => { selSubject = null; renderBody(); };

    const {data, error} = await db.from("chapters").select("*").eq("subject_id", selSubject.id).order("sort_order");
    const wrap = document.getElementById("chapList");
    if(error){ wrap.innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle" style="margin-bottom:8px;font-size:24px"></i><br>${escapeHtml(error.message)}</div>`; return; }
    if(!data?.length){ wrap.innerHTML = `<div class="empty"><i class="fas fa-inbox" style="margin-bottom:8px;font-size:24px"></i><br>No chapters yet.</div>`; return; }

    wrap.innerHTML = "";
    data.forEach(ch => {
      const row = el(`<div class="card row" style="cursor:pointer"><span style="flex:1;font-weight:600"><i class="fas fa-folder-open" style="margin-right:8px;color:var(--accent)"></i>${escapeHtml(ch.name)}</span><span style="color:var(--text-muted)"><i class="fas fa-chevron-right" style="font-size:12px"></i></span></div>`);
      row.onclick = () => { selChapter = ch; renderBody(); };
      wrap.appendChild(row);
    });
    return;
  }

  c.innerHTML = `<button class="back" id="b2"><i class="fas fa-arrow-left"></i> ${escapeHtml(selChapter.name)}</button>`;
  document.getElementById("b2").onclick = () => { selChapter = null; renderBody(); };

  if(mode === "video"){
    const box = el(`<div id="vidBox">${skelList(2)}</div>`);
    c.appendChild(box);
    const {data, error} = await db.from("videos").select("*").eq("chapter_id", selChapter.id).order("sort_order");
    if(error){ box.innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle" style="margin-bottom:8px;font-size:24px"></i><br>${escapeHtml(error.message)}</div>`; return; }
    if(!data?.length){ box.innerHTML = `<div class="empty"><i class="fas fa-inbox" style="margin-bottom:8px;font-size:24px"></i><br>No videos yet.</div>`; return; }
    box.innerHTML = data.map(v => `
      <h3 style="margin-bottom:10px"><i class="fas fa-play-circle" style="margin-right:8px;color:var(--accent)"></i>${escapeHtml(v.title)}</h3>
      <div class="yt-wrap">
        <iframe src="https://www.youtube-nocookie.com/embed/${escapeHtml(v.youtube_id)}?modestbranding=1&rel=0" title="${escapeHtml(v.title)}" allowfullscreen></iframe>
      </div>`).join("");
  } else {
    const list = el(`<div id="pdfList">${skelList(3)}</div>`);
    c.appendChild(list);
    const {data, error} = await db.from("pdfs").select("*").eq("chapter_id", selChapter.id).eq("category", selCategory).order("created_at", {ascending:false});
    if(error){ list.innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle" style="margin-bottom:8px;font-size:24px"></i><br>${escapeHtml(error.message)}</div>`; return; }
    if(!data?.length){ list.innerHTML = `<div class="empty"><i class="fas fa-inbox" style="margin-bottom:8px;font-size:24px"></i><br>No content in this category yet.</div>`; return; }

    let bmSet = new Set();
    try{
      const {data: bms} = await db.from("bookmarks").select("pdf_id").eq("user_id", session.user.id);
      if(bms) bmSet = new Set(bms.map(b => b.pdf_id));
    }catch(e){}

    list.innerHTML = "";
    data.forEach(pdf => {
      const row = el(`<div class="card row">
        <span style="cursor:pointer;flex:1;font-weight:600" class="openPdf"><i class="fas fa-file-pdf" style="margin-right:8px;color:var(--danger)"></i>${escapeHtml(pdf.title)}</span>

      </div>`);
      row.querySelector(".openPdf").onclick = () => openPdf(pdf);
      row.querySelector(".bmBtn").onclick = async e => {
        e.stopPropagation();
        try{
          if(bmSet.has(pdf.id)) await db.from("bookmarks").delete().eq("user_id", session.user.id).eq("pdf_id", pdf.id);
          else await db.from("bookmarks").insert({user_id: session.user.id, pdf_id: pdf.id});
          renderBody();
        }catch(err){ toast(err?.message || "Error"); }
      };

}

async function openPdf(pdf){
  try{
    const {data, error} = await db.storage.from("content").createSignedUrl(pdf.file_path, 3600);
    if(error) throw error;
    if(!data?.signedUrl) throw new Error("No link");
    await openPdfReader(data.signedUrl, pdf.title, "pdf_" + pdf.id, pdf);
  }catch(e){
    toast(e?.message || "Unable to open PDF");
  }
}

async function openPdfReader(url, title, storageKeyRaw, pdfMeta){

  if(!window.pdfjsLib){ toast("PDF viewer failed to load"); return; }

  const storageKey = encodeURIComponent(storageKeyRaw || url).slice(0, 180);
  const modal = el(`<div class="pdf-modal" id="pdfModal">
    <div class="pdf-toolbar" id="pdfToolbar">
      <button class="pdf-tbtn" id="pdfClose"><i class="fas fa-times"></i></button>
      <div class="pdf-title">${escapeHtml(title || "")}</div>
      <div class="pdf-tools">
        <button class="pdf-tbtn" id="pdfZoomOut" title="Zoom out"><i class="fas fa-minus"></i></button>
        <span class="pdf-zoom-label" id="pdfZoomLabel">100%</span>
        <button class="pdf-tbtn" id="pdfZoomIn" title="Zoom in"><i class="fas fa-plus"></i></button>
        <button class="pdf-tbtn" id="pdfFitWidth" title="Fit width"><i class="fas fa-arrows-alt-h"></i></button>
        <button class="pdf-tbtn" id="pdfFitPage" title="Fit page"><i class="fas fa-compress-arrows-alt"></i></button>
        <button class="pdf-tbtn" id="pdfSearchBtn" title="Search"><i class="fas fa-search"></i></button>
        <button class="pdf-tbtn" id="pdfBookmarkPage" title="Bookmark"><i class="far fa-star"></i></button>

        <button class="pdf-tbtn" id="pdfDownload" title="Download"><i class="fas fa-download"></i></button>

        <button class="pdf-tbtn" id="pdfFullscreenBtn" title="Fullscreen"><i class="fas fa-expand"></i></button>
      </div>
    </div>
    <div class="pdf-canvas-wrap" id="pdfCanvasWrap">
      <div class="pdf-canvas-stack" id="pdfCanvasStack" style="position:relative">
        <canvas id="pdfCanvas"></canvas>
        <div id="pdfTextLayer" class="textLayer" style="position:absolute;top:0;left:0;line-height:1;overflow:hidden;opacity:0.2;pointer-events:auto;user-select:text"></div>
        <canvas id="pdfAnnoCanvas"></canvas>

    <div class="pdf-panel" id="pdfPanel">
      <div class="pdf-panel-tabs">
        <button class="pdf-panel-tab active" data-pt="pages"><i class="far fa-file"></i> Pages</button>
        <button class="pdf-panel-tab" data-pt="bookmarks"><i class="far fa-bookmark"></i> Bookmarks</button>
        <button class="pdf-panel-tab" data-pt="notes"><i class="fas fa-paint-brush"></i> Notes</button>
        <button class="pdf-panel-tab" data-pt="info"><i class="fas fa-info-circle"></i> Info</button>
      </div>
      <div class="pdf-panel-body" id="pdfPanelBody"></div>
    </div>
    <div class="toast" id="pdfToast"></div>
  </div>`);

  document.body.appendChild(modal);

  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    const pdfDoc = await pdfjsLib.getDocument({url, withCredentials:false}).promise;
    const progress = lsGet("pdfprog_" + storageKey, {page:1, scale:null});
    const bookmarks = lsGet("pdfpagebm_" + storageKey, {});
    const annotations = lsGet("pdfanno_" + storageKey, {});

    pr = {
      pdfDoc,
      pageNum: Math.min(progress.page || 1, pdfDoc.numPages),
      totalPages: pdfDoc.numPages,
      scale: progress.scale || 1,
      fitMode: progress.scale ? "custom" : "width",
      storageKey,
      annotations,
      bookmarks,
      redoStack: {},
      tool: null,
      color: "#6366f1",
      width: 3,
      searchMatches: [],
      searchIndex: -1,
      originalUrl: url,
      title: title || "Document"
    };

    await pr_renderPage();

    if(progress.page && progress.page > 1){
      pr_toast("Resumed from page " + progress.page);
    }
  }catch(e){
    modal.remove();
    pr = null;
    toast(e?.message || "Unable to load PDF");
    return;
  }

  document.getElementById("pdfClose").onclick = () => {
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    modal.remove();
    pr = null;

  document.getElementById("pdfZoomIn").onclick = () => {
    pr.fitMode = "custom";
    pr.scale = Math.min(4, pr.scale + 0.25);

  document.getElementById("pdfZoomOut").onclick = () => {
    pr.fitMode = "custom";
    pr.scale = Math.max(0.4, pr.scale - 0.25);
    pr_renderPage();
  };
  document.getElementById("pdfFitWidth").onclick = () => { pr.fitMode = "width"; pr_renderPage(); };
  document.getElementById("pdfFitPage").onclick = () => { pr.fitMode = "page"; pr_renderPage(); };
  document.getElementById("pdfPrev").onclick = () => pr_goToPage(pr.pageNum - 1);
  document.getElementById("pdfNext").onclick = () => pr_goToPage(pr.pageNum + 1);
  document.getElementById("pdfPageInput").onchange = e => pr_goToPage(parseInt(e.target.value) || 1);

  document.getElementById("pdfBookmarkPage").onclick = () => {
    if(pr.bookmarks[pr.pageNum]){
      delete pr.bookmarks[pr.pageNum];
      pr_toast("Bookmark removed");
    } else {
      pr.bookmarks[pr.pageNum] = {label: "Page " + pr.pageNum, at: Date.now()};
      pr_toast("Page bookmarked");
    }
    lsSet("pdfpagebm_" + pr.storageKey, pr.bookmarks);
    pr_renderPage();
  };

  document.getElementById("pdfAnnoToggle").onclick = () => {
    const bar = document.getElementById("pdfAnnoBar");
    if(bar){
      const showing = bar.style.display !== "none";
      bar.style.display = showing ? "none" : "flex";
      document.getElementById("pdfAnnoToggle").classList.toggle("active-tool", !showing);
      if(showing){ pr.tool = null; }
    }
  };

  document.getElementById("pdfPanelBtn").onclick = () => {
    const panel = document.getElementById("pdfPanel");
    panel.classList.toggle("open");
    if(panel.classList.contains("open")) pr_renderPanel("pages");
  };

  document.querySelectorAll(".pdf-panel-tab").forEach(t => {
    t.onclick = () => {
      document.querySelectorAll(".pdf-panel-tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      pr_renderPanel(t.dataset.pt);
    };
  });

  document.getElementById("pdfFullscreenBtn").onclick = async () => {
    try{
      if(!document.fullscreenElement) await modal.requestFullscreen();
      else await document.exitFullscreen();
    }catch(e){}
  };

  document.getElementById("pdfDownload").onclick = () => {
    const a = document.createElement("a");
    a.href = pr.originalUrl;
    a.download = (title || "document") + ".pdf";
    a.target = "_blank";
    a.click();
  };

  window.addEventListener("resize", () => {
    if(pr && (pr.fitMode === "width" || pr.fitMode === "page")) pr_renderPage();
  }, {once:false});
}

async function pr_renderPage(){
  if(!pr) return;
  const page = await pr.pdfDoc.getPage(pr.pageNum);
  const canvas = document.getElementById("pdfCanvas");
  const anno = document.getElementById("pdfAnnoCanvas");
  const wrap = document.getElementById("pdfCanvasWrap");
  if(!canvas || !anno || !wrap) return;

  let scale = pr.scale;
  if(pr.fitMode === "width"){
    const avail = wrap.clientWidth - 32;
    const vp1 = page.getViewport({scale: 1});
    scale = avail / vp1.width;
    pr.scale = scale;
  } else if(pr.fitMode === "page"){
    const availW = wrap.clientWidth - 32;
    const availH = wrap.clientHeight - 32;
    const vp1 = page.getViewport({scale: 1});
    scale = Math.min(availW / vp1.width, availH / vp1.height);
    pr.scale = scale;
  }

  const outputScale = window.devicePixelRatio || 1;
  const viewport = page.getViewport({scale: pr.scale * outputScale});

  canvas.width = viewport.width;
  canvas.height = viewport.height;
  canvas.style.width = (viewport.width / outputScale) + "px";
  canvas.style.height = (viewport.height / outputScale) + "px";

  anno.width = viewport.width;
  anno.height = viewport.height;
  anno.style.width = canvas.style.width;
  anno.style.height = canvas.style.height;

  const ctx = canvas.getContext("2d");
  await page.render({
    canvasContext: ctx,
    viewport,
    transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null
  }).promise;

  const zl = document.getElementById("pdfZoomLabel");
  if(zl) zl.textContent = Math.round(pr.scale * 100) + "%";
  const pi = document.getElementById("pdfPageInput");
  if(pi) pi.value = pr.pageNum;
  const pt = document.getElementById("pdfPageTotal");
  if(pt) pt.textContent = pr.totalPages;

  const bm = pr.bookmarks[pr.pageNum];
  const bb = document.getElementById("pdfBookmarkPage");
  if(bb){
    bb.textContent = bm ? "★" : "☆";
    bb.classList.toggle("active-tool", !!bm);
  }

  lsSet("pdfprog_" + pr.storageKey, {
    page: pr.pageNum,
    scale: pr.fitMode === "width" || pr.fitMode === "page" ? null : pr.scale
  });
}

async function pr_goToPage(n){
  if(!pr) return;
  n = Math.max(1, Math.min(pr.totalPages, n));
  pr.pageNum = n;
  await pr_renderPage();
}

function pr_renderPanel(tab){
  const body = document.getElementById("pdfPanelBody");
  if(!body) return;
  if(tab === "pages"){
    let h = "";
    for(let i=1; i<=pr.totalPages; i++) h += `<div class="pdf-panel-item" data-p="${i}"><i class="far fa-file" style="margin-right:8px"></i>Page ${i}${pr.bookmarks[i]?" <i class='fas fa-star' style='color:var(--warn)'></i>":""}</div>`;
    body.innerHTML = h || `<div class="empty">No pages</div>`;
  } else if(tab === "bookmarks"){
    const keys = Object.keys(pr.bookmarks);
    if(!keys.length){ body.innerHTML = `<div class="empty"><i class="far fa-bookmark"></i> No bookmarks yet</div>`; return; }
    body.innerHTML = keys.map(k => `<div class="pdf-panel-item" data-p="${k}"><i class="fas fa-bookmark" style="margin-right:8px;color:var(--accent)"></i>${escapeHtml(pr.bookmarks[k].label || ("Page "+k))}</div>`).join("");
  } else if(tab === "info"){
    body.innerHTML = `<div class="pdf-panel-item" style="cursor:default"><div style="font-weight:700;margin-bottom:8px"><i class="fas fa-info-circle" style="margin-right:6px;color:var(--accent)"></i>${escapeHtml(pr.title || "Document")}</div><div style="color:var(--text-muted);font-size:13px" id="pdfInfoPage">Page ${pr.pageNum} / ${pr.totalPages}</div></div>`;
  } else {
    const keys = Object.keys(pr.annotations).filter(k => (pr.annotations[k]||[]).length);
    if(!keys.length){ body.innerHTML = `<div class="empty"><i class="fas fa-pen"></i> No notes/drawings yet</div>`; return; }
    body.innerHTML = keys.map(k => `<div class="pdf-panel-item" data-p="${k}"><i class="fas fa-paint-brush" style="margin-right:8px;color:var(--accent)"></i>Page ${k} — ${pr.annotations[k].length} stroke(s)</div>`).join("");
  }
  body.querySelectorAll(".pdf-panel-item[data-p]").forEach(it => {
    it.onclick = () => {
      pr_goToPage(parseInt(it.dataset.p));
      document.getElementById("pdfPanel")?.classList.remove("open");
    };
  });
}

async function startPdfTest(test){
  if(!test.file_path){ toast("No paper uploaded"); return; }
  try{
    const {data, error} = await db.storage.from("content").createSignedUrl(test.file_path, 7200);
    if(error) throw error;
    if(!data?.signedUrl) throw new Error("No link");
    if(!window.pdfjsLib) await loadPdfJs();
    if(!window.pdfjsLib){ toast("PDF viewer failed"); return; }

    const modal = el(`<div class="modal-bg"><div class="modal-box" style="max-width:940px">
      <div class="timer" id="tmr"><i class="far fa-clock"></i> <span></span></div>
      <h3 style="text-align:center;margin-bottom:16px"><i class="fas fa-file-alt" style="margin-right:8px;color:var(--accent)"></i>${escapeHtml(test.title)}</h3>
      <div style="overflow:auto;text-align:center"><canvas id="pc"></canvas></div>
      <div style="display:flex;justify-content:center;gap:12px;margin-top:14px"><button id="zo"><i class="fas fa-minus"></i></button><span id="zl">100%</span><button id="zi"><i class="fas fa-plus"></i></button></div>
      <button class="btn" style="width:100%;margin-top:18px" id="submitTest"><i class="fas fa-paper-plane" style="margin-right:6px"></i>Submit Test</button>
    </div></div>`);
    document.body.appendChild(modal);

    let remaining = (Number(test.duration_minutes) || 60) * 60;
    const timerEl = document.getElementById("tmr").querySelector("span");
    let timerRef = null;
    const finish = () => { if(timerRef) clearInterval(timerRef); modal.remove(); toast("Test submitted"); };
    const tick = () => {
      const m = Math.floor(remaining/60), s = remaining % 60;
      timerEl.textContent = `${m}:${s<10?"0":""}${s} remaining`;
      if(remaining <= 0){ finish(); return; }
      remaining--;
    };
    tick();
    timerRef = setInterval(tick, 1000);
    document.getElementById("submitTest").onclick = () => { if(confirm("Submit now?")) finish(); };

    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    let scale = 1.2;
    const pdfDoc = await pdfjsLib.getDocument({url: data.signedUrl, withCredentials:false}).promise;
    const page = await pdfDoc.getPage(1);
    const render = async () => {
      const vp = page.getViewport({scale});
      const canvas = document.getElementById("pc");
      if(!canvas) return;
      canvas.width = vp.width;
      canvas.height = vp.height;
      await page.render({canvasContext: canvas.getContext("2d"), viewport: vp}).promise;
      const zl = document.getElementById("zl");
      if(zl) zl.textContent = Math.round(scale / 1.2 * 100) + "%";
    };
    await render();
    document.getElementById("zi").onclick = () => { scale += 0.3; render().catch(console.error); };
    document.getElementById("zo").onclick = () => { scale = Math.max(0.5, scale - 0.3); render().catch(console.error); };
  }catch(e){
    toast(e?.message || "Unable to start");
  }
}

async function startCbtTest(test){
  try{
    const isAdmin = profile?.role === "admin" || profile?.role === "owner";
    const cols = isAdmin ? "*" : "id, question_text, option_a, option_b, option_c, option_d, sort_order, question_image";
    const {data, error} = await db.from("test_questions").select(cols).eq("test_id", test.id).order("sort_order");
    if(error) throw error;
    if(!data?.length){ toast("No questions for this CBT yet."); return; }

    cbtTest = test;
    cbtQuestions = data;
    cbtAnswers = {};
    cbtMarked = new Set();
    cbtBookmarks = new Set();
    cbtIndex = 0;
    cbtRemaining = (Number(test.duration_minutes) || 60) * 60;

    if(cbtTimerRef) clearInterval(cbtTimerRef);
    cbtTimerRef = setInterval(() => {
      cbtRemaining--;
      const tEl = document.getElementById("cbtTimer");
      if(tEl){
        const m = Math.floor(cbtRemaining/60), s = cbtRemaining % 60;
        tEl.textContent = `${m}:${s<10?"0":""}${s}`;
      }
      if(cbtRemaining <= 0){
        clearInterval(cbtTimerRef);
        cbtTimerRef = null;
        finishCbt(true);
      }
    }, 1000);
    renderCbtUI();
  }catch(e){
    toast(e?.message || "Unable to start CBT");
  }
}

      <div class="cbt-legend">
        <span><div class="cbt-dot" style="background:rgba(99,102,241,0.35);border:1px solid var(--accent)"></i> Answered</span>
        <span><div class="cbt-dot" style="background:rgba(245,158,11,0.35);border:1px solid var(--warn)"></i> Marked</span>
        <span><div class="cbt-dot" style="background:var(--panel);border:1px solid var(--border)"></i> Not visited</span>
      </div>
    </div>
  </div>`;

  c.querySelectorAll(".cbt-opt").forEach(btn => {
    btn.onclick = () => { cbtAnswers[q.id] = btn.dataset.o; renderCbtUI(); };
  });
  document.getElementById("cbtPrev").onclick = () => { if(cbtIndex > 0){ cbtIndex--; renderCbtUI(); } };
  document.getElementById("cbtNext").onclick = () => { if(cbtIndex < cbtQuestions.length-1){ cbtIndex++; renderCbtUI(); } };
  document.getElementById("cbtMark").onclick = () => {
    if(cbtMarked.has(q.id)) cbtMarked.delete(q.id); else cbtMarked.add(q.id);
    renderCbtUI();
  };
  document.getElementById("cbtBm").onclick = () => {
    if(cbtBookmarks.has(q.id)) cbtBookmarks.delete(q.id); else cbtBookmarks.add(q.id);
    renderCbtUI();
  };
  document.getElementById("cbtSubmit").onclick = async () => {
    if(await confirmAction("Submit Test", "Submit test? Answers cannot be changed.")) finishCbt(false);
  };

  const palette = document.getElementById("palette");
  cbtQuestions.forEach((qq, i) => {
    const btn = el(`<button class="cbt-pbtn">${i+1}</button>`);
    if(cbtAnswers[qq.id]) btn.classList.add("answered");
    if(cbtMarked.has(qq.id)) btn.classList.add("marked");
    if(i === cbtIndex) btn.classList.add("current");
    btn.onclick = () => { cbtIndex = i; renderCbtUI(); };
    palette.appendChild(btn);
  });
}

async function finishCbt(auto){
  if(cbtTimerRef){ clearInterval(cbtTimerRef); cbtTimerRef = null; }
  const c = document.getElementById("content");
  c.innerHTML = `<div class="card score-card"><div style="color:var(--text-muted)">Calculating score...</div></div>`;

  let score = 0, total = cbtQuestions.length * 4, correct = 0, wrong = 0, unattempted = 0;
  let reviewQs = [];

  try{
    const {data: fullQs} = await db.from("test_questions")
      .select("id, question_text, option_a, option_b, option_c, option_d, correct_option, sort_order")
      .eq("test_id", cbtTest.id)
      .order("sort_order");
    if(fullQs?.length) cbtQuestions = fullQs;
  }catch(e){}

  cbtQuestions.forEach(q => {
    const ans = cbtAnswers[q.id] || null;
    const corr = (q.correct_option || "").toUpperCase();
    let status = "unattempted";
    if(!ans) unattempted++;
    else if(corr && ans === corr){ correct++; status = "correct"; }
    else { wrong++; status = "wrong"; }

    reviewQs.push({
      id: q.id,
      question_text: q.question_text,
      option_a: q.option_a,
      option_b: q.option_b,
      option_c: q.option_c,
      option_d: q.option_d,
      correct_option: corr || null,
      user_answer: ans,
      status
    });
  });

  score = (correct * 4) + (wrong * -1);
  total = cbtQuestions.length * 4;

  const lastScoreData = {
    score, total, correct, wrong, unattempted,
    title: cbtTest?.title,
    at: Date.now(),
    review: reviewQs
  };
  saveLastScore(lastScoreData);
  showScoreAndReview(c, lastScoreData, auto);
}

function showScoreAndReview(c, data, auto){
  const den = (data.correct||0) + (data.wrong||0) + (data.unattempted||0);
  const accuracy = den ? Math.round(((data.correct||0) / den) * 100) : 0;

  c.innerHTML = `<div class="card score-card">
    <div style="color:var(--text-muted);margin-bottom:8px;font-size:14px">${auto ? "<i class='fas fa-hourglass-end'></i> Time's up!" : "<i class='fas fa-check-circle' style='color:var(--green)'></i> Test Submitted"}</div>
    <h2 style="margin-bottom:6px">${escapeHtml(data.title || "Test")}</h2>
    <div class="score-num">${data.score}</div>
    <div style="color:var(--text-muted);margin-bottom:22px">out of ${data.total}</div>
    <div class="grid2" style="max-width:380px;margin:0 auto 24px;text-align:left">
      <div class="card" style="margin:0">
        <div style="color:var(--text-muted);font-size:13px">Correct</div>
        <div style="font-weight:800;color:var(--green);font-size:20px"><i class="fas fa-check" style="margin-right:6px"></i>${data.correct||0}</div>
      </div>
      <div class="card" style="margin:0">
        <div style="color:var(--text-muted);font-size:13px">Wrong</div>
        <div style="font-weight:800;color:var(--danger);font-size:20px"><i class="fas fa-times" style="margin-right:6px"></i>${data.wrong||0}</div>
      </div>
      <div class="card" style="margin:0">
        <div style="color:var(--text-muted);font-size:13px">Unattempted</div>
        <div style="font-weight:700;font-size:20px"><i class="far fa-circle" style="margin-right:6px"></i>${data.unattempted||0}</div>
      </div>
      <div class="card" style="margin:0">
        <div style="color:var(--text-muted);font-size:13px">Accuracy</div>
        <div style="font-weight:800;font-size:20px;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text"><i class="fas fa-bullseye" style="margin-right:6px"></i>${accuracy}%</div>
      </div>
    </div>
    <button class="btn" style="width:100%;margin-bottom:12px" id="viewReview"><i class="fas fa-list-alt" style="margin-right:6px"></i>Question-wise Review</button>
    <button class="btn-outline" style="width:100%" id="backTests"><i class="fas fa-arrow-left" style="margin-right:6px"></i>Back to Tests</button>
  </div>`;

  document.getElementById("backTests").onclick = () => {
    cbtTest = null; cbtQuestions = []; cbtAnswers = {};
    renderTests(c);
  };
  document.getElementById("viewReview").onclick = () => renderQuestionReview(c, data);
}

function renderQuestionReview(c, data){
  if(!data.review || !data.review.length){
    c.innerHTML = `<div class="empty">Review data not available.</div>
      <button class="btn" id="backScore">Back</button>`;
    document.getElementById("backScore").onclick = () => showScoreAndReview(c, data, false);
    return;
  }

  let html = `<button class="back" id="backScore"><i class="fas fa-arrow-left"></i> Score Summary</button>
    <h2 style="margin-bottom:8px"><i class="fas fa-clipboard-list" style="margin-right:10px;color:var(--accent)"></i>${escapeHtml(data.title || "Review")}</h2>
    <div style="color:var(--text-muted);margin-bottom:18px;font-size:14px"><i class="fas fa-info-circle" style="margin-right:6px"></i>${data.correct||0} correct · ${data.wrong||0} wrong · ${data.unattempted||0} skipped</div>`;

  data.review.forEach((q, i) => {
    const statusColor = q.status === "correct" ? "var(--green)" : q.status === "wrong" ? "var(--danger)" : "var(--text-muted)";
    const statusText = q.status === "correct" ? "Correct" : q.status === "wrong" ? "Wrong" : "Not Attempted";

    const optHtml = (letter, text) => {
      let extra = "";
      if(q.user_answer === letter) extra += ` <span style="color:var(--accent);font-weight:700"><i class="fas fa-arrow-right" style="margin-right:4px"></i>Your answer</span>`;
      if(q.correct_option === letter) extra += ` <span style="color:var(--green);font-weight:700"><i class="fas fa-check" style="margin-right:4px"></i>Correct</span>`;
      let bg = "var(--panel)";
      if(q.correct_option === letter) bg = "rgba(16,185,129,0.15)";
      else if(q.user_answer === letter && q.status === "wrong") bg = "rgba(239,68,68,0.15)";
      return `<div style="padding:12px 14px;margin:8px 0;border-radius:10px;border:1px solid var(--border);background:${bg}">
        <b>${letter}.</b> ${escapeHtml(text||"")}${extra}
      </div>`;
    };

    html += `<div class="card" style="margin-bottom:16px">
      <div class="row" style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)">
        <div style="font-weight:700">Q${i+1}</div>
        <div style="color:${statusColor};font-weight:700;font-size:13px"><i class="fas fa-${q.status==="correct"?"check-circle":q.status==="wrong"?"times-circle":"circle"}"></i> ${statusText}</div>
      </div>
      <div style="line-height:1.6;margin-bottom:12px;font-weight:600">${escapeHtml(q.question_text)}</div>
      ${optHtml("A", q.option_a)}
      ${optHtml("B", q.option_b)}
      ${optHtml("C", q.option_c)}
      ${optHtml("D", q.option_d)}
    </div>`;
  });

  html += `<button class="btn" style="width:100%;margin-top:12px" id="backTests2"><i class="fas fa-arrow-left" style="margin-right:6px"></i>Back to Tests</button>`;
  c.innerHTML = html;
  document.getElementById("backScore").onclick = () => showScoreAndReview(c, data, false);
  document.getElementById("backTests2").onclick = () => {
    cbtTest = null; cbtQuestions = []; cbtAnswers = {};
    renderTests(c);
  };
}

async function renderAdminSubjects(body){
  body.innerHTML = `
    <div class="card">

    <div id="subjManageList">${skelList(4)}</div>`;

  document.getElementById("addSubj").onclick = async () => {
    const name = document.getElementById("newSubj").value.trim();
    if(!name) return toast("Enter subject name");
    try{
      const {data: existing} = await db.from("subjects").select("sort_order").order("sort_order",{ascending:false}).limit(1);
      const nextOrder = (existing?.[0]?.sort_order || 0) + 1;
      await db.from("subjects").insert({name, sort_order: nextOrder});
      toast("Subject added");
      renderAdminSubjects(body);
    }catch(e){ toast(e?.message || "Error"); }
  };

  try{
    const {data, error} = await db.from("subjects").select("*").order("sort_order");
    if(error) throw error;
    const list = document.getElementById("subjManageList");
    if(!data?.length){ list.innerHTML = `<div class="empty"><i class="fas fa-inbox" style="margin-bottom:8px;font-size:24px"></i><br>No subjects yet.</div>`; return; }

    list.innerHTML = "";
    for(let i=0; i<data.length; i++){
      const s = data[i];
      const {count: chapCount} = await db.from("chapters").select("id", {count:"exact", head:true}).eq("subject_id", s.id);

      const row = el(`<div class="card">
        <div class="row">
          <div style="flex:1">
            <div style="font-weight:700;margin-bottom:4px"><i class="fas fa-book" style="margin-right:8px;color:var(--accent)"></i>${escapeHtml(s.name)}</div>
            <div style="color:var(--text-muted);font-size:13px"><i class="fas fa-folder"></i> ${chapCount||0} chapters</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn-small upS" ${i===0?"disabled":""} title="Move up"><i class="fas fa-arrow-up"></i></button>
            <button class="btn-small downS" ${i===data.length-1?"disabled":""} title="Move down"><i class="fas fa-arrow-down"></i></button>
            <button class="btn-small editS" title="Rename"><i class="fas fa-edit"></i> Rename</button>
            <button class="btn-danger delS" title="Delete"><i class="fas fa-trash"></i> Delete</button>
          </div>
        </div>
      </div>`);

      row.querySelector(".upS").onclick = async () => {
        if(i===0) return;
        const prev = data[i-1];
        try{
          await db.from("subjects").update({sort_order: prev.sort_order}).eq("id", s.id);
          await db.from("subjects").update({sort_order: s.sort_order}).eq("id", prev.id);
          toast("Moved up");
          renderAdminSubjects(body);
        }catch(e){ toast(e?.message||"Error"); }
      };

      row.querySelector(".downS").onclick = async () => {
        if(i===data.length-1) return;
        const next = data[i+1];
        try{
          await db.from("subjects").update({sort_order: next.sort_order}).eq("id", s.id);
          await db.from("subjects").update({sort_order: s.sort_order}).eq("id", next.id);
          toast("Moved down");
          renderAdminSubjects(body);
        }catch(e){ toast(e?.message||"Error"); }
      };

      row.querySelector(".editS").onclick = async () => {
        const newName = prompt("New subject name:", s.name);
        if(newName === null || !newName.trim()) return;
        try{
          await db.from("subjects").update({name: newName.trim()}).eq("id", s.id);
          toast("Subject renamed");
          renderAdminSubjects(body);
        }catch(e){ toast(e?.message || "Error"); }
      };

      row.querySelector(".delS").onclick = async () => {
        const ok = await confirmAction("Delete Subject", 
          `Delete "${s.name}"?\n\nThis subject has ${chapCount||0} chapters.\nAll chapters + PDFs + videos under it will be deleted permanently.`);
        if(!ok) return;
        try{
          const {data: chs} = await db.from("chapters").select("id").eq("subject_id", s.id);
          if(chs?.length){
            for(const ch of chs){
              const {data: pdfs} = await db.from("pdfs").select("file_path").eq("chapter_id", ch.id);
              if(pdfs?.length){
                const paths = pdfs.map(p => p.file_path).filter(Boolean);
                if(paths.length) await db.storage.from("content").remove(paths);
              }
              await db.from("pdfs").delete().eq("chapter_id", ch.id);
              await db.from("videos").delete().eq("chapter_id", ch.id);
            }
            await db.from("chapters").delete().eq("subject_id", s.id);
          }
          await db.from("subjects").delete().eq("id", s.id);
          toast("Subject deleted");
          renderAdminSubjects(body);
        }catch(e){ toast(e?.message || "Delete failed"); }
      };

      list.appendChild(row);
    }
  }catch(e){
    document.getElementById("subjManageList").innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle" style="margin-bottom:8px;font-size:24px"></i><br>${escapeHtml(e?.message||"Error")}</div>`;
  }
}
