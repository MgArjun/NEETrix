<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0507">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ZNEETRIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0507;--blue:#c4325a;--green:#6e1229;--violet:#e896aa;--amber:#fbbf24;--ok:#3dd68c;--red:#fb7185;
  --text:#f6eaee;--muted:#a08c94;
  --glass:rgba(255,255,255,.05);--glass-b:rgba(255,255,255,.10);
  --r:20px;--ease:cubic-bezier(.16,1,.3,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{--bg:#f8eff1;--text:#24101a;--muted:#7a5c68;--glass:rgba(255,255,255,.7);--glass-b:rgba(36,16,26,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none;
  background-image:radial-gradient(60vmax 60vmax at 0% 0%,rgba(190,45,85,.13),transparent 60%),radial-gradient(55vmax 55vmax at 100% 100%,rgba(110,18,41,.09),transparent 60%)}
#particles{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06)}
.muted{color:var(--muted);font-size:13.5px}
.empty{color:var(--muted);text-align:center;padding:48px 12px;font-size:14px}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:700;font-size:14px;color:#ffffff;background:linear-gradient(135deg,var(--blue),var(--green));box-shadow:0 8px 26px rgba(190,45,85,.28);transition:transform .2s var(--ease),box-shadow .2s,opacity .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(190,45,85,.38)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--glass);color:var(--text);border:1px solid var(--glass-b);box-shadow:none}
.btn.danger{background:rgba(251,113,133,.14);color:#fecdd3;border:1px solid rgba(251,113,133,.45);box-shadow:none}
.btn.w{width:100%}
.field{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--glass-b);border-radius:14px;padding:14px 16px;font-size:14.5px;margin-bottom:10px;outline:none;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(190,45,85,.18)}
.field:disabled{opacity:.5}

/* splash */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.splash-in{text-align:center}
.splash svg{width:132px;height:132px;overflow:visible;filter:drop-shadow(0 0 28px rgba(190,45,85,.55))}
.splash .ring{transform-origin:60px 60px;animation:spin 7s linear infinite}
.splash .ring.b{animation-duration:11s;animation-direction:reverse}
.splash .draw{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.4s .2s var(--ease) forwards}
.splash .core{transform-origin:60px 60px;animation:pop .9s .5s var(--ease) both}
.splash h1{margin-top:22px;font-size:30px;font-weight:800;letter-spacing:.38em;text-indent:.38em;background:linear-gradient(120deg,#ffdce4,var(--blue),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .9s 1s var(--ease) both}
.splash p{margin-top:8px;color:var(--muted);font-size:12.5px;letter-spacing:.2em;animation:rise .9s 1.25s var(--ease) both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.logo-mark{width:30px;height:30px;flex-shrink:0}
.wordmark{font-weight:800;letter-spacing:.22em;font-size:15px;background:linear-gradient(120deg,#ffdce4,var(--blue),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}

/* auth */
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth{width:100%;max-width:400px;padding:34px 26px;animation:rise .7s var(--ease)}
.auth .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.auth .msg{min-height:20px;font-size:13px;margin:0 0 8px;color:var(--red)}
.auth .msg.good{color:var(--ok)}
.links{display:flex;justify-content:space-between;margin-top:16px;font-size:13px}
.links a{color:var(--blue);cursor:pointer}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--glass-b)}

/* shell */
.shell{min-height:100vh;display:flex}
.nav{position:fixed;z-index:30;display:flex;gap:4px;padding:8px;background:rgba(16,8,11,.72);border:1px solid var(--glass-b);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5)}
:root[data-theme="light"] .nav{background:rgba(255,255,255,.8)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:1;min-height:52px;border-radius:16px;color:var(--muted);font-size:11px;font-weight:600;transition:color .25s,background .25s,transform .15s}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
.nav button:active{transform:scale(.92)}
.nav button.on{color:var(--text);background:linear-gradient(135deg,rgba(190,45,85,.22),rgba(110,18,41,.14))}
.nav button.on svg{transform:translateY(-2px) scale(1.08);stroke:var(--blue)}
main{flex:1;min-width:0;width:100%;max-width:980px;margin:0 auto;padding:calc(var(--sat) + 22px) 16px calc(var(--sab) + 110px)}
.view{animation:rise .5s var(--ease)}
h2.title{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-bottom:16px}
@media(max-width:859px){.nav{left:12px;right:12px;bottom:calc(var(--sab) + 12px);border-radius:24px}}
@media(min-width:860px){
  .nav{left:20px;top:20px;bottom:20px;width:96px;flex-direction:column;border-radius:28px;justify-content:flex-start;padding-top:70px}
  .nav button{flex:0 0 auto;min-height:64px}
  .nav::before{content:"";position:absolute;top:18px;left:50%;width:30px;height:30px;transform:translateX(-50%);background:var(--logo) center/contain no-repeat}
  main{margin-left:140px;padding:40px 28px 60px;max-width:none}
  main>.view{max-width:900px}
}

/* home */
.greet{margin:6px 2px 22px}
.greet .hi{color:var(--muted);font-size:15px;font-weight:600}
.greet h1{font-size:clamp(34px,8vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:4px;background:linear-gradient(120deg,var(--text) 30%,var(--blue) 75%,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{padding:20px;margin-bottom:14px}
.quote{font-size:17px;font-weight:600;line-height:1.5;letter-spacing:-.01em;border-left:3px solid;border-image:linear-gradient(180deg,var(--blue),var(--green)) 1;padding-left:16px}
.rings{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.rings{grid-template-columns:repeat(4,1fr)}}
.ring-tile{padding:16px 10px;text-align:center}
.ring-tile svg{width:78px;height:78px;transform:rotate(-90deg)}
.ring-tile .track{stroke:rgba(255,255,255,.08)}
.ring-tile .val{stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease)}
.ring-tile .num{font-size:22px;font-weight:800;margin-top:-58px;height:58px;display:grid;place-items:center}
.ring-tile .lbl{margin-top:10px;font-size:12.5px;color:var(--muted);font-weight:600}
.score-card{cursor:pointer;transition:transform .25s var(--ease),border-color .25s}
.score-card:hover{transform:translateY(-2px);border-color:rgba(190,45,85,.5)}
.score-card .big{font-size:40px;font-weight:800;letter-spacing:-.03em}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--green))}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.skel{border-radius:var(--r);background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.10),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* profile */
.avatar{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:36px;font-weight:800;color:#ffffff;background:linear-gradient(135deg,var(--blue),var(--green));box-shadow:0 0 0 4px rgba(190,45,85,.15),0 0 42px rgba(190,45,85,.4);margin:0 auto 14px}
.pcard{text-align:center;padding:26px 20px}
.badge{display:inline-block;font-size:11.5px;padding:4px 12px;border-radius:99px;border:1px solid var(--glass-b);color:var(--muted);font-weight:600}
.badge.guest{color:var(--amber);border-color:rgba(251,191,36,.5)}
.badge.mail{color:var(--green);border-color:rgba(110,18,41,.5)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--glass-b);font-size:13.5px}
.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right;word-break:break-all}
.sw{position:relative;width:46px;height:27px;border-radius:99px;background:rgba(255,255,255,.12);transition:background .25s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .3s var(--ease)}
.sw.on{background:linear-gradient(135deg,var(--blue),var(--green))}.sw.on::after{transform:translateX(19px)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
select.field{width:auto;margin:0;padding:9px 12px}select option{background:#12080c}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(4,2,3,.7);backdrop-filter:blur(8px);animation:fade .25s}
.modal .mb{width:100%;max-width:420px;max-height:90vh;overflow:auto;padding:24px;animation:rise .4s var(--ease)}
@keyframes fade{from{opacity:0}}
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 96px);z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{padding:12px 18px;border-radius:14px;background:rgba(20,9,13,.94);border:1px solid var(--green);font-size:13.5px;font-weight:600;max-width:90vw;animation:rise .35s var(--ease)}
.toast.bad{border-color:var(--red)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ZNEETRIX Part 3: tests + admin. Add after style.css in index.html */
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.ic.xs{width:13px;height:13px;vertical-align:-2px}
.sm{font-size:12px}.sh{font-size:15px;font-weight:800;margin:20px 2px 10px}
.seg{display:flex;gap:6px;padding:5px;margin-bottom:14px;background:var(--glass);border:1px solid var(--glass-b);border-radius:16px}
.seg.scroll{overflow-x:auto;scrollbar-width:none}.seg.scroll::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;padding:10px 14px;border-radius:12px;font-weight:700;font-size:13.5px;color:var(--muted);transition:background .25s,color .25s}
.seg button.on{color:#ffffff;background:linear-gradient(135deg,var(--blue),var(--green))}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:9px 14px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-b);font-weight:600;font-size:13.5px}
.ib{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--glass);border:1px solid var(--glass-b);flex-shrink:0;transition:transform .15s,border-color .2s}
.ib.sm{width:36px;height:36px;border-radius:11px}.ib:active{transform:scale(.92)}.ib.red{color:#fecdd3;border-color:rgba(251,113,133,.4)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--glass-b);color:var(--muted)}
.chip.blue{color:var(--blue);border-color:rgba(190,45,85,.4)}.chip.g{color:var(--ok);border-color:rgba(61,214,140,.4)}.chip.r{color:var(--red);border-color:rgba(251,113,133,.4)}
.brow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.brow .btn{flex:1;min-width:120px}
.tcard .trow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.tt{font-size:17px;font-weight:800;letter-spacing:-.01em}
.sbig{font-size:30px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}.sbig small{font-size:14px;color:var(--muted);font-weight:600}.sbig.c{text-align:center;margin:6px 0 18px}
.rules{margin:0 0 12px 18px;line-height:1.7;font-size:14px;color:var(--text)}.note{padding:12px 14px;border-radius:14px;background:rgba(190,45,85,.08);border:1px solid rgba(190,45,85,.25);font-size:13.5px;line-height:1.6;white-space:pre-wrap;margin:12px 0}
.kv b{font-weight:800}.g{color:var(--ok)}.r{color:var(--red)}

/* modal extras */
.modal .mb.wide{max-width:760px}.mh{font-size:18px;font-weight:800}.mh-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.mp{margin:8px 0 16px;line-height:1.6}.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.mbtns .btn{flex:1;min-width:110px}
.fg{margin-bottom:12px}.fl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}.fh{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.fg .field,.toolbar .field{margin:0;width:100%}textarea.field{resize:vertical;font-family:inherit;line-height:1.5}
.center-msg{text-align:center;padding:18px}.spin{width:34px;height:34px;margin:0 auto 12px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--blue);animation:spin .8s linear infinite}

/* CBT */
body.cbt-on .nav{display:none}body.cbt-on main{padding:calc(var(--sat) + 10px) 10px calc(var(--sab) + 96px)}
@media(min-width:860px){body.cbt-on main{margin-left:0;padding:24px 28px 100px}body.cbt-on main>.view,body.cbt-on main>.cbt{max-width:1100px;margin:0 auto}}
.cbt-top{position:sticky;top:calc(var(--sat) + 6px);z-index:20;display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:12px}
.cbt-ti{flex:1;min-width:0;display:flex;flex-direction:column}.cbt-ti b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cbt-ti span{font-size:12px;color:var(--muted)}
.cbt-tm{font-variant-numeric:tabular-nums;font-weight:800;font-size:19px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06);transition:color .3s,background .3s}
.cbt-tm.warn{color:var(--amber);background:rgba(251,191,36,.12)}.cbt-tm.crit{color:var(--red);background:rgba(251,113,133,.15);animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.55}}
.cbt-body{display:grid;gap:12px}.cbt-q{padding:20px}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}.qno{font-weight:800;font-size:15px}.qno small{color:var(--muted);font-weight:600}
.qtext{font-size:16.5px;line-height:1.65;font-weight:600;white-space:pre-wrap;margin-bottom:14px}.qimg{max-width:100%;border-radius:14px;margin:0 0 14px;border:1px solid var(--glass-b);background:#fff}
.opts{display:grid;gap:10px}.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--glass-b);font-size:15px;line-height:1.5;transition:border-color .2s,background .2s,transform .15s;position:relative}
.opt:active{transform:scale(.99)}.opt i{font-style:normal;flex-shrink:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:rgba(255,255,255,.08)}
.opt span{padding-top:4px;white-space:pre-wrap;word-break:break-word}.opt.sel{border-color:var(--blue);background:rgba(190,45,85,.16)}.opt.sel i{background:linear-gradient(135deg,var(--blue),var(--green));color:#ffffff}
.opt.ro{cursor:default}.opt.ro:active{transform:none}.opt.ok{border-color:var(--ok);background:rgba(61,214,140,.13)}.opt.ok i{background:var(--ok);color:#ffffff}.opt.bad{border-color:var(--red);background:rgba(251,113,133,.13)}.opt.bad i{background:var(--red);color:#ffffff}
.opt em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:800;padding-top:6px;white-space:nowrap;color:var(--muted)}
.cbt-bar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:8px;padding:10px 12px calc(var(--sab) + 10px);background:rgba(10,5,7,.82);border-top:1px solid var(--glass-b);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
:root[data-theme="light"] .cbt-bar{background:rgba(248,239,241,.9)}.cbt-bar .btn{flex:1;padding:13px 8px}.cbt-bar .btn.on{border-color:var(--violet);color:var(--violet)}
.cbt-pal{padding:16px}.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.pal-x{display:none}
.legend{display:grid;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:12px}.legend span{display:flex;align-items:center;gap:8px}.legend b{margin-left:auto;color:var(--text)}.legend .pb{width:16px;height:16px;border-radius:5px;pointer-events:none}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:46vh;overflow:auto;margin-bottom:12px;padding:2px}
.pb{aspect-ratio:1;min-width:0;border-radius:11px;font-weight:800;font-size:13px;border:1px solid var(--glass-b);background:rgba(255,255,255,.05);color:var(--text)}
.pb.nv{background:rgba(255,255,255,.05);color:var(--muted)}.pb.na{background:rgba(251,113,133,.16);border-color:rgba(251,113,133,.5)}.pb.a{background:rgba(61,214,140,.2);border-color:rgba(61,214,140,.6)}
.pb.m{background:rgba(232,150,170,.22);border-color:rgba(232,150,170,.65)}.pb.am{background:rgba(232,150,170,.22);border-color:var(--ok);box-shadow:inset 0 0 0 2px rgba(61,214,140,.7)}.pb.cur{outline:2px solid var(--blue);outline-offset:2px}
.pal-bg{display:none}
@media(max-width:859px){
  .cbt-pal{position:fixed;left:10px;right:10px;bottom:calc(var(--sab) + 80px);z-index:40;max-height:72vh;overflow:auto;transform:translateY(130%);transition:transform .35s var(--ease);box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .cbt.pal-open .cbt-pal{transform:none}.cbt.pal-open .pal-bg{display:block;position:fixed;inset:0;z-index:35;background:rgba(4,2,3,.55)}.pal-x{display:grid}
}
@media(min-width:860px){.cbt-body{grid-template-columns:1fr 290px;align-items:start}.cbt-pal{position:sticky;top:90px}.pal-tg{display:none}.cbt-bar{left:0;padding-left:28px;padding-right:28px}.cbt-bar .btn{max-width:200px}.cbt-bar{justify-content:center}}

/* result + review */
.res{text-align:center;padding:26px 18px}.rbig{position:relative;width:150px;height:150px;margin:0 auto 8px}.rbig svg{width:100%;height:100%;transform:rotate(-90deg)}.rbig .track{stroke:rgba(255,255,255,.08)}.rbig .val{stroke:url(#none);stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset 1.3s var(--ease)}

/* ============================ CBT engine ============================ */
async function begin(t) {

}

const cur = () => ST.qs[ST.idx];

}

function cbtShell() {

      <button class="ib pal-tg" data-c="pal" aria-label="Question palette">${ic("grid")}</button></div>
    <div class="cbt-body"><section class="glass cbt-q" id="qa"></section><div class="pal-bg" data-c="pal"></div><aside class="glass cbt-pal" id="pal"></aside></div>
    <div class="cbt-bar"><button class="btn ghost" data-c="prev">‹ Prev</button><button class="btn ghost" data-c="clear">Clear</button><button class="btn ghost" id="mk" data-c="mark">Mark</button><button class="btn" id="nx" data-c="next">Next ›</button></div></div>`;
  root.firstElementChild.onclick = (e) => {

function paintQ() {

const nextOrder = (list) => (list.length ? Math.max(...list.map((x) => num(x.sort_order, 0))) + 1 : 0);
async function meta() {
  const [subjects, chapters] = await Promise.all([A.list("subjects", "sort_order"), A.list("chapters", "sort_order")]);
  const sName = {}, cName = {};
  subjects.forEach((s) => (sName[String(s.id)] = s.name)); chapters.forEach((c) => (cName[String(c.id)] = c.name));
  return { subjects, chapters, sName, cName };
}
const sel = (id, opts, val, extra = "") => `<select class="field" id="${id}" ${extra}>${opts.map(([v, l]) => `<option value="${E(v)}"${same(v, val) ? " selected" : ""}>${E(l)}</option>`).join("")}</select>`;
const iconBtn = (act, id, icon, label, cls = "") => `<button class="ib sm ${cls}" data-act="${act}" data-id="${E(id)}" aria-label="${label}" title="${label}">${ic(icon)}</button>`;

// Make a chapter id out of the form values (creates the chapter if "+ New chapter" was chosen).
async function resolveChapter(v, chapters) {
  if (v.chapter_id !== "__new") return v.chapter_id;
  if (!v.new_chapter) throw new Error("Type the new chapter name");
  const row = await A.ins("chapters", { subject_id: v.subject_id, name: v.new_chapter, sort_order: nextOrder(chapters.filter((c) => same(c.subject_id, v.subject_id))) });
  return row.id;
}
async function reorder(table, group, id, dir, byCreated) {
  const i = group.findIndex((x) => same(x.id, id)), j = i + dir;
  if (i < 0 || j < 0 || j >= group.length) return;
  const arr = group.slice(); [arr[i], arr[j]] = [arr[j], arr[i]];
  if (byCreated) {
    const base = Math.min(...arr.map((x) => +new Date(x.created_at)));
    await Promise.all(arr.map((x, k) => A.upd(table, x.id, { created_at: new Date(base + k * 1000).toISOString() })));
  } else {
    await Promise.all(arr.map((x, k) => (num(x.sort_order, -1) === k ? null : A.upd(table, x.id, { sort_order: k }))).filter(Boolean));
  }
}

function parseBulk(text) {
  const ok = [], errors = [];
  const hasOpt = (b) => /^\s*\(?[A-Da-d][\).:]\s*\S/m.test(b);
  const hasAns = (b) => /^\s*(?:ans(?:wer)?|correct(?: answer)?)\s*[:\-.]/im.test(b);
  const blocks = [];
  for (const b of text.replace(/\r/g, "").split(/\n[ \t]*\n/).map((x) => x.trim()).filter(Boolean)) {
    const prev = blocks[blocks.length - 1];
    if (prev !== undefined && ((!hasOpt(prev) && !hasAns(prev)) || (!hasOpt(b) && (!hasAns(prev) || !hasAns(b))))) blocks[blocks.length - 1] = prev + "\n" + b; else blocks.push(b);
  }
  blocks.forEach((blk, bi) => {
    const q = { text: [], o: {}, ans: "", exp: [] };
    let mode = "q", last = "";
    for (const raw of blk.split("\n")) {
      const line = raw.trim(); let m;
      if (!line) continue;
      if ((m = line.match(/^\(?([A-Da-d])[\).:]\s*(.*)$/)) && (mode === "q" || mode === "o")) { last = m[1].toUpperCase(); q.o[last] = m[2]; mode = "o"; }
      else if ((m = line.match(/^(?:ans(?:wer)?|correct(?: answer)?)\s*[:\-.]\s*\(?([A-Da-d])\)?/i))) { q.ans = m[1].toUpperCase(); mode = "a"; }
      else if ((m = line.match(/^(?:exp(?:lanation)?|sol(?:ution)?)\s*[:\-.]\s*(.*)$/i))) { q.exp.push(m[1]); mode = "e"; }
      else if (mode === "q") q.text.push(line);
      else if (mode === "e") q.exp.push(line);
      else if (mode === "o" && last) q.o[last] += " " + line;
    }
    const qt = q.text.join("\n").replace(/^\s*(?:Q\.?\s*)?\d+\s*[\).:\-]\s*/i, "").trim();
    const n = bi + 1;
    if (!qt) return errors.push(`Question ${n}: no question text`);
    if (!["A", "B", "C", "D"].every((k) => q.o[k])) return errors.push(`Question ${n}: needs options A, B, C and D`);
    if (!q.ans) return errors.push(`Question ${n}: missing "Answer: B" line`);
    ok.push({ question_text: qt, option_a: q.o.A, option_b: q.o.B, option_c: q.o.C, option_d: q.o.D, correct_option: q.ans, explanation: q.exp.join(" ").trim() || null });
  });
  return { ok, errors };
}

    }
    const items = [];
    rows.forEach((r) => {
      items.push({ z: 0, k: "rung", r });
      [[r.A, BLUE], [r.B, GREEN]].forEach(([n, col]) => items.push({ z: n.z + 0.001, k: "node", n, r, col }));
      if (r.i) { const p = rows[r.i - 1]; [["A", BLUE], ["B", GREEN]].forEach(([key, col]) => items.push({ z: (p[key].z + r[key].z) / 2, k: "seg", p: p[key], q: r[key], r, col })); }

    items.sort((m, n) => m.z - n.z);

    items.forEach((it) => {
      const r = it.r;

        const g = x.createLinearGradient(r.A.x, r.A.y, r.B.x, r.B.y), al = (0.16 + 0.6 * r.glow) * r.edge * r.rv;

      } else if (it.k === "seg") {

      } else {
        const n = it.n, zz = (n.z + 1) / 2, rad = (3.2 + 2.4 * zz) * r.rv, al = (0.35 + 0.65 * zz) * r.edge;
        if (rad <= 0.1) return;
        x.globalCompositeOperation = OP;
        const gl = x.createRadialGradient(n.x, n.y, 0, n.x, n.y, rad * 3.4); gl.addColorStop(0, rgba(it.col, 0.5 * al * (1 + 1.5 * r.glow))); gl.addColorStop(1, rgba(it.col, 0));
        x.fillStyle = gl; x.beginPath(); x.arc(n.x, n.y, rad * 3.4, 0, 7); x.fill();
        x.globalCompositeOperation = "source-over";
        const sg = x.createRadialGradient(n.x - rad * 0.35, n.y - rad * 0.35, rad * 0.1, n.x, n.y, rad * 1.1);
        sg.addColorStop(0, `rgba(255,255,255,${al})`); sg.addColorStop(0.45, rgba(it.col, al)); sg.addColorStop(1, rgba(mixc(it.col, [10, 20, 40], 0.55), al));

    sg2.addColorStop(0, rgba(BLUE, 0)); sg2.addColorStop(0.5, rgba(light ? BLUE : [255, 225, 232], 0.35 * clamp(t / 1.4))); sg2.addColorStop(1, rgba(BLUE, 0));
    x.globalCompositeOperation = OP; x.fillStyle = sg2; x.fillRect(-90, sy - 0.5, 180, 1);
    x.restore();

  };
  requestAnimationFrame(frame);
}

/* ---------- splash ---------- */
function splash() {
  return new Promise((res) => {
    const d = document.createElement("div");
    d.className = "splash";
    const cols = (k) => { const p = [[255, 220, 228], [190, 45, 85], [110, 18, 41]], q = k * 2, m = q < 1 ? 0 : 1, f = q < 1 ? q : q - 1; return p[m].map((v, n) => Math.round(v + (p[m + 1][n] - v) * f)); };
    const word = "ZNEETRIX".split("").map((ch, n) => `<span style="--i:${n};color:rgb(${cols(n / 7).join(",")})">${ch}</span>`).join("");
    const first = !localStorage.getItem("znx-auth"), ms = matchMedia("(prefers-reduced-motion: reduce)").matches || S.settings.reduce ? 300 : first ? 3400 : 1600;
    d.innerHTML = `<div class="splash-in"><canvas class="dna-c" aria-hidden="true"></canvas><h1>${word}</h1><p>PREPARE · FOCUS · RISE</p><div class="splash-bar"><i style="animation-duration:${ms}ms"></i></div></div>`;
    dnaSplash(d.querySelector(".dna-c"));
    document.body.appendChild(d);
    setTimeout(() => { d.classList.add("out"); setTimeout(() => d.remove(), 750); res(); }, ms);
  });
}

/* ---------- auth ---------- */
function authScreen(mode = "login", msg = "", good = false) {

  const sub = { login: "Welcome back. Pick up where you left off.", signup: "Create your account to track every lecture and test.", forgot: "We will email you a reset link.", reset: "Choose a new password." }[mode];
  app.innerHTML = `<div class="center"><div class="glass auth">
    <div class="brand"><svg class="logo-mark" viewBox="0 0 120 120">${LOGO("a").replace(/<svg[^>]*>|<\/svg>/g, "")}</svg><span class="wordmark">ZNEETRIX</span></div>
    <p class="muted" style="margin:6px 0 22px">${sub}</p>
    ${mode !== "reset" ? '<input class="field" id="em" type="email" placeholder="Email" autocomplete="email">' : ""}
    ${mode !== "forgot" ? `<input class="field" id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="${mode === "login" ? "current" : "new"}-password">` : ""}
    <div class="msg ${good ? "good" : ""}" id="msg">${E(msg)}</div>
    <button class="btn w" data-a="authGo" data-m="${mode}">${L}</button>

  </div></div>`;
}
function statusScreen(s) {
  const t = { pending: ["Waiting for approval", "Your request is with the admin. Check again once approved."], paused: ["Account paused", "The admin has paused your access."], blocked: ["Access blocked", "The admin has blocked this account."] }[s] || ["Unavailable", "Contact the admin."];
  app.innerHTML = `<div class="center"><div class="glass auth"><span class="wordmark">ZNEETRIX</span><h2 style="margin:18px 0 6px">${t[0]}</h2><p class="muted" style="margin-bottom:20px">${t[1]}</p>
  <button class="btn w" data-a="recheck">Check again</button><div style="height:10px"></div><button class="btn ghost w" data-a="logout">Log out</button></div></div>`;
}

async function enter(session) {
  if (S.user?.id === session.user.id && S.prof?.status === "active" && $(".shell")) return;
  S.user = session.user;
  S.prof = await api.profile(session.user.id);
  for (let i = 0; !S.prof && i < 3; i++) { await new Promise((r) => setTimeout(r, 700)); S.prof = await api.profile(session.user.id); }
  if (!S.prof) return statusScreen("pending");
  if (S.prof.status && S.prof.status !== "active") return statusScreen(S.prof.status);
  api.trackLogin(session.user);
  shell();
}

/* ---------- shell ---------- */
const ICON = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  learn: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/>',

async function route() {

}
function soon(m, name, part) {

}

/* ---------- home ---------- */
const QUOTES = [
  "Discipline turns dreams into ranks.", "Every page you study today becomes confidence tomorrow.",
  "NEET is not about luck; it is about consistency.", "Small daily effort creates extraordinary results.",
  "Your future patients are waiting for the doctor you are becoming.", "One chapter. One test. Every day.",
  "Revision is where marks are made.", "Show up on the days you do not feel like it."
];
const greeting = () => { const h = new Date().getHours(); return h >= 5 && h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : h < 21 ? "Good evening" : "Good night"; };
const ring = (pct, color, num, lbl) => {
  const R = 32, C = 2 * Math.PI * R;
  return `<div class="glass ring-tile"><svg viewBox="0 0 80 80"><circle class="track" cx="40" cy="40" r="${R}" fill="none" stroke-width="7"/><circle class="val" cx="40" cy="40" r="${R}" fill="none" stroke="${color}" stroke-width="7" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-to="${C * (1 - Math.min(100, pct) / 100)}"/></svg><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`;
};
async function home(m) {
  const name = S.prof.name || (S.user.email || "Guest").split("@")[0];
  const [att, cnt, vAll, pAll] = await Promise.all([api.attempts(100), api.counts(S.user.id).catch(() => ({ lectures: 0, pdfs: 0 })), api.allVideos().catch(() => []), api.allPdfs().catch(() => [])]);
  const q = QUOTES[Math.floor(Date.now() / 864e5) % QUOTES.length];
  const last = att[0];
  const avg = att.length ? Math.round(att.reduce((a, x) => a + Math.max(0, x.score) / (x.total || 1) * 100, 0) / att.length) : 0;
  const lectures = cnt.lectures, pdfs = cnt.pdfs, vTot = Math.max(vAll.length, 1), pTot = Math.max(pAll.length, 1);
  const completion = Math.round(((lectures / vTot + pdfs / pTot + Math.min(att.length, 10) / 10) / 3) * 100);
  const lp = last ? Math.max(0, Math.round(last.score / (last.total || 1) * 100)) : 0;
  m.innerHTML = `<div class="view">
    <div class="greet"><div class="hi">${greeting()}</div><h1>${E(name)}</h1></div>
    ${S.user.is_anonymous ? '<div class="glass card row"><span class="muted">You are on a guest profile. Create an account to keep your progress on every device.</span><button class="btn" data-a="tab" data-k="me">Create account</button></div>' : ""}
    ${last ? `<div class="glass card score-card" data-a="review"><div class="row"><div><div class="muted">Latest test · ${E(last.title || "Test")}</div><div class="big">${last.score}<span class="muted" style="font-size:18px"> / ${last.total}</span></div></div><div style="text-align:right"><div class="muted">${att.length} attempted</div><div class="muted">Average ${avg}%</div></div></div><div class="bar"><i style="width:${lp}%"></i></div></div>`
      : '<div class="glass card"><h3 style="font-size:18px;margin-bottom:6px">Start with one chapter today</h3><p class="muted" style="margin-bottom:14px">Watch a lecture, solve its questions, then take a short test. Your progress shows up here.</p><button class="btn" data-a="tab" data-k="learn">Open lectures</button></div>'}
    <div class="glass card"><p class="quote">${E(q)}</p></div>
    <div class="rings">${ring(lectures / vTot * 100, "#c4325a", lectures, "Lectures watched")}${ring(pdfs / pTot * 100, "#e896aa", pdfs, "PDFs opened")}${ring(att.length / 10 * 100, "#6e1229", att.length, "Tests attempted")}${ring(completion, "#fbbf24", completion + "%", "Completion")}</div>
  </div>`;
  requestAnimationFrame(() => setTimeout(() => m.querySelectorAll(".val").forEach((c) => (c.style.strokeDashoffset = c.dataset.to)), 80));
}

/* ---------- me / profile ---------- */
function me(m) {
  const p = S.prof, guest = !!S.user.is_anonymous, s = S.settings;
  const init = (p.name || S.user.email || "G")[0].toUpperCase();

  m.innerHTML = `<div class="view"><h2 class="title">Me</h2>
    <div class="glass pcard card"><div class="avatar">${E(init)}</div><h3 style="font-size:20px;margin-bottom:8px">${E(p.name || (guest ? "Guest" : "Student"))}</h3><span class="badge ${guest ? "guest" : "mail"}">${guest ? "Guest account" : "Email account"}</span></div>
    <div class="glass card"><input class="field" id="nm" placeholder="Your name" value="${E(p.name || "")}"><button class="btn w" data-a="saveName">Save name</button></div>
    <div class="glass card">
      <div class="kv"><span>User ID</span><button class="uidc" data-a="copyid" data-v="${E(uidCode(S.user.id))}" aria-label="Copy user ID">${E(uidCode(S.user.id))}</button></div>

    <button class="btn ghost w" data-a="logout">Log out</button><div style="height:10px"></div>

}

/* ---------- actions ---------- */
const A = {
  auth: (b) => authScreen(b.dataset.m),
  async guest() { await api.guest(); },
  async authGo(b) {
    const m = b.dataset.m, em = $("#em")?.value.trim(), pw = $("#pw")?.value;
    const say = (t, good) => { const e = $("#msg"); e.textContent = t; e.className = "msg" + (good ? " good" : ""); };
    if (m !== "forgot" && (!pw || pw.length < 8)) return say("Password must be 8+ characters.");
    if (m !== "reset" && !em) return say("Enter your email.");
    b.disabled = true;
    try {
      if (m === "login") await api.signIn(em, pw);
      else if (m === "signup") { const d = await api.signUp(em, pw); if (!d.session) say("Account created. Confirm your email, then log in.", true); }
      else if (m === "forgot") { await api.forgot(em); say("Reset link sent. Check your inbox.", true); }
      else { await api.newPassword(pw); S.recovery = false; history.replaceState(null, "", location.pathname); S.user = null; const s = await api.session(); if (s) await enter(s); toast("Password updated"); }
    } catch (e) { say(e.message); }
    b.disabled = false;
  },
  async logout() { await api.signOut(); },
  async recheck() { S.user = null; const s = await api.session(); if (s) await enter(s); },
  tab(b) { S.tab = b.dataset.k; route(); },
  review() { Promise.resolve(__r("tests")).then((x) => x.openLatestReview($("#main"), ctx())); },
  copyid(b) { navigator.clipboard?.writeText(b.dataset.v).then(() => toast("ID copied"), () => toast("Could not copy", true)); },
  toggle(b) {
    const k = b.dataset.k;
    if (k === "light") { S.settings.theme = S.settings.theme === "light" ? "dark" : "light"; applyTheme(); } else { S.settings[k] = !S.settings[k]; if (k === "reduce") applyTheme(); }
    if (navigator.vibrate) navigator.vibrate(8);
    lsSet("znx_settings", S.settings); b.classList.toggle("on", k === "light" ? S.settings.theme === "light" : S.settings[k]);
  },
  async saveName() {
    const name = $("#nm").value.trim(); if (!name) return toast("Enter a name", true);
    await api.saveProfile(S.user.id, { name }); S.prof.name = name; toast("Name saved"); me($("#main"));
  },
  async upgrade() {
    const e = $("#ge").value.trim(), p = $("#gp").value;
    if (!e || p.length < 8) return toast("Enter an email and an 8+ character password", true);
    await api.upgradeGuest(e, p); toast("Check your email to confirm the account");
  },
  async delete() {
    if (!(await confirmBox("Delete your account and all your progress? This cannot be undone.", { ok: "Delete", danger: true, title: "Delete account?" }))) return;
    await api.deleteMyAccount(); await api.signOut(); toast("Account deleted");
  }
};
document.addEventListener("click", (e) => { const b = e.target.closest("[data-a]"); if (!b || b.tagName === "SELECT") return; const f = A[b.dataset.a]; if (f) run(() => f(b, e)); });
document.addEventListener("change", (e) => {
  const b = e.target.closest('select[data-a="speed"]'); if (!b) return;
  S.settings.speed = +b.value; lsSet("znx_settings", S.settings); toast("Default speed " + b.value + "x");
});

/* ---------- keep the login alive ---------- */
document.addEventListener("visibilitychange", () => { if (!document.hidden) api.session().catch(() => {}); });
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});

/* ---------- scroll reset: every new page opens at the top, so Back is always reachable ---------- */
(() => {
  let last = "";
  new MutationObserver(() => {
    const t = document.querySelector("#main h2.title");
    const k = (t ? t.textContent : "") + "|" + (document.querySelector("#main .back") ? "b" : "") + "|" + S.tab;
    if (k !== last) { last = k; window.scrollTo(0, 0); }
  }).observe(app, { childList: true, subtree: true });
})();

/* ---------- boot ---------- */
(async () => {
  try {
    db.auth.onAuthStateChange((ev, ss) => {
      if (ev === "PASSWORD_RECOVERY") { S.recovery = true; authScreen("reset"); }
      else if (ev === "SIGNED_OUT") { S.user = S.prof = null; S.tab = "home"; authScreen(); }
      else if (ss && !S.recovery && (ev === "SIGNED_IN" || ev === "INITIAL_SESSION")) setTimeout(() => run(() => enter(ss)), 0);
    });
    const [ses] = await Promise.all([api.session(), splash()]);
    if (!ses && !S.recovery) authScreen();
  } catch (e) { app.innerHTML = `<p class="empty">${E(e.message || "Could not start. Check your internet.")}</p>`; }
})();

__x.getSettings = getSettings;

};
