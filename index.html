      <div style="color:var(--text-muted);font-size:13px;margin-bottom:12px"><i class="fas fa-info-circle" style="margin-right:6px"></i>Leave file empty = CBT test</div>
      <button class="btn" id="addTest"><i class="fas fa-plus" style="margin-right:6px"></i>Create Test</button>
    </div>

    <h3 style="margin-top:32px;margin-bottom:14px"><i class="fas fa-folder-open" style="margin-right:8px;color:var(--accent)"></i>Manage Chapters</h3>
    <div id="chapManageList">${skelList(3)}</div>

    <h3 style="margin-top:32px;margin-bottom:14px"><i class="fas fa-file-pdf" style="margin-right:8px;color:var(--danger)"></i>Manage PDFs</h3>
    <div id="pdfManageList">${skelList(3)}</div>

    <h3 style="margin-top:32px;margin-bottom:14px"><i class="fas fa-video" style="margin-right:8px;color:var(--accent)"></i>Manage Videos</h3>
    <div id="vidManageList">${skelList(3)}</div>

    <h3 style="margin-top:32px;margin-bottom:14px"><i class="fas fa-file-alt" style="margin-right:8px;color:var(--accent)"></i>Existing Tests</h3>
    <div id="existingTestsList">${skelList(2)}</div>
  `;

  try{
    const {data: subjects} = await db.from("subjects").select("*").order("sort_order");
    const opts = (subjects||[]).map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join("") || `<option value="">No subjects</option>`;
    ["chSubj","vidSubj","pdfSubj"].forEach(id => {
      const sel = document.getElementById(id);
      if(sel) sel.innerHTML = opts;
    });

    document.getElementById("chSubj").onchange = () => loadChapterSelectForVideo();
    document.getElementById("vidSubj").onchange = () => loadChapterSelectForVideo();
    document.getElementById("pdfSubj").onchange = () => loadChapterSelectForPdf();

    await loadChapterSelectForPdf();
    await loadChapterSelectForVideo();

    document.getElementById("addChap").onclick = async () => {
      const subjId = document.getElementById("chSubj").value;
      const name = document.getElementById("newChap").value.trim();
      if(!subjId || !name) return toast("Select subject and enter chapter name");
      try{
        const {data: existing} = await db.from("chapters").select("sort_order").eq("subject_id", subjId).order("sort_order",{ascending:false}).limit(1);
        const nextOrder = (existing?.[0]?.sort_order || 0) + 1;
        await db.from("chapters").insert({subject_id: subjId, name, sort_order: nextOrder});
        toast("Chapter added");
        renderAdminContent(body);
      }catch(e){ toast(e?.message || "Error"); }
    };

    document.getElementById("addVid").onclick = async () => {
      const subjId = document.getElementById("vidSubj").value;
      const chapId = document.getElementById("vidChap").value;
      const title = document.getElementById("vidTitle").value.trim();
      const url = document.getElementById("vidUrl").value.trim();
      if(!subjId || !chapId || !title || !url) return toast("Fill all fields");
      const vid = ytId(url);
      if(!vid) return toast("Invalid YouTube URL");
      try{
        const {data: existing} = await db.from("videos").select("sort_order").eq("chapter_id", chapId).order("sort_order",{ascending:false}).limit(1);
        const nextOrder = (existing?.[0]?.sort_order || 0) + 1;
        await db.from("videos").insert({chapter_id: chapId, title, youtube_id: vid, sort_order: nextOrder});
        toast("Video added");
        renderAdminContent(body);
      }catch(e){ toast(e?.message || "Error"); }
    };

    document.getElementById("addPdf").onclick = async () => {
      const subjId = document.getElementById("pdfSubj").value;
      const chapId = document.getElementById("pdfChap").value;
      const title = document.getElementById("pdfTitle").value.trim();
      const cat = document.getElementById("pdfCat").value;
      const file = document.getElementById("pdfFile").files[0];
      if(!subjId || !chapId || !title || !file) return toast("Fill all fields and select PDF");
      if(file.type !== "application/pdf") return toast("Only PDF files allowed");

      const path = `pdfs/${Date.now()}_${file.name}`;
      try{
        const {error: uploadError} = await db.storage.from("content").upload(path, file, {contentType: "application/pdf"});
        if(uploadError) throw uploadError;

        const {data: existing} = await db.from("pdfs").select("sort_order").eq("chapter_id", chapId).order("sort_order",{ascending:false}).limit(1);
        const nextOrder = (existing?.[0]?.sort_order || 0) + 1;

        await db.from("pdfs").insert({
          chapter_id: chapId,
          title,
          category: cat,
          file_path: path,
          sort_order: nextOrder,
          created_at: new Date().toISOString()
        });
        toast("PDF uploaded");
        renderAdminContent(body);
      }catch(e){
        toast(e?.message || "Upload failed");
      }
    };

    document.getElementById("addTest").onclick = async () => {
      const title = document.getElementById("testTitle").value.trim();
      const dur = parseInt(document.getElementById("testDur").value) || 60;
      const file = document.getElementById("testFile").files[0];

      if(!title) return toast("Enter test title");

      let filePath = null;
      if(file){
        if(file.type !== "application/pdf") return toast("Only PDF files allowed");
        const path = `tests/${Date.now()}_${file.name}`;
        const {error: uploadError} = await db.storage.from("content").upload(path, file, {contentType: "application/pdf"});
        if(uploadError) throw uploadError;
        filePath = path;
      }

      try{
        await db.from("tests").insert({
          title,
          duration_minutes: dur,
          file_path: filePath,
          type: filePath ? "pdf" : "cbt",
          created_at: new Date().toISOString()
        });
        toast("Test created");
        renderAdminContent(body);
      }catch(e){
        toast(e?.message || "Create failed");
      }
    };

    await renderChaptersManage(body);
    await renderPdfsManage(body);
    await renderVideosManage(body);
    await renderTestsManage(body);

  }catch(e){
    body.innerHTML += `<div class="empty"><i class="fas fa-exclamation-circle" style="margin-bottom:8px;font-size:24px"></i><br>${escapeHtml(e?.message||"Error")}</div>`;
  }
}

async function loadChapterSelectForPdf(){
  const subjId = document.getElementById("pdfSubj").value;
  const sel = document.getElementById("pdfChap");
  if(!subjId){ sel.innerHTML = `<option value="">Select subject first</option>`; return; }
  const {data} = await db.from("chapters").select("*").eq("subject_id", subjId).order("sort_order");
  sel.innerHTML = (data||[]).map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join("") || `<option value="">No chapters</option>`;
}

async function loadChapterSelectForVideo(){
  const subjId = document.getElementById("vidSubj").value;
  const sel = document.getElementById("vidChap");
  if(!subjId){ sel.innerHTML = `<option value="">Select subject first</option>`; return; }
  const {data} = await db.from("chapters").select("*").eq("subject_id", subjId).order("sort_order");
  sel.innerHTML = (data||[]).map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join("") || `<option value="">No chapters</option>`;
}

async function renderChaptersManage(body){
  const list = document.getElementById("chapManageList");
  try{
    const {data} = await db.from("chapters").select("*, subjects(name)").order("sort_order");
    if(!data?.length){ list.innerHTML = `<div class="empty"><i class="fas fa-inbox" style="margin-bottom:8px;font-size:24px"></i><br>No chapters yet.</div>`; return; }
    list.innerHTML = "";
    data.forEach(ch => {
      const row = el(`<div class="card row">
        <div style="flex:1">
          <div style="font-weight:700;margin-bottom:4px"><i class="fas fa-folder" style="margin-right:8px;color:var(--accent)"></i>${escapeHtml(ch.name)}</div>
          <div style="color:var(--text-muted);font-size:13px"><i class="fas fa-book"></i> ${escapeHtml(ch.subjects?.name||"")}</div>
        </div>
        <button class="btn-small delChap"><i class="fas fa-trash" style="color:var(--danger)"></i> Delete</button>
      </div>`);
      row.querySelector(".delChap").onclick = async () => {
        const ok = await confirmAction("Delete Chapter", `Delete "${ch.name}"?\n\nAll PDFs + videos under it will be deleted permanently.`);
        if(!ok) return;
        try{
          const {data: pdfs} = await db.from("pdfs").select("file_path").eq("chapter_id", ch.id);
          if(pdfs?.length){
            const paths = pdfs.map(p => p.file_path).filter(Boolean);
            if(paths.length) await db.storage.from("content").remove(paths);
          }
          await db.from("pdfs").delete().eq("chapter_id", ch.id);
          await db.from("videos").delete().eq("chapter_id", ch.id);
          await db.from("chapters").delete().eq("id", ch.id);
          toast("Chapter deleted");
          renderChaptersManage(body);
        }catch(e){ toast(e?.message || "Delete failed"); }
      };
      list.appendChild(row);
    });
  }catch(e){
    list.innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle" style="margin-bottom:8px;font-size:24px"></i><br>${escapeHtml(e?.message||"Error")}</div>`;
  }
}

async function renderPdfsManage(body){
  const list = document.getElementById("pdfManageList");
  try{
    const {data} = await db.from("pdfs").select("*, chapters(name, subject_id), subjects(name)").order("created_at", {ascending:false});
    if(!data?.length){ list.innerHTML = `<div class="empty"><i class="fas fa-inbox" style="margin-bottom:8px;font-size:24px"></i><br>No PDFs yet.</div>`; return; }
    list.innerHTML = "";
    data.forEach(pdf => {
      const row = el(`<div class="card row">
        <div style="flex:1">
          <div style="font-weight:700;margin-bottom:4px"><i class="fas fa-file-pdf" style="margin-right:8px;color:var(--danger)"></i>${escapeHtml(pdf.title)}</div>
          <div style="color:var(--text-muted);font-size:13px"><i class="fas fa-folder"></i> ${escapeHtml(pdf.chapters?.name||"")} · ${escapeHtml(pdf.subjects?.name||"")}</div>
        </div>
        <button class="btn-small delPdf"><i class="fas fa-trash" style="color:var(--danger)"></i> Delete</button>
      </div>`);
      row.querySelector(".delPdf").onclick = async () => {
        const ok = await confirmAction("Delete PDF", `Delete "${pdf.title}" permanently?\n\nThis cannot be undone.`);
        if(!ok) return;
        try{
          if(pdf.file_path) await db.storage.from("content").remove([pdf.file_path]);
          await db.from("pdfs").delete().eq("id", pdf.id);
          toast("PDF deleted");
          renderPdfsManage(body);
        }catch(e){ toast(e?.message || "Delete failed"); }
      };
      list.appendChild(row);
    });
  }catch(e){
    list.innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle" style="margin-bottom:8px;font-size:24px"></i><br>${escapeHtml(e?.message||"Error")}</div>`;
  }
}

async function renderVideosManage(body){
  const list = document.getElementById("vidManageList");
  try{
    const {data} = await db.from("videos").select("*, chapters(name, subject_id), subjects(name)").order("sort_order");
    if(!data?.length){ list.innerHTML = `<div class="empty"><i class="fas fa-inbox" style="margin-bottom:8px;font-size:24px"></i><br>No videos yet.</div>`; return; }
    list.innerHTML = "";
    data.forEach(vid => {
      const row = el(`<div class="card row">
        <div style="flex:1">
          <div style="font-weight:700;margin-bottom:4px"><i class="fas fa-video" style="margin-right:8px;color:var(--accent)"></i>${escapeHtml(vid.title)}</div>
          <div style="color:var(--text-muted);font-size:13px"><i class="fas fa-folder"></i> ${escapeHtml(vid.chapters?.name||"")} · ${escapeHtml(vid.subjects?.name||"")}</div>
        </div>
        <button class="btn-small delVid"><i class="fas fa-trash" style="color:var(--danger)"></i> Delete</button>
      </div>`);
      row.querySelector(".delVid").onclick = async () => {
        const ok = await confirmAction("Delete Video", `Delete "${vid.title}" permanently?`);
        if(!ok) return;
        try{
          await db.from("videos").delete().eq("id", vid.id);
          toast("Video deleted");
          renderVideosManage(body);
        }catch(e){ toast(e?.message || "Delete failed"); }
      };
      list.appendChild(row);
    });
  }catch(e){
    list.innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle" style="margin-bottom:8px;font-size:24px"></i><br>${escapeHtml(e?.message||"Error")}</div>`;
  }
}

async function renderTestsManage(body){
  const list = document.getElementById("existingTestsList");
  try{
    const {data} = await db.from("tests").select("*").order("created_at", {ascending:false});
    if(!data?.length){ list.innerHTML = `<div class="empty"><i class="fas fa-inbox" style="margin-bottom:8px;font-size:24px"></i><br>No tests yet.</div>`; return; }
    list.innerHTML = "";
    data.forEach(test => {
      const row = el(`<div class="card row">
        <div style="flex:1">
          <div style="font-weight:700;margin-bottom:4px"><i class="fas fa-file-alt" style="margin-right:8px;color:var(--accent)"></i>${escapeHtml(test.title)}</div>
          <div style="color:var(--text-muted);font-size:13px"><i class="far fa-clock"></i> ${test.duration_minutes||60} min · ${test.type||"CBT"}</div>
        </div>
        <button class="btn-small delTest"><i class="fas fa-trash" style="color:var(--danger)"></i> Delete</button>
      </div>`);
      row.querySelector(".delTest").onclick = async () => {
        const ok = await confirmAction("Delete Test", `Delete "${test.title}" permanently?`);
        if(!ok) return;
        try{
          if(test.file_path) await db.storage.from("content").remove([test.file_path]);
          await db.from("tests").delete().eq("id", test.id);
          toast("Test deleted");
          renderTestsManage(body);
        }catch(e){ toast(e?.message || "Delete failed"); }
      };
      list.appendChild(row);
    });
  }catch(e){
    list.innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle" style="margin-bottom:8px;font-size:24px"></i><br>${escapeHtml(e?.message||"Error")}</div>`;
  }
}

async function renderAdminUsers(body){
  body.innerHTML = `<h3 style="margin-bottom:16px"><i class="fas fa-users" style="margin-right:10px;color:var(--accent)"></i>All Users</h3><div id="userList">${skelList(4)}</div>`;
  const list = document.getElementById("userList");
  try{
    const {data, error} = await db.from("profiles").select("*").order("created_at", {ascending:false});
    if(error) throw error;
    if(!data?.length){ list.innerHTML = `<div class="empty"><i class="fas fa-inbox" style="margin-bottom:8px;font-size:24px"></i><br>No users yet.</div>`; return; }
    list.innerHTML = "";
    data.forEach(u => {
      const row = el(`<div class="card row">
        <div style="flex:1">
          <div style="font-weight:700;margin-bottom:4px"><i class="fas fa-user" style="margin-right:8px;color:var(--accent)"></i>${escapeHtml(u.name||u.email||"")}</div>
          <div style="color:var(--text-muted);font-size:13px"><i class="fas fa-envelope"></i> ${escapeHtml(u.email||"")} · ${u.role||"student"} · ${u.status||"pending"}</div>
        </div>
        ${u.status !== "blocked" ? `<button class="btn-small blockUser"><i class="fas fa-ban" style="color:var(--danger)"></i> Block</button>` : `<button class="btn-small unblockUser"><i class="fas fa-check" style="color:var(--green)"></i> Unblock</button>`}
      </div>`);
      const blockBtn = row.querySelector(".blockUser");
      const unblockBtn = row.querySelector(".unblockUser");
      if(blockBtn) blockBtn.onclick = async () => {
        const ok = await confirmAction("Block User", `Block ${u.email}?`);
        if(!ok) return;
        try{
          await db.from("profiles").update({status:"blocked"}).eq("id", u.id);
          toast("User blocked");
          renderAdminUsers(body);
        }catch(e){ toast(e?.message||"Error"); }
      };
      if(unblockBtn) unblockBtn.onclick = async () => {
        try{
          await db.from("profiles").update({status:"active"}).eq("id", u.id);
          toast("User unblocked");
          renderAdminUsers(body);
        }catch(e){ toast(e?.message||"Error"); }
      };
      list.appendChild(row);
    });
  }catch(e){
    list.innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle" style="margin-bottom:8px;font-size:24px"></i><br>${escapeHtml(e?.message||"Error")}</div>`;
  }
}

initializeApp();
</script>
</body>
