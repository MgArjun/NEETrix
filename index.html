    /* ===================== TESTS ===================== */
    async function renderTests(c){
      c.innerHTML = `<h2>Tests</h2><div id="testList">${skelList(3)}</div>`;
      const list = document.getElementById("testList");
      try{
        const {data, error} = await db.from("tests").select("*").order("created_at", {ascending:false});
        if(error) throw error;
        if(!data?.length){ list.innerHTML = `<div class="empty">No tests yet.</div>`; return; }
        list.innerHTML = "";
        data.forEach(test => {
          const isCbt = test.type === "cbt" || !test.file_path;
          const row = el(`<div class="card row"><div><div style="font-weight:600">${escapeHtml(test.title)}</div><div class="muted">${test.duration_minutes || 60} min · ${isCbt ? "CBT Mode" : "PDF Paper"}</div></div><button class="btn">Start</button></div>`);
          row.querySelector("button").onclick = () => { if(isCbt) startCbtTest(test); else startPdfTest(test); };
          list.appendChild(row);
        });
      }catch(e){
        list.innerHTML = `<div class="empty">${escapeHtml(e?.message || "Error")}</div>`;
      }
    }
    async function startPdfTest(test){
      if(!test.file_path){ toast("No paper uploaded"); return; }
      try{
        const {data, error} = await db.storage.from("content").createSignedUrl(test.file_path, 7200);
        if(error) throw error;
        if(!data?.signedUrl) throw new Error("No link");
        if(!window.pdfjsLib) await loadPdfJs();
        if(!window.pdfjsLib){ toast("PDF viewer failed"); return; }
        const modal = el(`<div class="modal-bg"><div class="modal-box" style="max-width:920px"><div class="timer" id="tmr"></div><h3>${escapeHtml(test.title)}</h3><div style="overflow:auto;text-align:center"><canvas id="pc"></canvas></div><div class="zoom-row"><button id="zo">−</button><span id="zl">100%</span><button id="zi">+</button></div><button class="btn" style="width:100%;margin-top:14px" id="submitTest">Submit Test</button></div></div>`);
        document.body.appendChild(modal);
        let remaining = (Number(test.duration_minutes) || 60) * 60;
        const timerEl = document.getElementById("tmr");
        let timerRef = null;
        const finish = () => { if(timerRef) clearInterval(timerRef); modal.remove(); toast("Test submitted"); };
        const tick = () => { const m = Math.floor(remaining/60), s = remaining % 60; timerEl.textContent = `${m}:${s<10?"0":""}${s} remaining`; if(remaining <= 0){ finish(); return; } remaining--; };
        tick();
        timerRef = setInterval(tick, 1000);
        document.getElementById("submitTest").onclick = () => { if(confirm("Submit now?")) finish(); };
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
        let scale = 1.2;
        const pdfDoc = await pdfjsLib.getDocument({url: data.signedUrl, withCredentials:false}).promise;
        const page = await pdfDoc.getPage(1);
        const render = async () => {
          const vp = page.getViewport({scale});
          const canvas = document.getElementById("pc");
          if(!canvas) return;
          canvas.width = vp.width;
          canvas.height = vp.height;
          await page.render({canvasContext: canvas.getContext("2d"), viewport: vp}).promise;
          const zl = document.getElementById("zl");
          if(zl) zl.textContent = Math.round(scale / 1.2 * 100) + "%";
        };
        await render();
        document.getElementById("zi").onclick = () => { scale += 0.3; render().catch(console.error); };
        document.getElementById("zo").onclick = () => { scale = Math.max(0.5, scale - 0.3); render().catch(console.error); };
      }catch(e){
        toast(e?.message || "Unable to start");
      }
    }
    async function startCbtTest(test){
      try{
        const isAdmin = profile?.role === "admin";
        const cols = isAdmin ? "*" : "id, question_text, option_a, option_b, option_c, option_d, sort_order, question_image";
        const {data, error} = await db.from("test_questions").select(cols).eq("test_id", test.id).order("sort_order");
        if(error) throw error;
        if(!data?.length){ toast("No questions for this CBT yet."); return; }
        cbtTest = test;
        cbtQuestions = data;
        cbtAnswers = {};
        cbtMarked = new Set();
        cbtBookmarks = new Set();
        cbtIndex = 0;
        cbtRemaining = (Number(test.duration_minutes) || 60) * 60;
        if(cbtTimerRef) clearInterval(cbtTimerRef);
        cbtTimerRef = setInterval(() => {
          cbtRemaining--;
          const tEl = document.getElementById("cbtTimer");
          if(tEl){ const m = Math.floor(cbtRemaining/60), s = cbtRemaining % 60; tEl.textContent = `${m}:${s<10?"0":""}${s}`; }
          if(cbtRemaining <= 0){ clearInterval(cbtTimerRef); cbtTimerRef = null; finishCbt(true); }
        }, 1000);
        renderCbtUI();
      }catch(e){
        toast(e?.message || "Unable to start CBT");
      }
    }
    function renderCbtUI(){
      const c = document.getElementById("content");
      if(!c || !cbtQuestions.length) return;
      const q = cbtQuestions[cbtIndex];
      const selected = cbtAnswers[q.id] || null;
      const imgHtml = q.question_image ? `<img class="q-img" src="${escapeHtml(q.question_image)}" alt="Question image"/>` : "";
      c.innerHTML = `<div class="timer" id="cbtTimer">${Math.floor(cbtRemaining/60)}:${(cbtRemaining%60)<10?"0":""}${cbtRemaining%60}</div><div class="cbt-layout"><div class="cbt-qbox"><div class="muted" style="margin-bottom:8px">Question ${cbtIndex+1} of ${cbtQuestions.length}</div><div style="font-size:15.5px;line-height:1.55;margin-bottom:12px">${escapeHtml(q.question_text)}</div>${imgHtml}<button class="cbt-opt ${selected==="A"?"selected":""}" data-o="A">A. ${escapeHtml(q.option_a)}</button><button class="cbt-opt ${selected==="B"?"selected":""}" data-o="B">B. ${escapeHtml(q.option_b)}</button><button class="cbt-opt ${selected==="C"?"selected":""}" data-o="C">C. ${escapeHtml(q.option_c)}</button><button class="cbt-opt ${selected==="D"?"selected":""}" data-o="D">D. ${escapeHtml(q.option_d)}</button><div class="cbt-nav"><button class="btn-outline" id="cbtPrev" ${cbtIndex===0?"disabled":""}>← Previous</button><button class="btn-outline" id="cbtMark">${cbtMarked.has(q.id)?"Unmark":"Mark for Review"}</button><button class="btn-outline" id="cbtBm">${cbtBookmarks.has(q.id)?"★ Bookmarked":"☆ Bookmark"}</button><button class="btn" id="cbtNext">${cbtIndex===cbtQuestions.length-1?"Review":"Next →"}</button></div><button class="btn-danger" style="width:100%;margin-top:14px" id="cbtSubmit">Submit Test</button></div><div class="cbt-palette"><div style="font-weight:600;font-size:13px">Question Palette</div><div class="cbt-palette-grid" id="palette"></div><div class="cbt-legend"><span><div class="cbt-dot" style="background:rgba(79,140,255,.35);border:1px solid var(--accent)"></div> Answered</span><span><div class="cbt-dot" style="background:rgba(245,158,11,.35);border:1px solid var(--warn)"></div> Marked</span><span><div class="cbt-dot" style="background:var(--panel2);border:1px solid var(--border)"></div> Not visited</span></div></div></div>`;
      c.querySelectorAll(".cbt-opt").forEach(btn => { btn.onclick = () => { cbtAnswers[q.id] = btn.dataset.o; renderCbtUI(); }; });
      document.getElementById("cbtPrev").onclick = () => { if(cbtIndex > 0){ cbtIndex--; renderCbtUI(); } };
      document.getElementById("cbtNext").onclick = () => { if(cbtIndex < cbtQuestions.length-1){ cbtIndex++; renderCbtUI(); } };
      document.getElementById("cbtMark").onclick = () => { if(cbtMarked.has(q.id)) cbtMarked.delete(q.id); else cbtMarked.add(q.id); renderCbtUI(); };
      document.getElementById("cbtBm").onclick = () => { if(cbtBookmarks.has(q.id)) cbtBookmarks.delete(q.id); else cbtBookmarks.add(q.id); renderCbtUI(); };
      document.getElementById("cbtSubmit").onclick = async () => { if(await confirmAction("Submit Test", "Submit test? Answers cannot be changed.")) finishCbt(false); };
      const palette = document.getElementById("palette");
      cbtQuestions.forEach((qq, i) => {
        const btn = el(`<button class="cbt-pbtn">${i+1}</button>`);
        if(cbtAnswers[qq.id]) btn.classList.add("answered");
        if(cbtMarked.has(qq.id)) btn.classList.add("marked");
        if(i === cbtIndex) btn.classList.add("current");
        btn.onclick = () => { cbtIndex = i; renderCbtUI(); };
        palette.appendChild(btn);
      });
    }
    async function finishCbt(auto){
      if(cbtTimerRef){ clearInterval(cbtTimerRef); cbtTimerRef = null; }
      const c = document.getElementById("content");
      c.innerHTML = `<div class="card score-card"><div class="muted">Calculating score...</div></div>`;
      let score = 0, total = cbtQuestions.length * 4, correct = 0, wrong = 0, unattempted = 0;
      let reviewQs = [];
      try{
        const {data: fullQs} = await db.from("test_questions").select("id, question_text, option_a, option_b, option_c, option_d, correct_option, sort_order").eq("test_id", cbtTest.id).order("sort_order");
        if(fullQs?.length) cbtQuestions = fullQs;
      }catch(e){}
      cbtQuestions.forEach(q => {
        const ans = cbtAnswers[q.id] || null;
        const corr = (q.correct_option || "").toUpperCase();
        let status = "unattempted";
        if(!ans) unattempted++;
        else if(corr && ans === corr){ correct++; status = "correct"; }
        else { wrong++; status = "wrong"; }
        reviewQs.push({id: q.id, question_text: q.question_text, option_a: q.option_a, option_b: q.option_b, option_c: q.option_c, option_d: q.option_d, correct_option: corr || null, user_answer: ans, status});
      });
      score = (correct * 4) + (wrong * -1);
      total = cbtQuestions.length * 4;
      try{
        const answersPayload = {};
        Object.keys(cbtAnswers).forEach(id => { answersPayload[id] = cbtAnswers[id]; });
        const {data, error} = await db.rpc("score_cbt_test", {p_test_id: cbtTest.id, p_answers: answersPayload});
        if(!error && data){ score = data.score ?? score; total = data.total ?? total; correct = data.correct ?? correct; wrong = data.wrong ?? wrong; unattempted = data.unattempted ?? unattempted; }
      }catch(e){}
      const lastScoreData = {score, total, correct, wrong, unattempted, title: cbtTest?.title, at: Date.now(), review: reviewQs};
      saveLastScore(lastScoreData);
      showScoreAndReview(c, lastScoreData, auto);
    }
    function showScoreAndReview(c, data, auto){
      const den = (data.correct||0) + (data.wrong||0) + (data.unattempted||0);
      const accuracy = den ? Math.round(((data.correct||0) / den) * 100) : 0;
      c.innerHTML = `<div class="card score-card"><div class="muted" style="margin-bottom:6px">${auto ? "Time's up!" : "Test Submitted"}</div><h2 style="margin-bottom:4px">${escapeHtml(data.title || "Test")}</h2><div class="score-num">${data.score}</div><div class="muted" style="margin-bottom:18px">out of ${data.total}</div><div class="grid2" style="max-width:360px;margin:0 auto 20px;text-align:left"><div class="card" style="margin:0"><div class="muted">Correct</div><div style="font-weight:700;color:var(--green)">${data.correct||0}</div></div><div class="card" style="margin:0"><div class="muted">Wrong</div><div style="font-weight:700;color:var(--danger)">${data.wrong||0}</div></div><div class="card" style="margin:0"><div class="muted">Unattempted</div><div style="font-weight:700">${data.unattempted||0}</div></div><div class="card" style="margin:0"><div class="muted">Accuracy</div><div style="font-weight:700">${accuracy}%</div></div></div><button class="btn" style="width:100%;margin-bottom:10px" id="viewReview">Question-wise Review</button><button class="btn-outline" style="width:100%" id="backTests">Back to Tests</button></div>`;
      document.getElementById("backTests").onclick = () => { cbtTest = null; cbtQuestions = []; cbtAnswers = {}; renderTests(c); };
      document.getElementById("viewReview").onclick = () => renderQuestionReview(c, data);
    }
    function renderQuestionReview(c, data){
      if(!data.review || !data.review.length){
        c.innerHTML = `<div class="empty">Review data not available.</div><button class="btn" id="backScore">Back</button>`;
        document.getElementById("backScore").onclick = () => showScoreAndReview(c, data, false);
        return;
      }
      let html = `<button class="back" id="backScore">Score Summary</button><h2>${escapeHtml(data.title || "Review")}</h2><div class="muted" style="margin-bottom:16px">${data.correct||0} correct · ${data.wrong||0} wrong · ${data.unattempted||0} skipped</div>`;
      data.review.forEach((q, i) => {
        const statusColor = q.status === "correct" ? "var(--green)" : q.status === "wrong" ? "var(--danger)" : "var(--muted)";
        const statusText = q.status === "correct" ? "Correct" : q.status === "wrong" ? "Wrong" : "Not Attempted";
        const optHtml = (letter, text) => {
          let extra = "";
          if(q.user_answer === letter) extra += ` <span style="color:var(--accent);font-weight:600">(Your answer)</span>`;
          if(q.correct_option === letter) extra += ` <span style="color:var(--green);font-weight:600">(Correct)</span>`;
          let bg = "var(--panel2)";
          if(q.correct_option === letter) bg = "rgba(34,211,163,.12)";
          else if(q.user_answer === letter && q.status === "wrong") bg = "rgba(239,68,68,.12)";
          return `<div style="padding:10px 12px;margin:6px 0;border-radius:8px;border:1px solid var(--border);background:${bg}"><b>${letter}.</b> ${escapeHtml(text||"")}${extra}</div>`;
        };
        html += `<div class="card" style="margin-bottom:14px"><div class="row" style="margin-bottom:8px"><div style="font-weight:600">Q${i+1}</div><div style="color:${statusColor};font-weight:600;font-size:13px">${statusText}</div></div><div style="line-height:1.5;margin-bottom:10px">${escapeHtml(q.question_text)}</div>${optHtml("A", q.option_a)}${optHtml("B", q.option_b)}${optHtml("C", q.option_c)}${optHtml("D", q.option_d)}</div>`;
      });
      html += `<button class="btn" style="width:100%;margin-top:10px" id="backTests2">Back to Tests</button>`;
      c.innerHTML = html;
      document.getElementById("backScore").onclick = () => showScoreAndReview(c, data, false);
      document.getElementById("backTests2").onclick = () => { cbtTest = null; cbtQuestions = []; cbtAnswers = {}; renderTests(c); };
    }

    /* ===================== ADMIN (Complete) ===================== */
    async function renderAdmin(c){
      c.innerHTML = `<h2>Admin</h2><div class="tabs2"><button class="tab2 ${adminTab==="dashboard"?"active":""}" data-a="dashboard">Dashboard</button><button class="tab2 ${adminTab==="subjects"?"active":""}" data-a="subjects">Subjects</button><button class="tab2 ${adminTab==="content"?"active":""}" data-a="content">Content</button><button class="tab2 ${adminTab==="users"?"active":""}" data-a="users">Users</button><button class="tab2 ${adminTab==="cbt"?"active":""}" data-a="cbt">CBT Questions</button><button class="tab2 ${adminTab==="logins"?"active":""}" data-a="logins">Logins</button></div><div id="adminBody"></div>`;
      c.querySelectorAll(".tab2").forEach(b => { b.onclick = () => { adminTab = b.dataset.a; renderAdmin(c); }; });
      const body = document.getElementById("adminBody");
      if(adminTab === "dashboard") await renderAdminDashboard(body);
      else if(adminTab === "subjects") await renderAdminSubjects(body);
      else if(adminTab === "content") await renderAdminContent(body);
      else if(adminTab === "users") await renderAdminUsers(body);
      else if(adminTab === "cbt") await renderAdminCbt(body);
      else if(adminTab === "logins") await renderAdminLogins(body);
    }
    async function renderAdminDashboard(body){
      body.innerHTML = `<div class="grid2" id="dashStats">${skelList(6,"skel-card")}</div><h3 style="margin-top:24px">Quick Actions</h3><div class="row-wrap" style="gap:10px"><button class="btn" id="goSubjects">Manage Subjects</button><button class="btn-outline" id="goContent">Content Manager</button><button class="btn-outline" id="goUsers">Users</button></div>`;
      try{
        const [subjects, chapters, pdfs, videos, tests, users] = await Promise.all([
          db.from("subjects").select("id", {count:"exact", head:true}),
          db.from("chapters").select("id", {count:"exact", head:true}),
          db.from("pdfs").select("id", {count:"exact", head:true}),
          db.from("videos").select("id", {count:"exact", head:true}),
          db.from("tests").select("id", {count:"exact", head:true}),
          db.from("profiles").select("id", {count:"exact", head:true})
        ]);
        const stats = [
          {label:"Subjects", value: subjects.count||0},
          {label:"Chapters", value: chapters.count||0},
          {label:"PDFs", value: pdfs.count||0},
          {label:"Videos", value: videos.count||0},
          {label:"Tests", value: tests.count||0},
          {label:"Users", value: users.count||0}
        ];
        document.getElementById("dashStats").innerHTML = stats.map(s => `<div class="card" style="text-align:center;margin:0"><div class="muted">${s.label}</div><div style="font-size:28px;font-weight:700;margin-top:6px">${s.value}</div></div>`).join("");
      }catch(e){
        document.getElementById("dashStats").innerHTML = `<div class="empty">${escapeHtml(e?.message||"Error")}</div>`;
      }
      document.getElementById("goSubjects").onclick = () => { adminTab = "subjects"; renderAdmin(document.getElementById("content")); };
      document.getElementById("goContent").onclick = () => { adminTab = "content"; renderAdmin(document.getElementById("content")); };
      document.getElementById("goUsers").onclick = () => { adminTab = "users"; renderAdmin(document.getElementById("content")); };
    }
    async function renderAdminSubjects(body){
      body.innerHTML = `<div class="card"><h3 style="margin-top:0">Add Subject</h3><input id="newSubj" placeholder="Subject name"/><button class="btn" id="addSubj">Add Subject</button></div><h3>All Subjects</h3><div id="subjManageList">${skelList(4)}</div>`;
      document.getElementById("addSubj").onclick = async () => {
        const name = document.getElementById("newSubj").value.trim();
        if(!name) return toast("Enter subject name");
        try{
          const {data: existing} = await db.from("subjects").select("sort_order").order("sort_order",{ascending:false}).limit(1);
          const nextOrder = (existing?.?.sort_order || 0) + 1;
          await db.from("subjects").insert({name, sort_order: nextOrder});
          toast("Subject added");
          renderAdminSubjects(body);
        }catch(e){ toast(e?.message || "Error"); }
      };
      try{
        const {data, error} = await db.from("subjects").select("*").order("sort_order");
        if(error) throw error;
        const list = document.getElementById("subjManageList");
        if(!data?.length){ list.innerHTML = `<div class="empty">No subjects yet.</div>`; return; }
        list.innerHTML = "";
        for(let i=0; i<data.length; i++){
          const s = data[i];
          const {count: chapCount} = await db.from("chapters").select("id", {count:"exact", head:true}).eq("subject_id", s.id);
          const row = el(`<div class="card"><div class="row"><div style="flex:1"><div style="font-weight:600">${escapeHtml(s.name)}</div><div class="muted">${chapCount||0} chapters</div></div><div class="row-wrap"><button class="btn-small upS" ${i===0?"disabled":""}>↑</button><button class="btn-small downS" ${i===data.length-1?"disabled":""}>↓</button><button class="btn-small editS">Rename</button><button class="btn-danger delS">Delete</button></div></div></div>`);
          row.querySelector(".upS").onclick = async () => {
            if(i===0) return;
            const prev = data[i-1];
            try{
              await db.from("subjects").update({sort_order: prev.sort_order}).eq("id", s.id);
              await db.from("subjects").update({sort_order: s.sort_order}).eq("id", prev.id);
              toast("Moved up");
              renderAdminSubjects(body);
            }catch(e){ toast(e?.message||"Error"); }
          };
          row.querySelector(".downS").onclick = async () => {
            if(i===data.length-1) return;
            const next = data[i+1];
            try{
              await db.from("subjects").update({sort_order: next.sort_order}).eq("id", s.id);
              await db.from("subjects").update({sort_order: s.sort_order}).eq("id", next.id);
              toast("Moved down");
              renderAdminSubjects(body);
            }catch(e){ toast(e?.message||"Error"); }
          };
          row.querySelector(".editS").onclick = async () => {
            const newName = prompt("New subject name:", s.name);
            if(newName === null || !newName.trim()) return;
            try{
              await db.from("subjects").update({name: newName.trim()}).eq("id", s.id);
              toast("Subject renamed");
              renderAdminSubjects(body);
            }catch(e){ toast(e?.message || "Error"); }
          };
          row.querySelector(".delS").onclick = async () => {
            const ok = await confirmAction("Delete Subject", `Delete "${s.name}"?\n\nThis subject has ${chapCount||0} chapters.\nAll chapters + PDFs + videos under it will be deleted.`);
            if(!ok) return;
            try{
              const {data: chs} = await db.from("chapters").select("id").eq("subject_id", s.id);
              if(chs?.length){
                for(const ch of chs){
                  const {data: pdfs} = await db.from("pdfs").select("file_path").eq("chapter_id", ch.id);
                  if(pdfs?.length){ const paths = pdfs.map(p => p.file_path).filter(Boolean); if(paths.length) await db.storage.from("content").remove(paths); }
                  await db.from("pdfs").delete().eq("chapter_id", ch.id);
                  await db.from("videos").delete().eq("chapter_id", ch.id);
                }
                await db.from("chapters").delete().eq("subject_id", s.id);
              }
              await db.from("subjects").delete().eq("id", s.id);
              toast("Subject deleted");
              renderAdminSubjects(body);
            }catch(e){ toast(e?.message || "Delete failed"); }
          };
          list.appendChild(row);
        }
      }catch(e){
        document.getElementById("subjManageList").innerHTML = `<div class="empty">${escapeHtml(e?.message||"Error")}</div>`;
      }
    }
    async function renderAdminContent(body){
      body.innerHTML = `<div class="card"><h3 style="margin-top:0">Add Chapter</h3><select id="chSubj"></select><input id="newChap" placeholder="Chapter name"/><button class="btn" id="addChap">Add Chapter</button></div><div class="card"><h3>Add Video</h3><select id="vidSubj"></select><select id="vidChap"></select><input id="vidTitle" placeholder="Video title"/><input id="vidUrl" placeholder="YouTube link"/><button class="btn" id="addVid">Add Video</button></div><div class="card"><h3>Add PDF</h3><select id="pdfSubj"></select><select id="pdfChap"></select><select id="pdfCat"><option value="general">Practice</option><option value="ncert">Important</option><option value="pyq">PYQs</option></select><input id="pdfTitle" placeholder="PDF title"/><input type="file" id="pdfFile" accept="application/pdf"/><button class="btn" id="addPdf">Upload PDF</button></div><div class="card"><h3>Add Test</h3><input id="testTitle" placeholder="Test title"/><input id="testDur" type="number" value="60" placeholder="Duration (min)"/><input type="file" id="testFile" accept="application/pdf"/><div class="muted" style="margin-bottom:8px">Leave file empty = CBT test</div><button class="btn" id="addTest">Create Test</button></div><h3 style="margin-top:28px">Manage Chapters</h3><div id="chapManageList">${skelList(3)}</div><h3 style="margin-top:28px">Manage PDFs</h3><div id="pdfManageList">${skelList(3)}</div><h3 style="margin-top:28px">Manage Videos</h3><div id="vidManageList">${skelList(3)}</div><h3 style="margin-top:28px">Existing Tests</h3><div id="existingTestsList">${skelList(2)}</div>`;
      try{
        const {data: subjects} = await db.from("subjects").select("*").order("sort_order");
        const opts = (subjects||[]).map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join("") || `<option value="">No subjects</option>`;
        ["chSubj","vidSubj","pdfSubj"].forEach(id => { const sel = document.getElementById(id); if(sel) sel.innerHTML = opts; });
        const loadChapters = async (subId, chapId) => {
          const subSel = document.getElementById(subId);
          const chapSel = document.getElementById(chapId);
          if(!subSel || !chapSel) return;
          const sid = subSel.value;
          if(!sid){ chapSel.innerHTML = `<option value="">No chapters</option>`; return; }
          const {data: chs} = await db.from("chapters").select("*").eq("subject_id", sid).order("sort_order");
          chapSel.innerHTML = (chs||[]).map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join("") || `<option value="">No chapters</option>`;
        };
        if(subjects?.length){ await loadChapters("vidSubj","vidChap"); await loadChapters("pdfSubj","pdfChap"); }
        document.getElementById("vidSubj").onchange = () => loadChapters("vidSubj","vidChap");
        document.getElementById("pdfSubj").onchange = () => loadChapters("pdfSubj","pdfChap");
        document.getElementById("addChap").onclick = async () => {
          const subject_id = document.getElementById("chSubj").value;
          const name = document.getElementById("newChap").value.trim();
          if(!subject_id || !name) return toast("Select subject and enter name");
          try{
            const {data: existing} = await db.from("chapters").select("sort_order").eq("subject_id", subject_id).order("sort_order",{ascending:false}).limit(1);
            const nextOrder = (existing?.?.sort_order || 0) + 1;
            await db.from("chapters").insert({subject_id, name, sort_order: nextOrder});
            toast("Chapter added");
            renderAdminContent(body);
          }catch(e){ toast(e?.message || "Error"); }
        };
        document.getElementById("addVid").onclick = async () => {
          const title = document.getElementById("vidTitle").value.trim();
          const url = document.getElementById("vidUrl").value.trim();
          const youtubeId = ytId(url);
          const chapter_id = document.getElementById("vidChap").value;
          if(!title || !youtubeId || !chapter_id) return toast("Fill all fields + valid YouTube link");
          try{ await db.from("videos").insert({chapter_id, title, youtube_id: youtubeId}); toast("Video added"); renderAdminContent(body); }catch(e){ toast(e?.message || "Error"); }
        };
        document.getElementById("addPdf").onclick = async () => {
          const category = document.getElementById("pdfCat").value;
          const title = document.getElementById("pdfTitle").value.trim();
          const file = document.getElementById("pdfFile").files;
          const chapter_id = document.getElementById("pdfChap").value;
          if(!title || !file || !chapter_id) return toast("Fill title, select chapter and choose PDF");
          if(file.type !== "application/pdf") return toast("PDF only");
          try{
            const path = `pdfs/${crypto.randomUUID()}_${file.name}`;
            const {error: upErr} = await db.storage.from("content").upload(path, file, {cacheControl:"3600", upsert:false});
            if(upErr) throw upErr;
            const {error: insErr} = await db.from("pdfs").insert({chapter_id, category, title, file_path: path});
            if(insErr){ try{ await db.storage.from("content").remove([path]); }catch(e){} throw insErr; }
            toast("PDF uploaded");
            renderAdminContent(body);
          }catch(e){ toast(e?.message || "Upload failed"); }
        };
        document.getElementById("addTest").onclick = async () => {
          const title = document.getElementById("testTitle").value.trim();
          const duration_minutes = parseInt(document.getElementById("testDur").value) || 60;
          const file = document.getElementById("testFile").files;
          if(!title) return toast("Enter title");
          try{
            let file_path = null, type = "cbt";
            if(file){
              if(file.type !== "application/pdf") return toast("PDF only");
              file_path = `tests/${crypto.randomUUID()}_${file.name}`;
              type = "pdf";
              const {error: upErr} = await db.storage.from("content").upload(file_path, file, {cacheControl:"3600", upsert:false});
              if(upErr) throw upErr;
            }
            const payload = {title, duration_minutes, file_path};
            try{ const {error} = await db.from("tests").insert({...payload, type}); if(error) throw error; }catch(e){ const {error} = await db.from("tests").insert(payload); if(error){ if(file_path) try{ await db.storage.from("content").remove([file_path]); }catch(x){} throw error; } }
            toast("Test created");
            renderAdminContent(body);
          }catch(e){ toast(e?.message || "Error"); }
        };
        const chapList = document.getElementById("chapManageList");
        const {data: allChaps} = await db.from("chapters").select("*, subjects(name)").order("sort_order");
        if(!allChaps?.length) chapList.innerHTML = `<div class="empty">No chapters</div>`;
        else {
          chapList.innerHTML = "";
          for(const ch of allChaps){
            const {count: pdfCount} = await db.from("pdfs").select("id",{count:"exact",head:true}).eq("chapter_id", ch.id);
            const {count: vidCount} = await db.from("videos").select("id",{count:"exact",head:true}).eq("chapter_id", ch.id);
            const row = el(`<div class="card"><div class="row"><div style="flex:1"><div style="font-weight:600">${escapeHtml(ch.name)}</div><div class="muted">${escapeHtml(ch.subjects?.name||"")} · ${pdfCount||0} PDFs · ${vidCount||0} Videos</div></div><div class="row-wrap"><button class="btn-small renChap">Rename</button><button class="btn-danger delChap">Delete</button></div></div></div>`);
            row.querySelector(".renChap").onclick = async () => { const nn = prompt("New chapter name:", ch.name); if(nn === null || !nn.trim()) return; try{ await db.from("chapters").update({name: nn.trim()}).eq("id", ch.id); toast("Chapter renamed"); renderAdminContent(body); }catch(e){ toast(e?.message||"Error"); } };
            row.querySelector(".delChap").onclick = async () => { const ok = await confirmAction("Delete Chapter", `Delete "${ch.name}"?\n\nContains:\n• ${pdfCount||0} PDFs\n• ${vidCount||0} Videos\n\nAll content will be deleted.`); if(!ok) return; try{ const {data: pdfs} = await db.from("pdfs").select("file_path").eq("chapter_id", ch.id); if(pdfs?.length){ const paths = pdfs.map(p => p.file_path).filter(Boolean); if(paths.length) await db.storage.from("content").remove(paths); } await db.from("pdfs").delete().eq("chapter_id", ch.id); await db.from("videos").delete().eq("chapter_id", ch.id); await db.from("chapters").delete().eq("id", ch.id); toast("Chapter deleted"); renderAdminContent(body); }catch(e){ toast(e?.message||"Delete failed"); } };
            chapList.appendChild(row);
          }
        }
        const pdfList = document.getElementById("pdfManageList");
        const {data: allPdfs} = await db.from("pdfs").select("*, chapters(name, subject_id, subjects(name))").order("created_at",{ascending:false}).limit(150);
        if(!allPdfs?.length) pdfList.innerHTML = `<div class="empty">No PDFs</div>`;
        else {
          pdfList.innerHTML = "";
          allPdfs.forEach(pdf => {
            const row = el(`<div class="card"><div class="row"><div style="flex:1"><div style="font-weight:600">${escapeHtml(pdf.title)}</div><div class="muted">${escapeHtml(pdf.chapters?.subjects?.name||"")} → ${escapeHtml(pdf.chapters?.name||"")} · ${pdf.category}</div></div><div class="row-wrap"><button class="btn-small renPdf">Rename</button><button class="btn-small movPdf">Move</button><button class="btn-small repPdf">Replace</button><button class="btn-danger delPdf">Delete</button></div></div></div>`);
            row.querySelector(".renPdf").onclick = async () => { const nn = prompt("New PDF title:", pdf.title); if(nn === null || !nn.trim()) return; try{ await db.from("pdfs").update({title: nn.trim()}).eq("id", pdf.id); toast("PDF renamed"); renderAdminContent(body); }catch(e){ toast(e?.message||"Error"); } };
            row.querySelector(".movPdf").onclick = async () => { const {data: chs} = await db.from("chapters").select("id, name, subjects(name)").order("name"); if(!chs?.length) return toast("No chapters"); const modal = el(`<div class="modal-bg"><div class="modal-box" style="max-width:480px"><h3 style="margin-bottom:12px">Move PDF</h3><div class="muted" style="margin-bottom:10px">${escapeHtml(pdf.title)}</div><select id="moveChapSel" style="margin-bottom:14px">${chs.map(c => `<option value="${c.id}">${escapeHtml(c.subjects?.name||"")} → ${escapeHtml(c.name)}</option>`).join("")}</select><div style="display:flex;gap:10px"><button class="btn-outline" style="flex:1" id="moveCancel">Cancel</button><button class="btn" style="flex:1" id="moveConfirm">Move</button></div></div></div>`); document.body.appendChild(modal); document.getElementById("moveCancel").onclick = () => modal.remove(); document.getElementById("moveConfirm").onclick = async () => { const newChap = document.getElementById("moveChapSel").value; try{ await db.from("pdfs").update({chapter_id: newChap}).eq("id", pdf.id); toast("PDF moved"); modal.remove(); renderAdminContent(body); }catch(e){ toast(e?.message||"Error"); } }; };
            row.querySelector(".repPdf").onclick = async () => { const input = document.createElement("input"); input.type = "file"; input.accept = "application/pdf"; input.onchange = async () => { const file = input.files; if(!file) return; if(file.type !== "application/pdf") return toast("PDF only"); try{ const path = `pdfs/${crypto.randomUUID()}_${file.name}`; const {error: upErr} = await db.storage.from("content").upload(path, file, {cacheControl:"3600", upsert:false}); if(upErr) throw upErr; if(pdf.file_path) try{ await db.storage.from("content").remove([pdf.file_path]); }catch(e){} await db.from("pdfs").update({file_path: path}).eq("id", pdf.id); toast("PDF replaced successfully"); renderAdminContent(body); }catch(e){ toast(e?.message||"Replace failed"); } }; input.click(); };
            row.querySelector(".delPdf").onclick = async () => { const ok = await confirmAction("Delete PDF", `Delete "${pdf.title}"?\n\nFile will also be removed from storage.`); if(!ok) return; try{ if(pdf.file_path) await db.storage.from("content").remove([pdf.file_path]); await db.from("pdfs").delete().eq("id", pdf.id); toast("PDF deleted"); renderAdminContent(body); }catch(e){ toast(e?.message||"Delete failed"); } };
            pdfList.appendChild(row);
          });
        }
        const vidList = document.getElementById("vidManageList");
        const {data: allVids} = await db.from("videos").select("*, chapters(name, subjects(name))").order("created_at",{ascending:false}).limit(100);
        if(!allVids?.length) vidList.innerHTML = `<div class="empty">No videos</div>`;
        else {
          vidList.innerHTML = "";
          allVids.forEach(v => {
            const row = el(`<div class="card"><div class="row"><div style="flex:1"><div style="font-weight:600">${escapeHtml(v.title)}</div><div class="muted">${escapeHtml(v.chapters?.subjects?.name||"")} → ${escapeHtml(v.chapters?.name||"")}</div></div><div class="row-wrap"><button class="btn-small renVid">Rename</button><button class="btn-danger delVid">Delete</button></div></div></div>`);
            row.querySelector(".renVid").onclick = async () => { const nn = prompt("New video title:", v.title); if(nn === null || !nn.trim()) return; try{ await db.from("videos").update({title: nn.trim()}).eq("id", v.id); toast("Video renamed"); renderAdminContent(body); }catch(e){ toast(e?.message||"Error"); } };
            row.querySelector(".delVid").onclick = async () => { const ok = await confirmAction("Delete Video", `Delete "${v.title}"?`); if(!ok) return; try{ await db.from("videos").delete().eq("id", v.id); toast("Video deleted"); renderAdminContent(body); }catch(e){ toast(e?.message||"Error"); } };
            vidList.appendChild(row);
          });
        }
        const loadExistingTests = async () => {
          const list = document.getElementById("existingTestsList");
          try{
            const {data, error} = await db.from("tests").select("*").order("created_at",{ascending:false});
            if(error) throw error;
            if(!data?.length){ list.innerHTML = `<div class="empty">No tests yet.</div>`; return; }
            list.innerHTML = "";
            data.forEach(t => {
              const typeLabel = (t.type === "cbt" || !t.file_path) ? "CBT" : "PDF";
              const row = el(`<div class="card" style="margin-bottom:10px"><div class="row"><div style="flex:1"><div style="font-weight:600">${escapeHtml(t.title)}</div><div class="muted">${t.duration_minutes||60} min · ${typeLabel}</div></div><div class="row-wrap"><button class="btn-small editT">Edit</button><button class="btn-danger delT">Delete</button></div></div></div>`);
              row.querySelector(".editT").onclick = () => { const newTitle = prompt("New title:", t.title); if(newTitle === null) return; const newDur = prompt("Duration (minutes):", String(t.duration_minutes||60)); if(newDur === null) return; (async () => { try{ await db.from("tests").update({title: (newTitle.trim() || t.title), duration_minutes: parseInt(newDur) || 60}).eq("id", t.id); toast("Updated"); loadExistingTests(); }catch(e){ toast(e?.message||"Update failed"); } })(); };
              row.querySelector(".delT").onclick = async () => { const ok = await confirmAction("Delete Test", `Delete test "${t.title}"?\nAll its questions will also be deleted.`); if(!ok) return; try{ await db.from("test_questions").delete().eq("test_id", t.id); await db.from("tests").delete().eq("id", t.id); if(t.file_path) try{ await db.storage.from("content").remove([t.file_path]); }catch(e){} toast("Test deleted"); loadExistingTests(); }catch(e){ toast(e?.message||"Delete failed"); } };
              list.appendChild(row);
            });
          }catch(e){ list.innerHTML = `<div class="empty">${escapeHtml(e?.message||"Error")}</div>`; }
        };
        loadExistingTests();
      }catch(e){ body.innerHTML += `<div class="empty">${escapeHtml(e?.message||"Error")}</div>`; }
    }
    async function renderAdminUsers(body){
      try{
        const {data, error} = await db.from("profiles").select("*").order("created_at",{ascending:false});
        if(error) throw error;
        if(!data?.length){ body.innerHTML = `<div class="empty">No users yet.</div>`; return; }
        body.innerHTML = `<table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody id="uRows"></tbody></table>`;
        const rows = document.getElementById("uRows");
        rows.innerHTML = "";
        data.forEach(p => {
          const tr = el(`<tr><td>${escapeHtml(p.email||"")}</td><td>${escapeHtml(p.role||"user")}</td><td>${escapeHtml(p.status||"pending")}</td><td class="row-wrap"><button class="btn-small">Activate</button><button class="btn-small">Pause</button><button class="btn-small">Block</button></td></tr>`);
          rows.appendChild(tr);
        });
      }catch(e){ body.innerHTML = `<div class="empty">${escapeHtml(e?.message||"Error")}</div>`; }
    }
    async function renderAdminCbt(body){ body.innerHTML = `<div class="empty">CBT Questions manager placeholder – implement as needed.</div>`; }
    async function renderAdminLogins(body){ body.innerHTML = `<div class="empty">Login events viewer placeholder – implement as needed.</div>`; }

    // Start app
    initializeApp();
  </script>
</body>
