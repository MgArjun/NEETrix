<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEETrix</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070d;--gl:rgba(255,255,255,.055);--gb:rgba(255,255,255,.11);--t:#eef2f8;--m:#8a94a8;--a:#8aa4ff;--a2:#5eead4;--r:#fb7185;--w:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.3;animation:fl 24s ease-in-out infinite alternate}
.bg i:nth-child(1){background:#4338ca;top:-22%;left:-16%}.bg i:nth-child(2){background:#0f766e;bottom:-26%;right:-16%;animation-delay:-9s}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.glass{background:var(--gl);border:1px solid var(--gb);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth{width:100%;max-width:380px;padding:34px 28px;animation:in .7s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}}
.logo{font-size:30px;font-weight:800;letter-spacing:-.04em;background:linear-gradient(120deg,#c7d2fe,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}.logo.sm{font-size:18px;margin-right:6px}
.m{color:var(--m);font-size:13.5px}.auth .m{margin:6px 0 22px}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--gb);color:var(--t);border-radius:12px;padding:13px 15px;font:inherit;font-size:14px;margin-bottom:10px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(138,164,255,.18)}
select option{background:#0b1020}textarea{min-height:90px;resize:vertical}
button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
.btn{background:linear-gradient(135deg,#6d83f2,#5b6ee1);border:0;color:#fff;font-weight:600;font-size:14px;padding:12px 20px;border-radius:12px;transition:.2s;box-shadow:0 6px 22px rgba(109,131,242,.35)}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;pointer-events:none}
.btn.ghost{background:var(--gl);border:1px solid var(--gb);box-shadow:none}.btn.bad{background:rgba(251,113,133,.16);border:1px solid rgba(251,113,133,.5);box-shadow:none;color:#fecdd3}.w{width:100%;margin-top:6px}
.sm{background:var(--gl);border:1px solid var(--gb);border-radius:9px;padding:6px 11px;font-size:12px;margin-left:6px}.sm.bad{color:var(--r)}.sm.ok{color:var(--a2)}
.links{display:flex;justify-content:space-between;margin-top:16px;font-size:13px}.links a,.item a{color:var(--a);cursor:pointer}
.msg{min-height:18px;font-size:13px;margin:-2px 0 8px;color:var(--r)}
.nav{position:sticky;top:12px;z-index:30;margin:12px auto 0;max-width:960px;width:calc(100% - 24px);display:flex;align-items:center;gap:8px;padding:8px 10px 8px 16px;border-radius:999px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:var(--m);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;transition:.25s}
.tabs button.on{background:rgba(255,255,255,.1);color:#fff}
.av{width:34px;height:34px;border-radius:50%;border:1px solid var(--gb);background:linear-gradient(135deg,#6d83f2,#2dd4bf);font-weight:700;font-size:13px;flex-shrink:0}
main{max-width:960px;margin:0 auto;padding:26px 14px 60px}
h2{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:4px 0 16px}h3{font-size:16px;font-weight:700;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{padding:18px 20px;margin-bottom:12px}.hov{cursor:pointer;transition:.3s}.hov:hover{transform:translateY(-3px);border-color:rgba(138,164,255,.5)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.row input{margin:0;flex:1;min-width:140px}
.back{background:none;border:0;color:var(--m);font-size:13px;margin-bottom:12px}.back:hover{color:var(--t)}
.seg{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.seg button{background:var(--gl);border:1px solid var(--gb);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--m)}.seg button.on{color:#fff;border-color:var(--a);background:rgba(138,164,255,.18)}
.empty{color:var(--m);text-align:center;padding:50px 0;font-size:14px}
.hero{padding:44px 24px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.04em}
.orb{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--a) 45%,#312e81);box-shadow:0 0 40px rgba(138,164,255,.6),0 0 90px rgba(94,234,212,.25);animation:br 4.5s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.08);box-shadow:0 0 60px rgba(138,164,255,.8),0 0 120px rgba(94,234,212,.35)}}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:6px}
.pill{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid var(--gb);color:var(--m)}.pill.active{color:var(--a2);border-color:var(--a2)}.pill.paused,.pill.blocked{color:var(--r);border-color:var(--r)}.pill.pending{color:var(--w);border-color:var(--w)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--gb);white-space:nowrap}th{color:var(--m);font-weight:600;font-size:12px}
.sub{background:rgba(255,255,255,.04);border-radius:12px;padding:10px 14px;margin-top:10px}.item{font-size:13px;color:var(--m);padding:5px 0;display:flex;justify-content:space-between;gap:8px}.r{display:inline-flex}
.yt{position:relative;padding-bottom:56.25%;border-radius:16px;overflow:hidden;background:#000;margin:8px 0 6px;border:1px solid var(--gb)}.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.modal{position:fixed;inset:0;z-index:80;background:rgba(3,5,10,.7);backdrop-filter:blur(8px);display:grid;place-items:center;padding:14px;animation:in .3s}
.mb{width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:24px;position:relative}.mb h3{margin:0 30px 14px 0}
.x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--gb);background:var(--gl);font-size:18px;z-index:2}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;padding:12px 20px;border-radius:14px;background:rgba(20,28,48,.92);border:1px solid var(--a2);font-size:13.5px;animation:in .3s;max-width:90vw}.toast.bad{border-color:var(--r)}
.pv{width:100%;max-width:1100px;height:92vh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.pvh{display:flex;align-items:center;gap:10px;padding:12px 52px 12px 16px;border-bottom:1px solid var(--gb);flex-wrap:wrap}.pvh b{font-size:14px;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.tools button{background:var(--gl);border:1px solid var(--gb);padding:6px 10px;border-radius:9px;font-size:12.5px}.tools button.on{border-color:var(--a);background:rgba(138,164,255,.25)}.tools span{font-size:12.5px;min-width:46px;text-align:center}
.pvb{flex:1;overflow:auto;padding:16px;background:rgba(0,0,0,.25)}.pg{position:relative;margin:0 auto;width:max-content;background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6)}.pg canvas{display:block}.dl{position:absolute;inset:0;touch-action:none}
.cl{display:grid;grid-template-columns:1fr 230px;gap:12px;align-items:start}@media(max-width:760px){.cl{grid-template-columns:1fr}}
.bar.glass{height:auto;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;margin-bottom:12px;border-radius:16px}.tm{font-size:22px;color:var(--w);font-variant-numeric:tabular-nums}
.q{font-size:16.5px;line-height:1.65;margin:6px 0 14px}.qi{max-width:100%;border-radius:12px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;background:var(--gl);border:1px solid var(--gb);border-radius:14px;font-size:14.5px;transition:.2s}.opt:hover{border-color:var(--a)}.opt.sel{background:rgba(138,164,255,.22);border-color:var(--a)}
.opt.good{border-color:var(--a2);background:rgba(94,234,212,.12)}.opt.wrong{border-color:var(--r);background:rgba(251,113,133,.12)}
.row2{display:flex;gap:8px;margin:14px 0 10px}.row2 .btn{flex:1;padding:11px 6px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;position:sticky;top:76px}.pb{aspect-ratio:1;border-radius:10px;border:1px solid var(--gb);background:var(--gl);font-size:12.5px;font-weight:700}.pb.an{background:rgba(138,164,255,.28);border-color:var(--a)}.pb.mk{background:rgba(251,191,36,.25);border-color:var(--w)}.pb.cur{outline:2px solid var(--a2);outline-offset:2px}
.score{font-size:64px;font-weight:800;letter-spacing:-.04em;background:linear-gradient(135deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;gap:26px;justify-content:center;margin:14px 0 20px}.stats b{display:block;font-size:20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="bg"><i></i><i></i></div><div id="app"></div>
<script>
const U="https://qhggamgxfwlwtpmwxfwk.supabase.co",K="sb_publishable_X9_aDiQcrKhYyPfuQdnKPA_K8F7RPjM";
const PDFJS="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",WORKER="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
let db,T=null,S={tab:'home',cat:'general',adm:'users',sub:null,chap:null,user:null,prof:null,tests:[]};
const $=s=>document.querySelector(s),app=$('#app');
const E=v=>(v??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ok=async p=>{const{data,error}=await p;if(error)throw error;return data};
const toast=(m,bad)=>{const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)};
const run=async f=>{try{return await f()}catch(e){toast(e.message||'Something went wrong',1)}};
const fmt=r=>Math.floor(r/60)+':'+String(r%60).padStart(2,'0');
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const load=src=>new Promise((r,j)=>{const s=document.createElement('script');s.src=src;s.onload=r;s.onerror=()=>j(new Error('Could not load '+src));document.head.appendChild(s)});
const ytId=s=>{s=(s||'').trim();const m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/)||s.match(/^([\w-]{11})$/);return m?m[1]:null};
async function ytCheck(id){try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));return r.ok?await r.json():false}catch(e){return null}}
function modal(h){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="glass mb"><button class="x" data-a="close">×</button>${h}</div>`;d.onclick=e=>{if(e.target==d)d.remove()};document.body.appendChild(d);return d}

/* ---------- AUTH ---------- */
function auth(mode='login',msg=''){const L={login:'Log in',signup:'Create account',forgot:'Send reset link',reset:'Save new password'}[mode];
app.innerHTML=`<div class="center"><div class="glass auth"><div class="logo">NEETrix</div><p class="m">${mode=='reset'?'Choose a new password':'Focused preparation for NEET aspirants'}</p>
${mode!='reset'?'<input id="em" type="email" placeholder="Email" autocomplete="email">':''}${mode=='forgot'?'':'<input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="'+(mode=='login'?'current':'new')+'-password">'}
<div class="msg" id="msg">${E(msg)}</div><button class="btn w" data-a="authGo" data-m="${mode}">${L}</button>
${mode=='login'?'<button class="btn ghost w" data-a="guest">Continue as guest</button>':''}
<div class="links">${mode=='login'?'<a data-a="auth" data-m="signup">Create account</a><a data-a="auth" data-m="forgot">Forgot password?</a>':'<a data-a="auth" data-m="login">Back to log in</a>'}</div></div></div>`}
function status(s){const t={pending:['Waiting for approval','Your request is with the admin. You can log in again once approved.'],paused:['Account paused','The admin has paused your access.'],blocked:['Access blocked','The admin has blocked this account.']}[s]||['Unavailable','Contact the admin.'];
app.innerHTML=`<div class="center"><div class="glass auth"><div class="logo">NEETrix</div><h2 style="margin:16px 0 6px">${t[0]}</h2><p class="m">${t[1]}</p><button class="btn w" data-a="recheck">Check again</button><button class="btn ghost w" data-a="logout">Log out</button></div></div>`}
async function enter(ss){if(S.user?.id===ss.user.id&&S.prof?.status=='active')return;S.user=ss.user;
S.prof=await ok(db.from('profiles').select('*').eq('id',ss.user.id).maybeSingle());
if(!S.prof)return status('pending');if(S.prof.status!='active')return status(S.prof.status);
db.from('login_events').insert({user_id:ss.user.id,email:ss.user.email||'guest'}).then(()=>{});shell()}

/* ---------- SHELL ---------- */
const TABS=[['home','Home'],['learn','Lectures'],['qb','Questions'],['tests','Tests'],['saved','Saved']];
function shell(){const adm=S.prof.role=='admin';
app.innerHTML=`<nav class="nav glass"><b class="logo sm">NEETrix</b><div class="tabs">${TABS.concat(adm?[['admin','Admin']]:[]).map(([k,l])=>`<button data-a="tab" data-k="${k}" class="${S.tab==k?'on':''}">${l}</button>`).join('')}</div><button class="av" data-a="profile">${E((S.prof.name||S.user.email||'G')[0].toUpperCase())}</button></nav><main id="main"></main>`;body()}
async function body(){const m=$('#main');if(!m)return;try{const t=S.tab;
if(t=='home')await home(m);else if(t=='learn')await browse(m,'v');else if(t=='qb')await browse(m,'p');else if(t=='tests')await tests(m);else if(t=='saved')await saved(m);else if(t=='admin'&&S.prof.role=='admin')await admin(m)}
catch(e){m.innerHTML=`<p class="empty">${E(e.message)}</p>`}}

async function home(m){const n=S.prof.name||(S.user.email||'Guest').split('@')[0];
m.innerHTML=`<section class="glass hero"><div class="orb"></div><h1>Hello, ${E(n)}</h1><p class="m" style="margin-top:8px">One chapter. One test. Every day.</p></section>${S.prof.is_guest?'<div class="glass card row"><span class="m">You are a guest. Create an account to keep your progress on every device.</span><button class="btn" data-a="profile">Create account</button></div>':''}
<div class="grid" style="margin-bottom:14px"><div class="glass card hov" data-a="tab" data-k="learn"><h3>Lectures</h3><p class="m">Concept videos by chapter</p></div><div class="glass card hov" data-a="tab" data-k="qb"><h3>Question bank</h3><p class="m">Practice sheets, PYQs, NCERT</p></div><div class="glass card hov" data-a="tab" data-k="tests"><h3>Mock tests</h3><p class="m">NEET pattern, +4 / −1</p></div></div><div id="att"></div>`;
const a=await ok(db.from('attempts').select('*').order('created_at',{ascending:false}).limit(5));
$('#att').innerHTML=a.length?`<h3 style="margin:18px 0 10px">Recent tests</h3>`+a.map(x=>{const p=Math.max(0,Math.round(x.score/(x.total||1)*100));return`<div class="glass card"><div class="row"><b>${E(x.title||'Test')}</b><span>${x.score}/${x.total}</span></div><div class="bar"><i style="width:${p}%"></i></div><p class="m" style="margin-top:8px">${x.correct} correct · ${x.wrong} wrong · ${x.unattempted} skipped · ${new Date(x.created_at).toLocaleDateString()}</p></div>`}).join(''):'<p class="empty">Take a test and your analysis appears here.</p>'}

/* ---------- BROWSE ---------- */
async function browse(m,mode){const ttl=mode=='v'?'Video lectures':'Question bank';
const cats=mode=='p'?`<div class="seg">${[['general','Practice sheets'],['pyq','Past papers'],['ncert','NCERT notes']].map(([k,l])=>`<button data-a="cat" data-k="${k}" class="${S.cat==k?'on':''}">${l}</button>`).join('')}</div>`:'';
if(!S.sub){m.innerHTML=`<h2>${ttl}</h2>${cats}<div class="grid" id="l"></div>`;const d=await ok(db.from('subjects').select('*').order('sort_order'));
$('#l').innerHTML=d.length?d.map(s=>`<div class="glass card hov" data-a="pickSub" data-id="${E(s.id)}" data-n="${E(s.name)}"><h3>${E(s.name)}</h3><p class="m">Chapters and material</p></div>`).join(''):'<p class="empty">No subjects yet.</p>';return}
if(!S.chap){m.innerHTML=`<button class="back" data-a="up">← Subjects</button><h2>${E(S.sub.name)}</h2>${cats}<div id="l"></div>`;const d=await ok(db.from('chapters').select('*').eq('subject_id',S.sub.id).order('sort_order'));
$('#l').innerHTML=d.length?d.map(c=>`<div class="glass card hov row" data-a="pickChap" data-id="${E(c.id)}" data-n="${E(c.name)}"><b>${E(c.name)}</b><span class="m">→</span></div>`).join(''):'<p class="empty">No chapters yet.</p>';return}
m.innerHTML=`<button class="back" data-a="up">← ${E(S.sub.name)}</button><h2>${E(S.chap.name)}</h2>${cats}<div id="l"></div>`;const l=$('#l');
if(mode=='v'){const d=await ok(db.from('videos').select('*').eq('chapter_id',S.chap.id).order('sort_order'));
l.innerHTML=d.length?d.map(v=>{const id=ytId(v.youtube_id);return`<h3 style="margin-top:18px">${E(v.title)}</h3>${id?`<div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&playsinline=1" title="${E(v.title)}" allow="accelerometer;encrypted-media;picture-in-picture;fullscreen" allowfullscreen loading="lazy"></iframe></div><a class="m" style="color:var(--a)" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${id}">Not playing? Open on YouTube</a>`:'<p class="m">This video link is invalid. Ask the admin to fix it.</p>'}`}).join(''):'<p class="empty">No lectures here yet.</p>';return}
const d=await ok(db.from('pdfs').select('*').eq('chapter_id',S.chap.id).eq('category',S.cat).order('created_at',{ascending:false}));
const bm=new Set((await ok(db.from('bookmarks').select('pdf_id').eq('user_id',S.user.id))).map(b=>b.pdf_id));
l.innerHTML=d.length?d.map(p=>`<div class="glass card row"><div style="flex:1;cursor:pointer" data-a="openPdf" data-id="${E(p.id)}" data-p="${E(p.file_path)}" data-n="${E(p.title)}"><b>${E(p.title)}</b><p class="m">Tap to open</p></div><button class="sm" data-a="bm" data-id="${E(p.id)}" data-on="${bm.has(p.id)?1:0}">${bm.has(p.id)?'★ Saved':'☆ Save'}</button></div>`).join(''):'<p class="empty">Nothing in this category yet.</p>'}
async function saved(m){m.innerHTML='<h2>Saved</h2><div id="l"></div>';const d=await ok(db.from('bookmarks').select('pdf_id,pdfs(id,title,file_path)').eq('user_id',S.user.id));
$('#l').innerHTML=d.filter(b=>b.pdfs).map(b=>`<div class="glass card row"><div style="flex:1;cursor:pointer" data-a="openPdf" data-p="${E(b.pdfs.file_path)}" data-n="${E(b.pdfs.title)}"><b>${E(b.pdfs.title)}</b></div><button class="sm bad" data-a="bm" data-id="${E(b.pdfs.id)}" data-on="1">Remove</button></div>`).join('')||'<p class="empty">Save a PDF and it shows up here.</p>'}

/* ---------- PDF VIEWER ---------- */
async function openPdf(path,title){const d=await ok(db.storage.from('content').createSignedUrl(path,7200));await pdfView(d.signedUrl,title)}
async function pdfView(url,title){
if(!window.pdfjsLib)await load(PDFJS).catch(()=>{});if(!window.pdfjsLib)return toast('PDF viewer could not load. Check your internet.',1);
pdfjsLib.GlobalWorkerOptions.workerSrc=WORKER;
const md=document.createElement('div');md.className='modal';
md.innerHTML=`<div class="glass pv"><div class="pvh"><b>${E(title)}</b><div class="tools"><button id="pp">‹</button><span id="pi">–</span><button id="pn">›</button></div><div class="tools"><button id="zo">−</button><span id="zl">100%</span><button id="zi">+</button><button id="zf">Fit</button></div><div class="tools"><button data-t="hand" class="on">✋ Scroll</button><button data-t="pen">✏️ Pen</button><button data-t="hl">🖍 Marker</button><button data-t="er">Eraser</button><button id="cl">Clear</button></div></div><button class="x" id="xx">×</button><div class="pvb" id="pvb"><div class="pg"><canvas id="c1"></canvas><canvas id="c2" class="dl" style="pointer-events:none"></canvas></div></div></div>`;

const c1=q('#c1'),c2=q('#c2'),x1=c1.getContext('2d'),x2=c2.getContext('2d');
const kd=e=>{if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else if(e.key=='Escape')close()};
const close=()=>{document.removeEventListener('keydown',kd);md.remove()};document.addEventListener('keydown',kd);q('#xx').onclick=close;md.onclick=e=>{if(e.target==md)close()};
function ann(){x2.clearRect(0,0,c2.width,c2.height);(st[n]||[]).forEach(s=>{if(!s.p.length)return;x2.save();x2.lineCap=x2.lineJoin='round';x2.globalCompositeOperation=s.t=='er'?'destination-out':'source-over';x2.globalAlpha=s.t=='hl'?.35:1;x2.strokeStyle=s.t=='hl'?'#fbbf24':'#fb7185';x2.lineWidth=(s.t=='er'?26:s.t=='hl'?18:3)*c2.width/900;x2.beginPath();s.p.forEach(([a,b],i)=>i?x2.lineTo(a*c2.width,b*c2.height):x2.moveTo(a*c2.width,b*c2.height));if(s.p.length==1)x2.lineTo(s.p[0][0]*c2.width+.1,s.p[0][1]*c2.height);x2.stroke();x2.restore()})}
async function draw(){if(busy){pend=1;return}busy=1;try{const p=await doc.getPage(n),dpr=Math.min(devicePixelRatio||1,2),fit=(q('#pvb').clientWidth-32)/p.getViewport({scale:1}).width,vp=p.getViewport({scale:Math.max(.2,fit*z)*dpr});
c1.width=c2.width=vp.width;c1.height=c2.height=vp.height;c1.style.width=c2.style.width=vp.width/dpr+'px';c1.style.height=c2.style.height=vp.height/dpr+'px';
await p.render({canvasContext:x1,viewport:vp}).promise;ann();q('#pi').textContent=n+' / '+doc.numPages;q('#zl').textContent=Math.round(z*100)+'%'}catch(e){toast('Page error: '+e.message,1)}busy=0;if(pend){pend=0;draw()}}
function go(d){if(!doc)return;const k=n+d;if(k<1||k>doc.numPages)return;n=k;q('#pvb').scrollTop=0;draw()}
q('#pp').onclick=()=>go(-1);q('#pn').onclick=()=>go(1);q('#zi').onclick=()=>{z=Math.min(4,z+.25);draw()};q('#zo').onclick=()=>{z=Math.max(.5,z-.25);draw()};q('#zf').onclick=()=>{z=1;draw()};
q('#cl').onclick=()=>{if(confirm('Clear marks on this page?')){st[n]=[];ann()}};
md.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{md.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('on'));b.classList.add('on');tool=b.dataset.t;c2.style.pointerEvents=tool=='hand'?'none':'auto'});
const pos=e=>{const r=c2.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
c2.onpointerdown=e=>{c2.setPointerCapture(e.pointerId);cur={t:tool,p:[pos(e)]};(st[n]=st[n]||[]).push(cur);ann();e.preventDefault()};
c2.onpointermove=e=>{if(!cur)return;cur.p.push(pos(e));ann()};c2.onpointerup=c2.onpointercancel=()=>{cur=null};
try{doc=await pdfjsLib.getDocument(url).promise;await draw()}catch(e){q('#pvb').innerHTML=`<p class="empty">Could not open this PDF.<br>${E(e.message)}<br><br><a style="color:var(--a)" target="_blank" href="${E(url)}">Open in browser</a></p>`}}

async function tests(m){if(T?.active)return cbt();m.innerHTML='<h2>Mock tests</h2><div id="l"></div>';
S.tests=await ok(db.from('tests').select('*,subjects(name),chapters(name)').order('created_at',{ascending:false}));
$('#l').innerHTML=S.tests.length?S.tests.map(t=>{const c=t.type!='pdf'&&!t.file_path;const mt=[t.subjects?.name,t.chapters?.name].filter(Boolean).join(' › ');const sv=lsGet('nx_'+t.id);const res=c&&sv&&sv.end>Date.now();
return`<div class="glass card row"><div><b>${E(t.title)}</b><p class="m">${mt?E(mt)+' · ':''}${t.duration_minutes||180} min · ${c?'Interactive':'PDF paper'}</p></div><button class="btn" data-a="startTest" data-id="${E(t.id)}">${res?'Resume':'Start'}</button></div>`}).join(''):'<p class="empty">No tests available yet.</p>'}
function tick(){clearInterval(T.iv);T.iv=setInterval(()=>{const r=Math.max(0,Math.round((T.end-Date.now())/1e3)),e=$('#tm');if(e)e.textContent=fmt(r);if(r<=0)run(()=>submit(true))},1000)}
const save=()=>lsSet('nx_'+T.t.id,{ans:T.ans,mk:T.mk,end:T.end});
function cbt(){const m=$('#main'),q=T.qs[T.i],a=T.ans[q.id];
m.innerHTML=`<div class="bar glass"><span class="m">${E(T.t.title)}</span><b id="tm" class="tm">${fmt(Math.max(0,Math.round((T.end-Date.now())/1e3)))}</b></div><div class="cl"><div class="glass card"><p class="m">Question ${T.i+1} of ${T.qs.length}</p><p class="q">${E(q.question_text)}</p>${q.question_image?`<img class="qi" src="${E(q.question_image)}" alt="Figure">`:''}
${'ABCD'.split('').map(o=>`<button class="opt ${a==o?'sel':''}" data-a="opt" data-o="${o}">${o}. ${E(q['option_'+o.toLowerCase()])}</button>`).join('')}
<div class="row2"><button class="btn ghost" data-a="nav" data-d="-1" ${T.i?'':'disabled'}>←</button><button class="btn ghost" data-a="mark">${T.mk.includes(q.id)?'Unmark':'Mark'}</button><button class="btn ghost" data-a="clr">Clear</button><button class="btn" data-a="nav" data-d="1" ${T.i<T.qs.length-1?'':'disabled'}>→</button></div><button class="btn bad w" data-a="submit">Submit test</button></div>
<div class="glass card pal">${T.qs.map((x,j)=>`<button class="pb ${T.ans[x.id]?'an':''} ${T.mk.includes(x.id)?'mk':''} ${j==T.i?'cur':''}" data-a="go" data-j="${j}">${j+1}</button>`).join('')}</div></div>`}
async function submit(){clearInterval(T.iv);let r;try{r=await ok(db.rpc('submit_test',{p_test:String(T.t.id),p_answers:T.ans}))}catch(e){tick();throw e}
localStorage.removeItem('nx_'+T.t.id);T.active=false;const rv=r.review||[],qs=T.qs;
$('#main').innerHTML=`<div class="glass card" style="text-align:center;padding:34px 20px"><p class="m">${E(T.t.title)}</p><div class="score">${r.score}</div><p class="m">out of ${r.total}</p><div class="stats"><div><b style="color:var(--a2)">${r.correct}</b><span class="m">Correct</span></div><div><b style="color:var(--r)">${r.wrong}</b><span class="m">Wrong</span></div><div><b>${r.unattempted}</b><span class="m">Skipped</span></div></div><button class="btn" data-a="tab" data-k="tests">Back to tests</button></div><h3 style="margin:18px 0 10px">Review</h3>`+
qs.map((q,i)=>{const v=rv.find(x=>x.id==q.id)||{};return`<div class="glass card"><p class="m">Q${i+1}</p><p class="q">${E(q.question_text)}</p>${'ABCD'.split('').map(o=>`<div class="opt ${o==v.correct?'good':o==v.chosen?'wrong':''}">${o}. ${E(q['option_'+o.toLowerCase()])}${o==v.chosen?' (your answer)':''}</div>`).join('')}</div>`}).join('');scrollTo(0,0)}
